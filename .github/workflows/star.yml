name: Star Repositories

on:
  workflow_dispatch:
  push:
    paths:
      - repos.txt

permissions:
  contents: read

jobs:
  star-repos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        run: |
          gh --version

      - name: Check authentication
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN }}
        run: |
          echo "Authenticated user:"
          gh api user --jq '.login'

          echo "Token scopes:"
          gh api -i user 2>&1 | grep -i "x-oauth-scopes" || true

      - name: Star and watch repositories
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN }}
        run: |
          while IFS= read -r repo || [ -n "$repo" ]; do

            # Skip empty lines and comments
            if [[ -z "$repo" || "$repo" == \#* ]]; then
              continue
            fi

            echo ""
            echo "Processing: $repo"

            # Check repo exists
            if ! gh api "/repos/$repo" --silent > /dev/null 2>&1; then
              echo "⚠️ Repository not found or no access: $repo"
              continue
            fi


            # STAR CHECK
            if gh api "/user/starred/$repo" --silent > /dev/null 2>&1; then
              echo "⭐ Already starred: $repo"
            else
              echo "⭐ Starring: $repo"

              if gh api \
                --method PUT \
                "/user/starred/$repo"; then
                echo "✅ Starred: $repo"
              else
                echo "❌ Failed to star: $repo"
              fi
            fi


            # WATCH CHECK
            if gh api "/repos/$repo/subscription" \
              --jq '.subscribed' 2>/dev/null | grep -q true; then

              echo "👁️ Already watching: $repo"

            else

              echo "👁️ Watching: $repo"

              if gh api \
                --method PUT \
                "/repos/$repo/subscription" \
                -f subscribed=true \
                -f ignored=false; then

                echo "✅ Watching: $repo"

              else
                echo "❌ Failed to watch: $repo"
              fi

            fi


          done < repos.txt
