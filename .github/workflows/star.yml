name: Star and Watch Repositories

on:
  workflow_dispatch:
  push:
    paths:
      - repos.txt

permissions:
  contents: read

jobs:
  star-watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check authentication
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN }}
        run: |
          echo "Authenticated user:"
          gh api user --jq '.login'

      - name: Star and watch repositories
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN }}
        run: |
          if [ ! -f repos.txt ]; then
            echo "❌ repos.txt not found"
            exit 1
          fi

          while IFS= read -r repo || [ -n "$repo" ]; do

            if [[ -z "$repo" || "$repo" == \#* ]]; then
              continue
            fi

            echo ""
            echo "=============================="
            echo "Processing: $repo"
            echo "=============================="


            # Check repo exists
            if ! gh api "/repos/$repo" --silent > /dev/null 2>&1; then
              echo "⚠️ Repository not found or no access: $repo"
              continue
            fi


            # Star check
            if gh api "/user/starred/$repo" --silent > /dev/null 2>&1; then
              echo "⭐ Already starred: $repo"
            else
              echo "⭐ Starring: $repo"

              if gh api \
                --method PUT \
                "/user/starred/$repo"; then
                echo "✅ Starred: $repo"
              else
                echo "❌ Failed to star: $repo"
              fi
            fi


            # # Watch check
            # watched=$(gh api "/repos/$repo/subscription" \
            #   --jq '.subscribed' 2>/dev/null || echo false)

            # if [ "$watched" = "true" ]; then
            #   echo "👁️ Already watching: $repo"
            # else
            #   echo "👁️ Watching: $repo"

            #   if gh api \
            #     --method PUT \
            #     "/repos/$repo/subscription" \
            #     --input <(echo '{"subscribed":true,"ignored":false}'); then

            #     echo "✅ Watching: $repo"

            #   else
            #     echo "❌ Failed to watch: $repo"
            #   fi
            # fi

          done < repos.txt
