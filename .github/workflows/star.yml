name: Star Repositories

on:
  workflow_dispatch:
  push:
    paths:
      - repos.txt

permissions:
  contents: read

jobs:
  star-repos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        run: |
          gh --version

      - name: Check authentication
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN }}
        run: |
          echo "Authenticated user:"
          gh api user --jq '.login'

          echo "Token scopes:"
          gh api -i user 2>&1 | grep -i "x-oauth-scopes" || true

      - name: Star repositories
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN }}
        run: |
          if [ ! -f repos.txt ]; then
            echo "❌ repos.txt not found"
            exit 1
          fi

          while IFS= read -r repo || [ -n "$repo" ]; do

            # Ignore empty lines and comments
            if [[ -z "$repo" || "$repo" == \#* ]]; then
              continue
            fi

            echo ""
            echo "Processing: $repo"

            # Check repository exists
            if ! gh api "/repos/$repo" --silent > /dev/null 2>&1; then
              echo "⚠️ Repository not found or no access: $repo"
              continue
            fi

            # Check if already starred
            if gh api "/user/starred/$repo" --silent > /dev/null 2>&1; then
              echo "⭐ Already starred: $repo"
              continue
            fi

            echo "⭐ Starring: $repo"

            # Star repository
            if gh api \
              --method PUT \
              "/user/starred/$repo"; then

              echo "✅ Successfully starred: $repo"

            else

              echo "❌ Failed to star: $repo"

            fi

          done < repos.txt
