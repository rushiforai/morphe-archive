name: Fetch Morphe Repos

on:
  schedule:
      - cron: "0 0 * * *"
  workflow_dispatch:
  push:

concurrency:
  group: morphe-repo-fetcher
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  OUTPUT_FILE: repos.txt
  REVIEW_DISCOVERIES: "true"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Prepare pending review list
        run: |
          : > "$RUNNER_TEMP/pending_repos.txt"

      - name: Fetch Repos (registry-based)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_FILE: ${{ env.OUTPUT_FILE }}
          REVIEW_DISCOVERIES: ${{ env.REVIEW_DISCOVERIES }}
          PENDING_FILE: ${{ runner.temp }}/pending_repos.txt
        run: |
          python scripts/fetch_org_repos.py

      - name: Discover More Repos (GitHub-wide search)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_FILE: ${{ env.OUTPUT_FILE }}
          REVIEW_DISCOVERIES: ${{ env.REVIEW_DISCOVERIES }}
          PENDING_FILE: ${{ runner.temp }}/pending_repos.txt
        run: |
          python scripts/discover_github_wide.py

      - name: Open review issue for new discoveries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PENDING_FILE: ${{ runner.temp }}/pending_repos.txt
        run: |
          set -euo pipefail

          if [ ! -s "$PENDING_FILE" ]; then
            echo "No new repo discoveries pending review."
            exit 0
          fi

          title="Review newly discovered Morphe repos"
          body="$RUNNER_TEMP/pending_issue.md"

          {
            echo "New candidate repos were discovered, but they were not added to \`repos.txt\`."
            echo ""
            echo "Review each source, then add approved entries to \`custom_repos.txt\` or \`repos.txt\`."
            echo ""
            echo "\`\`\`text"
            cat "$PENDING_FILE"
            echo "\`\`\`"
          } > "$body"

          existing_issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing_issue" ]; then
            gh issue edit "$existing_issue" --body-file "$body"
            echo "Updated existing issue #$existing_issue."
          else
            gh issue create --title "$title" --body-file "$body"
          fi

      - name: Generate README
        env:
          OUTPUT_FILE: ${{ env.OUTPUT_FILE }}
          VALIDATE_BUNDLES: "1"
        run: |
          python scripts/generate_readme.py

      - name: Generate Settings Json
        env:
          OUTPUT_FILE: ${{ env.OUTPUT_FILE }}
        run: |
          python scripts/add_repos_to_bundles.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update Morphe repo list [skip ci]"
            git push origin main
          else
            echo "No changes detected. Skipping commit."
          fi
