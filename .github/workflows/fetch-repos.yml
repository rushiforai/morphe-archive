name: Fetch Morphe Repos

on:
  schedule:
      - cron: "0 0 * * *"
  workflow_dispatch:
  # Only rerun when this workflow's own inputs change. Unfiltered, every push ran the
  # full GitHub-wide discovery - up to an hour - and its data commit then raced the
  # scheduled run; editing a workflow or the README should not cost a runner hour.
  push:
    paths:
      - "scripts/**"
      - "repos.txt"
      - "custom_repos.txt"
      - "ignore_repos.txt"
      - "rejected_repos.txt"

concurrency:
  group: morphe-repo-fetcher
  cancel-in-progress: false

permissions:
  contents: write

env:
  OUTPUT_FILE: repos.txt

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch Repos (registry-based)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_FILE: ${{ env.OUTPUT_FILE }}
        run: |
          python scripts/fetch_org_repos.py

      - name: Discover More Repos (GitHub-wide search)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_FILE: ${{ env.OUTPUT_FILE }}
        run: |
          python scripts/discover_github_wide.py

      - name: Import Star-List Repos (Jman-Github/revanced)
        env:
          STAR_LIST_USER: Jman-Github
          STAR_LIST_NAME: revanced
          OUTPUT_FILE: ${{ env.OUTPUT_FILE }}
        run: |
          python scripts/import_star_list.py

      - name: Generate README
        env:
          OUTPUT_FILE: ${{ env.OUTPUT_FILE }}
          VALIDATE_BUNDLES: "1"
        run: |
          python scripts/generate_readme.py

      - name: Generate Settings Json
        env:
          OUTPUT_FILE: ${{ env.OUTPUT_FILE }}
        run: |
          python scripts/add_repos_to_bundles.py

      - name: Generate Website
        run: |
          python scripts/generate_site.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update Morphe repo list [skip ci]"
            # The remote can move while this job runs: the nightly schedule and a
            # manual dispatch both land here, and so does any other commit. A bare
            # push then fails with "fetch first" and the whole run's data is lost,
            # so rebase onto whatever arrived and try again.
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git push origin main; then
                pushed=1
                break
              fi
              echo "Push rejected (attempt $attempt). Rebasing onto the latest main and retrying."
              # The data here is generated, so a rebase of two competing data
              # commits would conflict on repos.txt and the JSON. Prefer the files
              # this run just generated: they came from the same sources, later.
              git pull --rebase --autostash -X theirs origin main
              sleep $((attempt * 5))
            done

            if [ "$pushed" -ne 1 ]; then
              echo "::error::Could not push after 5 attempts; leaving the data uncommitted."
              exit 1
            fi
          else
            echo "No changes detected. Skipping commit."
          fi
