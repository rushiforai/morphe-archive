name: Clone Morphe Example Patches

on:
  workflow_run:
    workflows: ["Fetch Morphe Repos"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: morphe-clone-examples
  cancel-in-progress: false

permissions:
  contents: write

env:
  REPOS_FILE: repos.txt
  DEST_DIR: examplepatches

jobs:
  clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Each Repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          if [ ! -f "$REPOS_FILE" ]; then
            echo "No $REPOS_FILE found. Run the Fetch Morphe Repos workflow first."
            exit 1
          fi

          mkdir -p "$DEST_DIR"

          while IFS= read -r repo || [ -n "$repo" ]; do
            # skip blank lines and comments
            [ -z "$repo" ] && continue
            case "$repo" in \#*) continue ;; esac

            # skip explicitly ignored repos
            if [ -f ignore_repos.txt ] && grep -Fxq "$repo" ignore_repos.txt; then
              echo "Skipping ignored repo: $repo"
              continue
            fi

            repo_ref="${repo#https://}"
            repo_ref="${repo_ref#http://}"
            repo_ref="${repo_ref%.git}"

            case "$repo_ref" in
              github.com/*)
                host="github.com"
                path="${repo_ref#github.com/}"
                target="$DEST_DIR/$path"
                ;;
              gitlab.com/*)
                host="gitlab.com"
                path="${repo_ref#gitlab.com/}"
                target="$DEST_DIR/$host/$path"
                ;;
              *)
                host="github.com"
                path="$repo_ref"
                target="$DEST_DIR/$path"
                ;;
            esac

            tmp="$(mktemp -d)"

            echo "Fetching $repo..."
            if [ "$host" = "github.com" ]; then
              clone_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${path}.git"
            else
              clone_url="https://gitlab.com/${path}.git"
            fi

            if git clone --depth 1 "$clone_url" "$tmp" 2>/dev/null; then
              rm -rf "$tmp/.git"
              mkdir -p "$target"
              # sync fresh content into target, removing stale files, but never deleting the folder itself
              rsync -a --delete "$tmp/" "$target/"
              echo "Updated: $repo"
            else
              echo "Failed to fetch $repo, leaving existing folder (if any) untouched."
            fi

            rm -rf "$tmp"
          done < "$REPOS_FILE"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- "$DEST_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh ${DEST_DIR} from repos.txt [skip ci]"
            # The remote can move while this job runs: the nightly schedule and a
            # manual dispatch both land here, and so does any other commit. A bare
            # push then fails with "fetch first" and the whole run's data is lost,
            # so rebase onto whatever arrived and try again.
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git push origin main; then
                pushed=1
                break
              fi
              echo "Push rejected (attempt $attempt). Rebasing onto the latest main and retrying."
              # The data here is generated, so a rebase of two competing data
              # commits would conflict on repos.txt and the JSON. Prefer the files
              # this run just generated: they came from the same sources, later.
              git pull --rebase --autostash -X theirs origin main
              sleep $((attempt * 5))
            done

            if [ "$pushed" -ne 1 ]; then
              echo "::error::Could not push after 5 attempts; leaving the data uncommitted."
              exit 1
            fi
          else
            echo "No changes detected. Skipping commit."
          fi
