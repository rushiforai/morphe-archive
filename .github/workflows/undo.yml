name: Repository Actions

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose repository action"
        required: true
        type: choice
        options:
          - star
          - unstar
          - watch
          - unwatch

permissions:
  contents: read

jobs:
  repo-actions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check authentication
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN }}
        run: |
          echo "Authenticated as:"
          gh api user --jq '.login'

      - name: Execute repository action
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN }}
          ACTION: ${{ inputs.action }}
        run: |

          if [ ! -f repos.txt ]; then
            echo "❌ repos.txt not found"
            exit 1
          fi

          while IFS= read -r repo || [ -n "$repo" ]; do

            # Skip empty lines and comments
            if [[ -z "$repo" || "$repo" == \#* ]]; then
              continue
            fi

            echo ""
            echo "================================"
            echo "Repository: $repo"
            echo "Action: $ACTION"
            echo "================================"


            # Check repository exists
            if ! gh api "/repos/$repo" --silent > /dev/null 2>&1; then
              echo "⚠️ Repository not found: $repo"
              continue
            fi


            case "$ACTION" in


              star)

                if gh api "/user/starred/$repo" --silent > /dev/null 2>&1; then

                  echo "⭐ Already starred: $repo"

                else

                  echo "⭐ Starring: $repo"

                  if gh api \
                    --method PUT \
                    "/user/starred/$repo"; then

                    echo "✅ Starred: $repo"

                  else

                    echo "❌ Failed to star: $repo"

                  fi

                fi

                ;;


              unstar)

                if gh api "/user/starred/$repo" --silent > /dev/null 2>&1; then

                  echo "❌ Removing star: $repo"

                  if gh api \
                    --method DELETE \
                    "/user/starred/$repo"; then

                    echo "✅ Unstarred: $repo"

                  else

                    echo "❌ Failed to unstar: $repo"

                  fi

                else

                  echo "⭐ Not starred: $repo"

                fi

                ;;


              watch)

                subscribed=$(gh api \
                  "/repos/$repo/subscription" \
                  --jq '.subscribed' 2>/dev/null || echo false)


                if [ "$subscribed" = "true" ]; then

                  echo "👁️ Already watching: $repo"

                else

                  echo "👁️ Watching: $repo"

                  if gh api \
                    --method PUT \
                    "/repos/$repo/subscription" \
                    --input <(echo '{"subscribed":true,"ignored":false}'); then

                    echo "✅ Watching: $repo"

                  else

                    echo "❌ Failed to watch: $repo"

                  fi

                fi

                ;;


              unwatch)

                subscribed=$(gh api \
                  "/repos/$repo/subscription" \
                  --jq '.subscribed' 2>/dev/null || echo false)


                if [ "$subscribed" = "true" ]; then

                  echo "🔕 Unwatching: $repo"

                  if gh api \
                    --method DELETE \
                    "/repos/$repo/subscription"; then

                    echo "✅ Unwatched: $repo"

                  else

                    echo "❌ Failed to unwatch: $repo"

                  fi

                else

                  echo "👁️ Not watching: $repo"

                fi

                ;;


              *)

                echo "❌ Unknown action: $ACTION"
                exit 1

                ;;

            esac


          done < repos.txt
