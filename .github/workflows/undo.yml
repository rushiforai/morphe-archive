name: Repository Actions

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose repository action"
        required: true
        type: choice
        options:
          - star
          - unstar
          - watch
          - unwatch

permissions:
  contents: read

jobs:
  repo-actions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check authentication
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN }}
        run: |
          echo "Authenticated as:"
          gh api user --jq '.login'

      - name: Apply action
        env:
          GH_TOKEN: ${{ secrets.STAR_TOKEN }}
          ACTION: ${{ inputs.action }}
        run: |

          if [ ! -f repos.txt ]; then
            echo "❌ repos.txt not found"
            exit 1
          fi

          while IFS= read -r repo || [ -n "$repo" ]; do

            # Skip empty/comment lines
            if [[ -z "$repo" || "$repo" == \#* ]]; then
              continue
            fi

            echo ""
            echo "=========================="
            echo "Processing: $repo"
            echo "Action: $ACTION"
            echo "=========================="


            # Check repo exists
            if ! gh api "/repos/$repo" --silent > /dev/null 2>&1; then
              echo "⚠️ Repository not found: $repo"
              continue
            fi


            case "$ACTION" in

              star)

                if gh api "/user/starred/$repo" --silent > /dev/null 2>&1; then
                  echo "⭐ Already starred: $repo"
                else
                  gh api \
                    --method PUT \
                    "/user/starred/$repo" \
                    && echo "✅ Starred: $repo"
                fi

                ;;


              unstar)

                if gh api "/user/starred/$repo" --silent > /dev/null 2>&1; then

                  gh api \
                    --method DELETE \
                    "/user/starred/$repo" \
                    && echo "✅ Unstarred: $repo"

                else
                  echo "⭐ Not starred: $repo"
                fi

                ;;


              watch)

                watched=$(gh api "/repos/$repo/subscription" \
                  --jq '.subscribed' 2>/dev/null || echo false)

                if [ "$watched" = "true" ]; then
                  echo "👁️ Already watching: $repo"
                else

                  gh api \
                    --method PUT \
                    "/repos/$repo/subscription" \
                    --input <(echo '{"subscribed":true,"ignored":false}') \
                    && echo "✅ Watching: $repo"

                fi

                ;;


              unwatch)
              
                watched=$(gh api "/repos/$repo/subscription" \
                  --jq '.subscribed' 2>/dev/null || echo false)
              
                if [ "$watched" = "true" ]; then
              
                  echo "🔕 Unwatching: $repo"
              
                  if gh api \
                    --method DELETE \
                    "/repos/$repo/subscription"; then
              
                    echo "✅ Unwatched: $repo"
              
                  else
              
                    echo "❌ Failed to unwatch: $repo"
              
                  fi
              
                else
              
                  echo "👁️ Not watching: $repo"
              
                fi
              
                ;;

            esac


          done < repos.txt
