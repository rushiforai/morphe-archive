name: Open a PR to main

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: dev-to-main-pr
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  pull-request:
    name: Open pull request
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BRANCH: dev
          TARGET_BRANCH: main
        run: |
          if gh pr list --base "$TARGET_BRANCH" --head "$SOURCE_BRANCH" --json number | jq -e '. | length > 0' >/dev/null; then
            echo "Pull request already exists."
            exit 0
          fi

          COMMITS=$(gh api "repos/${{ github.repository }}/compare/${TARGET_BRANCH}...${SOURCE_BRANCH}" --jq '.total_commits')
          if [ "$COMMITS" -eq 0 ]; then
            echo "No commits between $TARGET_BRANCH and $SOURCE_BRANCH."
            exit 0
          fi

          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$SOURCE_BRANCH" \
            --title 'chore: merge dev into main' \
            --body 'Merge dev into main when the current prerelease is ready for a stable release.'