.mic{left:261px;top:23px}

.tb{left:7px;top:6px;width:376px;height:37px}
.tb .rb{position:absolute;inset:0;border-radius:19px;background:#10162c;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}

.tb .g1,.tb .g2,.tb .glow{background-image:linear-gradient(90deg,#ff2d9b,#b04dff,#3a63ff,#19b8ff,#1fd36b,#f4e317,#ff8b1f,#ff3b3b,#ff2d9b);background-size:200% 100%;animation-name:flow;animation-duration:7s;animation-timing-function:linear;animation-iteration-count:infinite}

.tb .g1,.tb .g2{position:absolute;inset:0;-webkit-mask-image:linear-gradient(0deg,#000 0%,rgba(0,0,0,.8) 35%,rgba(0,0,0,.08) 85%);mask-image:linear-gradient(0deg,#000 0%,rgba(0,0,0,.8) 35%,rgba(0,0,0,.08) 85%)}
.tb .g2{animation-duration:11s;animation-direction:reverse;mix-blend-mode:screen;opacity:.55;transform:scaleY(.8);transform-origin:bottom}
.tb .dots{position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.5) .9px,transparent 1.3px) 0 0/3.4px 3.4px;opacity:.7}
@keyframes flow{to{background-position:200% 0}}
@keyframes pulse{from{opacity:.45;transform:scaleY(.8)}to{opacity:.9;transform:scaleY(1.25)}}
.cb{position:absolute;top:2px;width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#4a4c60,#33344a);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);transition:transform .45s cubic-bezier(.34,1.7,.5,1);cursor:pointer}

.cb .ic{stroke:#fff;stroke-width:2}
.cb.ok{background:linear-gradient(180deg,#b7a2ff,#9a82f2)}.cb.ok .ic{stroke:#2a1a6e;stroke-width:2.4}
.rows{position:absolute;left:0;top:53px;width:100%;display:flex;flex-direction:column;gap:12px;padding:0 8px}
.r{display:flex;gap:6px;height:40px}
.r.c3{padding:0 20px}.r.b4{}.r.b5{gap:8px}
.k{position:relative;flex:0 0 32px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;font-weight:400;color:#eceef8;background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.11));box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 0 rgba(0,0,0,.4);transform:translateZ(0);transition:transform .55s cubic-bezier(.34,1.8,.5,1),background .45s ease,box-shadow .45s ease;touch-action:none;will-change:transform}
.k.d{transform:scale(.9) translateY(1px);background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.24));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 16px rgba(160,140,255,.5);transition-duration:.06s,.06s,.06s}
.k .rp{position:absolute;inset:0;border-radius:12px;pointer-events:none;background:radial-gradient(circle,rgba(190,170,255,.7),transparent 70%)}
.k.w{flex:0 0 51px}.k.n{flex:0 0 48px;font-size:15px;background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.08))}
.k.e{flex:0 0 33px}.k.p{flex:0 0 30px;background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.08))}
.k.sp{flex:1;font-size:15px;color:#d5d7e6}
.k.pu{background:linear-gradient(180deg,#8a6bd6,#5d4a98)}
.k.pu.d{background:linear-gradient(180deg,#a98bf0,#7a63c0)}
.k.pur{flex:0 0 52px;background:linear-gradient(180deg,#9b7af0,#6b4fc2)}
.k.pur.d{background:linear-gradient(180deg,#b79cff,#8467dd)}
.k.on svg{fill:#fff}
.k .ic{stroke:#eceef8;stroke-width:1.8}
.home{left:120px;top:853px;width:150px;height:5px;border-radius:3px;background:#eef0f7}
/* ===== liquid glass pass ===== */
:root{--rim:linear-gradient(140deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.14) 28%,rgba(255,255,255,.03) 55%,rgba(255,255,255,.2) 80%,rgba(255,255,255,.6) 100%)}
#stage{background:radial-gradient(150% 27% at 25% 50%,rgba(12,52,205,.8),rgba(8,30,135,.42) 50%,transparent 82%),radial-gradient(80% 20% at 92% 56%,rgba(10,30,125,.42),transparent 70%),var(--bg)}
.kb{background:radial-gradient(70% 38% at 12% 28%,rgba(34,64,190,.34),transparent 70%),radial-gradient(60% 40% at 92% 75%,rgba(118,76,210,.3),transparent 70%),linear-gradient(180deg,rgba(38,40,62,.82),rgba(21,22,36,.95) 40%,#171826);backdrop-filter:blur(24px) saturate(1.4);border-top:1px solid rgba(255,255,255,.08)}
/* rim light */
.k::before,.pill::before,.seg::before,.seg .th::before,.cb::before,.send::before,.tb::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--rim);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.tb::after{border-radius:19px;z-index:3}
/* keys */
.k,.k.d{background:linear-gradient(165deg,rgba(170,172,212,.42) 0%,rgba(100,102,142,.34) 55%,rgba(82,84,122,.34) 100%)}
.k{box-shadow:inset 0 1px 1px rgba(255,255,255,.42),inset 0 -1.5px 2px rgba(255,255,255,.15),inset 0 0 12px rgba(255,255,255,.06),0 4px 10px rgba(0,0,0,.35),0 1px 0 rgba(0,0,0,.5);text-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .6s cubic-bezier(.34,1.8,.5,1),box-shadow .5s ease}
.k::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(140% 95% at 18% 0%,rgba(255,255,255,.36),rgba(255,255,255,0) 58%),linear-gradient(0deg,rgba(255,255,255,.08),transparent 30%);opacity:.7;pointer-events:none;transition:opacity .55s ease}
.k.n,.k.p,.k.n.d,.k.p.d{background:linear-gradient(165deg,rgba(125,127,165,.34),rgba(72,74,108,.32))}
.k.pu,.k.pu.d{background:linear-gradient(160deg,rgba(180,148,240,.55),rgba(100,78,164,.55))}
.k.pur,.k.pur.d{background:linear-gradient(150deg,#b9a1ff 0%,#8e69ee 50%,#6b47d0 100%);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),inset 0 -2px 3px rgba(40,10,110,.35),0 5px 16px rgba(120,80,230,.45)}
.k.d{transform:scale(.9) translateY(1px);box-shadow:inset 0 1px 1px rgba(255,255,255,.65),inset 0 0 16px rgba(195,175,255,.38),0 0 20px rgba(150,130,255,.65),0 2px 6px rgba(0,0,0,.3);transition-duration:.06s,.06s}
.k.d::after{opacity:1;transition-duration:.06s}
/* input pill */
.pill{background:linear-gradient(180deg,rgba(68,88,195,.3),rgba(18,26,88,.58) 60%,rgba(24,36,122,.45));backdrop-filter:blur(20px) saturate(1.7);border:0;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.5),inset 0 -1.5px 2px rgba(150,170,255,.3),inset 0 0 28px rgba(110,140,255,.14),0 12px 40px rgba(0,16,110,.55)}
.pill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,0) 42%);pointer-events:none}
.send{background:radial-gradient(120% 100% at 50% 0%,#5b7dff,#2447e0 50%,#1431b4);box-shadow:inset 0 2px 1.5px rgba(255,255,255,.6),inset 0 -4px 8px rgba(0,10,80,.45),0 6px 18px rgba(30,70,255,.6)}
.send::before{display:none}
.send::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(60% 40% at 50% 12%,rgba(255,255,255,.55),transparent 70%);pointer-events:none}
/* segmented */
.seg{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:0;backdrop-filter:blur(16px) saturate(1.6);box-shadow:inset 0 1px 1px rgba(255,255,255,.35),inset 0 -1px 2px rgba(255,255,255,.12),0 6px 20px rgba(0,10,80,.4)}
.seg .th{background:linear-gradient(165deg,rgba(222,228,255,.36),rgba(140,150,212,.2));box-shadow:inset 0 1px 1px rgba(255,255,255,.65),inset 0 -2px 3px rgba(255,255,255,.14),0 4px 12px rgba(0,0,0,.4)}
.seg .th::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 90% at 20% 0%,rgba(255,255,255,.4),transparent 60%);pointer-events:none}

.tb .rb{background:linear-gradient(180deg,#0b1127,#141c3b);box-shadow:inset 0 1px 1px rgba(255,255,255,.3),inset 0 -1px 2px rgba(255,255,255,.1),0 4px 14px rgba(0,0,0,.4)}
.tb .rb::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.15),transparent 38%);pointer-events:none}
.cb{background:linear-gradient(165deg,rgba(172,174,214,.45),rgba(84,86,126,.45));box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -1.5px 2px rgba(255,255,255,.16),0 3px 8px rgba(0,0,0,.35);z-index:4}

.cb::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(90% 60% at 30% 5%,rgba(255,255,255,.4),transparent 60%);pointer-events:none}

:root{--rim:linear-gradient(140deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.05) 30%,rgba(255,255,255,.02) 60%,rgba(255,255,255,.16) 100%)}

.k,.k.d{background:linear-gradient(180deg,rgba(128,130,165,.5),rgba(96,98,132,.46))}
.k{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 4px rgba(0,0,0,.3);text-shadow:none}

.k.d{transform:scale(.92);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 10px rgba(160,140,255,.3)}

.pill{background:linear-gradient(180deg,rgba(44,58,140,.3),rgba(16,22,70,.58));backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 18px rgba(110,140,255,.06),0 8px 24px rgba(0,12,90,.4)}

 <div class="abs seg" id="seg"><div class="th" id="th"></div><span class="on">Chat</span><span>Task</span></div>

 <div class="abs kb" id="kbd">
  <div class="abs tb">
   <div class="rb"><div class="g2"></div><div class="g1"></div><div class="dots"></div></div>
   <div class="glow" style="z-index:-1"></div>
   <div class="cb" style="left:5px"><svg width="16" height="16" viewBox="0 0 16 16"><path class="ic" d="M3 3l10 10M13 3L3 13"/></svg></div>
   <div class="cb" style="left:298px"><svg width="16" height="16" viewBox="0 0 16 16"><path class="ic" d="M3 6l5 5 5-5"/></svg></div>

  </div>
  <div class="rows" id="rows"></div>
 </div>
 <div class="abs home"></div>
</div>

<script>
(function(){
var st=document.getElementById('stage');
function fit(){var h=(window.visualViewport&&visualViewport.height)||innerHeight,w=innerWidth,s=Math.min(w/390,h/867);st.style.transform='translateX(-50%) scale('+s+')';st.style.top=Math.max(0,(h-867*s)/2)+'px'}
fit();addEventListener('resize',fit);

var ICO={
 shift:'<svg width="22" height="22" viewBox="0 0 22 22"><path class="ic" d="M11 3.5L3.5 11.5H8v6h6v-6h4.5z"/></svg>',
 bs:'<svg width="26" height="22" viewBox="0 0 26 22"><path class="ic" d="M8.5 3.5h13a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-13L2.5 11zM13 8l6 6M19 8l-6 6"/></svg>',
 emoji:'<svg width="24" height="24" viewBox="0 0 24 24"><circle class="ic" cx="12" cy="12" r="9"/><path class="ic" d="M8 14.2c1 1.5 2.3 2.2 4 2.2s3-.7 4-2.2"/><circle cx="9" cy="9.6" r="1.1" fill="#eceef8"/><circle cx="15" cy="9.6" r="1.1" fill="#eceef8"/></svg>',
 globe:'<svg width="24" height="24" viewBox="0 0 24 24"><circle class="ic" cx="12" cy="12" r="9"/><path class="ic" d="M3 12h18M12 3c3 2.7 3 15.3 0 18M12 3c-3 2.7-3 15.3 0 18"/></svg>',
 enter:'<svg width="26" height="22" viewBox="0 0 26 22"><path class="ic" d="M22 4v8H5M10 7l-5 5 5 5"/></svg>'
};
var LAY={
 a:[ "1234567890".split(''),"qwertyuiop".split(''),"asdfghjkl".split(''),['shift'].concat("zxcvbnm".split('')).concat(['bs']),['sym','emoji','globe','space','.','enter'] ],
 s:[ "1234567890".split(''),"@#$_&-+()/".split(''),['*','"',"'",':',';','!','?','%','='],['alt','<','>','[',']','{','}','bs'],['abc','emoji','globe','space',',','enter'] ]
};
var mode='a',shift=false,txt='';
var rows=document.getElementById('rows'),T=document.getElementById('t'),PH=document.getElementById('ph'),CA=document.getElementById('caret'),pill=document.getElementById('pill');

function mk(k){
 var d=document.createElement('div');d.className='k';d.dataset.k=k;
 if(k==='shift'){d.classList.add('w');d.innerHTML=ICO.shift;if(shift)d.classList.add('on')}
 else if(k==='alt'){d.classList.add('w','n');d.textContent='=\\<'}
 else if(k==='bs'){d.classList.add('w','pu');d.innerHTML=ICO.bs}
 else if(k==='sym'){d.classList.add('n');d.textContent='.?123'}
 else if(k==='abc'){d.classList.add('n');d.textContent='ABC'}
 else if(k==='emoji'){d.classList.add('e');d.innerHTML=ICO.emoji}
 else if(k==='globe'){d.classList.add('e');d.innerHTML=ICO.globe}
 else if(k==='space'){d.classList.add('sp');d.textContent='English'}
 else if(k==='enter'){d.classList.add('pur');d.innerHTML=ICO.enter}
 else if(k==='.'||k===','){d.classList.add('p');d.textContent=k}
 else d.textContent=(shift&&mode==='a')?k.toUpperCase():k;
 return d;
}
function build(){
 rows.innerHTML='';
 LAY[mode].forEach(function(r,i){
  var el=document.createElement('div');el.className='r'+(i===2?' c3':'')+(i===4?' b5':'');
  r.forEach(function(k){el.appendChild(mk(k))});rows.appendChild(el);
 });
}
function show(){
 var v=txt.length>26?txt.slice(-26):txt;T.textContent=v;
 PH.style.display=txt?'none':'';CA.classList.toggle('t',!!txt);
 pill.classList.toggle('has',!!txt);
}
var audioCtx = null;
var soundEnabled = true;
function playKeyClick(type) {
 if (!soundEnabled) return;
 try {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  var osc = audioCtx.createOscillator();
  var gain = audioCtx.createGain();
  osc.type = 'sine';
  var f = (type === 'space') ? 220 : (type === 'enter') ? 320 : (type === 'bs') ? 260 : 380 + Math.random() * 40;
  osc.frequency.setValueAtTime(f, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.035);
  gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.035);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.04);
 } catch(_) {}
}

function flashKey(kVal) {
 if (!kVal) return;
 var el = rows.querySelector('.k[data-k="' + kVal + '"]') || rows.querySelector('.k[data-k="' + kVal.toLowerCase() + '"]') || rows.querySelector('.k[data-k="' + kVal.toUpperCase() + '"]');
 if (!el) return;
 el.classList.add('d');
 var rp = document.createElement('span'); rp.className = 'rp'; el.appendChild(rp);
 rp.animate([{opacity:.85,transform:'scale(.4)'},{opacity:0,transform:'scale(1.35)'}],{duration:450,easing:'cubic-bezier(.2,.7,.2,1)'}).onfinish=function(){rp.remove()};
 setTimeout(function(){ el.classList.remove('d'); }, 120);
}

function press(k){
 playKeyClick(k);
 if(k==='shift'){shift=!shift;build();return}
 if(k==='sym'){mode='s';build();return}
 if(k==='abc'){mode='a';build();return}
 if(k==='alt'||k==='globe')return;
 if(k==='bs'){txt=txt.slice(0,-1);show();return}
 if(k==='enter'){if(txt){txt='';show();pill.classList.add('bump');setTimeout(function(){pill.classList.remove('bump')},140)}return}
 if(k==='space'){txt+=' ';show();return}
 if(k==='emoji'){txt+='\u{1F642}';show();return}
 var c=(shift&&mode==='a')?k.toUpperCase():k;
 txt+=c;show();
 if(shift&&mode==='a'){shift=false;build()}
}
build();show();

var act={},rep={};
function down(e){
 var k=e.target.closest&&e.target.closest('.k');if(!k)return;
 e.preventDefault();
 act[e.pointerId]=k;k.classList.add('d');
 var rp=document.createElement('span');rp.className='rp';k.appendChild(rp);
 rp.animate([{opacity:.85,transform:'scale(.4)'},{opacity:0,transform:'scale(1.35)'}],{duration:520,easing:'cubic-bezier(.2,.7,.2,1)'}).onfinish=function(){rp.remove()};
 if(navigator.vibrate)try{navigator.vibrate(6)}catch(_){}
 var key=k.dataset.k;
 press(key);
 if(key==='bs'){
  rep[e.pointerId]=setTimeout(function(){rep[e.pointerId]=setInterval(function(){press('bs')},55)},380);
 }
}
function up(e){
 var k=act[e.pointerId];if(!k)return;
 k.classList.remove('d');delete act[e.pointerId];
 if(rep[e.pointerId]){clearTimeout(rep[e.pointerId]);clearInterval(rep[e.pointerId]);delete rep[e.pointerId]}
}
rows.addEventListener('pointerdown',down);
addEventListener('pointerup',up);addEventListener('pointercancel',up);

document.querySelectorAll('.sg').forEach(function(s){
 s.addEventListener('click',function(){
  txt=s.dataset.s;
  show();
  playKeyClick('enter');
  if(pill){
   pill.classList.add('bump');
   setTimeout(function(){pill.classList.remove('bump')},140);
  }
 });
});
var seg=document.getElementById('seg'),th=document.getElementById('th'),sp=seg.querySelectorAll('span');
seg.addEventListener('click',function(e){
 var i=e.target===sp[1]?1:e.target===sp[0]?0:(e.offsetX>seg.clientWidth/2?1:0);
 th.style.transform='translateX('+(i*73)+'px)';
 sp[0].classList.toggle('on',i===0);sp[1].classList.toggle('on',i===1);
 playKeyClick('space');
});
document.getElementById('send').addEventListener('click',function(){if(txt){txt='';show();playKeyClick('enter')}});
var mic=document.querySelector('.mic');
if(mic){
 mic.style.cursor='pointer';
 mic.addEventListener('click',function(){
  txt='🎙️ Listening (Gemini Rambler)...';
  show();
  playKeyClick('enter');
  setTimeout(function(){
   txt='Meeting confirmed for 5 PM with team.';
   show();
   playKeyClick('space');
   if(pill){
    pill.classList.add('bump');
    setTimeout(function(){pill.classList.remove('bump')},140);
   }
  },1200);
 });
}

// Physical Keyboard Integration (Desktop/Laptop Typing)
window.addEventListener('keydown', function(e) {
 if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
 if (e.ctrlKey || e.metaKey || e.altKey) return;
 var k = e.key;
 if (k === 'Backspace') {
  e.preventDefault();
  press('bs');
  flashKey('bs');
 } else if (k === 'Enter') {
  e.preventDefault();
  press('enter');
  flashKey('enter');
 } else if (k === ' ') {
  e.preventDefault();
  press('space');
  flashKey('space');
 } else if (k === 'Shift') {
  press('shift');
  flashKey('shift');
 } else if (k.length === 1) {
  e.preventDefault();
  var lower = k.toLowerCase();
  flashKey(lower);
  txt += k;
  show();
  playKeyClick('char');
 }
});

// PostMessage API for Embedded Parent Control
window.addEventListener('message', function(e) {
 if (!e.data) return;
 if (e.data.action === 'type') {
  txt = e.data.text || '';
  show();
  if (pill) {
   pill.classList.add('bump');
   setTimeout(function(){ pill.classList.remove('bump'); }, 160);
  }
 } else if (e.data.action === 'clear') {
  txt = '';
  show();
 } else if (e.data.action === 'toggleSound') {
  soundEnabled = !soundEnabled;
 }
});

// Dynamic Local Time Clock
function updateClock() {
 try {
  var d = new Date();
  var h = d.getHours();
  var m = d.getMinutes();
  var s = (h % 12 || 12) + ':' + (m < 10 ? '0' : '') + m;
  var clk = document.getElementById('clock');
  if (clk) clk.textContent = s;
 } catch (_) {}
}
updateClock();
setInterval(updateClock, 10000);

// Hide Return Button if embedded inside an iframe
if (window !== window.top) {
 var hp = document.getElementById('homePill');
 if (hp) hp.style.display = 'none';
}
})();
</script>
</body>
</html>
