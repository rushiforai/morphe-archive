name: TikTok 46.7.3 acceptance

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: tiktok-46-7-3-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon

      - name: Resolve runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*-sources.mpp' ! -name '*-javadoc.mpp' | sort | head -n 1)"
          test -n "$MPP"
          case "$MPP" in
            *-sources.mpp|*-javadoc.mpp) echo "Refusing non-runtime MPP: $MPP" >&2; exit 1 ;;
          esac
          echo "Using runtime bundle: $MPP"
          echo "MPP=$MPP" >> "$GITHUB_ENV"

      - name: Verify theme bytecode and runtime regressions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:test :extensions:tiktok:testDebugUnitTest --no-daemon

      - name: Download exact TikTok 46.7.3 APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="b9e96e64e94ac0f9ea229dd0ba743f1930121a8b6941cf9fd87191604da0129e"
          curl -fL --retry 4 --retry-delay 3 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            'https://d.apkpure.net/b/APK/com.zhiliaoapp.musically?versionCode=2024607030' \
            -o tiktok-46.7.3.apk
          ACTUAL="$(sha256sum tiktok-46.7.3.apk | awk '{print $1}')"
          SIZE="$(stat -c '%s' tiktok-46.7.3.apk)"
          echo "Downloaded bytes: $SIZE"
          echo "SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Inspect exact 46.7.3 model structures
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: |
          set +e
          ANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer 2>/dev/null | sort | tail -n 1)"
          {
            echo "=== BlueIT exact TikTok 46.7.3 model evidence ==="
            echo "apkanalyzer=$ANALYZER"
            if [ -z "$ANALYZER" ]; then
              echo "apkanalyzer unavailable"
              exit 0
            fi
            echo "=== FeedItemList ==="
            timeout 25s "$ANALYZER" dex code --class com.ss.android.ugc.aweme.feed.model.FeedItemList tiktok-46.7.3.apk 2>&1 | head -n 1600
            echo "=== Aweme ==="
            timeout 25s "$ANALYZER" dex code --class com.ss.android.ugc.aweme.feed.model.Aweme tiktok-46.7.3.apk 2>&1 | head -n 2200
            echo "=== PhotoModeImageInfo ==="
            timeout 25s "$ANALYZER" dex code --class com.ss.android.ugc.aweme.feed.model.PhotoModeImageInfo tiktok-46.7.3.apk 2>&1 | head -n 1200
            echo "=== Video ==="
            timeout 25s "$ANALYZER" dex code --class com.ss.android.ugc.aweme.feed.model.Video tiktok-46.7.3.apk 2>&1 | head -n 1800
            echo "=== quick string evidence ==="
            rm -rf /tmp/blueit-dex && mkdir -p /tmp/blueit-dex
            unzip -q -j tiktok-46.7.3.apk 'classes*.dex' -d /tmp/blueit-dex || true
            find /tmp/blueit-dex -type f -name '*.dex' -print0 | xargs -0 strings 2>/dev/null \
              | grep -Ei 'Feed0VVManager|full_feed_commit_process_data|homepage_hot|filter_show_ad|soft_ads|roi2|onDoubleTap|onSingleTapConfirmed|onLongPress|DoubleTap|SingleTap|Gesture|Digg|seekTo|PhotoModeImageInfo|BitRate|aigc' \
              | sort -u | head -n 1800
          } > target-evidence.txt 2>&1
          cat target-evidence.txt | head -n 5000
          exit 0

      - name: Download Morphe Desktop CLI
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(curl -fsSL -H 'Accept: application/vnd.github+json' https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest)"
          URL="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url' | head -n 1)"
          test -n "$URL" && test "$URL" != null
          curl -fL --retry 3 "$URL" -o morphe-desktop.jar

      - name: Apply full 46.7.3 catalog once
        id: patch_full
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Xmx6g
        run: |
          set +e
          PATCH_NAMES="$(python3 - <<'PY'
          import json
          data = json.load(open('patches-list.json'))
          for patch in data.get('patches') or []:
              versions = (patch.get('compatiblePackages') or {}).get('com.zhiliaoapp.musically') or []
              if '46.7.3' in versions:
                  print(patch['name'])
          PY
          )"
          args=()
          while IFS= read -r name; do
            [ -n "$name" ] && args+=(-e "$name")
          done <<< "$PATCH_NAMES"
          java -jar morphe-desktop.jar patch \
            -p "$MPP" \
            --continue-on-error \
            --unsigned \
            --result-file morphe-full-result.json \
            "${args[@]}" \
            -o /tmp/tiktok-full-patched.apk \
            tiktok-46.7.3.apk 2>&1 | tee morphe-full.log
          code=${PIPESTATUS[0]}
          if grep -q 'INFO: Applying 0 patches' morphe-full.log; then code=97; fi
          if grep -q '^WARNING: Skipping ".*": incompatible with com.zhiliaoapp.musically 46.7.3' morphe-full.log; then code=98; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate complete 46.7.3 catalog
        id: validate
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          package = "com.zhiliaoapp.musically"
          version = "46.7.3"
          failures = []
          metadata_path = Path("patches-list.json")
          if not metadata_path.exists():
              failures.append("patches-list.json was not generated")
              metadata = {"patches": []}
          else:
              metadata = json.loads(metadata_path.read_text())

          expected = set()
          for patch in metadata.get("patches") or []:
              versions = (patch.get("compatiblePackages") or {}).get(package) or []
              if version in versions:
                  expected.add(patch.get("name"))

          print("Expected full catalog:", sorted(expected))
          path = Path("morphe-full-result.json")
          if not path.exists():
              failures.append("full catalog: morphe-full-result.json was not produced")
          else:
              data = json.loads(path.read_text())
              applied = {item.get("name") for item in (data.get("appliedPatches") or [])}
              failed = data.get("failedPatches") or []
              missing = sorted(expected - applied)
              unexpected = sorted(applied - expected)
              print(f"full catalog: applied={len(applied)} expected={len(expected)} failed={len(failed)}")
              if failed:
                  failures.append(f"full catalog: failed patches: {failed}")
              if missing:
                  failures.append(f"full catalog: compatible patches not applied: {missing}")
              if unexpected:
                  failures.append(f"full catalog: unexpected applied patches: {unexpected}")
              if not expected:
                  failures.append("full catalog: generated metadata selected no 46.7.3 patches")

          if failures:
              for failure in failures:
                  print(failure, file=sys.stderr)
              raise SystemExit(1)
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify reusable hook discovery against the acceptance APK
        if: steps.patch_full.outputs.exit_code == '0'
        run: |
          python3 -m pip install -r scripts/tiktok/requirements.txt
          python3 scripts/tiktok/rediscover_hooks.py tiktok-hook-report.json tiktok-46.7.3.apk --verify-baseline

      - name: Summarize failures
        if: always()
        shell: bash
        run: |
          echo '=== FULL-CATALOG PATCH FAILURES / SKIPS ==='
          grep -E 'SEVERE: FAILED:|Patching aborted|PatchException|Failed to match|Could not find instruction|WARNING: Skipping' morphe-full.log || true
          echo '=== BLUEIT GESTURE DISCOVERY ==='
          grep '\[BlueITGestureDiscovery\]' morphe-full.log || true
          echo '=== FULL-CATALOG APPLIED COUNT ==='
          grep -c '^INFO: Applied:' morphe-full.log || true
          echo '=== FULL-CATALOG RESULT JSON ==='
          cat morphe-full-result.json 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-46.7.3-acceptance
          path: |
            morphe-full.log
            morphe-full-result.json
            patches-list.json
            target-evidence.txt
            tiktok-hook-report.json
            tiktok-hook-migration.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if acceptance reported failures
        if: always()
        shell: bash
        run: |
          test "${{ steps.patch_full.outputs.exit_code }}" = "0"
          test "${{ steps.validate.outputs.exit_code }}" = "0"
