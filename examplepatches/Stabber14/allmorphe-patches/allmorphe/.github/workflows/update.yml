name: AllMorphe Bundle Index Auto-Update

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Refresh bundle index
        run: python allmorphe/fetch_patches.py

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes detected."
            exit 0
          fi
          git config user.name "AllMorphe Bot"
          git config user.email "allmorphe-bot@users.noreply.github.com"
          git add sources.txt bundles.json install-all.sh patches-bundle.json allmorphe/sources.txt allmorphe/bundles.json
          git commit -m "chore: update AllMorphe bundle index [skip ci]"
          git push