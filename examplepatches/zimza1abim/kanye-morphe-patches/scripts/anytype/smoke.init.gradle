gradle.projectsEvaluated {
    def p = gradle.rootProject.project(':patches')
    p.sourceSets.test.kotlin.srcDir(new File(gradle.rootProject.projectDir, 'scripts/anytype'))
    p.configurations.testImplementation.extendsFrom(p.configurations.compileOnly)
    p.dependencies.add('testImplementation', 'app.morphe:morphe-patcher:1.8.0')
    p.dependencies.add('testImplementation', 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2')
    p.tasks.register('anytypeSmoke', JavaExec) {
        dependsOn p.tasks.named('testClasses'), p.tasks.named('jar')
        classpath = p.sourceSets.test.runtimeClasspath
        mainClass = 'AnytypeSmokeKt'
        maxHeapSize = '3g'
        args System.getProperty('anytype.apk'), p.layout.buildDirectory.file("libs/patches-${p.version}.mpp").get().asFile.absolutePath, System.getProperty('anytype.out'), System.getProperty('anytype.sdk')
    }
}
