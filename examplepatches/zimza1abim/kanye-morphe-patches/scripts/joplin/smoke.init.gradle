gradle.projectsEvaluated {
    def p = gradle.rootProject.project(':patches')
    p.sourceSets.test.kotlin.srcDir(new File(gradle.rootProject.projectDir, 'scripts/joplin'))
    p.configurations.testImplementation.extendsFrom(p.configurations.compileOnly)
    p.dependencies.add('testImplementation', 'app.morphe:morphe-patcher:2.3.0')
    p.dependencies.add('testImplementation', 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2')
    p.tasks.register('joplinSmoke', JavaExec) {
        dependsOn p.tasks.named('testClasses')
        classpath = p.sourceSets.test.runtimeClasspath
        mainClass = 'JoplinSmokeKt'
        maxHeapSize = '3g'
        args System.getProperty('joplin.apk'), p.layout.buildDirectory.file("libs/patches-${p.version}.mpp").get().asFile.absolutePath, System.getProperty('joplin.out'), System.getProperty('joplin.sdk')
    }
}
