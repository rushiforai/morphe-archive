// Usage: ./gradlew -I scripts/compat/compat.init.gradle :patches:compatSmoke -x :patches:test \
//   -Dcompat.apk=<apk> -Dcompat.out=<dir> -Dcompat.sdk=<android sdk> -Dcompat.patches='A|B'
gradle.projectsEvaluated {
    def p = gradle.rootProject.project(':patches')
    p.sourceSets.test.kotlin.srcDir(new File(gradle.rootProject.projectDir, 'scripts/compat/src'))
    p.configurations.testImplementation.extendsFrom(p.configurations.compileOnly)
    p.dependencies.add('testImplementation', 'app.morphe:morphe-patcher:2.3.0')
    p.dependencies.add('testImplementation', 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2')
    p.tasks.register('compatSmoke', JavaExec) {
        dependsOn p.tasks.named('testClasses'), p.tasks.named('buildAndroid')
        classpath = p.sourceSets.test.runtimeClasspath
        mainClass = 'CompatSmokeKt'
        maxHeapSize = '4g'
        args System.getProperty('compat.apk'),
            p.layout.buildDirectory.file("libs/patches-${p.version}.mpp").get().asFile.absolutePath,
            System.getProperty('compat.out'),
            System.getProperty('compat.sdk'),
            System.getProperty('compat.patches')
    }
}
