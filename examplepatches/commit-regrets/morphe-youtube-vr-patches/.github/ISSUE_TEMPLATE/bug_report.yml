name: 🐞 Bug report
description: Report a bug or an issue.
title: "bug: "
labels: ["Bug report"]
body:
  - type: markdown
    attributes:
      value: |
        # YouTube VR Patches bug report

        Before creating a new bug report, please keep the following in mind:

        - **Do not submit a duplicate bug report**: Search for existing bug reports [here](https://github.com/commit-regrets/morphe-youtube-vr-patches/issues?q=label%3A%22Bug+report%22).
        - **Check the version support first**: the patches only apply to the app versions listed in
          `patches/src/main/kotlin/app/ytvr/patches/shared/Constants.kt`. An unlisted version is
          *skipped*, not failed, so the result is an app with none of the fixes — see
          [docs/VERSIONING.md](https://github.com/commit-regrets/morphe-youtube-vr-patches/blob/main/docs/VERSIONING.md)
          before assuming a patch is broken.
        - **A new YouTube VR version is the usual cause.** If the store updated the app, the
          fingerprints need re-deriving; the fields below are what make that possible.
  - type: textarea
    attributes:
      label: Bug description
      description: |
        - Describe your bug in detail
        - Add steps to reproduce the bug if possible (Step 1. ... Step 2. ...)
        - Add images and videos if possible
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: YouTube VR version and version code
      description: |
        On a PC with adb: `adb shell dumpsys package com.google.android.apps.youtube.vr.oculus | grep -E 'versionName|versionCode'`
        In Morphe Manager, the version is shown next to the app you selected.
      placeholder: "1.90.05 (19005000)"
    validations:
      required: true
  - type: input
    id: bundle-version
    attributes:
      label: Patches bundle version
      description: The `.mpp` you applied, e.g. `patches-1.1.0.mpp`, or "the source at <commit>".
      placeholder: "patches-1.1.0.mpp"
    validations:
      required: true
  - type: dropdown
    id: how-patched
    attributes:
      label: How did you patch?
      options:
        - Morphe Manager (on the headset)
        - Morphe Desktop (GUI)
        - Morphe CLI
        - scripts/patch-and-install.ps1
    validations:
      required: true
  - type: textarea
    id: patch-results
    attributes:
      label: Which patches applied, were skipped, or failed
      description: |
        This is the field that matters most. With the CLI, run the apply with a report and paste
        the result:

        ```
        java -jar morphe-desktop-all.jar patch --patches patches-<version>.mpp \
          --force --continue-on-error --result-file out.json -o out.apk youtube-vr.apk
        ```

        Paste the `Applied:` / `Skipping` / `FAILED:` lines, or the `appliedPatches` and
        `failedPatches` arrays from `out.json`. `--force` bypasses the version check so the
        patches are actually attempted; without it an unlisted version is skipped and the report
        looks clean.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Headset
      options:
        - Quest 2
        - Quest 3
        - Quest 3S
        - Quest Pro
        - Other (say which below)
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error logs
      description: Exceptions can be captured by running `adb logcat | grep -E 'AndroidRuntime|System.out'` while reproducing, and the patcher's own output.
      render: shell
  - type: textarea
    attributes:
      label: Solution
      description: If applicable, add a possible solution to the bug.
  - type: textarea
    attributes:
      label: Additional context
      description: Add additional context here.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your bug report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
        - label: I have checked the version support in docs/VERSIONING.md and provided the version details above.
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: All requested information has been provided properly.
          required: true
