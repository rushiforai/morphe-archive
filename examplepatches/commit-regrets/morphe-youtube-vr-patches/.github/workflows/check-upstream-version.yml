name: Check Upstream Version

on:
  schedule:
    # GitHub's schedule event is the unreliable part, measured here: '0 10 * * *' drifted
    # 13:43->16:44 UTC across a week of runs and was dropped entirely on 2026-11-25 (no run
    # created, no failure -- delayed schedule events can be skipped under load). Four slots
    # a day, all off the hour (peak load sits on the hour marks), bound a dropped slot at
    # ~6h of detection latency; a whole dropped day still leaves the next day's slots. The
    # check is idempotent -- a duplicate run only re-queries the store, and an open issue
    # suppresses duplicate notifications -- so extra slots cost seconds, not double reports.
    # The watchdog (upstream-check-watchdog.yml) alarms when even these all go quiet.
    - cron: '23 1,7,13,19 * * *'
  workflow_dispatch:

concurrency:
  group: check-upstream-version
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Meta Quest Store
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true

      - name: Query Meta Quest Store
        id: check
        run: node scripts/check-upstream-version.mjs

      - name: Process upstream update notification
        if: steps.check.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NEW_VERSION: ${{ steps.check.outputs.latest_version }}
          BODY_FILE: ${{ steps.check.outputs.issue_body_path }}
        run: |
          TITLE="Upstream Update: YouTube VR $NEW_VERSION is available on Meta Quest Store"

          echo "Searching for existing issue with title '$TITLE'..."
          # Open issues only: a CLOSED issue with the same title must not mask a fresh detection
          # (closed #40 suppressed the genuine 1.89.09 issue for five runs, 2026-10-22..26).
          EXISTING_ISSUE=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Issue #$EXISTING_ISSUE already exists for version $NEW_VERSION. Skipping duplicate issue creation."
            exit 0
          fi

          echo "Ensuring 'upstream-update' label exists..."
          gh label create "upstream-update" \
            --color "0E8A16" \
            --description "New upstream app release detected on Meta Quest Store" \
            --force || true

          echo "Opening GitHub Issue for YouTube VR $NEW_VERSION..."
          gh issue create \
            --title "$TITLE" \
            --label "upstream-update" \
            --body-file "$BODY_FILE"
