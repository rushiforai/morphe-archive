name: Release

on:
  # Manual on purpose: no push triggers this, so nothing is built or released unless we ask.
  # Dispatch it from `main` when a release is actually wanted; semantic-release then decides
  # whether the commits since the last tag justify one (see .releaserc.js, which also allows
  # pre-releases from `develop`).
  workflow_dispatch:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      # @semantic-release/github's success step labels the released pull requests and issues;
      # without this it fails with a 403 and no message, after the release has been published.
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        # npm ci, deliberately: the lockfile is the contract now. semantic-release runs out of this
        # tree, so its preset and its conventional-changelog-writer are resolved here, together,
        # exactly as `npm ls` would show -- the failure mode this file used to have was those two
        # being split across two different installs.
        run: npm ci

      # semantic-release verifies it is allowed to push before it does anything else. Give it an
      # explicitly authenticated origin rather than relying on the checked-out remote's form, and
      # a committer identity for the version-bump commit @semantic-release/git creates.
      - name: Configure Git for the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The release only works while the preset and the writer agree, so print both on every run.
      # This is the check that would have caught the split-tree failure before it published.
      - name: Check the changelog tooling resolves consistently
        run: node .github/scripts/release-debug.mjs

      # The extension build needs an Android platform jar (for javac) and R8 (for d8). Neither
      # exists on the runner, so fetch both and hand them over through the environment -- the
      # build resolves them from $ANDROID_JAR and $R8_JAR (see patches/build.gradle.kts).
      # Without this the release fails in `generatePatchesList`, i.e. before publishing.
      - name: Provide the Android platform jar and R8
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/platform.zip" \
            https://dl.google.com/android/repository/platform-34-ext7_r03.zip
          unzip -q -o "$tools/platform.zip" -d "$tools"
          echo "ANDROID_JAR=$(find "$tools" -name android.jar | head -n1)" >> "$GITHUB_ENV"
          curl -fsSL -o "$tools/r8.jar" \
            https://maven.google.com/com/android/tools/r8/9.5.23/r8-9.5.23.jar
          echo "R8_JAR=$tools/r8.jar" >> "$GITHUB_ENV"

      # semantic-release runs directly, not through cycjimmy/semantic-release-action. That action
      # installed its own semantic-release tree and resolved conventional-changelog-writer from
      # there -- writer 8.2.0, outside the reach of this repository's lockfile and `overrides` --
      # while loading the changelog preset from this repository. Preset v10 needs a writer@9, so
      # that split tree threw "Missing helper" on every run. Running our own semantic-release keeps
      # the preset and the writer in one tree, which is the whole point.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bundle signing (docs/INTERNALS.md, "The patcher 2.x alignment"): the plugin signs the
          # .mpp it assembles when this Ed25519 private key is present, and cross-checks it
          # against the committed morphe-signing.pub. Absent -> unsigned bundle, still valid.
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          echo "new_release_git_tag=" >> "$GITHUB_OUTPUT"
          # No flags: this is the same invocation the action made, just from our own tree.
          npx semantic-release | tee semantic-release.log
          if git tag --points-at HEAD | grep -q .; then
            tag=$(git tag --points-at HEAD | head -n1)
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_git_tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Always verify compilation when semantic-release did not publish a release.
      # This covers non-main/dev branches, chore commits, docs commits, etc.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
