[versions]
# 2.4.0 -- the version the official bundle (morphe-patches v2.3.0) builds against. The current
# hosts (Manager 2.7.1 and Desktop 2.3.0, both running patcher 2.5.0) must run 2.4-built
# bundles because the official bundle ships exactly this pairing. Re-checked 2026-11-24.
morphe-patcher = "2.4.0"
# The commit the official bundle pins alongside patcher 2.4.0 -- deliberately NOT the commit
# patcher 2.4.0's own build pins (5eaff5a2c9). If the assembly step ever fails on missing
# dexlib2 APIs, the patcher's own pin is the fallback. jitpack hashes do not order, so Gradle
# will not resolve the conflict for us.
smali = "4220ae75f7"
gson = "2.15.0"
junit = "6.1.3"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }
# The patches Gradle plugin (2.x) reads this alias and puts it on the patcher-provided
# compile classpath; it must stay the commit the compiled-against patcher pins (see the
# smali version note above).
smali = { module = "com.github.MorpheApp.smali:smali", version.ref = "smali" }
# The dexlib2 classes proper (incl. the immutable instruction builders the mining test uses).
# The plugin puts this on the MAIN compile classpath itself; the tests need their own copy.
# Same commit as the `smali` alias above.
smali-dexlib2 = { module = "com.github.MorpheApp.smali:smali-dexlib2", version.ref = "smali" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
