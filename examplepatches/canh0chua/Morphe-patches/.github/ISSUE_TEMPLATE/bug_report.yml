name: Bug Report
description: Report a bug in a patch
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: patch-name
    attributes:
      label: Patch Name
      description: The name of the patch that has the bug
      placeholder: e.g. "Example Patch"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App Version
      description: The version of the target app you are patching
      placeholder: e.g. "2.0.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: If applicable, add logs to help explain your problem
      placeholder: Paste logs here
      render: text
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here