name: Build Morphe patches

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: gradle :patches:buildAndroid --no-daemon
      - name: Upload .mpp bundle
        uses: actions/upload-artifact@v4
        with:
          name: instagram-custom-branding-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error
      - name: Publish stable release and update source manifest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          set -euo pipefail
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$MPP"
          TAG="v${VERSION}"
          cp "$MPP" patches.mpp
          gh release create "$TAG" "patches.mpp" --title "Instagram Custom Branding ${TAG}" --notes "Automated Morphe patch bundle build. Verify compatibility with your Instagram APK before use."
          python3 - <<'PY'
          import json, os, datetime
          repo=os.environ["REPO"]; version=os.environ["VERSION"]
          data={
            "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "description": "Instagram custom app name, icon and splash branding patches",
            "download_url": f"https://github.com/{repo}/releases/download/v{version}/patches.mpp",
            "signature_download_url": "",
            "version": version
          }
          with open("patches-bundle.json","w",encoding="utf-8") as f:
            json.dump(data,f,ensure_ascii=False,indent=2)
            f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          git commit -m "chore: update patch bundle manifest [skip ci]"
          git push
