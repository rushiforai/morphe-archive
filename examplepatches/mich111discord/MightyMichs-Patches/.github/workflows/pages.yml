name: Deploy website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.website/**'
      - '.github/workflows/pages.yml'

# Do not run on [skip ci] commits — GitHub skips the whole workflow automatically.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy .website to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
