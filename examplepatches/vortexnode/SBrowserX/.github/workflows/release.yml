name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build and Publish GitHub Release
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Morphe Android patch bundle
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN }}
        run: ./gradlew :patches:buildAndroid

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '/^[[:space:]]*version[[:space:]]*=/ { value=$2; sub(/^[[:space:]]+/, "", value); sub(/[[:space:]]*#.*/, "", value); sub(/[[:space:]]+$/, "", value); print value; exit }' gradle.properties)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          (cd patches/build/libs && sha256sum "patches-${version}.mpp" > SHA256SUMS)

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: SBrowserX ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            patches/build/libs/patches-${{ steps.meta.outputs.version }}.mpp
            patches/build/libs/SHA256SUMS
