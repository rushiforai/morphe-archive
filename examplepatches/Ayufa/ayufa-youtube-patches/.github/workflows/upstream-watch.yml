name: Watch upstream Morphe targets

# Read-only watch of upstream MorpheApp/morphe-patches.
# Never writes anything to upstream: it only downloads raw files from
# upstream and, when the supported YouTube targets drift from this repo,
# opens an issue in THIS repository.

on:
  schedule:
    # Daily 10:30 JST (01:30 UTC)
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Compare YouTube targets with upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare targets
        id: compare
        run: |
          set -euo pipefail
          UPSTREAM_CONSTANTS="https://raw.githubusercontent.com/MorpheApp/morphe-patches/main/patches/src/main/kotlin/app/morphe/patches/youtube/shared/Constants.kt"
          UPSTREAM_TOML="https://raw.githubusercontent.com/MorpheApp/morphe-patches/main/gradle/libs.versions.toml"

          curl -fsSL "$UPSTREAM_CONSTANTS" -o /tmp/upstream-constants.kt
          curl -fsSL "$UPSTREAM_TOML" -o /tmp/upstream-libs.versions.toml || true

          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import re

          upstream = open('/tmp/upstream-constants.kt').read()
          ours = open('patches/src/main/kotlin/app/ayufa/patches/youtube/shared/Constants.kt').read()

          # Upstream anchors this repo cares about:
          #  - the version commented "Last version for Android 8.0"
          #  - the newest non-experimental target (first AppTarget block
          #    without isExperimental, targets are listed newest first)
          m = re.search(r'version\s*=\s*"([0-9.]+)"[^\n]*Last version for Android 8\.0', upstream)
          upstream_android8 = m.group(1) if m else "unknown"

          upstream_stable = "unknown"
          for block in re.findall(r'AppTarget\((.*?)\)', upstream, re.S):
              v = re.search(r'version\s*=\s*"([0-9.]+)"', block)
              if v and 'isExperimental' not in block:
                  upstream_stable = v.group(1)
                  break

          def our_target(const_name):
              m = re.search(const_name + r'.*?AppTarget\(\s*version\s*=\s*"([0-9.]+)"', ours, re.S)
              return m.group(1) if m else "unknown"

          our_android8 = our_target('COMPATIBILITY_YOUTUBE_ANDROID_8')
          our_modern = our_target('COMPATIBILITY_YOUTUBE_MODERN')

          try:
              toml = open('/tmp/upstream-libs.versions.toml').read()
              upstream_patcher = re.search(r'^morphe-patcher\s*=\s*"([^"]+)"', toml, re.M).group(1)
          except Exception:
              upstream_patcher = "unknown"
          our_toml = open('gradle/libs.versions.toml').read()
          m = re.search(r'^morphe-patcher\s*=\s*"([^"]+)"', our_toml, re.M)
          our_patcher = m.group(1) if m else "unknown"

          drift = 0
          if upstream_android8 != "unknown" and upstream_android8 != our_android8:
              drift = 1
          if upstream_stable != "unknown" and upstream_stable != our_modern:
              drift = 1
          # Note: morphe-patches' own patcher version is informational only.
          # This repo follows the patches-template patcher version, which
          # Dependabot keeps updated; a difference is not drift.

          print(f"upstream_versions=Android 8.0 last: {upstream_android8} / newest stable: {upstream_stable}")
          print(f"our_versions=Android 8.0 target: {our_android8} / modern target: {our_modern}")
          print(f"upstream_patcher={upstream_patcher}")
          print(f"our_patcher={our_patcher}")
          print(f"drift={drift}")
          PYEOF

      - name: Open issue on drift
        if: steps.compare.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="upstream: Morphe YouTube targets changed"
          BODY=$(cat <<EOF
          Upstream \`MorpheApp/morphe-patches\` (main) now declares YouTube targets that differ from this repo.

          **Upstream targets:**
          \`\`\`
          ${{ steps.compare.outputs.upstream_versions }}
          \`\`\`

          **This repo declares:**
          \`\`\`
          ${{ steps.compare.outputs.our_versions }}
          \`\`\`

          morphe-patcher: upstream \`${{ steps.compare.outputs.upstream_patcher }}\` / this repo \`${{ steps.compare.outputs.our_patcher }}\`

          Action: check docs/UPSTREAM.md, re-verify fingerprints against any
          new "last version for Android 8.0" / newest stable target, and
          update \`Constants.kt\` accordingly. Do not interact with upstream.
          EOF
          )
          # Skip if an identical open issue already exists.
          if gh issue list --state open --search "$TITLE in:title" --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "Issue already open; skipping."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "$BODY" --label "upstream" || \
          gh issue create --title "$TITLE" --body "$BODY"
