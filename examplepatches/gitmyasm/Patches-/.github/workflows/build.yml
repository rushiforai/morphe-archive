name: Build patches

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build .mpp bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Build patch bundle
        env:
          GITHUB_ACTOR: gitmyasm
          GITHUB_TOKEN: ${{ secrets.MORPHE_GPR_TOKEN || github.token }}
        run: ./gradlew :patches:buildAndroid --no-daemon --stacktrace

      - name: Show output
        run: ls -lh patches/build/libs/

      - name: Upload .mpp
        uses: actions/upload-artifact@v4
        with:
          name: patches-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 7
