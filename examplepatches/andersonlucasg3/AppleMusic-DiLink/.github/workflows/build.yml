name: Release APKs (engine + TV + Car)

# Publica APKs, não bundles .mpp. O produto são os companions (:tv-app/:car-app) e o
# engine (Apple Music 7.0.0 patcheado) por ABI. Todos os APKs saem assinados com o
# MESMO certificado Morphe (secrets MORPHE_*): o engine e o companion compartilham
# sharedUserId e o MediaBrowserService recusa a conexão se o cert for diferente.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão da release, sem o prefixo v (ex.: 1.5.1)"
        required: true
        type: string
      source_url:
        description: "URL do APKM 4-ABI (default: secret ENGINE_SOURCE_URL; vazio = só companions)"
        required: false
        default: ""
        type: string
      publish:
        description: "Criar/atualizar a release apps-<version> (desmarque para só artifacts)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The ubuntu runner image ships the Android SDK and cmdline-tools; the
      # android-actions/setup-android action is not used because its bootstrap
      # tries to install the removed "tools" package and fails.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      BUILD_TOOLS: /usr/local/lib/android/sdk/build-tools/36.0.0
      PUBLISH: ${{ inputs.publish }}
      MORPHE_KEYSTORE_P12: ${{ secrets.MORPHE_KEYSTORE_P12 }}
      MORPHE_KEYSTORE_PASSWORD: ${{ secrets.MORPHE_KEYSTORE_PASSWORD }}
      MORPHE_KEY_ALIAS: ${{ secrets.MORPHE_KEY_ALIAS }}
      MORPHE_KEY_PASSWORD: ${{ secrets.MORPHE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::input version é obrigatório (ex.: 1.5.1)"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::versão inválida: $VERSION"
            exit 1
          fi
          # appVersionCode scheme shared with the in-app updater: 1.6.1 -> 10601.
          VERSION_CODE="$(VERSION="$VERSION" python3 -c 'import os,re; m=re.match(r"^(\d+)\.(\d+)(?:\.(\d+))?$", os.environ["VERSION"]); print(int(m.group(1))*10000+int(m.group(2))*100+int(m.group(3) or 0) if m else "")')"
          if [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" -le 0 ]; then
            echo "::error::versão $VERSION não segue MAJOR.MINOR[.PATCH]; não é possível derivar o versionCode"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION VERSION_CODE=$VERSION_CODE"

      # Sem source_url nem ENGINE_SOURCE_URL o job NÃO falha: publica os companions e
      # marca "engine não anexado" nas notas. Com URL, qualquer falha do engine derruba
      # o job (melhor não publicar um release quebrado).
      - name: Resolve APK source URL
        id: source
        env:
          INPUT_SOURCE_URL: ${{ inputs.source_url }}
          SECRET_SOURCE_URL: ${{ secrets.ENGINE_SOURCE_URL }}
        run: |
          set -euo pipefail
          URL="${INPUT_SOURCE_URL:-$SECRET_SOURCE_URL}"
          echo "SOURCE_URL=$URL" >> "$GITHUB_ENV"
          if [ -n "$URL" ]; then
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "Fonte do APKM 4-ABI: $URL"
          else
            echo "::warning::sem source_url e sem ENGINE_SOURCE_URL: release só com os companions"
          fi

      # O p12 em base64 é o cert do release (CN=Morphe, SHA-256 1e0586...). Ele é
      # decodificado uma vez e usado pelo apksigner em todos os APKs.
      - name: Decode the Morphe keystore
        run: |
          set -euo pipefail
          if [ -z "$MORPHE_KEYSTORE_P12" ]; then
            echo "::error::secret MORPHE_KEYSTORE_P12 ausente"
            exit 1
          fi
          printf '%s' "$MORPHE_KEYSTORE_P12" | base64 -d > "$RUNNER_TEMP/morphe.p12"
          if [ ! -s "$RUNNER_TEMP/morphe.p12" ]; then
            echo "::error::falha ao decodificar o p12"
            exit 1
          fi
          file "$RUNNER_TEMP/morphe.p12"

      # The app.morphe:* artifacts live in GitHub Packages of the MorpheApp org, so the
      # default GITHUB_TOKEN of this repository cannot read them. Add a repository secret
      # GPR_KEY with a token that has read:packages (and GPR_USER with the account name).
      # Without it the build fails at dependency resolution.
      #
      # The companions link four dex files; mergeExtDex OOMs on the runner's default
      # heap (~2 GB), so the build runs with 4 GB heap and 1 GB metaspace.
      - name: Build patches bundle and companions
        env:
          GITHUB_ACTOR: ${{ secrets.GPR_USER != '' && secrets.GPR_USER || github.actor }}
          GITHUB_TOKEN: ${{ secrets.GPR_KEY != '' && secrets.GPR_KEY || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :patches:buildAndroid :tv-app:assembleRelease :car-app:assembleRelease \
            --no-daemon \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$VERSION_CODE" \
            "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      # AGP gera *-release-unsigned.apk (os módulos desligam o debug keystore de
      # propósito); zipalign + apksigner aplicam o p12 em cada companion.
      - name: Sign companions
        run: |
          set -euo pipefail
          mkdir -p dist
          sign_apk() {
            local input="$1" output="$2"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$input" "$RUNNER_TEMP/$output.aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/morphe.p12" --ks-type PKCS12 \
              --ks-pass "pass:$MORPHE_KEYSTORE_PASSWORD" \
              --ks-key-alias "$MORPHE_KEY_ALIAS" \
              --key-pass "pass:$MORPHE_KEY_PASSWORD" \
              --out "dist/$output" "$RUNNER_TEMP/$output.aligned.apk"
          }
          TV_APK="$(find tv-app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          CAR_APK="$(find car-app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$TV_APK" ] || [ -z "$CAR_APK" ]; then
            echo "::error::release APK do :tv-app ou :car-app não encontrado"
            exit 1
          fi
          sign_apk "$TV_APK" AppleMusic-TV.apk
          sign_apk "$CAR_APK" AppleMusic-Car.apk
          ls -l dist

      - name: Validate companion certificates
        run: |
          set -euo pipefail
          EXPECTED_CERT_SHA256="1e058623722ed37eb59bb55411d01d6b7b212c6a8353aacecd60d515cee60463"
          verify_cert() {
            local apk="$1" certs fingerprint
            certs="$("$BUILD_TOOLS/apksigner" verify --print-certs "$apk")"
            if ! grep -q "CN=Morphe" <<< "$certs"; then
              echo "::error::$apk não está assinado com CN=Morphe"
              exit 1
            fi
            fingerprint="$(grep -m 1 "certificate SHA-256 digest" <<< "$certs" \
              | sed 's/.*digest: *//' | tr -d ':' | tr 'A-F' 'a-f')"
            if [ "$fingerprint" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$apk assinado com cert errado: $fingerprint"
              exit 1
            fi
            echo "$apk: CN=Morphe / $fingerprint"
          }
          verify_cert dist/AppleMusic-TV.apk
          verify_cert dist/AppleMusic-Car.apk

      - name: Download engine tools
        if: steps.source.outputs.url != ''
        run: |
          set -euo pipefail
          mkdir -p tools
          curl -L --fail --retry 3 -o tools/APKEditor-1.4.9.jar \
            https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar
          curl -L --fail --retry 3 -o tools/morphe-desktop-2.1.1-all.jar \
            https://github.com/MorpheApp/morphe-desktop/releases/download/v2.1.1/morphe-desktop-2.1.1-all.jar

      # APKEditor merges the bundle by file name: base as the package name and the
      # splits as config.<qualifier>.apk, the same layout validated locally
      # (.pipeline/splits).
      - name: Download source bundle and assemble ABI splits
        if: steps.source.outputs.url != ''
        env:
          SOURCE_URL: ${{ steps.source.outputs.url }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/source.bin" "$SOURCE_URL"
          rm -rf source splits32 splits64
          mkdir -p source
          unzip -q -o "$RUNNER_TEMP/source.bin" -d source
          find source -type f -name '*.apk' | sort

          BASE="$(find source -type f \( -name 'base.apk' -o -name 'com.apple.android.music.apk' \) -print -quit)"
          ABI32="$(find source -type f \( -name 'split_config.armeabi_v7a.apk' -o -name 'config.armeabi_v7a.apk' \) -print -quit)"
          ABI64="$(find source -type f \( -name 'split_config.arm64_v8a.apk' -o -name 'config.arm64_v8a.apk' \) -print -quit)"
          DPI="$(find source -type f \( -name 'split_config.xhdpi.apk' -o -name 'config.xhdpi.apk' \) -print -quit)"
          for pair in "base:$BASE" "armeabi_v7a:$ABI32" "arm64_v8a:$ABI64" "xhdpi:$DPI"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::fonte sem ${pair%%:*}"
              exit 1
            fi
          done
          echo "base=$BASE"
          echo "abi32=$ABI32 abi64=$ABI64 dpi=$DPI"

          mkdir -p splits32 splits64
          for dir in splits32 splits64; do
            cp "$BASE" "$dir/com.apple.android.music.apk"
            cp "$DPI" "$dir/config.xhdpi.apk"
          done
          cp "$ABI32" splits32/config.armeabi_v7a.apk
          cp "$ABI64" splits64/config.arm64_v8a.apk
          ls -l splits32 splits64

      # A CLI do morphe-desktop assina o APK de saída com o keystore que ela gera em
      # tools/morphe-data (outro cert). Por isso o patch roda com --unsigned e a
      # assinatura do release é aplicada depois pelo apksigner com o p12 MORPHE_*.
      - name: Build engine APKs (arm32 TV, arm64 car)
        if: steps.source.outputs.url != ''
        run: |
          set -euo pipefail
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name 'patches-*.mpp' \
            ! -name '*-sources.mpp' ! -name '*-javadoc.mpp' -print -quit)"
          if [ -z "$MPP" ]; then
            echo "::error::bundle .mpp não encontrado em patches/build/libs"
            exit 1
          fi
          echo "MPP=$MPP"

          build_engine() {
            local splits="$1" abi="$2" output="$3"
            java -Xmx4096m -XX:MaxMetaspaceSize=1024m -jar tools/APKEditor-1.4.9.jar \
              m -i "$splits" -o "merged-$abi.apk"
            java -Xmx4096m -XX:MaxMetaspaceSize=1024m -jar tools/morphe-desktop-2.1.1-all.jar \
              patch -p "$MPP" -o "engine-$abi-unsigned.apk" "merged-$abi.apk" \
              --unsigned -e "DiLink: hide engine launcher"
            "$BUILD_TOOLS/zipalign" -f -p 4 "engine-$abi-unsigned.apk" "$RUNNER_TEMP/engine-$abi-aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/morphe.p12" --ks-type PKCS12 \
              --ks-pass "pass:$MORPHE_KEYSTORE_PASSWORD" \
              --ks-key-alias "$MORPHE_KEY_ALIAS" \
              --key-pass "pass:$MORPHE_KEY_PASSWORD" \
              --out "dist/$output" "$RUNNER_TEMP/engine-$abi-aligned.apk"
            ls -l "dist/$output"
          }
          build_engine splits32 armeabi-v7a AppleMusic-engine-arm32.apk
          build_engine splits64 arm64-v8a AppleMusic-engine-arm64.apk

      # O engine não pode aparecer no launcher (o companion é a única entrada) e precisa
      # da lib da ABI certa: o merge sem o split da ABI instala com
      # INSTALL_FAILED_NO_MATCHING_ABIS na TV box 32-bit.
      - name: Validate engine APKs
        if: steps.source.outputs.url != ''
        run: |
          set -euo pipefail
          EXPECTED_CERT_SHA256="1e058623722ed37eb59bb55411d01d6b7b212c6a8353aacecd60d515cee60463"
          verify_cert() {
            local apk="$1" certs fingerprint
            certs="$("$BUILD_TOOLS/apksigner" verify --print-certs "$apk")"
            if ! grep -q "CN=Morphe" <<< "$certs"; then
              echo "::error::$apk não está assinado com CN=Morphe"
              exit 1
            fi
            fingerprint="$(grep -m 1 "certificate SHA-256 digest" <<< "$certs" \
              | sed 's/.*digest: *//' | tr -d ':' | tr 'A-F' 'a-f')"
            if [ "$fingerprint" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$apk assinado com cert errado: $fingerprint"
              exit 1
            fi
            echo "$apk: CN=Morphe / $fingerprint"
          }
          check_engine() {
            local apk="$1" abi="$2" badging
            badging="$("$BUILD_TOOLS/aapt2" dump badging "$apk")"
            grep -E "package:|launchable-activity|native-code|sdkVersion" <<< "$badging" || true
            if grep -qE "launchable-activity: name='com\.apple\.android\.music" <<< "$badging"; then
              echo "::error::$apk ainda expõe a activity do engine no launcher"
              exit 1
            fi
            if ! grep -q "native-code:.*$abi" <<< "$badging"; then
              echo "::error::$apk sem native-code $abi"
              exit 1
            fi
          }
          verify_cert dist/AppleMusic-engine-arm32.apk
          check_engine dist/AppleMusic-engine-arm32.apk armeabi-v7a
          verify_cert dist/AppleMusic-engine-arm64.apk
          check_engine dist/AppleMusic-engine-arm64.apk arm64-v8a

      # O APK único: a UI framework-only de single-apk/single-ui é compilada no runner
      # (javac + d8 dos build-tools), empacotada como classesN.dex e injetada no engine já
      # assinado, por ABI. A activity do engine (login) continua no APK; só a entrada
      # LAUNCHER muda para OneActivity. O updater da UI precisa de REQUEST_INSTALL_PACKAGES.
      - name: Build single APKs (UI injected per ABI)
        if: steps.source.outputs.url != ''
        run: |
          set -euo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          DEX="one/dex/classes.dex"
          rm -rf one
          mkdir -p one/classes one/dex one/generated/com/anderson/applemusic/one
          cat > one/generated/com/anderson/applemusic/one/Version.java <<EOF
          package com.anderson.applemusic.one;

          /** Generated at build time by the CI; do not edit. */
          final class Version {
              static final String NAME = "$VERSION";
              static final int CODE = $VERSION_CODE;

              private Version() {
              }
          }
          EOF
          javac --release 8 -Xlint:-options -encoding UTF-8 -classpath "$ANDROID_JAR" \
            -d one/classes one/generated/com/anderson/applemusic/one/Version.java \
            $(find single-apk/single-ui/src/main/java -name '*.java')
          jar cf one/single-ui.jar -C one/classes .
          "$BUILD_TOOLS/d8" --release --min-api 29 --lib "$ANDROID_JAR" \
            --output one/dex one/single-ui.jar

          FOREIGN="$("$BUILD_TOOLS/dexdump" -l plain "$DEX" \
            | sed -n "s/.*Class descriptor *: '\([^']*\)'.*/\1/p" \
            | grep -v '^Lcom/anderson/applemusic/one/' || true)"
          if [ -n "$FOREIGN" ]; then
            echo "::error::o dex da UI contém classes fora de com.anderson.applemusic.one"
            echo "$FOREIGN"
            exit 1
          fi
          echo "dex: $("$BUILD_TOOLS/dexdump" -l plain "$DEX" | grep -c 'Class descriptor') classes, all com.anderson.applemusic.one.*"

          build_one() {
            local abi="$1"
            local engine="dist/AppleMusic-engine-$abi.apk" work="one/$abi"
            mkdir -p "$work"
            unzip -p "$engine" AndroidManifest.xml > "$work/manifest.bin"
            python3 single-apk/tools/axml_inject.py --in "$work/manifest.bin" \
              --out "$work/manifest-patched.bin" \
              --activity com.anderson.applemusic.one.OneActivity --theme 0x0103022e \
              --permission android.permission.REQUEST_INSTALL_PACKAGES
            python3 single-apk/tools/pack_single_apk.py --engine "$engine" --dex "$DEX" \
              --manifest "$work/manifest-patched.bin" --out "$work/unsigned.apk"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$work/unsigned.apk" "$work/aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/morphe.p12" --ks-type PKCS12 \
              --ks-pass "pass:$MORPHE_KEYSTORE_PASSWORD" \
              --ks-key-alias "$MORPHE_KEY_ALIAS" \
              --key-pass "pass:$MORPHE_KEY_PASSWORD" \
              --out "dist/AppleMusic-one-$abi.apk" "$work/aligned.apk"
            ls -l "dist/AppleMusic-one-$abi.apk"
          }
          build_one arm32
          build_one arm64

      # O APK único precisa da assinatura Morphe, da OneActivity como LAUNCHER, da lib da
      # ABI certa e da permissão que o PackageInstaller exige para se auto-atualizar.
      - name: Validate single APKs
        if: steps.source.outputs.url != ''
        run: |
          set -euo pipefail
          EXPECTED_CERT_SHA256="1e058623722ed37eb59bb55411d01d6b7b212c6a8353aacecd60d515cee60463"
          verify_one() {
            local abi="$1" arch="$2"
            local apk="dist/AppleMusic-one-$abi.apk" certs fingerprint badging
            "$BUILD_TOOLS/zipalign" -c -p 4 "$apk"
            certs="$("$BUILD_TOOLS/apksigner" verify --print-certs "$apk")"
            grep -q "CN=Morphe" <<< "$certs"
            fingerprint="$(grep -m 1 "certificate SHA-256 digest" <<< "$certs" \
              | sed 's/.*digest: *//' | tr -d ':' | tr 'A-F' 'a-f')"
            if [ "$fingerprint" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$apk assinado com cert errado: $fingerprint"
              exit 1
            fi
            badging="$("$BUILD_TOOLS/aapt2" dump badging "$apk")"
            if ! grep -q "launchable-activity: name='com.anderson.applemusic.one.OneActivity'" <<< "$badging"; then
              echo "::error::$apk sem OneActivity como LAUNCHER"
              exit 1
            fi
            if ! grep -q "native-code:.*$arch" <<< "$badging"; then
              echo "::error::$apk sem native-code $arch"
              exit 1
            fi
            if ! "$BUILD_TOOLS/aapt2" dump permissions "$apk" \
              | grep -q "android.permission.REQUEST_INSTALL_PACKAGES"; then
              echo "::error::$apk sem REQUEST_INSTALL_PACKAGES (updater não instala)"
              exit 1
            fi
            echo "$apk: CN=Morphe / OneActivity / $arch / REQUEST_INSTALL_PACKAGES"
          }
          verify_one arm32 armeabi-v7a
          verify_one arm64 arm64-v8a

      # Metadados lidos pelo updater in-app (core): versão, versionCode e, por artefato,
      # nome/sha256/tamanho/versionCode. Roda depois dos APKs e antes do SHA256SUMS para
      # que o checksum também cubra este arquivo.
      - name: Write updates.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from datetime import datetime, timezone

          version = os.environ["VERSION"]
          version_code = int(os.environ["VERSION_CODE"])
          dist = "dist"
          build_tools = os.environ["BUILD_TOOLS"]

          def sha256(path):
              digest = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def add(key, filename, version_code=None):
              path = os.path.join(dist, filename)
              if not os.path.exists(path):
                  return False
              entry = {
                  "name": filename,
                  "sha256": sha256(path),
                  "size": os.path.getsize(path),
              }
              if version_code is not None:
                  entry["versionCode"] = version_code
              assets[key] = entry
              return True

          assets = {}
          for key, filename in (("tv", "AppleMusic-TV.apk"), ("car", "AppleMusic-Car.apk")):
              if not add(key, filename, version_code):
                  print(f"::error::{filename} ausente em dist/")
                  raise SystemExit(1)

          for key, filename in (
              ("engine-arm32", "AppleMusic-engine-arm32.apk"),
              ("engine-arm64", "AppleMusic-engine-arm64.apk"),
          ):
              path = os.path.join(dist, filename)
              if not os.path.exists(path):
                  continue
              badging = subprocess.run(
                  [os.path.join(build_tools, "aapt2"), "dump", "badging", path],
                  check=True, capture_output=True, text=True,
              ).stdout
              match = re.search(r"versionCode='(\d+)'", badging)
              if not match:
                  print(f"::error::sem versionCode em {filename}")
                  raise SystemExit(1)
              assets[key] = {
                  "name": filename,
                  "sha256": sha256(path),
                  "size": os.path.getsize(path),
                  "versionCode": int(match.group(1)),
              }

          # O APK único carrega a versão da UI (Version.CODE), não o versionCode do engine:
          # é essa que o updater do APK único compara com a instalada.
          for key, filename in (
              ("one-arm32", "AppleMusic-one-arm32.apk"),
              ("one-arm64", "AppleMusic-one-arm64.apk"),
          ):
              path = os.path.join(dist, filename)
              if not os.path.exists(path):
                  if os.environ.get("SOURCE_URL"):
                      print(f"::error::{filename} ausente em dist/")
                      raise SystemExit(1)
                  continue
              assets[key] = {
                  "name": filename,
                  "sha256": sha256(path),
                  "size": os.path.getsize(path),
                  "versionCode": version_code,
                  "version": version,
              }

          document = {
              "version": version,
              "versionCode": version_code,
              "releasedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "assets": assets,
          }
          with open(os.path.join(dist, "updates.json"), "w", encoding="utf-8") as fh:
              json.dump(document, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(json.dumps(document, indent=2, sort_keys=True))
          PY

      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.apk updates.json > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: applemusic-apps-${{ inputs.version }}
          if-no-files-found: error
          path: |
            dist/*.apk
            dist/SHA256SUMS
            dist/updates.json

      - name: Prepare release notes
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          ENGINE_WARNING=""
          if [ -z "${SOURCE_URL:-}" ]; then
            ENGINE_WARNING="> **Aviso: engine não anexado.** O input source_url e o secret ENGINE_SOURCE_URL não foram informados, então esta release traz apenas os companions AppleMusic-TV.apk e AppleMusic-Car.apk. Sem o engine instalado o companion não conecta ao MediaBrowserService; gere o engine separadamente e instale-o antes do companion."
          fi
          {
            echo "# Apple Music — apps $VERSION"
            echo
            if [ -n "$ENGINE_WARNING" ]; then
              echo "$ENGINE_WARNING"
              echo
            fi
            echo "Todos os APKs desta release estão assinados com o **mesmo** certificado Morphe"
            echo "(CN=Morphe, SHA-256 1e058623722ed37eb59bb55411d01d6b7b212c6a8353aacecd60d515cee60463)."
            echo "O engine e o companion compartilham o UID (sharedUserId com.apple.android);"
            echo "certificados diferentes fazem o MediaBrowserService recusar a conexão."
            echo
            echo "## Instalação (nesta ordem)"
            echo
            echo "1. Desinstale o Apple Music oficial (com.apple.android.music): a assinatura é outra."
            echo "2. Instale o engine do device: AppleMusic-engine-arm32.apk (TV 32-bit) ou"
            echo "   AppleMusic-engine-arm64.apk (carro/arm64)."
            echo "3. Instale o companion: AppleMusic-TV.apk (TV) ou AppleMusic-Car.apk (carro)."
            echo
            if [ -n "${SOURCE_URL:-}" ]; then
              echo "## APK único (engine + UI no mesmo pacote)"
              echo
              echo "A release também traz \`AppleMusic-one-arm32.apk\` (arm32/TV) e"
              echo "\`AppleMusic-one-arm64.apk\` (arm64/carro): o engine com a UI embutida, sem"
              echo "companion."
              echo
              echo "1. Desinstale o Apple Music oficial e instale \`AppleMusic-one-<abi>.apk\` por cima"
              echo "   do engine (mesmo pacote/cert: a conta é preservada), ou no lugar de"
              echo "   engine + companion."
              echo "2. O botão **Atualizações** (e a checagem ao abrir, no máximo 1x/dia) lê o"
              echo "   \`updates.json\`, compara o \`versionCode\`, baixa o APK da ABI, confere o"
              echo "   SHA-256 e abre o instalador do sistema."
              echo
            fi
            echo "## Limitações conhecidas"
            echo
            echo "- Busca indisponível: o MediaBrowserService do engine não anuncia SEARCH_SUPPORTED."
            echo "- Criar estação: só a partir do item atual; a sessão não expõe a ação para outros itens."
            echo
            echo "Confira os downloads com SHA256SUMS."
            echo
            echo "## Atualizações in-app"
            echo
            echo "O arquivo \`updates.json\` descreve esta release (versão, versionCode e, por APK,"
            echo "SHA-256 e tamanho). Os companions com o updater in-app e o APK único"
            echo "(\`one-arm32\`/\`one-arm64\`) leem esse arquivo em \`releases/latest\`, baixam o"
            echo "APK novo, verificam o SHA-256 e abrem o instalador do sistema; no companion"
            echo "o engine é atualizado antes do app quando houver versão nova."
          } > release-notes.md
          cat release-notes.md

      - name: Create or update release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t ASSETS < <(find dist -maxdepth 1 -type f \( -name '*.apk' -o -name 'SHA256SUMS' -o -name 'updates.json' \) | sort)
          # TV + Car + updates.json + SHA256SUMS; com engine: +2 engines +2 APKs únicos.
          EXPECTED_ASSETS=4
          if [ -n "${SOURCE_URL:-}" ]; then
            EXPECTED_ASSETS=8
          fi
          if [ "${#ASSETS[@]}" -ne "$EXPECTED_ASSETS" ]; then
            echo "::error::assets inesperados: ${#ASSETS[@]} (esperado $EXPECTED_ASSETS)"
            printf '%s\n' "${ASSETS[@]}"
            exit 1
          fi
          RELEASE="apps-$VERSION"
          if gh release view "$RELEASE" > /dev/null 2>&1; then
            gh release upload "$RELEASE" "${ASSETS[@]}" --clobber
            gh release edit "$RELEASE" --title "Apple Music apps $VERSION" --notes-file release-notes.md
          else
            gh release create "$RELEASE" --title "Apple Music apps $VERSION" \
              --notes-file release-notes.md "${ASSETS[@]}"
          fi
