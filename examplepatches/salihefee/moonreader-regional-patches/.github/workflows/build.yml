name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: ./gradlew :patches:test :patches:buildAndroid --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: moonreader-regional-patches
          path: patches/build/libs/*.mpp
