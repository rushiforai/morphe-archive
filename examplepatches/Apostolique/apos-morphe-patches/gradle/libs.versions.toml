[versions]
desugar_jdk_libs = "2.1.5"
# Both are read by the Morphe Gradle plugin itself rather than referenced
# below, and the build fails without them. The smali pin is a source build,
# tracking https://github.com/google/smali/issues/100.
morphe-patcher = "1.3.3"
smali = "b6365a84f4"
morphe-patches-library = "1.0.2-dev.2"
annotation = "1.9.1"
gson = "2.13.2"
guava = "33.5.0-jre"
ksp = "2.3.6"
okhttp = "5.3.2"
jsoup = "1.18.1"

[libraries]
morphe-patches-library = { module = "app.morphe:morphe-patches-library", version.ref = "morphe-patches-library" }
morphe-extensions-library = { module = "app.morphe:morphe-extensions-library", version.ref = "morphe-patches-library" }
annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
desugar_jdk_libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar_jdk_libs" }
# Provided by the host app, so the extension compiles against it rather than
# bundling a second copy.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# The scraper, which Boost does not carry, so this one is compiled in.
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

[plugins]
android-library = { id = "com.android.library" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
