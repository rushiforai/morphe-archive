name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: XBadFellaX
      GIT_AUTHOR_EMAIL: 77979578+XBadFellaX@users.noreply.github.com
      GIT_COMMITTER_NAME: XBadFellaX
      GIT_COMMITTER_EMAIL: 77979578+XBadFellaX@users.noreply.github.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require successful development validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          count=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow development.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq length)
          test "$count" -gt 0 || { echo "Run Development and test its preview before releasing this commit."; exit 1; }

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check release version policy
        run: npm test

      - name: Check source metadata and update tooling
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      # Semantic release runs its own Gradle build command.
      # Only main generates a release as specified by .releaserc.
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply shared release title and notes template
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: python3 tools/release_title.py "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'BadFella Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Always verify compilation when semantic-release did not publish a release.
      # This covers non-main/dev branches, chore commits, docs commits, etc.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
