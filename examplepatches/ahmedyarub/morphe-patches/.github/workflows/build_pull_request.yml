name: Build pull request

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - main
  # Release builds main and dev itself.
  push:
    branches-ignore:
      - dev
      - main

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      # The unit tests check the bundle itself: every patch loads, none is unreachable, and the
      # patches for one app agree on its versions. The APK tests need the target APKs, which are
      # not in the repository, and run locally with :patches:apkTest.
      - name: Build and test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :patches:test --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: patches/build/libs
