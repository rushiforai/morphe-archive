name: Build patch bundle

on:
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./morphe-patches/gradlew -p morphe-patches :patches:buildAndroid --no-daemon
          ./morphe-apply/gradlew -p morphe-apply build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: quetta-patches-mpp
          path: morphe-patches/patches/build/libs/*.mpp
          if-no-files-found: error
