version: 2
updates:
  - package-ecosystem: github-actions
    labels: []
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # Coupled to extensions/nhl-adblock-native/rust-toolchain.toml and
      # updated by `bun run deps:update` (scripts/dependencies/apply.ts).
      - dependency-name: "dtolnay/rust-toolchain"

  # Bun drives CI (`bun install --frozen-lockfile`). The npm-based release
  # workflow installs package-lock.json with `npm ci` at release time.
  - package-ecosystem: bun
    labels: []
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      bun-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # version 10.x and later may not generate release notes correctly
      # https://github.com/conventional-changelog/conventional-changelog/issues/1495
      - dependency-name: "conventional-changelog-conventionalcommits"

  - package-ecosystem: gradle
    labels: []
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
