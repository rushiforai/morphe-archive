name: Test & Audit Verification Gate
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main', 'dev', 'next']
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
      android: ${{ steps.filter.outputs.android }}
      rust: ${{ steps.filter.outputs.rust }}
      native: ${{ steps.filter.outputs.native }}
      is_full_run: ${{ steps.run-type.outputs.is_full_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            core:
              - 'package.json'
              - 'bun.lock'
              - 'dependency-policy.json'
              - 'scripts/**'
              - '.github/**'
              - '.agents/**'
              - 'skills-lock.json'
              - '.editorconfig'
              - '.gitattributes'
              - '.prettierrc.json'
              - '.oxlintrc.json'
            web:
              - 'worker/**'
              - 'site/**'
              - 'scripts/**'
              - 'package.json'
              - 'bun.lock'
              - '.prettierrc.json'
              - '.oxlintrc.json'
            docs:
              - 'docs/**'
              - '*.md'
              - '.markdownlint-cli2.jsonc'
            android:
              - 'patches/**'
              - 'extensions/extension/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'extensions/adobescan-pdf-native/**'
              - 'extensions/nhl-adblock-native/**'
              - 'tools/asset-prep/**'
            rust:
              - 'tools/play-metadata/**'
              - 'extensions/nhl-adblock-native/**'
              - 'tools/asset-prep/**'
              - 'tools/apk-lab/**'
            native:
              - 'extensions/adobescan-pdf-native/**'
              - '.clang-format'

      - name: Determine Run Type
        id: run-type
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          CORE_CHANGED: ${{ steps.filter.outputs.core }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || \
             { [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; } || \
             [ "$CORE_CHANGED" = "true" ]; then
            echo "is_full_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_full_run=false" >> "$GITHUB_OUTPUT"
          fi

  test-web:
    name: Web Verification
    needs: detect-changes
    if: needs.detect-changes.outputs.is_full_run == 'true' || needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install worker dependencies
        working-directory: worker
        run: bun install --frozen-lockfile

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Audit web domain
        run: bun scripts/audit.ts all --domain web

  test-android:
    name: Android Verification
    needs: detect-changes
    if: needs.detect-changes.outputs.is_full_run == 'true' || needs.detect-changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache font assets
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/aidans-patches/fonts
          key: emoji-font-e37c7af6-${{ hashFiles('tools/asset-prep/Cargo.toml', 'tools/asset-prep/Cargo.lock', 'tools/asset-prep/src/**', 'tools/asset-prep/vendor/**') }}
          restore-keys: |
            emoji-font-

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false
          link-to-sdk: true

      - name: Configure Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android
      - name: Audit android domain
        run: bun scripts/audit.ts all --domain android

      - name: Build and verify patches
        run: ./gradlew :patches:buildAndroid clean --no-daemon

  test-rust:
    name: Rust Verification
    needs: detect-changes
    if: needs.detect-changes.outputs.is_full_run == 'true' || needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/play-metadata -> tools/play-metadata/target
            extensions/nhl-adblock-native -> extensions/nhl-adblock-native/target
            tools/asset-prep -> tools/asset-prep/target
            tools/apk-lab -> tools/apk-lab/target

      - name: Build native apk-lab release binaries
        run: cargo build --release --locked --manifest-path tools/apk-lab/Cargo.toml --bins

      # audit --domain rust is the single owner of cargo fmt/clippy/check/test
      # for every registered Rust project, including apk-lab.
      - name: Audit rust domain
        run: bun scripts/audit.ts all --domain rust

  test-native:
    name: Native Verification
    needs: detect-changes
    if: needs.detect-changes.outputs.is_full_run == 'true' || needs.detect-changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache CMake dependencies
        uses: actions/cache@v6
        with:
          path: |
            extensions/adobescan-pdf-native/build/host/_deps
            extensions/adobescan-pdf-native/build/android-arm64-v8a/_deps
          key: cmake-deps-${{ hashFiles('extensions/adobescan-pdf-native/CMakeLists.txt', 'extensions/adobescan-pdf-native/cmake/*.cmake') }}

      - name: Install system test tools
        timeout-minutes: 5
        run: |
          sudo apt-get update -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 poppler-utils ninja-build clang-format

      - name: Audit native domain
        env:
          AIDAN_REQUIRE_EXTERNAL_TOOLS: '1'
        run: bun scripts/audit.ts all --domain native

  gate:
    name: Test & Build Gate
    needs:
      [
        detect-changes,
        test-web,
        test-android,
        test-rust,
        test-native,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate Verification Status
        env:
          FULL_RUN: ${{ needs.detect-changes.outputs.is_full_run }}
          CORE_CHANGED: ${{ needs.detect-changes.outputs.core }}
          WEB_CHANGED: ${{ needs.detect-changes.outputs.web }}
          DOCS_CHANGED: ${{ needs.detect-changes.outputs.docs }}
          ANDROID_CHANGED: ${{ needs.detect-changes.outputs.android }}
          RUST_CHANGED: ${{ needs.detect-changes.outputs.rust }}
          NATIVE_CHANGED: ${{ needs.detect-changes.outputs.native }}
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          WEB_RESULT: ${{ needs.test-web.result }}
          ANDROID_RESULT: ${{ needs.test-android.result }}
          RUST_RESULT: ${{ needs.test-rust.result }}
          NATIVE_RESULT: ${{ needs.test-native.result }}
        run: |
          echo "### Test & Build Gate Verification Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Domain / Job | Status | Outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          DOMAIN_RUN=0

          check_job() {
            local name="$1"
            local result="$2"
            local detail="$3"
            local icon outcome

            case "$result" in
              success)
                icon="🟢"
                outcome="Passed"
                ;;
              failure)
                icon="🔴"
                outcome="Failed"
                FAILED=1
                ;;
              cancelled)
                icon="🟡"
                outcome="Cancelled"
                FAILED=1
                ;;
              skipped)
                icon="⚪"
                outcome="Skipped ($detail)"
                ;;
              *)
                icon="🔴"
                outcome="Unexpected status '$result'"
                FAILED=1
                ;;
            esac

            echo "| **$name** | $icon $result | $outcome |" >> "$GITHUB_STEP_SUMMARY"
          }

          count_domain() {
            case "$1" in
              success | failure | cancelled) DOMAIN_RUN=$((DOMAIN_RUN + 1)) ;;
            esac
          }

          check_job "Detect Changes" "$DETECT_RESULT" "change detection did not complete"
          check_job "Web (TypeScript / Site / Worker)" "$WEB_RESULT" \
            "is_full_run=$FULL_RUN web=$WEB_CHANGED docs=$DOCS_CHANGED"
          check_job "Android (Patches / Extension)" "$ANDROID_RESULT" \
            "is_full_run=$FULL_RUN android=$ANDROID_CHANGED"
          check_job "Rust (Play Metadata / Native)" "$RUST_RESULT" \
            "is_full_run=$FULL_RUN rust=$RUST_CHANGED"
          check_job "Native (Adobe Scan C++)" "$NATIVE_RESULT" \
            "is_full_run=$FULL_RUN native=$NATIVE_CHANGED"

          count_domain "$WEB_RESULT"
          count_domain "$ANDROID_RESULT"
          count_domain "$RUST_RESULT"
          count_domain "$NATIVE_RESULT"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -ne 0 ]; then
            echo "❌ **One or more required verification jobs failed or were cancelled.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Zero-check guard: a green gate must include at least one domain job.
          # Docs-only changes (docs/**, *.md, markdownlint config) are the sole
          # allowance: they need only Web Verification, which runs the markdown
          # lint and Documentation & Link Integrity tests. They must still run
          # Web, so an all-skipped docs change fails here instead of passing.
          if [ "$DOMAIN_RUN" -eq 0 ]; then
            echo "❌ **No domain verification job ran.**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ "$DOCS_CHANGED" = "true" ]; then
              echo "This is a docs-only change, but Web Verification was skipped. Docs-only runs must execute Web Verification for markdown and documentation tests." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Add the changed paths to a domain filter (or to the core filter) so this change cannot merge unverified." >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Detected changes: core=$CORE_CHANGED web=$WEB_CHANGED docs=$DOCS_CHANGED android=$ANDROID_CHANGED rust=$RUST_CHANGED native=$NATIVE_CHANGED is_full_run=$FULL_RUN." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ **All required domain verification gates passed cleanly.**" >> "$GITHUB_STEP_SUMMARY"
