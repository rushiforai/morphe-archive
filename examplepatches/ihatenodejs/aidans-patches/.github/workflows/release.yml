name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - release/main
      - release/dev
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.releaserc'
      - 'tools/asset-prep/**'
      - 'scripts/asset-prep.ts'
      - 'scripts/generate-patches-readme.ts'
      - 'scripts/generate-patches-readme.test.ts'
      - 'scripts/test-fixtures/generate-patches-readme/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/release.yml'

concurrency:
  # Per-target with promote-release.yml: a promotion to a release branch and a
  # release run on that branch serialize, while release/main and release/dev do
  # not starve each other.
  group: release-publication-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify Pre-Release Gate
    # workflow_dispatch can select any ref; publication is only ever allowed
    # from the protected release branches.
    if: >-
      github.ref == 'refs/heads/release/main' ||
      github.ref == 'refs/heads/release/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache font assets
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/aidans-patches/fonts
          key: emoji-font-e37c7af6-${{ hashFiles('tools/asset-prep/Cargo.toml', 'tools/asset-prep/Cargo.lock', 'tools/asset-prep/src/**', 'tools/asset-prep/vendor/**') }}
          restore-keys: |
            emoji-font-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false
          link-to-sdk: true

      - name: Configure Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install system test tools
        timeout-minutes: 5
        run: |
          sudo apt-get update -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 poppler-utils ninja-build clang-format

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The release job publishes from this exact lockfile. Prove it installs
      # in an isolated directory so bun's node_modules stays canonical here.
      - name: Verify release dependency lock
        run: |
          release_deps=$(mktemp -d)
          trap 'rm -rf "$release_deps"' EXIT
          cp package.json package-lock.json "$release_deps"/
          cd "$release_deps"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit android domain
        run: bun scripts/audit.ts all --domain android

      - name: Audit rust domain
        run: bun scripts/audit.ts all --domain rust

      - name: Audit native domain
        env:
          AIDAN_REQUIRE_EXTERNAL_TOOLS: '1'
        run: bun scripts/audit.ts all --domain native

      - name: Build and verify patches
        run: ./gradlew :patches:buildAndroid --no-daemon

  release:
    name: Release
    needs: [verify]
    if: >-
      needs.verify.result == 'success' &&
      (github.ref == 'refs/heads/release/main' ||
      github.ref == 'refs/heads/release/dev')
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      # Release commits are created locally and pushed from this job, so the
      # push identity must be a ruleset bypass actor. The dedicated GitHub App
      # provides an individually scoped identity. Add it as a bypass actor on
      # the release branch rulesets and on the verification gate ruleset so
      # the release-driven backmerge to dev is accepted.
      - name: Create release identity token
        id: release-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: Setup Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache font assets
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/aidans-patches/fonts
          key: emoji-font-e37c7af6-${{ hashFiles('tools/asset-prep/Cargo.toml', 'tools/asset-prep/Cargo.lock', 'tools/asset-prep/src/**', 'tools/asset-prep/vendor/**') }}
          restore-keys: |
            emoji-font-

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false
          link-to-sdk: true

      - name: Configure Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Publication must use the verified SHA, never a fast-forwarded newer
      # tree. A moved branch fails here so a fresh run verifies the new tip.
      # Release branches are protected so only the release identity (the app
      # token above) may update them, and the concurrency group serializes
      # runs for this ref. This guard rejects movement that already existed,
      # but it does not hold a lock between this read and the release push;
      # any other writer is blocked by branch protection instead.
      - name: Verify triggering revision is still the branch tip
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          # Keep a local branch name for semantic-release, but pin it to the
          # verified SHA instead of following the remote tip.
          git checkout -B "$RELEASE_BRANCH" "$VERIFIED_SHA"
          bun scripts/verify-release-revision.ts \
            --branch "$RELEASE_BRANCH" \
            --sha "$VERIFIED_SHA" \
            --remote origin

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked release dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Semantic release runs its own Gradle build command on release branches.
      - name: Reconcile release channel notes
        run: bun scripts/reconcile-release-notes.ts --ref "${{ github.ref_name }}" --remote origin

      # The release push is a machine-generated commit already covered by the
      # Verify Pre-Release Gate, and this job installs root dependencies only.
      # Point Git at an empty hooks directory instead of half-running the
      # pre-push audit in a checkout that cannot satisfy it.
      - name: Disable repository hooks for the automated release push
        run: git config --local core.hooksPath "$(mktemp -d)"

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          RELEASE_MAVEN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/run-release.ts

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

  deploy-site:
    name: Deploy Website
    needs: release
    if: github.ref == 'refs/heads/release/main' && needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-site.yml
    with:
      # The branch tip now includes semantic-release's release commit. The
      # release tag points at the pre-prepare gitHead, so it would miss the
      # generated CHANGELOG/patches-list changes.
      ref: ${{ github.ref_name }}
    secrets: inherit
  deploy-worker:
    name: Deploy Worker
    needs: release
    if: github.ref == 'refs/heads/release/main' && needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-worker.yml
    with:
      # The branch tip now includes semantic-release's release commit. The
      # release tag points at the pre-prepare gitHead, so it would miss the
      # generated CHANGELOG/patches-list changes.
      ref: ${{ github.ref_name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
