name: Deploy Website

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build and deploy (defaults to the triggering SHA)
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy Website
    # Deployment is only allowed for the stable release branch, either through
    # the release/main handoff or a manual dispatch from release/main.
    if: github.ref == 'refs/heads/release/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/asset-prep -> tools/asset-prep/target

      - name: Install Site Dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Verify Application Icons Present
        working-directory: site
        run: bun run check:icons

      - name: Run Site Unit Tests
        working-directory: site
        run: bun test

      - name: Typecheck Astro Site
        working-directory: site
        run: bun run check

      - name: Build Astro Static Site
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run build

      - name: Deploy to Cloudflare Pages (Production)
        if: env.DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy dist --project-name=aidans-patches
