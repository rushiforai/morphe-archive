name: Retry Superseded Release

# A Release run can fail after `@semantic-release/git` pushes the release commit
# but before any tag is created, when another push lands during the build. That
# failure is safe to re-run. This workflow re-runs at most one attempt, and only
# when the remote state proves no tag was recorded for the computed version.
#
# workflow_run workflows are loaded from the default branch, so this file takes
# effect once it reaches `main`.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: release-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    name: Retry superseded release
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Classify and retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          bun scripts/release-retry.ts \
            --run-id "$RUN_ID" \
            --repo "$REPOSITORY" \
            --branch "$BRANCH" \
            --head-sha "$HEAD_SHA"
