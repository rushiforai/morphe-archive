name: Retry Release Failure

# A Release run can fail before any tag is created. Re-running only the failed
# release job (so the successful verify job is reused) is safe only while the
# remote release branch still points at the exact revision that verify job
# checked out. A moved or force-pushed branch is never retried: it needs a
# fresh run that verifies the new tip. This workflow re-runs at most one
# attempt, and only for runs targeting `release/main` or `release/dev`.
#
# workflow_run workflows are loaded from the default branch, so this file takes
# effect once it reaches `main`.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: release-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    name: Retry superseded release
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.head_branch == 'release/main' ||
      github.event.workflow_run.head_branch == 'release/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Classify and retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          bun scripts/release-retry.ts \
            --run-id "$RUN_ID" \
            --repo "$REPOSITORY" \
            --branch "$BRANCH" \
            --head-sha "$HEAD_SHA"
