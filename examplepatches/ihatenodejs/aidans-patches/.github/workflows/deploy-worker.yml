name: Deploy Worker

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build and deploy (defaults to the triggering SHA)
        required: false
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy Worker
    # Deployment is only allowed for the stable release branch, either through
    # the release/main handoff or a manual dispatch from release/main.
    if: github.ref == 'refs/heads/release/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Worker Dependencies
        working-directory: worker
        run: bun install --frozen-lockfile

      - name: Typecheck Worker
        working-directory: worker
        run: bun run check

      - name: Run Worker Unit Tests
        working-directory: worker
        run: bun run test

      - name: Deploy Aidan's Patches Worker
        if: env.DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
