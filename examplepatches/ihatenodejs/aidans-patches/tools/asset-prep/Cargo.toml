[package]
name = "asset-prep"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Native host preparation of pinned build resources and application icons"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["webp"] }
png = "0.18.1"
regex = "1.12.2"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
sha2 = "0.10.8"
tempfile = "3.15.0"
turbojpeg = { version = "=1.5.1", default-features = false, features = ["cmake"] }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls", "gzip"] }
zip = { version = "=9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "lzma"] }

[patch.crates-io]
turbojpeg-sys = { path = "vendor/turbojpeg-sys" }

[dev-dependencies]
flate2 = "=1.1.11"
