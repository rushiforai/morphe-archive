[versions]
# Required aliases the app.morphe.patches Gradle plugin looks up by name
# to wire the morphe-patcher / smali compileOnly deps into :patches.
morphe-patcher = "1.6.0"
#noinspection GradleDependency
smali = "d92701d947"
gson = "2.14.0"
shizuku = "13.1.5"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
rikka-shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
