name: Tests

# The extension's unit tests: the rules that decide what Instagram may fetch, what a settings
# change wipes, what the locks freeze and which certificate Instagram trusts.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read   # the patcher Gradle plugin is fetched from GitHub Packages (settings.gradle.kts)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the extension's unit tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew :extensions:extension:testDebugUnitTest
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: extensions/extension/build/reports/tests/
