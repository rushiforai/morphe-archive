name: Publish patch bundle

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build signed bundle and catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
        run: |
          test -n "$MORPHE_SIGNING_KEY"
          version="${GITHUB_REF_NAME#v}"
          grep -Fx "version = $version" gradle.properties
          bash gradlew :patches:buildAndroid :patches:generatePatchesList
          test -s "patches/build/libs/patches-$version.mpp"
          jq -e --arg version "$version" '.version == $version and (.patches | length == 10)' patches-list.json
      - name: Publish release and refresh catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          bundle="patches-$version.mpp"
          jq -n --arg version "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%S)" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/$bundle" \
            --arg key "$(cat morphe-signing.pub)" \
            '{version:$version,created_at:$date,description:"See the GitHub release notes.",download_url:$url,signature_download_url:"",public_key:$key}' > patches-bundle.json
          args=()
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$tag" "patches/build/libs/$bundle" patches-list.json patches-bundle.json \
            --verify-tag --title "TikTok Lite Patches $tag" --generate-notes "${args[@]}"
          if [[ "$version" == *-* ]]; then exit 0; fi
          git fetch origin main
          git switch --detach origin/main
          git config user.name github-actions
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches-list.json patches-bundle.json
          git diff --cached --quiet || git commit -m "chore: publish catalog for $tag"
          git push origin HEAD:main
