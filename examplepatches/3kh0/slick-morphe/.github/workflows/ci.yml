name: ci

# Lints and builds every push and pull request on each platform the scripts support.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        check: [lint, build]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
      - uses: actions/cache@v6
        with:
          path: work
          key: ${{ runner.os }}-${{ matrix.check }}-${{ hashFiles(format('{0}.sh', matrix.check)) }}
      - run: bash ${{ matrix.check }}.sh
      - if: matrix.check == 'build' && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: slick-android
          path: dist/*.mpp
