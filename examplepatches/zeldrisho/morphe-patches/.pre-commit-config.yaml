minimum_pre_commit_version: '3.2.0'
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, pre-push]
# Fast commit-time hooks; fixers may modify files. JVM checks stay in Gradle.
repos:
  - repo: local
    hooks:
      - id: markdown-links
        name: markdown local links
        entry: python3 scripts/check_markdown_links.py
        language: system
        files: '\.md$'
        pass_filenames: false
        require_serial: true
      - id: gradle-quality
        name: Gradle JVM quality checks
        entry: bash ./gradlew qualityCheck --no-daemon
        language: system
        stages: [pre-push]
        files: '\.(kt|kts|java|xml|properties|toml)$'
        pass_filenames: false
        require_serial: true

  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(bat|cmd)$'
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
        files: '^\.github/workflows/'
        types: [yaml]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd # v0.16.9
    hooks:
      - id: ruff-check
        types: [python]
      - id: ruff-format
        args: [--check]
        types: [python]
