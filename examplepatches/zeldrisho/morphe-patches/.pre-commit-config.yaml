minimum_pre_commit_version: '4.3.0'
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, pre-push]
# Fast, check-only hooks. JVM checks stay in Gradle, not the commit path.
repos:
  - repo: local
    hooks:
      - id: markdown-links
        name: markdown local links
        entry: python3 scripts/check_markdown_links.py
        language: system
        files: '\.md$'
      - id: gradle-quality
        name: Gradle JVM quality checks
        entry: bash ./gradlew qualityCheck --no-daemon
        language: system
        stages: [pre-push]
        files: '\.(kt|kts|java|xml|properties|toml)$'
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(bat|cmd)$'
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 36243b70e5ce219623c3503f5afba0f8c96fda55 # v0.14.9
    hooks:
      - id: ruff-check
      - id: ruff-format
