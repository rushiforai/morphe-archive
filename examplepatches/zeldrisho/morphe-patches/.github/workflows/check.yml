name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# PR checks run on PRs targeting main; the push trigger covers only main
# for the post-merge baseline. Unrestricted push would duplicate every PR
# run (once via pull_request, once via push).
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo and pulls public
# packages (Morphe Gradle plugin via GitHub Packages). No writes.
permissions:
  contents: read
  packages: read

jobs:
  check:
    name: Unit tests + lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.3'
          enable-cache: false

      - name: Scripts, workflows, and conflict/line-ending checks
        # Same minimal command developers run locally: every hook is
        # self-contained (pinned revs in .pre-commit-config.yaml), so no
        # --from/--with flags are needed. Bump minimum_pre_commit_version
        # in .pre-commit-config.yaml if a newer pre-commit is required.
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: JVM formatting and static analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew qualityCheck --no-daemon

      - name: Unit tests
        env:
          # Morphe Gradle plugin resolves from GitHub Packages, which needs
          # auth even for public packages (see docs/toolchain.md).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:test :extensions:threads:testDebugUnitTest :extensions:zalo:testDebugUnitTest --no-daemon

      - name: Build bundle and verify embedded extension
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:verifyBundleExtension --no-daemon

      # Only the distributable bundle, never APKs, signing keys, or analysis data.
      - name: Upload bundle for device QA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patches-${{ github.sha }}-${{ github.run_attempt }}
          path: patches/build/libs/patches-*.mpp
          if-no-files-found: error
          retention-days: 7
