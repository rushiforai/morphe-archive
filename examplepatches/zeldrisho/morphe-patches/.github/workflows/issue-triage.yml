name: Issue triage

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  triage:
    if: >-
      !github.event.issue.pull_request &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check model configuration
        env:
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          test -n "$LLM_MODEL" || { echo 'Set the LLM_MODEL repository variable.' >&2; exit 1; }
          test -n "$AI_GATEWAY_API_KEY" || { echo 'Set the AI_GATEWAY_API_KEY repository secret.' >&2; exit 1; }

      # Fail closed until this repository config is available on the default branch.
      - name: Verify issue triage configuration
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api "repos/$GH_REPO/contents/.github/issue-triage.yml" --silent

      - name: Classify, investigate, and reply
        uses: zeldrisho/issue-triage-agent@main
        with:
          github-token: ${{ github.token }}
          openai-api-key: ${{ secrets.AI_GATEWAY_API_KEY }}
          llm-provider: openai
          llm-base-url: ${{ vars.LLM_BASE_URL }}
          llm-model: ${{ vars.LLM_MODEL }}
          config-path: .github/issue-triage.yml
