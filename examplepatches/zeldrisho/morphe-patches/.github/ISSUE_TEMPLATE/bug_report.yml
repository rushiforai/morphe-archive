name: 🐞 Bug report
description: Report a bug or an issue.
title: "bug: "
labels: ["Bug report"]
body:
  - type: markdown
    attributes:
      value: |
        # Zeldris Patches bug report

        Search [existing bug reports](https://github.com/zeldrisho/morphe-patches/issues?q=label%3A%22Bug+report%22) before submitting. Remove passwords, tokens, account information and other private data from logs and screenshots.
  - type: textarea
    attributes:
      label: Bug description
      description: |
        - Describe your bug in detail
        - Add steps to reproduce the bug if possible (Step 1. ... Step 2. ...)
        - Add images and videos if possible
    validations:
      required: true
  - type: input
    attributes:
      label: App and version
      description: Include the app name, version and version code, if available.
    validations:
      required: true
  - type: input
    attributes:
      label: Patch bundle and Morphe versions
      description: Include the patch bundle version and the Morphe Manager or Desktop version.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Selected patches and options
      description: List the selected patches, changed options and output package ID.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps and expected behavior
      description: Explain how to reproduce the problem and what you expected to happen.
    validations:
      required: true
  - type: input
    attributes:
      label: Device and Android version
      description: Include device model and Android version if relevant.
  - type: textarea
    attributes:
      label: Error logs
      description: Include the full Morphe patching log or relevant Android crash log, with private data removed.
      render: shell
  - type: textarea
    attributes:
      label: Solution
      description: If applicable, add a possible solution to the bug.
  - type: textarea
    attributes:
      label: Additional context
      description: Add additional context here.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your bug report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: All requested information has been provided properly.
          required: true
