name: Feature request
description: Create a detailed request for a new patch or improvement.
title: "feat: "
labels: ["Feature request"]
body:
  - type: textarea
    attributes:
      label: Feature description
      description: Describe the requested patch or improvement in detail.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Motivation
      description: Why should this feature be implemented and what is the use case?
    validations:
      required: true
