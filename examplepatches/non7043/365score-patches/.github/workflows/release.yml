name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle Credentials
        env:
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.gradle
          echo "gpr.user=$GPR_USER" >> ~/.gradle/gradle.properties
          echo "gpr.key=$GPR_KEY" >> ~/.gradle/gradle.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build patches
        env:
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          ./gradlew :patches:buildAndroid -Pversion=1.0.0 --stacktrace --no-daemon
          echo "Build finished. Directory contents:"
          ls -la patches/build/libs/
          for f in patches/build/libs/*.mpp; do
            if [ -f "$f" ] && [ "$f" != "patches/build/libs/patches-1.0.0.mpp" ]; then
              cp "$f" patches/build/libs/patches-1.0.0.mpp
            fi
          done

      - name: Get version from tag or commit
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "365Score Patches ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            patches/build/libs/*.mpp
            patches/build/libs/*.jar
            patches-bundle.json
            patches-list.json
        env:
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
