name: Dev build

# Builds the patch bundle from dev (no release) and pushes it to the dev-build branch, so it can
# be test-patched before a release.

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - patches/**
      - extensions/**
      - .github/workflows/dev-build.yml

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          bash ./gradlew :patches:buildAndroid --no-daemon 2>&1 | tee build.log
      - name: Publish to the dev-build branch
        if: always()
        run: |
          OUT=$(mktemp -d)
          MPP=$(ls patches/build/libs/*.mpp 2>/dev/null | grep -v -e sources -e javadoc | head -n 1)
          [ -n "$MPP" ] && cp "$MPP" "$OUT/patches-dev.mpp"
          tail -c 200000 build.log > "$OUT/build.log"
          echo "${GITHUB_SHA} $(date -u +%FT%TZ)" > "$OUT/SOURCE"
          cd "$OUT"
          git init -q -b dev-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Dev build for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dev-build
