name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build bundle
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # Git on Windows/macOS often loses the executable bit; never rely on it.
      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Build bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: patches-bundle
          path: patches/build/libs/patches-*.mpp
          if-no-files-found: error
