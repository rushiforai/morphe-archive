name: Release

on:
  workflow_dispatch:
    inputs:
      patch_release:
        description: Release pending features as a patch version
        type: boolean
        default: false
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Use patch version for this release
        if: github.event_name == 'workflow_dispatch' && inputs.patch_release
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = fs.readFileSync('.releaserc', 'utf8');
          const featureRule = '{ "type": "feat", "release": "minor" }';
          if (!config.includes(featureRule)) throw new Error('Feature release rule not found');
          fs.writeFileSync('.releaserc', config.replace(featureRule,
            '{ "type": "feat", "release": "patch" }'));
          NODE

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Santodan Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean :patches:verifyAndroidBundle --no-daemon
