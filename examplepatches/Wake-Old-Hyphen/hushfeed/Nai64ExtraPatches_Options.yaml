# ============ HUSHFEED PATCH OPTIONS ============
# Custom values for Hushfeed patches. Keys are matched safely; if the key name
# is wrong and the patch has a single option, the value is applied there and
# the real key is printed in the build log.
hushfeed_options:
  - name: "Remove unused language packs"
    options:
      Languages to keep : "en"
# Nai64ExtraPatches_Options.yaml
# PRIORITY RULE: Hushfeed wins. Any Nai64 patch overlapping a Hushfeed patch
# is disabled below so Hushfeed owns that surface.
# Anything not listed here is disabled by default anyway.

patches:
  # ============ ENABLED: surfaces Hushfeed does NOT cover ============
  - name: "Disable Root Checks"
    enabled: true

  - name: "Spoof SIM Serial Number"
    enabled: true
    options:
      simSerial: "8931084206518391742"

  - name: "Limit Ad Tracking"
    enabled: true

  - name: "Spoof Tracking IDs"
    enabled: true

  - name: "Disable Crash Reporters"
    enabled: true

  - name: "Remove Ad Services Entries"
    enabled: true

  - name: "Strip Exif Location"
    enabled: true

  - name: "Spoof Play Store Install Source"
    enabled: true

  - name: "Spoof Subscriber ID"
    enabled: true
    options:
      subscriberId: "204081234567890"

  - name: "Spoof Phone Number"
    enabled: true
    options:
      phoneNumber: ""

  - name: "Spoof Voice Mail"
    enabled: true

  - name: "Hide Roaming Status"
    enabled: true

  - name: "Disable Firebase Auto-Init"
    enabled: true

  - name: "Disable Firebase Performance"
    enabled: true

  - name: "Disable Remote Config Fetch"
    enabled: true

  - name: "Bypass VPN Detection"
    enabled: true

  # ============ DISABLED: Hushfeed owns these surfaces ============
  - name: "Empty Clipboard Report"
    enabled: false
    note: "Hushfeed Device privacy guard owns clipboard"
  - name: "Hide Clipboard"
    enabled: false
    note: "Hushfeed Device privacy guard owns clipboard"
  - name: "Hide Clipboard Description"
    enabled: false
    note: "Hushfeed Device privacy guard owns clipboard"
  - name: "Spoof SIM Country"
    enabled: false
    note: "Hushfeed SIM spoof owns telephony identity"
  - name: "Spoof SIM Operator"
    enabled: false
    note: "Hushfeed SIM spoof owns telephony identity"
  - name: "Spoof SIM Operator Name"
    enabled: false
    note: "Hushfeed SIM spoof owns telephony identity"
  - name: "Spoof Time Zone"
    enabled: false
    note: "Hushfeed Region spoof owns locale/timezone"
  - name: "Spoof Locale"
    enabled: false
    note: "Hushfeed Region spoof owns locale/timezone"
  - name: "Spoof Last Known Location"
    enabled: false
    note: "Hushfeed Location access governor owns location"
  - name: "Disable Telemetry"
    enabled: false
    note: "Hushfeed Disable telemetry owns AppLog/AppsFlyer/Firebase screens"