name: AMOLED Test - Injected (Custom IDs)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "TikTok version to test (must exist in PAB stock-tiktok-apk release)"
        default: "47.1.4"
        required: true

permissions:
  contents: write
  packages: read

jobs:
  build-injected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream Hushfeed (local only)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/SysAdminDoc/hushfeed.git || true
          git fetch upstream main
          git merge upstream/main --no-edit

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Inject AMOLED Fix
        run: python3 inject-amoled.py

      - name: Configure local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Extract version
        run: |
          VERSION=$(grep -E '^version\s*=' gradle.properties | head -n 1 | cut -d'=' -f2 | tr -d ' \r')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build .mpp Bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --dependency-verification=off

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests pyyaml

      - name: Download Morphe CLI and APKEditor
        run: |
          mkdir -p build
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url')
          curl -L -o build/cli.jar "$CLI_URL"
          APKEDITOR_URL=$(curl -s https://api.github.com/repos/REAndroid/APKEditor/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url')
          curl -L -o build/apkeditor.jar "$APKEDITOR_URL"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/keystore.bks

      - name: Detect keystore alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PREFERRED_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          curl -sL -o build/bcprov.jar https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar
          keytool -list -v -keystore signing/keystore.bks -storetype BKS -storepass "$KEYSTORE_PASSWORD" -providerpath build/bcprov.jar -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider > build/ks_list.txt 2>&1 || \
          keytool -list -v -keystore signing/keystore.bks -storepass "$KEYSTORE_PASSWORD" > build/ks_list.txt 2>&1 || true
          DETECTED=$(awk '/^Alias name:/{a=$3} /Entry type: PrivateKeyEntry/{if(a!=""){print a; exit}}' build/ks_list.txt)
          if [ -n "$PREFERRED_ALIAS" ] && grep -q "^Alias name: $PREFERRED_ALIAS$" build/ks_list.txt; then
            FINAL_ALIAS="$PREFERRED_ALIAS"
          else
            FINAL_ALIAS="$DETECTED"
          fi
          echo "SIGNING_ALIAS=$FINAL_ALIAS" >> $GITHUB_ENV

      - name: Prepare bundles
        run: |
          mkdir -p bundles
          cp patches/build/release/patches-${{ env.VERSION }}.mpp bundles/hushfeed.mpp
          NAI64_JSON=$(curl -s "https://raw.githubusercontent.com/Nai64/Nai64ExtraPatches/refs/heads/main/patches-bundle.json")
          NAI64_URL=$(echo "$NAI64_JSON" | jq -r '.download_url')
          NAI64_VER=$(echo "$NAI64_JSON" | jq -r '.version // "unknown"')
          curl -L -o bundles/nai64.mpp "$NAI64_URL"
          echo "NAI64_VERSION=$NAI64_VER" >> $GITHUB_ENV

      - name: Download base APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build
          gh release download stock-tiktok-apk --repo Wake-Old-Hyphen/PAB \
            --pattern "com.zhiliaoapp.musically_${{ github.event.inputs.version }}-*arm64-v8a*.apk" --dir build/
          mv build/com.zhiliaoapp.musically_${{ github.event.inputs.version }}-*.apk build/base.apk

      - name: Generate and configure options
        run: |
          java -jar build/cli.jar options-create -p bundles/hushfeed.mpp -p bundles/nai64.mpp -o build/options.json
          python3 configure_options.py

      - name: Patch TikTok
        run: |
          java -jar build/cli.jar patch \
            -p bundles/hushfeed.mpp -p bundles/nai64.mpp \
            --options-file build/options.json --force \
            --keystore signing/keystore.bks \
            --keystore-password "${{ secrets.KEYSTORE_PASSWORD }}" \
            --keystore-entry-alias "$SIGNING_ALIAS" \
            --keystore-entry-password "${{ secrets.KEY_PASSWORD }}" \
            --striplibs arm64-v8a \
            -o build/patched.apk build/base.apk

      - name: Strip permissions
        run: |
          java -jar build/apkeditor.jar d -i build/patched.apk -o build/decoded -f
          python3 strip_permissions.py build/decoded build/permissions-${{ github.event.inputs.version }}.json
          java -jar build/apkeditor.jar b -i build/decoded -o build/stripped.apk -f

      - name: Re-sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
          $BUILD_TOOLS/zipalign -p 4 build/stripped.apk build/aligned.apk
          APK_NAME="TikTok-${{ github.event.inputs.version }}-arm64-v${{ env.VERSION }}-v${{ env.NAI64_VERSION }}-INJECTED.apk"
          $BUILD_TOOLS/apksigner sign \
            --ks signing/keystore.bks \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "$SIGNING_ALIAS" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "build/$APK_NAME" build/aligned.apk
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="amoled-test-${{ github.event.inputs.version }}-injected-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" --repo ${{ github.repository }} \
            --title "AMOLED Test: Injected ${{ github.event.inputs.version }} (Custom IDs)" \
            --notes "Comparison build WITH our AMOLED injection applied." \
            --prerelease
          gh release upload "$TAG" "build/$APK_NAME" --clobber --repo ${{ github.repository }}