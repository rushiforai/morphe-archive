name: Auto Sync, Build MPP, Patch APKs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  # ==========================================
  # JOB 1: Sync upstream, inject AMOLED, build .mpp
  # ==========================================
  build-mpp:
    runs-on: ubuntu-latest
    outputs:
      UPSTREAM_CHANGED: ${{ steps.sync.outputs.UPSTREAM_CHANGED }}
      VERSION: ${{ steps.get_version.outputs.VERSION }}
      NAI64_VERSION: ${{ steps.nai64.outputs.NAI64_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream Hushfeed
        id: sync
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/SysAdminDoc/hushfeed.git || true
          git fetch upstream main
          LOCAL_SHA=$(git rev-parse HEAD)
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          if [ "$LOCAL_SHA" != "$UPSTREAM_SHA" ]; then
            echo "New upstream commits detected!"
            mkdir -p build
            git log --oneline "$LOCAL_SHA..$UPSTREAM_SHA" > build/hushfeed_changelog.txt || true
            cp build/hushfeed_changelog.txt hushfeed_changelog.txt || true
            git merge upstream/main --no-edit
            git push origin main
            echo "UPSTREAM_CHANGED=true" >> $GITHUB_OUTPUT
          else
            echo "No new upstream commits. Skipping build."
            echo "UPSTREAM_CHANGED=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        if: steps.sync.outputs.UPSTREAM_CHANGED == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.sync.outputs.UPSTREAM_CHANGED == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        if: steps.sync.outputs.UPSTREAM_CHANGED == 'true'
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Inject AMOLED Fix
        if: steps.sync.outputs.UPSTREAM_CHANGED == 'true'
        run: python3 inject-amoled.py

      - name: Configure local.properties
        if: steps.sync.outputs.UPSTREAM_CHANGED == 'true'
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Extract version
        if: steps.sync.outputs.UPSTREAM_CHANGED == 'true'
        id: get_version
        run: |
          VERSION=$(grep -E '^version\s*=' gradle.properties | head -n 1 | cut -d'=' -f2 | tr -d ' \r')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build .mpp Bundle
        if: steps.sync.outputs.UPSTREAM_CHANGED == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --dependency-verification=off

      - name: Publish .mpp Release
        if: steps.sync.outputs.UPSTREAM_CHANGED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Hushfeed v${{ steps.get_version.outputs.VERSION }} (AMOLED)
          files: patches/build/release/patches-${{ steps.get_version.outputs.VERSION }}.mpp
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Nai64 version (local mirror)
        if: steps.sync.outputs.UPSTREAM_CHANGED == 'true'
        id: nai64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p nai64-meta
          gh release download nai64-bundle --repo ${{ github.repository }} \
            --pattern "changelog_history.json" --dir nai64-meta/ || true
          NAI64_VER="1.1.0"
          if [ -f nai64-meta/changelog_history.json ]; then
            V=$(jq -r 'if type=="array" then (last | .version? // empty) else (.version? // empty) end' nai64-meta/changelog_history.json 2>/dev/null || true)
            [ -n "$V" ] && NAI64_VER="$V"
          fi
          echo "NAI64_VERSION=$NAI64_VER" >> $GITHUB_OUTPUT
          echo "Nai64 version (mirror): $NAI64_VER"

      - name: Upload changelog for publish job
        if: steps.sync.outputs.UPSTREAM_CHANGED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shared
          path: hushfeed_changelog.txt
          if-no-files-found: ignore
          retention-days: 1

  # ==========================================
  # JOB 2: Patch all TikTok versions in parallel
  # ==========================================
  build-apk:
    needs: build-mpp
    if: needs.build-mpp.outputs.UPSTREAM_CHANGED == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Edit this list whenever a new TikTok version is supported
        version: ['47.1.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests pyyaml

      - name: Download Morphe CLI and APKEditor
        run: |
          mkdir -p build
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url')
          curl -L -o build/cli.jar "$CLI_URL"
          APKEDITOR_URL=$(curl -s https://api.github.com/repos/REAndroid/APKEditor/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url')
          curl -L -o build/apkeditor.jar "$APKEDITOR_URL"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/keystore.bks

      - name: Detect keystore alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PREFERRED_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          curl -sL -o build/bcprov.jar https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar
          keytool -list -v -keystore signing/keystore.bks -storetype BKS -storepass "$KEYSTORE_PASSWORD" -providerpath build/bcprov.jar -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider > build/ks_list.txt 2>&1 || \
          keytool -list -v -keystore signing/keystore.bks -storepass "$KEYSTORE_PASSWORD" > build/ks_list.txt 2>&1 || true
          DETECTED=$(awk '/^Alias name:/{a=$3} /Entry type: PrivateKeyEntry/{if(a!=""){print a; exit}}' build/ks_list.txt)
          if [ -n "$PREFERRED_ALIAS" ] && grep -q "^Alias name: $PREFERRED_ALIAS$" build/ks_list.txt; then
            FINAL_ALIAS="$PREFERRED_ALIAS"
          else
            FINAL_ALIAS="$DETECTED"
          fi
          echo "SIGNING_ALIAS=$FINAL_ALIAS" >> $GITHUB_ENV

      - name: Download base APK from PAB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build
          gh release download stock-tiktok-apk --repo Wake-Old-Hyphen/PAB \
            --pattern "com.zhiliaoapp.musically_${{ matrix.version }}-*arm64-v8a*.apk" --dir build/
          mv build/com.zhiliaoapp.musically_${{ matrix.version }}-*.apk build/base.apk
          FILE_SIZE=$(stat -c%s build/base.apk)
          if [ "$FILE_SIZE" -lt 100000000 ]; then
            echo "Base APK too small ($FILE_SIZE bytes) — download failed."
            exit 1
          fi

      - name: Download Hushfeed bundle (injected)
        run: |
          mkdir -p bundles
          curl -L -o bundles/hushfeed.mpp "https://github.com/${{ github.repository }}/releases/download/v${{ needs.build-mpp.outputs.VERSION }}/patches-${{ needs.build-mpp.outputs.VERSION }}.mpp"

      - name: Download Nai64 bundle (local mirror)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bundles nai64-meta
          gh release download nai64-bundle --repo ${{ github.repository }} \
            --pattern "patches.jar" --dir nai64-meta/
          gh release download nai64-bundle --repo ${{ github.repository }} \
            --pattern "patches.sha256" --dir nai64-meta/ || true
          if [ -f nai64-meta/patches.sha256 ]; then
            (cd nai64-meta && sha256sum -c patches.sha256) || echo "WARNING: sha256 check failed or format differs — continuing"
          fi
          mv nai64-meta/patches.jar bundles/nai64.mpp
          echo "Nai64 bundle ready: $(du -h bundles/nai64.mpp | cut -f1)"

      - name: Generate options
        run: java -jar build/cli.jar options-create -p bundles/hushfeed.mpp -p bundles/nai64.mpp -o build/options.json

      - name: Configure options
        run: python3 configure_options.py

      - name: Patch TikTok
        run: |
          java -jar build/cli.jar patch \
            -p bundles/hushfeed.mpp -p bundles/nai64.mpp \
            --options-file build/options.json --force \
            --keystore signing/keystore.bks \
            --keystore-password "${{ secrets.KEYSTORE_PASSWORD }}" \
            --keystore-entry-alias "$SIGNING_ALIAS" \
            --keystore-entry-password "${{ secrets.KEY_PASSWORD }}" \
            --striplibs arm64-v8a \
            -o build/patched.apk build/base.apk

      - name: Strip permissions
        run: |
          java -jar build/apkeditor.jar d -i build/patched.apk -o build/decoded -f
          python3 strip_permissions.py build/decoded build/permissions-${{ matrix.version }}.json
          java -jar build/apkeditor.jar b -i build/decoded -o build/stripped.apk -f

      - name: Re-sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
          $BUILD_TOOLS/zipalign -p 4 build/stripped.apk build/aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks signing/keystore.bks \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "$SIGNING_ALIAS" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "build/TikTok-${{ matrix.version }}-arm64-v${{ needs.build-mpp.outputs.VERSION }}-v${{ needs.build-mpp.outputs.NAI64_VERSION }}.apk" \
            build/aligned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.version }}
          path: build/TikTok-${{ matrix.version }}-*.apk
          retention-days: 1

      - name: Upload permissions artifact
        uses: actions/upload-artifact@v4
        with:
          name: perm-${{ matrix.version }}
          path: build/permissions-${{ matrix.version }}.json
          retention-days: 1

  # ==========================================
  # JOB 3: One release, all APKs, full notes
  # ==========================================
  publish:
    needs: [build-mpp, build-apk]
    if: always() && needs.build-mpp.outputs.UPSTREAM_CHANGED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare build directory
        run: |
          mkdir -p build
          mv artifacts/*.apk build/ || true
          mv artifacts/permissions-*.json build/ || true
          mv artifacts/hushfeed_changelog.txt build/ || true

      - name: Verify at least one APK exists
        run: |
          if ! ls build/TikTok-*.apk 1>/dev/null 2>&1; then
            echo "No APK artifacts found — every matrix leg failed."
            exit 1
          fi
          ls -lah build/TikTok-*.apk

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Download bundles and CLI for options regeneration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build bundles
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url')
          curl -L -o build/cli.jar "$CLI_URL"
          curl -L -o bundles/hushfeed.mpp "https://github.com/${{ github.repository }}/releases/download/v${{ needs.build-mpp.outputs.VERSION }}/patches-${{ needs.build-mpp.outputs.VERSION }}.mpp"
          gh release download nai64-bundle --repo ${{ github.repository }} \
            --pattern "patches.jar" --dir bundles/
          mv bundles/patches.jar bundles/nai64.mpp

      - name: Regenerate options for notes
        run: |
          java -jar build/cli.jar options-create -p bundles/hushfeed.mpp -p bundles/nai64.mpp -o build/options.json
          python3 configure_options.py

      - name: Generate release notes
        env:
          HUSHFEED_VERSION: v${{ needs.build-mpp.outputs.VERSION }}
          NAI64_VERSION: v${{ needs.build-mpp.outputs.NAI64_VERSION }}
        run: python3 generate_release_notes.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSIONS_STR=$(python3 -c "import glob; print(', '.join(sorted(f.replace('build/permissions-','').replace('.json','') for f in glob.glob('build/permissions-*.json'))))")
          TAG="privacy-tiktok-multi-v${{ needs.build-mpp.outputs.VERSION }}-$(date +%Y%m%d-%H%M%S)"
          
          gh release create "$TAG" --repo ${{ github.repository }} \
            --title "TikTok Privacy Build ($VERSIONS_STR)" \
            --notes-file build/release_notes.md \
            --prerelease
          
          for apk in build/TikTok-*.apk; do
            ok=0
            for i in 1 2 3 4 5; do
              if gh release upload "$TAG" "$apk" --clobber --repo ${{ github.repository }}; then
                echo "Uploaded $apk"
                ok=1
                break
              fi
              echo "Upload attempt $i failed for $apk, retrying in 20s..."
              sleep 20
            done
            [ "$ok" = "1" ] || exit 1
          done