name: Variant Test - 47.1.4 (3 APKs)

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build-variant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: vpnoff
            force_disable_nai64: "Bypass VPN Detection"
            force_disable_hushfeed: ""
            relax_guard: "false"
          - variant: guardoff
            force_disable_nai64: ""
            force_disable_hushfeed: "Device privacy guard"
            relax_guard: "false"
          - variant: relax
            force_disable_nai64: ""
            force_disable_hushfeed: ""
            relax_guard: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream Hushfeed (local only)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/SysAdminDoc/hushfeed.git || true
          git fetch upstream main
          git merge upstream/main --no-edit

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Inject AMOLED Fix
        run: python3 inject-amoled.py

      - name: Relax Device privacy guard transport check
        if: matrix.relax_guard == 'true'
        run: python3 inject-guard-relax.py

      - name: Configure local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Extract version
        run: |
          VERSION=$(grep -E '^version\s*=' gradle.properties | head -n 1 | cut -d'=' -f2 | tr -d ' \r')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build .mpp Bundle (local, not published)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --dependency-verification=off

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests pyyaml

      - name: Download Morphe CLI and APKEditor
        run: |
          mkdir -p build
          CLI_URL=$(curl -s https://api.github.com/repos/MorpheApp/morphe-desktop/releases/latest | jq -r '.assets[] | select(.name | endswith("-all.jar")) | .browser_download_url')
          curl -L -o build/cli.jar "$CLI_URL"
          APKEDITOR_URL=$(curl -s https://api.github.com/repos/REAndroid/APKEditor/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url')
          curl -L -o build/apkeditor.jar "$APKEDITOR_URL"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 -d > signing/keystore.bks

      - name: Detect keystore alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PREFERRED_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          curl -sL -o build/bcprov.jar https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar
          keytool -list -v -keystore signing/keystore.bks -storetype BKS -storepass "$KEYSTORE_PASSWORD" -providerpath build/bcprov.jar -providerclass org.bouncycastle.jce.provider.BouncyCastleProvider > build/ks_list.txt 2>&1 || \
          keytool -list -v -keystore signing/keystore.bks -storepass "$KEYSTORE_PASSWORD" > build/ks_list.txt 2>&1 || true
          DETECTED=$(awk '/^Alias name:/{a=$3} /Entry type: PrivateKeyEntry/{if(a!=""){print a; exit}}' build/ks_list.txt)
          if [ -n "$PREFERRED_ALIAS" ] && grep -q "^Alias name: $PREFERRED_ALIAS$" build/ks_list.txt; then
            FINAL_ALIAS="$PREFERRED_ALIAS"
          else
            FINAL_ALIAS="$DETECTED"
          fi
          echo "SIGNING_ALIAS=$FINAL_ALIAS" >> $GITHUB_ENV

      - name: Prepare bundles (Nai64 from local mirror)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bundles nai64-meta
          cp patches/build/release/patches-${{ env.VERSION }}.mpp bundles/hushfeed.mpp
          gh release download nai64-bundle --repo ${{ github.repository }} \
            --pattern "patches.jar" --dir nai64-meta/
          gh release download nai64-bundle --repo ${{ github.repository }} \
            --pattern "changelog_history.json" --dir nai64-meta/ || true
          mv nai64-meta/patches.jar bundles/nai64.mpp
          NAI64_VER="1.1.0"
          if [ -f nai64-meta/changelog_history.json ]; then
            V=$(jq -r 'if type=="array" then (last | .version? // empty) else (.version? // empty) end' nai64-meta/changelog_history.json 2>/dev/null || true)
            [ -n "$V" ] && NAI64_VER="$V"
          fi
          echo "NAI64_VERSION=$NAI64_VER" >> $GITHUB_ENV

      - name: Download base APK 47.1.4 from PAB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build
          gh release download stock-tiktok-apk --repo Wake-Old-Hyphen/PAB \
            --pattern "com.zhiliaoapp.musically_47.1.4-*arm64-v8a*.apk" --dir build/
          mv build/com.zhiliaoapp.musically_47.1.4-*.apk build/base.apk
          FILE_SIZE=$(stat -c%s build/base.apk)
          if [ "$FILE_SIZE" -lt 100000000 ]; then
            echo "Base APK too small ($FILE_SIZE bytes) — download failed."
            exit 1
          fi

      - name: Generate options
        run: java -jar build/cli.jar options-create -p bundles/hushfeed.mpp -p bundles/nai64.mpp -o build/options.json

      - name: Configure options (variant overrides)
        env:
          FORCE_DISABLE_NAI64: ${{ matrix.force_disable_nai64 }}
          FORCE_DISABLE_HUSHFEED: ${{ matrix.force_disable_hushfeed }}
        run: python3 configure_options.py

      - name: Patch TikTok
        run: |
          java -jar build/cli.jar patch \
            -p bundles/hushfeed.mpp -p bundles/nai64.mpp \
            --options-file build/options.json --force \
            --keystore signing/keystore.bks \
            --keystore-password "${{ secrets.KEYSTORE_PASSWORD }}" \
            --keystore-entry-alias "$SIGNING_ALIAS" \
            --keystore-entry-password "${{ secrets.KEY_PASSWORD }}" \
            --striplibs arm64-v8a \
            -o build/patched.apk build/base.apk

      - name: Strip permissions
        run: |
          java -jar build/apkeditor.jar d -i build/patched.apk -o build/decoded -f
          python3 strip_permissions.py build/decoded build/permissions-47.1.4-${{ matrix.variant }}.json
          java -jar build/apkeditor.jar b -i build/decoded -o build/stripped.apk -f

      - name: Re-sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n1)
          $BUILD_TOOLS/zipalign -p 4 build/stripped.apk build/aligned.apk
          APK_NAME="TikTok-47.1.4-arm64-v${{ env.VERSION }}-v${{ env.NAI64_VERSION }}-VARIANT-${{ matrix.variant }}.apk"
          $BUILD_TOOLS/apksigner sign \
            --ks signing/keystore.bks \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "$SIGNING_ALIAS" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "build/$APK_NAME" build/aligned.apk
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: build/TikTok-47.1.4-*VARIANT-${{ matrix.variant }}.apk
          retention-days: 1

  publish:
    needs: build-variant
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare build directory
        run: |
          mkdir -p build
          mv artifacts/*.apk build/ || true
          if ! ls build/*.apk 1>/dev/null 2>&1; then
            echo "No APK artifacts found — every variant leg failed."
            exit 1
          fi
          ls -lah build/*.apk

      - name: Publish release with all variants
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="variant-test-47.1.4-$(date +%Y%m%d-%H%M%S)"
          cat > notes.md <<'EOF'
          Variant comparison builds for TikTok 47.1.4 (Hushfeed + Nai64 mirror).

          - VARIANT-vpnoff: Nai64 "Bypass VPN Detection" disabled. Device privacy guard fully enabled (clipboard + local-network).
          - VARIANT-guardoff: Hushfeed "Device privacy guard" disabled. Bypass VPN Detection enabled; no clipboard/local-network protection.
          - VARIANT-relax: both patches enabled; guard transport check relaxed (clipboard guard active, local-network block skipped when no call sites exist).

          Install only one variant at a time (same signature, same package — uninstall or overwrite between tests).
          EOF
          gh release create "$TAG" --repo ${{ github.repository }} \
            --title "Variant Test: TikTok 47.1.4 (vpnoff / guardoff / relax)" \
            --notes-file notes.md \
            --prerelease
          for apk in build/*.apk; do
            ok=0
            for i in 1 2 3 4 5; do
              if gh release upload "$TAG" "$apk" --clobber --repo ${{ github.repository }}; then
                echo "Uploaded $apk"
                ok=1
                break
              fi
              echo "Upload attempt $i failed for $apk, retrying in 20s..."
              sleep 20
            done
            [ "$ok" = "1" ] || exit 1
          done