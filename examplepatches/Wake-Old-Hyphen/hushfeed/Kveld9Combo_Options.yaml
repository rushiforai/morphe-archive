# ==========================================
# KVELD9 v2.12.1 UNIVERSAL PATCHES (your screenshots, remapped to current names)
# ==========================================
kveld9_patches:
  - name: "Clean App Packaging"
    enabled: true

  # VERIFY: confirm this exact name in the Configure-options log; if not found,
  # the allowlist silently skips it.
  - name: "Override certificate pinning"
    enabled: true

  # VERIFY: confirm this exact name in the log.
  - name: "Remove Debug Info"
    enabled: true

  # Screenshot said "(Universal)"; v2.12.1 catalog shows plain "Remove Extra Languages".
  - name: "Remove Extra Languages"
    enabled: true
    options:
      locales: "en"

  # VERIFY: confirm this exact name in the log.
  - name: "Remove Unused Screen Sizes"
    enabled: true
    options:
      dpis: "xxhdpi"
      stripSmartwatch: true
      stripTelevision: true
      stripOtherFormFactors: true

  - name: "Shrink PNG Images"
    enabled: true

  - name: "Shrink WebP Images"
    enabled: true
    options:
      stripExif: true
      stripXmp: true
      stripIcc: false

  - name: "Silence System Logs"
    enabled: true
    options:
      logLevel: "all"

  - name: "Spoof Reinstall IDs"
    enabled: true
    options:
      appSetId: "00000000-0000-0000-0000-000000000000"
      installId: "0000000000000000000000"
      spoofScope: true

  # v2.12.1: stripWakeLock was REMOVED from this patch (now a separate
  # "Wake Locks Off (Universal)" patch). Your screenshot had it Disabled, so
  # we simply omit it here.
  - name: "Stop Background Sync (Universal)"
    enabled: true
    options:
      stripBootPermission: true
      disableBootReceivers: true
      disableWorkManager: true      # per your screenshot; if the JobInfoSchedulerService
                                    # crash returns, flip this to false