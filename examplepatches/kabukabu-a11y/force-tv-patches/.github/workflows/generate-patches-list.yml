name: Generate patches list

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-patches
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: Generate patches-list.json
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
        run: gradle :patches:generatePatchesList --console=plain

      - name: Commit patches-list.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-list.json
          if git diff --cached --quiet; then
            echo "No changes to patches-list.json"
          else
            git commit -m "Generate patches-list.json with generatePatchesList"
            git push
          fi
