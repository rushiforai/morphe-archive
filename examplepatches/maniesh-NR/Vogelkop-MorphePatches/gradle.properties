# Access for the Morphe patches Gradle plugin (GitHub Packages).
# Either fill these in (a GitHub PAT with `read:packages`),
# or export GITHUB_ACTOR / GITHUB_TOKEN instead.
#gpr.user=
#gpr.key=

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2048m
# Rate-limited networks (shared sandbox IPs): give Maven more time and retries.
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.http.connectionTimeout=60000
kotlin.code.style=official

version = 1.3.0
