name: 🐞 Bug report
description: Report a bug or an issue.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # MiXplorer Sharing Fix bug report

        Before creating a new bug report, please keep the following in mind:

        - **Do not submit a duplicate bug report**: Search existing reports [here](https://github.com/ak800i/mixplorer-patches-for-morphe/issues?q=is%3Aissue).
        - **Check supported inputs**: Review the exact APK builds and installation warnings [here](https://github.com/ak800i/mixplorer-patches-for-morphe#supported-input).
  - type: textarea
    attributes:
      label: Bug description
      description: |
        - Describe your bug in detail
        - Include the MiXplorer package, version/build, Android version, and Morphe version
        - Add steps to reproduce the bug if possible (Step 1. ... Step 2. ...)
        - Add images and videos if possible
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error logs
      description: Paste the relevant Morphe patching, installation, or crash error. Remove account details, private filenames, device identifiers, and signing keys.
      render: shell
  - type: textarea
    attributes:
      label: Solution
      description: If applicable, add a possible solution to the bug.
  - type: textarea
    attributes:
      label: Additional context
      description: Add additional context here.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your bug report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: All requested information has been provided properly.
          required: true
