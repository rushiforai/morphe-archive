name: Release safety

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-notes:
    name: Release notes guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - name: Test channel rollover and Morphe app scopes
        run: node --test tests/test_release_branding.cjs tests/test_release_backmerge.cjs
      - name: Validate candidate release notes against source changes
        env:
          RELEASE_CHANNEL: ${{ github.base_ref || 'main' }}
        run: node .github/scripts/preview_release_notes.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-notes-preview
          path: build/release-safety/notes-preview.md
