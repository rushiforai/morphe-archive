name: Release

on:
  workflow_dispatch:
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      # Push release commits and the dev backmerge with the deploy key: the main
      # ruleset lets deploy keys bypass its required docs check, while the
      # built-in token cannot bypass rulesets on a personal repository.
      # semantic-release keeps the SSH remote because its push test succeeds.
      # Without the secret, checkout falls back to the built-in token.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Read published counterpart catalogue for README tables
        if: github.ref_name == 'main' || github.ref_name == 'dev'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p build
          FILTER='map(select((.draft | not) and (.prerelease | not)))[0].tag_name // empty'
          if [ "$REF_NAME" = main ]; then
            FILTER='map(select((.draft | not) and .prerelease))[0].tag_name // empty'
          fi
          TAG=$(gh api "repos/${REPOSITORY}/releases?per_page=100" --jq "$FILTER")
          if [ -n "$TAG" ]; then
            gh api --method GET "repos/${REPOSITORY}/contents/patches-list.json" -f "ref=${TAG}" --jq .content | base64 --decode > build/counterpart-patches-list.json
          else
            echo null > build/counterpart-patches-list.json
          fi

      - name: Verify Python regression tests
        run: python3 -m unittest discover -s tests

      - name: Verify release integration tests
        run: node --test tests/test_release_branding.cjs tests/test_release_backmerge.cjs

      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v8
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
          SHARED_MAPS_API_KEY: ${{ secrets.SHARED_MAPS_API_KEY }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Always verify compilation when semantic-release did not publish a release.
      # This covers non-main/dev branches, chore commits, docs commits, etc.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARED_MAPS_API_KEY: ${{ secrets.SHARED_MAPS_API_KEY }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
