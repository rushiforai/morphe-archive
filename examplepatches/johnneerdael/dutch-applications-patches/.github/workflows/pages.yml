name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/site-requirements.txt'
      - 'scripts/*docs*'
      - 'patches-list.json'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/site/**'
      - 'docs/site-requirements.txt'
      - 'scripts/*docs*'
      - 'tests/test_docs_catalogue.py'
      - 'tests/test_release_branding.cjs'
      - '.github/scripts/*release*'
      - '.github/scripts/generate_patches_readme.py'
      - '.releaserc'
      - 'patches-list.json'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # Release metadata is written in a [skip ci] commit. Build current main
  # after Release finishes so the catalogue reflects that new bundle.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NO_MKDOCS_2_WARNING: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/site-requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r docs/site-requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -p 'test_docs_catalogue.py'
      - run: node --test tests/test_release_branding.cjs
      - run: python scripts/generate_docs_catalog.py
      - run: python -m mkdocs build --strict
      - run: python scripts/check_docs_site.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs-site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
