name: Documentation

on:
  pull_request:
    paths:
      - 'docs/site/**'
      - 'docs/site-requirements.txt'
      - 'scripts/*docs*'
      - 'tests/test_docs_catalogue.py'
      - 'tests/test_release_branding.cjs'
      - '.github/scripts/*release*'
      - '.github/scripts/generate_patches_readme.py'
      - '.releaserc'
      - 'patches-list.json'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # Main source and docs-only pushes already run Release. Build after it
  # succeeds so promoted pages use its [skip ci] metadata commit; a parallel
  # push build can read the previous stable catalogue instead. Also refresh
  # prerelease cards after dev Release succeeds.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NO_MKDOCS_2_WARNING: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/site-requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r docs/site-requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -p 'test_docs_catalogue.py'
      - run: node --test tests/test_release_branding.cjs
      - name: Generate stable and prerelease catalogue cards
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p build
          PRERELEASE_TAG=$(gh api "repos/${REPOSITORY}/releases?per_page=100" --jq 'map(select(.prerelease and (.draft | not)))[0].tag_name // empty')
          if [ -n "$PRERELEASE_TAG" ]; then
            gh api --method GET "repos/${REPOSITORY}/contents/patches-list.json" -f "ref=${PRERELEASE_TAG}" --jq .content | base64 --decode > build/prerelease-patches-list.json
            python scripts/generate_docs_catalog.py --prerelease-metadata build/prerelease-patches-list.json
          else
            python scripts/generate_docs_catalog.py
          fi
      # Pull requests into main are checked by the Docs release gate against
      # metadata generated from their sources. On main itself the checkout
      # metadata is the release output, so it is the stable reference.
      # Elsewhere, compare against the latest published stable release.
      - name: Require the app-page template and correct pre-release flags
        if: github.base_ref != 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          if [ "$TARGET_BRANCH" = main ] || [ "${{ github.event_name }}" = workflow_run ]; then
            python scripts/check_docs_app_pages.py --stable-metadata patches-list.json
          else
            STABLE_TAG=$(gh api "repos/${REPOSITORY}/releases/latest" --jq .tag_name)
            gh api --method GET "repos/${REPOSITORY}/contents/patches-list.json" -f "ref=${STABLE_TAG}" --jq .content | base64 --decode > build/stable-patches-list.json
            python scripts/check_docs_app_pages.py --stable-metadata build/stable-patches-list.json
          fi
      - run: python -m mkdocs build --strict
      - run: python scripts/check_docs_site.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs-site

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_run')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
