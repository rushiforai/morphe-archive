name: Docs release gate

# Runs on every pull request into main, without path filters, so it can be a
# required status check. Merging into main publishes the candidate patch
# sources as the next stable release: app pages must follow the template and
# must not keep pre-release markers for apps that bundle will publish.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  app-pages:
    name: App pages and pre-release flags
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      # The checked-in patches-list.json is only regenerated during a release,
      # so build the metadata the merge would publish. The gate never ships the
      # build, so a placeholder satisfies the Maps key format check.
      - name: Generate candidate patch metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHARED_MAPS_API_KEY: AIzaSyDOCSGATEPLACEHOLDER00000000000000
        run: ./gradlew :patches:generatePatchesList --no-daemon
      - name: Fetch the latest prerelease metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p build
          PRERELEASE_TAG=$(gh api "repos/${REPOSITORY}/releases?per_page=100" --jq 'map(select(.prerelease and (.draft | not)))[0].tag_name // empty')
          if [ -n "$PRERELEASE_TAG" ]; then
            gh api --method GET "repos/${REPOSITORY}/contents/patches-list.json" -f "ref=${PRERELEASE_TAG}" --jq .content | base64 --decode > build/prerelease-patches-list.json
          fi
      - run: python scripts/check_docs_app_pages.py --stable-metadata patches-list.json
