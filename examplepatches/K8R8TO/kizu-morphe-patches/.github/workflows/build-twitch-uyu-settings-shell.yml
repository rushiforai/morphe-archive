name: Build Kizu

on:
  push:
    branches:
      - twitch-uyu-settings-shell
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Kizu build files
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Checkout uyu base
        uses: actions/checkout@v4
        with:
          repository: bakwudo/uyu
          ref: main
          path: uyu

      - name: Checkout emote donor
        uses: actions/checkout@v4
        with:
          repository: arandomhooman/hoomans-morphe-patches
          ref: main
          path: hooman

      - name: Apply Kizu customizations
        env:
          KIZU_VERSION: 0.4.${{ github.run_number }}
        run: python3 twitch-build/apply_kizu.py

      - name: Build Kizu MPP and patch index
        working-directory: uyu
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid generatePatchesList --no-daemon --stacktrace

      - name: Collect Kizu MPP
        run: |
          mkdir -p out
          MPP="$(find uyu/patches/build/libs -maxdepth 1 -type f -name '*.mpp' -print -quit)"
          test -n "$MPP"
          cp "$MPP" out/kizu.mpp
          cp uyu/patches-list.json out/patches-list.json
          PATCH_COUNT="$(jq '.patches | length' out/patches-list.json)"
          echo "Generated patch count: $PATCH_COUNT"
          test "$PATCH_COUNT" -gt 0
          sha256sum out/kizu.mpp
          sha256sum out/patches-list.json

      - name: Upload Kizu MPP
        uses: actions/upload-artifact@v4
        with:
          name: kizu-release-files
          path: |
            out/kizu.mpp
            out/patches-list.json
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    environment: approve-release
    permissions:
      contents: write
    steps:
      - name: Checkout Kizu build files
        uses: actions/checkout@v4

      - name: Download Kizu release files
        uses: actions/download-artifact@v4
        with:
          name: kizu-release-files
          path: out

      - name: Publish release and update patches-bundle.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="0.4.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          cp out/kizu.mpp "kizu-${VERSION}.mpp"
          cp out/patches-list.json patches-list.json
          gh release create "$TAG" "kizu-${VERSION}.mpp" --title "Kizu Twitch ${VERSION}" --notes "Auto-released after manual approval"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/kizu-${VERSION}.mpp"
          jq -n --arg v "$VERSION" --arg u "$URL" --arg c "$(date -u +%Y-%m-%dT%H:%M:%S)" '{created_at:$c, description:"Kizu enhancements for Twitch", download_url:$u, signature_download_url:"", version:$v}' > patches-bundle.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          git commit -m "chore: release ${VERSION} [skip ci]"
          git push
