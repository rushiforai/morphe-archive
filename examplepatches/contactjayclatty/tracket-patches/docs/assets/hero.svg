<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
<title id="title">Tracket patches — community Morphe patch source</title>
<desc id="desc">A dark editorial banner with warm amber typography, a technical grid and layered patch-system graphics. Target Tracket 0.9.38.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#161b24"/><stop offset=".55" stop-color="#0c1018"/><stop offset="1" stop-color="#201911"/></linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffdfaa"/><stop offset=".58" stop-color="#e4b15a"/><stop offset="1" stop-color="#bc7831"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#232a32" stop-opacity=".97"/><stop offset="1" stop-color="#14191f" stop-opacity=".86"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#e4b15a" stop-opacity=".32"/><stop offset="1" stop-color="#e4b15a" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e1d9ca" stroke-opacity=".055"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <clipPath id="bounds"><rect width="1280" height="480" rx="20"/></clipPath>
</defs>
<g clip-path="url(#bounds)">
