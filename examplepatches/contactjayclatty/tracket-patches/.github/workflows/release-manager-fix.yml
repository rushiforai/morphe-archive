name: Build and verify Manager bundle

on:
  push:
    branches: [main]
    paths:
      - build.py
      - tests/BundleSmoke.java
      - tests/AndroidBundleSmoke.java
      - src/tracket/morphe/LifetimeUnlock.java
      - .github/workflows/release-manager-fix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manager-bundle-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify JVM discovery and DEX structure
        run: python build.py
      - name: Build Android loader probe and download pinned Manager
        run: |
          mkdir -p build/android-probe
          javac --release 8 -d build/android-probe tests/AndroidBundleSmoke.java
          java -cp build/tools/r8.jar com.android.tools.r8.D8 --release --min-api 26 --output build/android-probe build/android-probe/AndroidBundleSmoke.class
          cd build/android-probe
          zip probe.jar classes.dex
          cd ../..
          curl --fail --location --retry 3 https://github.com/MorpheApp/morphe-manager/releases/download/v2.3.0/morphe-manager-2.3.0.apk -o build/manager.apk
          echo 'd59f7bc835294a05814232e2cfd8bf22775434763e9a1ac26c88836b0be27dde  build/manager.apk' | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Load bundle with Manager patcher on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            adb push build/manager.apk /data/local/tmp/manager.apk
            adb push build/android-probe/probe.jar /data/local/tmp/probe.jar
            adb push dist/patches-1.0.1.mpp /data/local/tmp/patches-1.0.1.mpp
            adb shell chmod 444 /data/local/tmp/manager.apk /data/local/tmp/probe.jar /data/local/tmp/patches-1.0.1.mpp
            adb shell dalvikvm -cp /data/local/tmp/manager.apk:/data/local/tmp/probe.jar AndroidBundleSmoke /data/local/tmp/patches-1.0.1.mpp | tee build/android-loader.log
            grep -q ANDROID_LOADER_PASS build/android-loader.log
      - uses: actions/upload-artifact@v4
        with:
          name: manager-compatible-bundle
          path: |
            dist/patches-1.0.1.mpp
            dist/patches-1.0.1.mpp.sha256
            build/android-loader.log

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manager-compatible-bundle
      - name: Publish verified bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create v1.0.1 dist/patches-1.0.1.mpp dist/patches-1.0.1.mpp.sha256 --target "$RELEASE_COMMIT" --title '1.0.1 — Morphe Manager packaging fix' --notes 'Fixes missing Android DEX and missing bundle name/version metadata reported in #5. Includes Java classes for desktop and classes.dex for Android. Verified by desktop patch discovery, DEX instruction decoding, and the Morphe Manager 2.3.0 patcher loading the bundle on Android 35. Gameplay patch logic and supported Tracket version (0.9.38) are unchanged. This release does not claim patched-app runtime verification.'
