name: Release

# Pushes to main publish stable releases and pushes to dev pre-releases, when their commits call for one
# (see .github/scripts/release.py). Every push to them also gets a build check; other branches are checked
# by build.yml when they come in as a pull request. "Run workflow" publishes a release an earlier run left
# unfinished. Actions are pinned by commit; Dependabot proposes updates.
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

# One run per branch at a time. Each releases the branch as it is when it starts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup host dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r tests/requirements-host.txt
          # Chrome is supplied by the GitHub-hosted Ubuntu image; fail if it is unavailable.
          google-chrome --version

      # A failed host check stops the job before any release commit, tag or publication.
      - name: Setup pinned Hermes compilers
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: npm:hermes-compiler@250829098.0.19 npm:hermes-compiler@260318099.0.4

      - name: Verify host checks
        run: bin/test-host

      # Morphe's Gradle plugin is published on GitHub Packages; GITHUB_TOKEN can read it.
      - name: Release
        id: release
        if: github.ref_name == 'main' || github.ref_name == 'dev'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/release.py

      # Also after a run that published something and then failed.
      - name: Attest
        if: ${{ !cancelled() && steps.release.outputs.published == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.release.outputs.assets }}

      # The release build covers the branch; a push without a release builds here.
      - name: Verify project compiles
        if: steps.release.outputs.built != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
