name: Release patches and update main catalog
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
permissions:
  contents: write
  packages: read
concurrency:
  group: publish-patch-catalog
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - run: ./gradlew --no-daemon :runtime:test :summary-engine:test :patches:build :patches:generatePatchesList :patches:buildAndroid --stacktrace
      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 scripts/prepare_release.py --tag "$RELEASE_TAG" \
            --binary "patches/build/libs/patches-${RELEASE_TAG#v}.mpp" --output build/release-bundle.json
          cp patches-list.json /tmp/ebpatcher-release-list.json
      - name: Publish immutable binary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Refuse to replace an existing asset. Use a new version for any changed byte.
          gh release create "$RELEASE_TAG" \
            "patches/build/libs/patches-${RELEASE_TAG#v}.mpp" \
            "patches/build/libs/patches-${RELEASE_TAG#v}.mpp.sha256" \
            --verify-tag --title "EBPatcher patches $RELEASE_TAG" --generate-notes
      - name: Verify published binary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          BINARY="patches-${RELEASE_TAG#v}.mpp"
          gh release download "$RELEASE_TAG" --pattern "$BINARY" --dir build/published
          cmp "patches/build/libs/$BINARY" "build/published/$BINARY"
          python3 scripts/prepare_release.py --binary "build/published/$BINARY" \
            --tag "$RELEASE_TAG" --output /tmp/ebpatcher-release-bundle.json
      - name: Advance main catalog
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch origin main
          git checkout -B catalog-update origin/main
          # A late old release must never roll main back over a newer manifest.
          python3 - <<'PY'
          import json,os,pathlib
          properties=pathlib.Path("gradle.properties").read_text().splitlines()
          version=next(line.split("=",1)[1].strip() for line in properties if line.partition("=")[0].strip()=="version")
          if "v"+version != os.environ["RELEASE_TAG"]:
              raise SystemExit("Main now targets another version; update its source metadata explicitly.")
          PY
          cp /tmp/ebpatcher-release-bundle.json patches-bundle.json
          cp /tmp/ebpatcher-release-list.json patches-list.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json patches-list.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish Morphe source for $RELEASE_TAG"
            git push origin HEAD:main
          fi
