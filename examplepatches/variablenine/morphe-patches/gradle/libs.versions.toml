[versions]
morphe-patcher = "2.3.0"
#noinspection GradleDependency
smali = "4220ae75f7"
gson = "2.15.0"
junit = "4.13.2"
robolectric = "4.17"
json = "20260814"
kotlinx-coroutines = "1.11.0"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
# The Morphe Gradle plugin adds this dependency during the build. The declaration is here so
# the plugin can read the version, and so dependabot offers updates.
#noinspection UnusedVersionCatalogEntry
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }

# Tests only. Nothing below ends up in the patch bundle.
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
json = { module = "org.json:json", version.ref = "json" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
