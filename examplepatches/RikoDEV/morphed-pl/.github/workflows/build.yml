name: Build

on:
  pull_request:
  push:
    branches-ignore:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build patches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # Building resolves the `app.morphe.patches` Gradle plugin from the Morphe
      # registry (maven.pkg.github.com/MorpheApp/registry), which needs a token.
      - name: Build .mpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
