name: Open a PR to main

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  pull-request:
    name: Open pull request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          TARGET_BRANCH: main
        run: |
          # Check if PR already exists (base=main, head=dev)
          if gh pr list --base "$TARGET_BRANCH" --head "$SOURCE_BRANCH" --json number | jq -e '. | length > 0' >/dev/null; then
            echo "Pull request already exists."
            exit 0
          fi

          # Check if there are any commits between branches
          COMMITS=$(gh api "repos/${{ github.repository }}/compare/${TARGET_BRANCH}...${SOURCE_BRANCH}" --jq '.total_commits')
          if [ "$COMMITS" -eq 0 ]; then
            echo "No commits between $TARGET_BRANCH and $SOURCE_BRANCH. Skipping PR creation."
            exit 0
          fi

          # Try to create the PR.
          #
          # A failure here is reported as a WARNING, not an error, and the job still
          # passes. This PR is a convenience for promoting dev to main; this repo's
          # releases are made by merging dev into main directly, so nothing depends
          # on it existing. Creating PRs from Actions needs "Allow GitHub Actions to
          # create and approve pull requests" (Settings > Actions > General), which
          # is off here - so before this change the job failed on EVERY push to dev,
          # for a permission the release flow does not use. A workflow that is
          # permanently red teaches you to ignore red, which costs more than the
          # convenience is worth. Enable that setting and this starts working again
          # with no further change.
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$SOURCE_BRANCH" \
            --title 'chore: Merge branch `dev` to `main`' \
            --body "When dev (pre-release) is ready, then merge this pull request to create a new stable release." \
            || {
              echo "::warning::Could not open the dev -> main pull request. This is optional: releases are made by merging dev into main directly. To get it automatically, enable 'Allow GitHub Actions to create and approve pull requests' in Settings > Actions > General > Workflow permissions."
              exit 0
            }
