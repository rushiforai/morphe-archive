name: PR build and test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read
  pull-requests: write

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    # Secrets are not available to PRs from forks, so only build same-repo branches.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN }}
        run: ./gradlew generatePatchesList :extensions:extension:testDebugUnitTest :extensions:calculator:testDebugUnitTest :patches:test :patches:buildAndroid --continue

      - name: Release tooling tests
        run: |
          python3 -I -m unittest discover -s tools/upstream-sync -p "test_*.py"
          python3 -I -m unittest discover -s tools/release-notes -p "test_*.py"

      - name: Check generated files are committed
        run: |
          if ! git diff --exit-code -- patches-list.json patches-bundle.json; then
            echo "::error::patches-list.json or patches-bundle.json differs from what Gradle generates. Commit the regenerated files."
            exit 1
          fi

      - name: Resolve patch file
        id: mpp
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *//p' gradle.properties | tr -d '[:space:]')"
          file="patches/build/libs/patches-$version.mpp"
          test -f "$file"
          sha="${{ github.event.pull_request.head.sha }}"
          {
            echo "file=$file"
            echo "name=patches-$version-pr${{ github.event.pull_request.number }}-${sha:0:7}"
            echo "sha=${sha:0:7}"
          } >> "$GITHUB_OUTPUT"

      # The artifact holds the .mpp for testing on a device; GitHub serves it as a zip.
      - name: Upload patch file
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mpp.outputs.name }}
          path: ${{ steps.mpp.outputs.file }}
          retention-days: 14
          if-no-files-found: error

      - name: Comment download link on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          NAME: ${{ steps.mpp.outputs.name }}
          URL: ${{ steps.upload.outputs.artifact-url }}
          SHA: ${{ steps.mpp.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker='<!-- pr-build-mpp -->'
          body="$(printf '%s\n### 実機テスト用パッチ\n\nコミット `%s` からビルドしたパッチです（ビルドとテストはすべて成功）。\n\n- ダウンロード: [%s](%s)（zip を展開すると `.mpp` が入っています。保存期間は 14 日です）\n- ビルドの記録: %s\n' "$marker" "$SHA" "$NAME" "$URL" "$RUN_URL")"
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty" | head -n1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  release-notes-preview:
    name: Japanese release notes preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Translates the release notes the next tag would publish, so the Japanese text
      # can be reviewed in the job summary before tagging.
      - name: Translate release notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          python -m pip install --quiet 'anthropic==2.4.0'
          python -I tools/release-notes/translate_ja.py --bundle patches-bundle.json --out "$RUNNER_TEMP/release-notes.md"
          {
            echo "## Release notes preview"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
