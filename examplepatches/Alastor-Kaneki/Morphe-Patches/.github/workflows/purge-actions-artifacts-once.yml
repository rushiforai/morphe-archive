name: Purge existing Actions artifacts once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/purge-actions-artifacts-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all existing Actions artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            core.info(`Deleting ${artifacts.length} artifacts from ${owner}/${repo}`);
            for (const artifact of artifacts) {
              try {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
                core.info(`Deleted ${artifact.name} (${artifact.id})`);
              } catch (error) {
                core.warning(`Could not delete ${artifact.name} (${artifact.id}): ${error.message}`);
              }
            }
