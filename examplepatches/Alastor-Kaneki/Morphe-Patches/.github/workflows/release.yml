name: Publish Morphe release

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  packages: read

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Test GX URL resolver
        run: bash tools/test-parser.sh

      - name: Test Chrome userscript engine
        run: bash tools/test-chrome-userscripts.sh

      - name: Test Chrome 150 exact menu hook
        run: bash tools/test-chrome150-menu-hook.sh

      - name: Build Android Morphe bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle buildAndroid --stacktrace

      - name: Create or update GitHub release and source metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^version=//p' gradle.properties | head -n 1)"
          TAG="v${VERSION}"
          mapfile -t BUNDLES < <(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' -print)

          if (( ${#BUNDLES[@]} == 0 )); then
            echo 'No .mpp bundle was generated.' >&2
            exit 1
          fi

          RELEASE_DESCRIPTION="Morphe Patches ${VERSION}. Includes the Opera GX raw mod downloader and the Chrome 150 exact app-menu MonkeyScript manager with Material You, Greasy Fork/Sleazy Fork browsing, installation, and userscript publishing."

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Morphe Patches ${TAG}" \
              --notes "$RELEASE_DESCRIPTION"
          fi
          gh release upload "$TAG" "${BUNDLES[@]}" --clobber

          BUNDLE="${BUNDLES[0]}"
          FILE_NAME="$(basename "$BUNDLE")"
          DIGEST="$(sha256sum "$BUNDLE" | awk '{print $1}')"
          CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%S)"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE_NAME}"

          SOURCE_METADATA="$(jq -n \
            --arg created_at "$CREATED_AT" \
            --arg description "$RELEASE_DESCRIPTION" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg signature_download_url "" \
            --arg version "$VERSION" \
            '{created_at: $created_at, description: $description, download_url: $download_url, signature_download_url: $signature_download_url, version: $version}')"

          RELEASE_MARKER="$(jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg asset "$FILE_NAME" \
            --arg sha256 "$DIGEST" \
            --arg sourceCommit "$GITHUB_SHA" \
            '{version: $version, tag: $tag, asset: $asset, sha256: $sha256, sourceCommit: $sourceCommit}')"

          upsert_repo_file() {
            local path="$1"
            local content="$2"
            local message="$3"
            local encoded existing_sha

            encoded="$(printf '%s\n' "$content" | base64 -w 0)"
            existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" --jq .sha 2>/dev/null || true)"

            if [[ -n "$existing_sha" ]]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
                -f message="$message" \
                -f content="$encoded" \
                -f sha="$existing_sha" \
                -f branch="$GITHUB_REF_NAME" >/dev/null
            else
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
                -f message="$message" \
                -f content="$encoded" \
                -f branch="$GITHUB_REF_NAME" >/dev/null
            fi
          }

          upsert_repo_file \
            "patches-bundle.json" \
            "$SOURCE_METADATA" \
            "Update Morphe source metadata for ${TAG}"

          upsert_repo_file \
            "releases/latest.json" \
            "$RELEASE_MARKER" \
            "Record Morphe release ${TAG}"
