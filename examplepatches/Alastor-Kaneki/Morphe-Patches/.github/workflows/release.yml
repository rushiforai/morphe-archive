name: Release

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install semantic-release dependencies
        run: npm install

      - name: Test GX URL resolver
        run: bash tools/test-parser.sh

      - name: Test standalone GX icon pack
        run: bash tools/test-gx-icon-pack.sh

      - name: Test Chrome userscript engine
        run: bash tools/test-chrome-userscripts.sh

      - name: Test Chrome 150 exact menu hook
        run: bash tools/test-chrome150-menu-hook.sh

      - name: Test Chrome page runtime and Material UI
        run: bash tools/test-chrome-runtime-bridge.sh

      - name: Generate patches list
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gradle wrapper --gradle-version 9.6.1
          ./gradlew generatePatchesList

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: semantic
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release bundle
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.semantic.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp
