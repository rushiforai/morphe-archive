name: Build Morphe patches

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Test GX URL resolver
        run: bash tools/test-parser.sh

      - name: Test standalone GX icon pack
        run: bash tools/test-gx-icon-pack.sh

      - name: Test Chrome userscript engine
        run: bash tools/test-chrome-userscripts.sh

      - name: Test Chrome 150 exact menu hook
        run: bash tools/test-chrome150-menu-hook.sh

      - name: Test Chrome page runtime and Material UI
        run: bash tools/test-chrome-runtime-bridge.sh

      - name: Build Android Morphe bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle buildAndroid --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: morphe-patches
          path: |
            patches/build/libs/*.mpp
            patches/build/libs/*.json
          if-no-files-found: error
          retention-days: 30
