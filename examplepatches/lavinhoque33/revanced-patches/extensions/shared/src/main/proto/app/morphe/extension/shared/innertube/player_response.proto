syntax = "proto3";

import "app/morphe/extension/shared/innertube/response_context.proto";

package app.morphe.extension.shared.innertube;

option optimize_for = LITE_RUNTIME;
option java_package = "app.morphe.extension.shared.innertube";

message PlayerResponse {
  optional ResponseContext responseContext = 1;
  optional PlayabilityStatus playabilityStatus = 2;
  optional StreamingData streamingData = 4;
  optional Captions captions = 10;
  optional VideoDetails videoDetails = 11;
  optional PlayerConfig playerConfig = 15;
}

// Verified against the signed-out ANDROID 20.10.38 response on 2026-10-31.
message Captions {
  optional CaptionTrackList playerCaptionsTracklistRenderer = 51621377;
}

message CaptionTrackList {
  repeated CaptionTrack captionTracks = 1;
  repeated CaptionTranslationLanguage translationLanguages = 3;
  repeated int32 defaultTranslationSourceTrackIndices = 6;
}

message CaptionText {
  repeated CaptionTextRun runs = 1;
}

message CaptionTextRun {
  optional string text = 1;
}

message CaptionTrack {
  optional string baseUrl = 1;
  optional CaptionText name = 2;
  optional string vssId = 3;
  optional string languageCode = 4;
  optional string kind = 5;
  optional bool isTranslatable = 7;
}

message CaptionTranslationLanguage {
  optional string languageCode = 1;
  optional CaptionText languageName = 2;
  repeated int32 translationSourceTrackIndices = 3;
}

// Field numbers read off a real player response, since asking for "videoDetails"
// in the fields mask returns nothing.
message VideoDetails {
  optional string videoId = 1;
  optional string title = 15;
  optional int32 lengthSeconds = 16;
  optional string channelId = 19;
  optional ThumbnailList thumbnail = 25;
  optional string ownerChannelName = 33;
  // The app's MusicVideoType enum (1 ATV, 2 OMV, ...), field 40 of the app's own message. The Song/Video pill
  // reads it: an audio-track type keeps the pill dim.
  optional int32 musicVideoType = 40;
  // Field 43 of the app's own message; the pill also stays dim when it is true.
  optional bool isLiveContent = 43;
}

message ThumbnailList {
  repeated ThumbnailEntry thumbnails = 1;
}

message ThumbnailEntry {
  optional string url = 1;
  optional int32 width = 2;
  optional int32 height = 3;
}


message PlayabilityStatus {
  optional Status status = 1;
  optional string reason = 2;
}

enum Status {
  OK = 0;
  ERROR = 1;
  UNPLAYABLE = 2;
  LOGIN_REQUIRED = 3;
  CONTENT_CHECK_REQUIRED = 4;
  AGE_CHECK_REQUIRED = 5;
  LIVE_STREAM_OFFLINE = 6;
  FULLSCREEN_ONLY = 7;
  GL_PLAYBACK_REQUIRED = 8;
  AGE_VERIFICATION_REQUIRED = 9;
}

message StreamingData {
  optional int64 expiresInSeconds = 1;
  repeated Format formats = 2;
  repeated Format adaptiveFormats = 3;
  // The built-in downloader reads the 1080p Premium (itag 616) HLS stream from it.
  optional string hlsManifestUrl = 5;
  optional string serverAbrStreamingUrl = 15;
}

message Format {
  // Original stream identity and byte layout, dex-verified on Music 8.30.54, 9.15.51 and 9.40.51.
  optional int64 lastModified = 11;
  optional ByteRange initRange = 9;
  optional ByteRange indexRange = 10;
  optional int32 itag = 1;
  optional int32 bitrate = 6;
  optional int32 averageBitrate = 31;
  optional int32 audioChannels = 46;
  optional int64 approxDurationMs = 44;
  optional int64 audioSampleRate = 45;
  optional int64 contentLength = 12;
  optional string mimeType = 5;
  optional string url = 2;
  optional string signatureCipher = 48;
  // Video dimensions for the built-in downloader's quality picker.
  optional int32 width = 7;
  optional int32 height = 8;
  optional int32 fps = 25;
  optional string qualityLabel = 26;
  // Same AudioTrack wire fields as innertube/utils/player_response.proto; retain the default recording.
  optional DownloadAudioTrack audioTrack = 28;
}

message DownloadAudioTrack {
  optional string id = 5;
  optional bool audioIsDefault = 6;
}

message ByteRange {
  optional int64 start = 3;
  optional int64 end = 4;
}

message PlayerConfig {
  optional AudioConfig audioConfig = 55405814;
  // Music 9.40.51 Laolg.f (Lakrx): its first field is the bool the app's ExoPlayer engine requires (Lyvb.S).
  optional ExoPlayerConfig exoPlayerConfig = 57825011;
  optional AndroidMedialibConfig androidMedialibConfig = 78958444;
  // Dex-verified on the three supported Music versions; preserve unrelated config when stripping SABR.
  optional MediaCommonConfig mediaCommonConfig = 215771584;
  optional PlayerGestureConfig playerGestureConfig = 262192541;
  optional InlinePlaybackConfig inlinePlaybackConfig = 399288314;
  optional PlaybackRoutingConfig playbackRoutingConfig = 470799370;
}

message MediaCommonConfig {
  optional MediaUstreamerRequestConfig mediaUstreamerRequestConfig = 2;
  optional bool enableSabr = 13;
}

message MediaUstreamerRequestConfig {
  optional bytes videoPlaybackUstreamerConfig = 4;
}

message PlaybackRoutingConfig {
  // Raw value 3 maps to forced Platypus in all three Music versions.
  optional int32 preferredEngine = 4;
}

message AudioConfig {
  optional bool muteOnStart = 4;
  // Music 9.40.51 Lajdb.i (read by Lwdx.aR): opens the itag check of the ExoPlayer engine for video formats too.
  optional bool exoAudioGate = 5;
}

message ExoPlayerConfig {
  optional bool useExoPlayer = 1;
}

message AndroidMedialibConfig {
  optional bool isItag18MainProfile = 3;
}

message PlayerGestureConfig {
  optional bool downAndOutPortraitAllowed = 1;
  optional bool downAndOutLandscapeAllowed = 2;
}

message InlinePlaybackConfig {
  optional bool showScrubbingControls = 1;
  optional bool showAudioControls = 2;
}
