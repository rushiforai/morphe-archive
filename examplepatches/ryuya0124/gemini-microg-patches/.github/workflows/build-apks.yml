name: Build APKs (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download configured APK inputs
        env:
          GOOGLE_BASE_APK_URL: ${{ secrets.GOOGLE_BASE_APK_URL }}
          GOOGLE_SPLIT_APK_URL: ${{ secrets.GOOGLE_SPLIT_APK_URL }}
          GEMINI_BASE_APK_URL: ${{ secrets.GEMINI_BASE_APK_URL }}
        run: python3 scripts/download-ci-inputs.py
      - run: scripts/check-inputs.sh
      - run: scripts/setup-tools.sh
      - name: Build and verify all APKs
        run: scripts/build-all.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-apks-${{ github.sha }}
          path: |
            build/*-unsigned.apk
            build/gemini-patches.jar
            build/*-patch-result.json
          if-no-files-found: error
          retention-days: 7
