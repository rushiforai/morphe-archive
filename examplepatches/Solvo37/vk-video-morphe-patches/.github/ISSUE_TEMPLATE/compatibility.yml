name: New VK Video version / compatibility
description: Report a new upstream version or a fingerprint failure
title: "[Compatibility] VK Video "
labels: []
body:
  - type: input
    id: version
    attributes:
      label: versionName
      placeholder: "1.164"
    validations:
      required: true
  - type: input
    id: version_code
    attributes:
      label: versionCode
      placeholder: "xxxxx"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did you get the official build?
      options:
        - RuStore
        - Google Play
        - VK / official update
        - Other
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Morphe error / failed fingerprint
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I am not attaching or committing the proprietary VK Video APK.
          required: true
