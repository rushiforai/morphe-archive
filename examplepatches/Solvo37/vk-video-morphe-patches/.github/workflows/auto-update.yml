name: VK Video auto build

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild the newest verified upstream even if its release already exists'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'ci/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'patches-list.json'
      - '.github/workflows/auto-update.yml'

permissions:
  contents: write
  packages: read
  issues: write

concurrency:
  group: vk-video-auto-build
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.vk.vkvideo
  EXPECTED_CERT_SHA256: 057d974412032066f1b5edb1fdb550f71854189815c806b27c4d486fb4f1ef32
  PROJECT_CERT_SHA256: d41f492f0e2a2e3990ac7f8e75cc5d4b14895f7b46c0b6113b7882c48aa5d40a

  GPLAYDL_VERSION: '4.2.1'
  APKEEP_VERSION: '1.0.0'
  APKEEP_SHA256: a23579a3ba366d25a6d69848189b983d65662f4ecf4b9e11e16510811659de4e
  APKEDITOR_VERSION: '1.4.1'

  RUSTORE_DOWNLOADER_VERSION: v1.4.0
  RUSTORE_DOWNLOADER_SHA256: 8ba94847a616b7b5d032285141253b8e3e2cb79d1119b827f558d48b6a157ca0

  MORPHE_VERSION: v1.16.0
  MORPHE_SHA256: 82a0df2ff881d83d5ca8b4f9a6ce196bd4ac3b87ff147fe37845c296b436806c

jobs:
  build:
    if: github.repository == 'Solvo37/vk-video-morphe-patches' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      GPLAYDL_API_KEY: ${{ secrets.GPLAYDL_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect patch-profile changes
        id: patch_change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHANGED=false

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            BEFORE="$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")"
            ZERO="0000000000000000000000000000000000000000"

            if [[ -n "$BEFORE" && "$BEFORE" != "$ZERO" ]]; then
              FILES="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')"
              if grep -Eq '^(patches/|gradle\.properties$|patches-list\.json$)' <<< "$FILES"; then
                CHANGED=true
              fi
            fi
          fi

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Patch profile changed: $CHANGED"

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.7.1'

      - name: Install Android verification tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apksigner aapt zipalign jq unzip zip

      - name: Resolve release baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BASELINE_VERSION="$(jq -r '.version_name' ci/baseline.json)"
          BASELINE_VERSION_CODE="$(jq -r '.version_code' ci/baseline.json)"
          BASELINE_TAG="$(jq -r '.release_tag' ci/baseline.json)"

          mkdir -p .baseline-release

          LATEST_TAG="$(
            gh release list               --repo "$GITHUB_REPOSITORY"               --limit 100               --json tagName,isDraft,isPrerelease,publishedAt               --jq '[.[] |
                select(.isDraft == false) |
                select(.isPrerelease == false) |
                select(.tagName | test("^[0-9]+(?:\\.[0-9]+){1,3}(?:-[0-9]+)?$"))
              ] | sort_by(.publishedAt) | last | .tagName // empty'
          )"

          if [[ -n "$LATEST_TAG" ]]; then
            rm -rf .baseline-release/*
            if gh release download "$LATEST_TAG"                 --repo "$GITHUB_REPOSITORY"                 --pattern 'upstream.json'                 --dir .baseline-release >/dev/null 2>&1; then

              RELEASE_VERSION="$(jq -r '.selected.version_name // .version_name // empty' .baseline-release/upstream.json)"
              RELEASE_CODE="$(jq -r '.selected.version_code // .version_code // empty' .baseline-release/upstream.json)"

              if [[ "$RELEASE_CODE" =~ ^[0-9]+$ ]] && (( RELEASE_CODE >= BASELINE_VERSION_CODE )); then
                BASELINE_VERSION="$RELEASE_VERSION"
                BASELINE_VERSION_CODE="$RELEASE_CODE"
                BASELINE_TAG="$LATEST_TAG"
              fi
            fi
          fi

          echo "Baseline: $BASELINE_VERSION ($BASELINE_VERSION_CODE), tag $BASELINE_TAG"

          echo "version=$BASELINE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$BASELINE_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$BASELINE_TAG" >> "$GITHUB_OUTPUT"

      - name: Load linked Google Play credential
        env:
          ENC_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "${GPLAYDL_API_KEY:-}" ]]; then
            echo "Using GPLAYDL_API_KEY repository secret."
            exit 0
          fi

          if [[ ! -s ci/gplaydl-api-key.enc ]]; then
            echo "No linked Google Play credential found; Google Play source will be skipped."
            exit 0
          fi

          KEY="$(openssl enc -d -aes-256-cbc -pbkdf2 -a -A             -in ci/gplaydl-api-key.enc             -pass env:ENC_PASSWORD)"

          [[ -n "$KEY" ]]
          echo "::add-mask::$KEY"
          echo "GPLAYDL_API_KEY=$KEY" >> "$GITHUB_ENV"
          unset KEY
          echo "Loaded encrypted Google Play credential."

      - name: Install download tools
        run: |
          set -euo pipefail

          python -m pip install --disable-pip-version-check "gplaydl==${GPLAYDL_VERSION}"

          curl -fL --retry 4             -o apkeep             "https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/apkeep-x86_64-unknown-linux-gnu"
          echo "${APKEEP_SHA256}  apkeep" | sha256sum -c -
          chmod +x apkeep

          curl -fL --retry 4             -o rustore-downloader.tar.gz             "https://github.com/RD2W/rustore-apk-downloader/releases/download/${RUSTORE_DOWNLOADER_VERSION}/RuStore_ApkDownloader_${RUSTORE_DOWNLOADER_VERSION}_linux-x86_64.tar.gz"
          echo "${RUSTORE_DOWNLOADER_SHA256}  rustore-downloader.tar.gz" | sha256sum -c -
          mkdir -p tools/rustore
          tar -xzf rustore-downloader.tar.gz -C tools/rustore
          chmod +x tools/rustore/rustore_apk_downloader

      - name: Download all available upstream candidates
        run: |
          set -euo pipefail
          rm -rf upstream
          mkdir -p upstream/rustore upstream/google-play upstream/apkpure

          echo "=== RuStore ==="
          if tools/rustore/rustore_apk_downloader -j "${PACKAGE_NAME}" > rustore-meta.json 2>/dev/null; then
            RUSTORE_CERT="$(jq -r '.signature // empty' rustore-meta.json | tr '[:upper:]' '[:lower:]')"
            echo "RuStore reports: $(jq -r '.version_name // "unknown"' rustore-meta.json) ($(jq -r '.version_code // "unknown"' rustore-meta.json))"
            if [[ "$RUSTORE_CERT" == "${EXPECTED_CERT_SHA256}" ]]; then
              tools/rustore/rustore_apk_downloader "${PACKAGE_NAME}" upstream/rustore                 || echo "::warning::RuStore APK download failed."
            else
              echo "::warning::RuStore metadata certificate is missing or unexpected; source skipped."
            fi
          else
            echo "::warning::RuStore metadata query failed."
          fi

          echo "=== Google Play ==="
          if [[ -n "${GPLAYDL_API_KEY:-}" ]]; then
            gplaydl download "${PACKAGE_NAME}"               --arch arm64               --no-extras               -o upstream/google-play               || echo "::warning::Google Play download failed."
          else
            echo "::notice::Google Play credential unavailable; source skipped."
          fi

          echo "=== APKPure ==="
          ./apkeep -a "${PACKAGE_NAME}" -d apk-pure upstream/apkpure             || echo "::warning::APKPure download failed."

          # Flatten APK/XAPK/APKS/APKM containers inside their source directory.
          for source_dir in upstream/rustore upstream/google-play upstream/apkpure; do
            while IFS= read -r archive; do
              [[ -z "$archive" ]] && continue
              tmp="${archive}.dir"
              rm -rf "$tmp"
              mkdir -p "$tmp"
              unzip -q "$archive" -d "$tmp"
              find "$tmp" -type f -name '*.apk' -exec cp -f {} "$source_dir"/ \;
              rm -rf "$tmp" "$archive"
            done < <(find "$source_dir" -maxdepth 1 -type f \( -name '*.xapk' -o -name '*.apks' -o -name '*.apkm' \) -print)
          done

          echo "Downloaded candidates:"
          find upstream -maxdepth 2 -type f -printf '%p\n' | sort

      - name: Select newest verified upstream
        id: upstream
        run: |
          set -euo pipefail
          python ci/select_upstream.py             --root upstream             --package "${PACKAGE_NAME}"             --certificate "${EXPECTED_CERT_SHA256}"             --output upstream.json             --github-output "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          VERSION_CODE: ${{ steps.upstream.outputs.version_code }}
          BASELINE_VERSION: ${{ steps.baseline.outputs.version }}
          BASELINE_VERSION_CODE: ${{ steps.baseline.outputs.version_code }}
          BASELINE_TAG: ${{ steps.baseline.outputs.tag }}
          USER_FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
          PATCH_PROFILE_CHANGED: ${{ steps.patch_change.outputs.changed }}
        run: |
          set -euo pipefail

          FORCE_REBUILD=false
          if [[ "$USER_FORCE_REBUILD" == "true" || "$PATCH_PROFILE_CHANGED" == "true" ]]; then
            FORCE_REBUILD=true
          fi
          echo "Force rebuild: $FORCE_REBUILD (manual=$USER_FORCE_REBUILD, patch-profile=$PATCH_PROFILE_CHANGED)"

          if (( VERSION_CODE < BASELINE_VERSION_CODE )); then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Newest verified source is $VERSION ($VERSION_CODE), below baseline $BASELINE_VERSION ($BASELINE_VERSION_CODE)."
            exit 0
          fi

          next_revision_tag() {
            local base="$1"
            local prefix="${base}."
            local max=-1
            local tag suffix

            while IFS= read -r tag; do
              [[ "$tag" == "$prefix"* ]] || continue
              suffix="${tag#"$prefix"}"
              if [[ "$suffix" =~ ^[0-9]+$ ]] && (( suffix > max )); then
                max="$suffix"
              fi
            done < <(
              gh release list \
                --repo "$GITHUB_REPOSITORY" \
                --limit 100 \
                --json tagName \
                --jq '.[].tagName'
            )

            if (( max < 0 )); then
              printf '%s.0\n' "$base"
            else
              printf '%s.%d\n' "$base" "$((max + 1))"
            fi
          }

          if (( VERSION_CODE == BASELINE_VERSION_CODE )) && [[ "$VERSION" == "$BASELINE_VERSION" ]]; then
            if [[ "$FORCE_REBUILD" != "true" ]]; then
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "Verified upstream is already released."
              exit 0
            fi
          fi

          TAG="$(next_revision_tag "$VERSION")"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Calculated immutable release tag $TAG already exists."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "Will build VK Video $VERSION ($VERSION_CODE) as immutable release revision $TAG."

      - name: Build Morphe patch bundle
        if: steps.decision.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon

      - name: Locate MPP
        if: steps.decision.outputs.build == 'true'
        id: mpp
        run: |
          set -euo pipefail
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' -print -quit)"
          test -n "$MPP"
          echo "path=$MPP" >> "$GITHUB_OUTPUT"

      - name: Install pinned Morphe Desktop and APKEditor
        if: steps.decision.outputs.build == 'true'
        run: |
          set -euo pipefail

          curl -fL --retry 4             -o morphe.jar             "https://github.com/MorpheApp/morphe-desktop/releases/download/${MORPHE_VERSION}/morphe-desktop-${MORPHE_VERSION#v}-all.jar"
          echo "${MORPHE_SHA256}  morphe.jar" | sha256sum -c -

          curl -fL --retry 4             -o APKEditor.jar             "https://github.com/REAndroid/APKEditor/releases/download/V${APKEDITOR_VERSION}/APKEditor-${APKEDITOR_VERSION}.jar"

      - name: Prepare universal upstream APK
        if: steps.decision.outputs.build == 'true'
        env:
          SOURCE_DIR: ${{ steps.upstream.outputs.dir }}
          BASE_APK: ${{ steps.upstream.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p dist merge-upstream

          while IFS= read -r apk; do
            cp "$apk" "merge-upstream/$(basename "$apk")"
          done < <(find "$SOURCE_DIR" -maxdepth 1 -type f -name '*.apk' -print | sort)

          COUNT="$(find merge-upstream -maxdepth 1 -type f -name '*.apk' | wc -l)"
          echo "Upstream APK count: $COUNT"

          if [[ "$COUNT" -gt 1 ]]; then
            "$JAVA_HOME/bin/java" -jar APKEditor.jar m               -i merge-upstream               -o dist/upstream-universal.apk
          else
            cp "$BASE_APK" dist/upstream-universal.apk
          fi

          BADGING="$(aapt dump badging dist/upstream-universal.apk | head -n1)"
          echo "$BADGING"
          grep -q "name='${PACKAGE_NAME}'" <<< "$BADGING"
          grep -q "versionName='${{ steps.upstream.outputs.version }}'" <<< "$BADGING"

      - name: Apply required patches
        if: steps.decision.outputs.build == 'true'
        id: patch
        continue-on-error: true
        env:
          MPP: ${{ steps.mpp.outputs.path }}
        run: |
          set -euo pipefail

          "$JAVA_HOME/bin/java" -jar morphe.jar patch             -p "$MPP"             --force             --exclusive             -e "Fix install conflict with stock VK"             -e "Bypass native signature check"             -e "Disable in-app update"             -e "Remove video ads"             -e "Remove clip ads"             -e "Filter clip feed ads"             -e "Block midroll ads"             -e "Filter Clips SDK ads"             -e "Block deep midroll ads"             -e "Hide home showcase ads"             -e "Disable video ad repository"             -e "Hide profile ad-free promo"             -e "Hide promoted banner content"             -e "Disable ad pixel tracking"             --bytecode-mode STRIP_FAST             --unsigned             -r dist/patch-result.json             -o dist/unsigned-patched.apk             dist/upstream-universal.apk

      - name: Validate Morphe result and patched payload
        if: steps.decision.outputs.build == 'true' && steps.patch.outcome == 'success'
        id: static_gate
        continue-on-error: true
        run: |
          set -euo pipefail

          jq -e '((.patchingSteps // []) | length) > 0 and all(.patchingSteps[]?; .success == true) and ((.failedPatches // []) | length == 0)' dist/patch-result.json >/dev/null

          for patch in             "Fix install conflict with stock VK"             "Bypass native signature check"             "Disable in-app update"             "Remove video ads"             "Remove clip ads"             "Filter clip feed ads"             "Block midroll ads"             "Filter Clips SDK ads"             "Block deep midroll ads"             "Hide home showcase ads"             "Disable video ad repository"             "Hide profile ad-free promo"             "Hide promoted banner content"             "Disable ad pixel tracking"; do
            jq -e --arg patch "$patch"               'any(.appliedPatches[]?; .name == $patch)'               dist/patch-result.json >/dev/null               || { echo "Required patch missing from Morphe report: $patch" >&2; exit 1; }
          done

          aapt dump xmltree dist/unsigned-patched.apk AndroidManifest.xml > dist/manifest-xmltree.txt
          python ci/verify_manifest.py dist/manifest-xmltree.txt
          python ci/verify_patched_apk.py             dist/unsigned-patched.apk             --json-out dist/static-gate.json

      - name: Open compatibility issue on gate failure
        if: steps.decision.outputs.build == 'true' && (steps.patch.outcome == 'failure' || steps.static_gate.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          VERSION_CODE: ${{ steps.upstream.outputs.version_code }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          STATIC_OUTCOME: ${{ steps.static_gate.outcome }}
        run: |
          set -euo pipefail

          TITLE="Compatibility: VK Video $VERSION ($VERSION_CODE)"
          EXISTING="$(gh issue list             --repo "$GITHUB_REPOSITORY"             --state open             --search "$TITLE in:title"             --json number             --jq '.[0].number // empty')"

          PATCH_DETAILS=""
          if [[ -s dist/patch-result.json ]]; then
            PATCH_DETAILS="$(jq -r '
              if (.failedPatches | length) == 0 then
                "No failed patches recorded."
              else
                .failedPatches[] | "- " + (.patch.name // "unknown") + ": " + (.reason // "unknown")
              end
            ' dist/patch-result.json 2>/dev/null || true)"
          fi

          STATIC_DETAILS=""
          if [[ -s dist/static-gate.json ]]; then
            STATIC_DETAILS="$(jq -r '
              if (.failures | length) == 0 then
                "No static failures recorded."
              else
                .failures[] | "- " + .
              end
            ' dist/static-gate.json 2>/dev/null || true)"
          fi

          BODY="Automated compatibility gate failed for VK Video **$VERSION** (versionCode **$VERSION_CODE**).

          Morphe patch step: **$PATCH_OUTCOME**
          Static post-patch gate: **$STATIC_OUTCOME**

          **Morphe details**
          ${PATCH_DETAILS:-No patch report was produced.}

          **Static gate details**
          ${STATIC_DETAILS:-No static gate report was produced.}

          The upstream package and VK signing certificate were verified before patching. No APK release was published.

          Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

      - name: Stop after compatibility failure
        if: steps.decision.outputs.build == 'true' && (steps.patch.outcome == 'failure' || steps.static_gate.outcome == 'failure')
        run: exit 1

      - name: Decode signing keystore
        if: steps.decision.outputs.build == 'true' && steps.patch.outcome == 'success' && steps.static_gate.outcome == 'success' && env.HAS_SIGNING == 'true'
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > signing.jks
          test -s signing.jks

      - name: Sign and verify final APK
        if: steps.decision.outputs.build == 'true' && steps.patch.outcome == 'success' && steps.static_gate.outcome == 'success' && env.HAS_SIGNING == 'true'
        id: signed
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          OUT="dist/VK-Video-${VERSION}-patched.apk"
          ALIGNED="dist/aligned-patched.apk"

          zipalign -f -p 4 dist/unsigned-patched.apk "$ALIGNED"

          apksigner sign             --ks signing.jks             --ks-pass env:STORE_PASSWORD             --ks-key-alias "$KEY_ALIAS"             --key-pass env:KEY_PASSWORD             --v1-signing-enabled false             --v2-signing-enabled false             --v3-signing-enabled true             --v4-signing-enabled false             --out "$OUT"             "$ALIGNED"

          zipalign -c -p 4 "$OUT"
          apksigner verify --verbose --print-certs "$OUT"

          CERT="$(apksigner verify --print-certs "$OUT"             | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'             | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          [[ "$CERT" == "${PROJECT_CERT_SHA256}" ]]

          BADGING="$(aapt dump badging "$OUT" | head -n1)"
          echo "$BADGING"
          grep -q "name='${PACKAGE_NAME}'" <<< "$BADGING"
          grep -q "versionName='${VERSION}'" <<< "$BADGING"

          # Repeat the static gate on the exact signed bytes that will be published.
          python ci/verify_patched_apk.py             "$OUT"             --json-out dist/final-gate.json

          sha256sum "$OUT" | tee "dist/VK-Video-${VERSION}-patched.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Build release metadata
        if: steps.decision.outputs.build == 'true' && steps.patch.outcome == 'success' && steps.static_gate.outcome == 'success'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          VERSION_CODE: ${{ steps.upstream.outputs.version_code }}
          SOURCE: ${{ steps.upstream.outputs.source }}
        run: |
          set -euo pipefail

          PATCH_VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1)"

          jq -n             --arg package "${PACKAGE_NAME}"             --arg version "$VERSION"             --argjson version_code "$VERSION_CODE"             --arg source "$SOURCE"             --arg patch_bundle_version "$PATCH_VERSION"             --arg morphe_version "${MORPHE_VERSION}"             --arg apkeditor_version "${APKEDITOR_VERSION}"             --arg project_certificate_sha256 "${PROJECT_CERT_SHA256}"             --arg workflow_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"             '{
              package: $package,
              version_name: $version,
              version_code: $version_code,
              upstream_source: $source,
              patch_bundle_version: $patch_bundle_version,
              bytecode_mode: "STRIP_FAST",
              native_target: "arm64-v8a/libvkcore.so",
              signing: {
                scheme_v1: false,
                scheme_v2: false,
                scheme_v3: true,
                scheme_v4: false,
                certificate_sha256: $project_certificate_sha256
              },
              tools: {
                morphe: $morphe_version,
                apkeditor: $apkeditor_version
              },
              workflow_run: $workflow_run
            }' > dist/build-metadata.json

      - name: Upload build diagnostics
        if: steps.decision.outputs.build == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vk-video-${{ steps.upstream.outputs.version }}-${{ steps.upstream.outputs.version_code }}-build
          path: |
            upstream.json
            dist/build-metadata.json
            dist/patch-result.json
            dist/static-gate.json
            dist/final-gate.json
            dist/manifest-xmltree.txt
            dist/VK-Video-*-patched.sha256
            patches/build/libs/*.mpp
          if-no-files-found: warn

      - name: Publish clean GitHub Release
        if: steps.decision.outputs.build == 'true' && steps.patch.outcome == 'success' && steps.static_gate.outcome == 'success' && env.HAS_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          VERSION_CODE: ${{ steps.upstream.outputs.version_code }}
          SOURCE: ${{ steps.upstream.outputs.source }}
          TAG: ${{ steps.decision.outputs.tag }}
          APK: ${{ steps.signed.outputs.apk }}
        run: |
          set -euo pipefail

          PUBLISH_APK="dist/VK-Video-${TAG}-patched.apk"
          cp "$APK" "$PUBLISH_APK"

          cat > dist/release-notes.md <<EOF
          ## VK Video $TAG

          Готовый подписанный ARM64 APK.

          - Android version: **$VERSION**
          - versionCode: **$VERSION_CODE**
          - upstream: **$SOURCE**
          - совместная установка с обычным VK
          - отключена встроенная проверка обновлений VK Video
          - применён текущий профиль удаления рекламы
          - Morphe STRIP_FAST → zipalign → APK Signature Scheme v3
          - статические compatibility gates пройдены

          В Release намеренно публикуется только APK. Служебные отчёты остаются в GitHub Actions.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Refusing to replace immutable assets."
            exit 1
          fi

          gh release create "$TAG" "$PUBLISH_APK#VK Video patched APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "VK Video $TAG — patched APK" \
            --notes-file dist/release-notes.md \
            --latest

      - name: Advance verified baseline
        if: steps.decision.outputs.build == 'true' && steps.patch.outcome == 'success' && steps.static_gate.outcome == 'success' && env.HAS_SIGNING == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          VERSION_CODE: ${{ steps.upstream.outputs.version_code }}
          TAG: ${{ steps.decision.outputs.tag }}
        run: |
          set -euo pipefail

          TODAY="$(date -u +%F)"
          jq \
            --arg version "$VERSION" \
            --argjson version_code "$VERSION_CODE" \
            --arg tag "$TAG" \
            --arg verified_at "$TODAY" \
            '.version_name = $version
             | .version_code = $version_code
             | .release_tag = $tag
             | .verified_at = $verified_at
             | .notes = "Automated release passed all compatibility gates."' \
            ci/baseline.json > ci/baseline.json.tmp
          mv ci/baseline.json.tmp ci/baseline.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/baseline.json
          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: advance verified baseline to $TAG"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Signing setup reminder
        if: steps.decision.outputs.build == 'true' && steps.patch.outcome == 'success' && steps.static_gate.outcome == 'success' && env.HAS_SIGNING != 'true'
        run: |
          echo "::warning::All compatibility gates passed, but Android signing secrets are not configured. No public APK release was created."
