name: Build

# Build-only. Versions are cut by hand (0.30.41, 0.30.42, ...) and released manually, so this
# workflow must never create a tag or a release. It exists to prove the tree compiles and to hand
# back the .mpp it produced.

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Build
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew generatePatchesList buildAndroid --no-daemon

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: patches-bundle
          path: patches/build/libs/patches-*.mpp
          if-no-files-found: error
