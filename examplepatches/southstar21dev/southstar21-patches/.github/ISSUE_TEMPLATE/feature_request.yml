name: Feature request
description: One new idea for the supported apps. One idea per issue.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you start**

        - **One idea per issue.** Several ideas in one issue get closed; open one each.
        - Only Instagram, YouTube Music and Spotify. Requests for other apps are closed.
        - Something broken isn't a feature: use the [bug report](https://github.com/southstar21dev/southstar21-patches/issues/new?template=bug_report.yml) instead.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Instagram
        - YouTube Music
        - Spotify
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What should it do?
      description: Describe the one change you want. Screenshots or a video of something similar help a lot.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What does it fix or make better for you?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues and this isn't a duplicate.
          required: true
        - label: This issue asks for one thing only.
          required: true
