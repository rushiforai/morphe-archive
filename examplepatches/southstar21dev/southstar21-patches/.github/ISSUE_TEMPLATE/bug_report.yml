name: Bug report
description: Something in a patch doesn't work as it should, on a supported app version.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you start**

        - Search [open and closed issues](https://github.com/southstar21dev/southstar21-patches/issues?q=is%3Aissue) first. Duplicates get closed.
        - One bug per issue.
        - Only the app versions listed in the [README](https://github.com/southstar21dev/southstar21-patches#patches) are supported. Update before reporting.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Instagram
        - YouTube Music
        - Spotify
    validations:
      required: true
  - type: dropdown
    id: patch
    attributes:
      label: Patch
      description: Pick every patch involved, or "Not sure".
      multiple: true
      options:
        - Liquid Glass navigation bar
        - Conscious gate
        - Disable Reels
        - Hide ads
        - View profile picture
        - Hide navigation buttons
        - Hide Ask Music button
        - Disable dynamic player color
        - Settings menu
        - Not sure
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings, Apps, the app, App info.
      placeholder: "456.1.0.56.78"
    validations:
      required: true
  - type: input
    id: patches-version
    attributes:
      label: Patches version
      description: Shown in Morphe Manager under patch sources.
      placeholder: "v1.5.0"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone
      placeholder: "Samsung Galaxy A17 5G"
    validations:
      required: true
  - type: dropdown
    id: android
    attributes:
      label: Android version
      description: The glass looks different below Android 13.
      options:
        - Android 17
        - Android 16
        - Android 15
        - Android 14
        - Android 13
        - Android 12
        - Android 11 or older
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the home feed
        2. Tap the Reels tab
        3. ...
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screen recording or screenshots
      description: Required for anything visual. Drag files into the box. Hide your username and other people's content if you like.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. For crashes, run `adb logcat -d > log.txt` right after it happens and attach the file.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues and this isn't a duplicate.
          required: true
        - label: I'm on the app version the README lists, patched with the latest patches.
          required: true
        - label: This issue is about one bug only.
          required: true
