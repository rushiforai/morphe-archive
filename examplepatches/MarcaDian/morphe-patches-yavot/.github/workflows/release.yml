name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    name: Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout yavot
        uses: actions/checkout@v7
        with:
          path: morphe-patches-yavot
          fetch-depth: 0

      - name: Checkout base morphe-patches
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches
          ref: dev
          path: morphe-patches

      - name: Checkout morphe-patcher
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patcher
          path: morphe-patcher

      - name: Checkout morphe-patches-library
        uses: actions/checkout@v7
        with:
          repository: MorpheApp/morphe-patches-library
          ref: dev
          path: morphe-patches-library

      - name: Setup Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install npm dependencies
        working-directory: morphe-patches-yavot
        run: npm install

      # Populate base's intermediates dirs that the yavot extension compileOnly's against.
      # Only the extension classes are needed, the patch code of yavot is independent of base.
      - name: Precompile base morphe-patches extension classes
        working-directory: morphe-patches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :extensions:youtube:compileReleaseKotlin \
                    :extensions:youtube:compileReleaseJavaWithJavac \
                    --no-daemon --stacktrace

      - name: Release
        working-directory: morphe-patches-yavot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
