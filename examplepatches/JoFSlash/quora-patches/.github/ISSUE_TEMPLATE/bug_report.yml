name: Bug report
description: A patch doesn't work, hides the wrong thing, or the app crashes.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please [search the existing issues](https://github.com/JoFSlash/quora-patches/issues?q=label%3Abug) first; the [contributing guide](https://github.com/JoFSlash/quora-patches/blob/main/CONTRIBUTING.md) explains what helps most.
  - type: input
    id: patch
    attributes:
      label: Patch
      description: The patch that misbehaves, by its name in Morphe Manager. Write "app crashes" if you don't know which one.
      placeholder: Hide Quora+ answers
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happens
      description: What you expected, what happened instead, and how to get there (which page or tab). Screenshots help a lot.
    validations:
      required: true
  - type: dropdown
    id: quora-version
    attributes:
      label: Quora version
      options:
        - "3.2.42"
        - Other (write it below)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Patches and Morphe Manager versions
      description: Shown in Morphe Manager. Add the Quora version here if you picked "Other".
      placeholder: "patches 1.2.0, Morphe Manager 1.20.0"
    validations:
      required: true
  - type: textarea
    id: patches
    attributes:
      label: Info from Patch settings
      description: >-
        Optional, but it helps a lot. In the patched app, long-press the Home tab, then tap
        "Report a problem": it copies the Quora and Android version, the patches that are on and the
        page check result. Paste it here.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Crash log
      description: Optional. For crashes, the output of `adb logcat | grep -E "AndroidRuntime|JoFSlashPatches"`.
      render: shell
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you send
      options:
        - label: I searched the open and closed issues and this is not a duplicate.
          required: true
        - label: The problem is still there with the latest release of the patches.
          required: true
