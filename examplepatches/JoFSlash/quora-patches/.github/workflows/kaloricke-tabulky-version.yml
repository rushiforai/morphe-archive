name: Kalorické Tabulky version

# Once a day, looks for a Kalorické Tabulky version on Google Play that this bundle doesn't support yet, and
# tries it: app-version.yml does the work, with the settings in .github/apps/kaloricke-tabulky.json. Run it by
# hand with a version to try that one, for example after uploading its file to JoFSlash/morphe-apks.

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Kalorické Tabulky version to try (empty: the newest on Google Play)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read

jobs:
  version:
    uses: ./.github/workflows/app-version.yml
    secrets: inherit
    with:
      app: kaloricke-tabulky
      version: ${{ inputs.version || '' }}
