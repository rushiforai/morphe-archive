name: Quora version

# Once a day, looks for a Quora version on APKMirror that this bundle doesn't support yet.
# For a new version it:
#   1. gets the APKM (from the private JoFSlash/quora-apks if it is there, else from APKMirror,
#      checked to be Quora's own and then kept in quora-apks),
#   2. patches it with every patch and starts it on an emulator,
#   3. opens a pull request that lists the version as supported, or an issue that says what failed.
# A scheduled run tries APKMirror once per version: when an issue or pull request for the version
# exists (open or closed), it leaves the version alone. Run the workflow by hand with the version
# to try again, for example after uploading the APKM:
#   gh release create quora-<version> -R JoFSlash/quora-apks --title "Quora <version>" quora-<version>.apkm
# QUORA_APKS_TOKEN needs read and write access to the contents of JoFSlash/quora-apks.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Quora version to try (empty: the newest on APKMirror)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read

jobs:
  check:
    name: Look for a new Quora version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      play: ${{ steps.check.outputs.play }}
      supported: ${{ steps.check.outputs.supported }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Pull requests go to dev, so they start from dev (or from the branch a test run is on).
          ref: ${{ github.ref_name == 'main' && 'dev' || github.ref_name }}

      - name: Check
        id: check
        # A version asked for by hand is tried even when APKMirror can't be read right now.
        continue-on-error: ${{ inputs.version != '' }}
        run: python3 .github/scripts/watch_quora_version.py --github-output "$GITHUB_OUTPUT"

      # Once per version (an issue that was closed isn't opened again). This issue doesn't stop the
      # scheduled runs from trying the version once APKMirror has it, and the pull request that
      # adds the version closes it.
      - name: Say when only Google Play has a newer version
        if: steps.check.outputs.play_only != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PLAY: ${{ steps.check.outputs.play_only }}
          SUPPORTED: ${{ steps.check.outputs.supported }}
        run: |
          title="Quora $PLAY is on Google Play"
          if gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "The issue for $PLAY exists."; exit 0
          fi
          body=$(printf '%s\n\n%s\n\n%s\n```\n%s\n```\n' \
            "Quora $PLAY is on [Google Play](https://play.google.com/store/apps/details?id=com.quora.android), but not on [APKMirror](https://www.apkmirror.com/apk/quora-inc/quora/) yet. This bundle supports $SUPPORTED. Quora turns old versions away on its servers (it did with 3.2.30), so the supported version should not fall far behind." \
            "Nothing to do if APKMirror gets it soon: the Quora version workflow looks every day and opens a pull request that adds the version once every patch applies and the app starts." \
            "To add it sooner, get the APKM of $PLAY elsewhere, then upload it and run the workflow by hand with the version:" \
            "gh release create quora-$PLAY -R JoFSlash/quora-apks --title \"Quora $PLAY\" quora-$PLAY.apkm
          gh workflow run quora-version.yml -R JoFSlash/quora-patches -f version=$PLAY")
          gh issue create --title "$title" --label enhancement --body "$body"

      - name: Pick the version to try
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.check.outputs.new }}
          ASKED: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          version="${ASKED:-$NEW}"
          if [ -z "$version" ]; then echo "Nothing new."; exit 0; fi
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::Not a version: $version"; exit 1; fi
          if gh pr list --state all --search "\"Support Quora $version\" in:title" --json title --jq '.[].title' | grep -qxF "Support Quora $version"; then
            echo "A pull request for $version already exists."; exit 0
          fi
          if [ "$EVENT" = "schedule" ] && gh issue list --state all --search "\"Quora $version is out\" in:title" --json title --jq '.[].title' | grep -qxF "Quora $version is out"; then
            echo "An issue for $version exists; run the workflow by hand with the version to try again."; exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  support:
    name: Try Quora ${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PLAY: ${{ needs.check.outputs.play }}
      SUPPORTED: ${{ needs.check.outputs.supported }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Pull requests go to dev, so they start from dev (or from the branch a test run is on).
          ref: ${{ github.ref_name == 'main' && 'dev' || github.ref_name }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # Writes result= ok (checked and kept in quora-apks), blocked, missing, bad (not Quora's own),
      # keepfail (checked, but couldn't be kept), error (a tool or the script failed), or notoken;
      # and source= quora-apks or apkmirror.
      - name: Get the APKM
        id: apkm
        env:
          APKS_TOKEN: ${{ secrets.QUORA_APKS_TOKEN }}
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          check="--apksigner $tools/apksigner --aapt2 $tools/aapt2"
          out="$RUNNER_TEMP/quora.apkm"
          if [ -z "$APKS_TOKEN" ]; then echo "result=notoken" >> "$GITHUB_OUTPUT"; exit 0; fi
          if GH_TOKEN="$APKS_TOKEN" gh release download "quora-$VERSION" -R JoFSlash/quora-apks -p "quora-$VERSION.apkm" -O "$out" 2>/dev/null; then
            echo "Using the APKM from quora-apks."
            echo "source=quora-apks" >> "$GITHUB_OUTPUT"
            set +e; python3 .github/scripts/fetch_quora_apkm.py --verify-only "$out" "$VERSION" $check; code=$?; set -e
            case $code in
              0) echo "result=ok" >> "$GITHUB_OUTPUT" ;;
              6) echo "result=bad" >> "$GITHUB_OUTPUT" ;;
              *) echo "result=error" >> "$GITHUB_OUTPUT" ;;
            esac
            exit 0
          fi
          echo "source=apkmirror" >> "$GITHUB_OUTPUT"
          set +e; python3 .github/scripts/fetch_quora_apkm.py "$VERSION" "$out" $check; code=$?; set -e
          case $code in
            0)
              # The asset is named after the file, and later runs look for quora-<version>.apkm.
              cp "$out" "$RUNNER_TEMP/quora-$VERSION.apkm"
              if GH_TOKEN="$APKS_TOKEN" gh release create "quora-$VERSION" -R JoFSlash/quora-apks --title "Quora $VERSION" \
                  --notes "Quora $VERSION APKM from APKMirror, checked to be signed by Quora. Added by the Quora version workflow." \
                  "$RUNNER_TEMP/quora-$VERSION.apkm"; then
                echo "result=ok" >> "$GITHUB_OUTPUT"
              else
                echo "result=keepfail" >> "$GITHUB_OUTPUT"
              fi ;;
            4) echo "result=blocked" >> "$GITHUB_OUTPUT" ;;
            5) echo "result=missing" >> "$GITHUB_OUTPUT" ;;
            6) echo "result=bad" >> "$GITHUB_OUTPUT" ;;
            *) echo "result=error" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build
        if: steps.apkm.outputs.result == 'ok'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Get the Morphe CLI
        if: steps.apkm.outputs.result == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$(cat .github/morphe-cli-version)" -R MorpheApp/morphe-cli -p 'morphe-desktop-*-all.jar' -O "$RUNNER_TEMP/morphe-cli.jar"

      - name: Enable KVM
        if: steps.apkm.outputs.result == 'ok'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator
        if: steps.apkm.outputs.result == 'ok'
        uses: ./.github/actions/install-emulator
        with:
          api-level: 34

      - name: Patch, install and start
        if: steps.apkm.outputs.result == 'ok'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: python3 .github/scripts/check_quora_version.py "$RUNNER_TEMP/quora.apkm" --cli "$RUNNER_TEMP/morphe-cli.jar" --install --expect-login --adb adb > "$RUNNER_TEMP/check.txt" 2>&1 || touch "$RUNNER_TEMP/check.failed"

      - name: Open a pull request or an issue
        if: always() && steps.apkm.outputs.result != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.apkm.outputs.result }}
          SOURCE: ${{ steps.apkm.outputs.source }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f "$RUNNER_TEMP/check.txt" ] && cat "$RUNNER_TEMP/check.txt"
          report=$(tail -n 40 "$RUNNER_TEMP/check.txt" 2>/dev/null || true)
          why=""
          if [ "$RESULT" = "ok" ] && [ -f "$RUNNER_TEMP/check.txt" ] && [ ! -f "$RUNNER_TEMP/check.failed" ]; then
            set +e; python3 .github/scripts/add_quora_version.py "$VERSION"; code=$?; set -e
            if [ $code -eq 3 ]; then echo "$VERSION is already listed."; exit 0; fi
            if [ $code -ne 0 ]; then
              why="Every patch applies and the app starts, but listing the version in Constants.kt failed (add_quora_version.py exited with $code). Add \`AppTarget(version = \"$VERSION\")\` by hand."
            else
              branch="support/quora-$VERSION"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git checkout -b "$branch"
              git commit -am "feat: Support Quora $VERSION"
              body=$(printf '%s\n\n%s\n\n```\n%s\n```\n\n%s\n' \
                "Quora $VERSION is on APKMirror. Every patch applies, and the patched app starts on an emulator and loads Quora's sign-in page ([run]($RUN_URL))." \
                "Before merging, try the feed on a phone: the page patches can't be checked without a signed-in account." \
                "$report" \
                "Opened by the Quora version workflow. Checks don't run on pull requests it opens; this run tested it.")
              play_issue=$(gh issue list --state open --search "\"Quora $VERSION is on Google Play\" in:title" --json number,title \
                --jq ".[] | select(.title == \"Quora $VERSION is on Google Play\") | .number" | head -1)
              if [ -n "$play_issue" ]; then body="$body
          Closes #$play_issue"; fi
              if git push -f origin "$branch" && gh pr create --base dev --head "$branch" --title "Support Quora $VERSION" --body "$body"; then
                exit 0
              fi
              why="Every patch applies and the app starts, but opening the pull request failed. The change is on the branch \`$branch\` if it was pushed; see the run log."
            fi
          fi
          if [ -z "$why" ]; then
            case "$RESULT" in
              blocked) why="APKMirror (or the network) turned the automatic download away. Download the APKM by hand and upload it, then run the Quora version workflow by hand with version $VERSION:
          \`\`\`
          gh release create quora-$VERSION -R JoFSlash/quora-apks --title \"Quora $VERSION\" quora-$VERSION.apkm
          \`\`\`" ;;
              missing) why="APKMirror has no APK bundle (APKM) of $VERSION yet. Wait until it has, or upload one you have, then run the Quora version workflow by hand with version $VERSION:
          \`\`\`
          gh release create quora-$VERSION -R JoFSlash/quora-apks --title \"Quora $VERSION\" quora-$VERSION.apkm
          \`\`\`" ;;
              bad) if [ "$SOURCE" = "quora-apks" ]; then
                     why="**The APKM in quora-apks isn't Quora's own** (wrong package, version or signature). Delete the release \`quora-$VERSION\` in JoFSlash/quora-apks: the emulator test on pull requests would use it."
                   else
                     why="**The APKM from APKMirror isn't Quora's own** (wrong package, version or signature). It wasn't used or kept. Check APKMirror by hand."
                   fi ;;
              keepfail) why="The APKM from APKMirror is Quora's own, but keeping it in quora-apks failed. Check that QUORA_APKS_TOKEN can write to JoFSlash/quora-apks, then run the workflow by hand." ;;
              error) why="Getting or checking the APKM failed for another reason (a tool or the script). See the run log." ;;
              notoken) why="The QUORA_APKS_TOKEN secret isn't set, so the APKM couldn't be fetched or kept." ;;
              *) why="Patching or starting the app failed:
          \`\`\`
          $report
          \`\`\`" ;;
            esac
          fi
          title="Quora $VERSION is out"
          body=$(printf '%s\n\n%s\n\n%s\n' \
            "Quora $VERSION is on [APKMirror](https://www.apkmirror.com/apk/quora-inc/quora/). This bundle supports $SUPPORTED.${PLAY:+ Google Play has $PLAY.}" \
            "$why" \
            "[Workflow run]($RUN_URL)")
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label enhancement --body "$body"
          fi
