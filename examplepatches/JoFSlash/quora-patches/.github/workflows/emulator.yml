name: Emulator test

# Patches Quora with every patch, installs it on Android 15, 16 and 17 emulators and checks
# that it starts without a crash or errors from the patches and loads Quora's sign-in page. When
# a check fails, the original Quora is tried the same way, to tell a broken patch from an Android
# version Quora itself doesn't work on. The feed needs a signed-in account; the weekly feed test
# (feed-test.yml) signs in with a test account and checks the page patches there.
#
# Quora's APK can't be in this public repository. It comes from the private repository
# JoFSlash/morphe-apks, read with the APKS_TOKEN secret (or QUORA_APKS_TOKEN, its old name; a fine-grained token with access
# to that repository's contents only: read and write, since the Quora version workflow keeps new
# APKMs there). Without the secret the test is skipped, except when the release (or the Morphe CLI
# workflow) runs it: there a skipped test would let an untested bundle through, so it fails.

on:
  # Only for pull requests that change this app's patches, this test or the shared build.
  pull_request:
    paths:
      - 'patches/src/main/kotlin/app/jofslash/patches/quora/**'
      - 'extensions/quora/**'
      - '.github/workflows/emulator.yml'
      - '.github/workflows/emulator-app.yml'
      - '.github/apps/quora.json'
      - '.github/scripts/check_app.py'
      - '.github/scripts/apps/quora.py'
      - '.github/actions/install-emulator/**'
      - '.github/morphe-cli-version'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'patches/build.gradle.kts'
  workflow_dispatch:
  workflow_call:
    inputs:
      required:
        description: 'Fail instead of skipping when APKS_TOKEN is missing'
        type: boolean
        default: true
      cli-version:
        description: 'Morphe CLI release to use (empty: the one in .github/morphe-cli-version)'
        type: string
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  test:
    # emulator-app.yml has a job that records a pass and needs to write; it only runs when
    # "record" is on, which it isn't here.
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/emulator-app.yml
    secrets: inherit
    with:
      app: quora
      # A pull request or a run by hand skips the test when APKS_TOKEN is missing; a workflow that
      # calls this one (required defaults to true there) fails instead.
      required: ${{ inputs.required == true }}
      cli-version: ${{ inputs.cli-version || '' }}
