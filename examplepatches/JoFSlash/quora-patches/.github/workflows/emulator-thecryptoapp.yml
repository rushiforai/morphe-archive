name: The Crypto App emulator test

# Patches The Crypto App with every patch, installs it on Android 10 to 17 emulators and checks that
# it starts without a crash or errors from the patches and shows its own screen, then opens the
# patches' "Crypto Alerts" screen. When a check fails, the original app is tried the same way, to
# tell a broken patch from an Android version the app itself doesn't work on. Alerts firing, charts
# and the portfolio need live prices and a person, so they are tried by hand on a phone.
#
# The APKM is the bundle with arm64-v8a and x86_64 libraries, so the x86_64 emulator runs it
# natively.
#
# The APK can't be in this public repository. It comes from the private repository
# JoFSlash/morphe-apks, read with the APKS_TOKEN secret (a fine-grained token
# with access to that repository's contents only: read here, read and write for The Crypto App's
# version workflow, which keeps new APKMs there). Without the secret the test is skipped,
# except when the release runs it: there a skipped test would let an untested bundle through, so
# it fails.

on:
  # Only for pull requests that change this app's patches, this test or the shared build.
  pull_request:
    paths:
      - 'patches/src/main/kotlin/app/jofslash/patches/thecryptoapp/**'
      - 'extensions/thecryptoapp/**'
      - '.github/workflows/emulator-thecryptoapp.yml'
      - '.github/workflows/emulator-app.yml'
      - '.github/apps/thecryptoapp.json'
      - '.github/scripts/check_app.py'
      - '.github/scripts/apps/thecryptoapp.py'
      - '.github/actions/install-emulator/**'
      - '.github/morphe-cli-version'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'patches/build.gradle.kts'
  workflow_dispatch:
  workflow_call:
    inputs:
      required:
        description: 'Fail instead of skipping when APKS_TOKEN is missing'
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    # emulator-app.yml has a job that records a pass and needs to write; it only runs when
    # "record" is on, which it isn't here.
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/emulator-app.yml
    secrets: inherit
    with:
      app: thecryptoapp
      # A pull request or a run by hand skips the test when APKS_TOKEN is missing; a workflow that
      # calls this one (required defaults to true there) fails instead.
      required: ${{ inputs.required == true }}
