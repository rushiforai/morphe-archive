name: IMDb version

# Once a day, looks for an IMDb version on APKPure that this bundle doesn't support yet, and
# tries it: app-version.yml does the work, with the settings in .github/apps/imdb.json. Run it by
# hand with a version to try that one, for example after uploading its file to JoFSlash/morphe-apks.

on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'IMDb version to try (empty: the newest on APKPure)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read

jobs:
  version:
    uses: ./.github/workflows/app-version.yml
    secrets: inherit
    with:
      app: imdb
      version: ${{ inputs.version || '' }}
