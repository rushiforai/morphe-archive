name: Google Health version

# Once a day, looks for a Google Health version on APKMirror that this bundle doesn't support yet, and
# tries it: app-version.yml does the work, with the settings in .github/apps/google-health.json. Run it by
# hand with a version to try that one, for example after uploading its file to JoFSlash/morphe-apks.

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Google Health version to try (empty: the newest on APKMirror)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read

jobs:
  version:
    uses: ./.github/workflows/app-version.yml
    secrets: inherit
    with:
      app: google-health
      version: ${{ inputs.version || '' }}
