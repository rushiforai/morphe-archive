name: Listonic emulator test

# Patches Listonic with every patch, installs it on Android 12L to 17 emulators and checks
# that it starts without a crash or errors from the patches and shows its own screen (the first
# screen of the onboarding). When a check fails, the original app is tried the same way, to tell a
# broken patch from an Android version the app itself doesn't work on. The lists, the ads, the sale
# campaigns and the Google sign-in are tried by hand on a phone.
#
# The app is kept as the split APKs Google Play installs (base, arm64-v8a, English and hdpi) zipped into
# an .apks. The emulator is x86_64; its Google APIs image runs the few arm64 libraries through
# Android's ARM translation, which the Android 13 image lacks.
#
# The APK can't be in this public repository. It comes from the private repository
# JoFSlash/morphe-apks, read with the APKS_TOKEN secret (a fine-grained token
# with access to that repository's contents only: read here, new versions are added there by hand,
# see listonic-version.yml). Without the secret the test is skipped,
# except when the release runs it: there a skipped test would let an untested bundle through, so
# it fails.

on:
  # Only for pull requests that change this app's patches, this test or the shared build.
  pull_request:
    paths:
      - 'patches/src/main/kotlin/app/jofslash/patches/listonic/**'
      - 'extensions/listonic/**'
      - '.github/workflows/emulator-listonic.yml'
      - '.github/workflows/emulator-app.yml'
      - '.github/apps/listonic.json'
      - '.github/scripts/check_app.py'
      - '.github/actions/install-emulator/**'
      - '.github/morphe-cli-version'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'patches/build.gradle.kts'
  workflow_dispatch:
  workflow_call:
    inputs:
      required:
        description: 'Fail instead of skipping when APKS_TOKEN is missing'
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    # emulator-app.yml has a job that records a pass and needs to write; it only runs when
    # "record" is on, which it isn't here.
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/emulator-app.yml
    secrets: inherit
    with:
      app: listonic
      # A pull request or a run by hand skips the test when APKS_TOKEN is missing; a workflow that
      # calls this one (required defaults to true there) fails instead.
      required: ${{ inputs.required == true }}
