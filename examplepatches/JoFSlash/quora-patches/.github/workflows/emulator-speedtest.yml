name: Speedtest emulator test

# Patches Speedtest by Ookla with every patch, installs it on a set of Android emulators and checks
# that it starts without a crash or errors from the patches and shows its own screen (the onboarding
# or the main screen). When a check fails, the original app is tried the same way, to tell a broken
# patch from an Android version the app itself doesn't work on. Running an actual speed test needs
# Ookla's servers and a person, so it is tried by hand on a phone.
#
# Speedtest ships as a single arm64-v8a APK (no x86_64 split), so the x86_64 emulator runs it through
# the system image's arm64 translation. google_apis x86_64 images have that from API 30 on, except
# API 33, which is why the matrix starts at API 30 and leaves 33 out (the app itself won't install
# there, patched or not).
#
# The APK can't be in this public repository. It comes from the private repository
# JoFSlash/morphe-apks, read with the APKS_TOKEN secret (a fine-grained token with access to that
# repository's contents only: read here, read and write for the Speedtest version workflow, which
# keeps new APKs there). Without the secret the test is skipped, except when the release runs it:
# there a skipped test would let an untested build through, so it fails.

on:
  # Only for pull requests that change this app's patches, this test or the shared build.
  pull_request:
    paths:
      - 'patches/src/main/kotlin/app/jofslash/patches/speedtest/**'
      - '.github/workflows/emulator-speedtest.yml'
      - '.github/workflows/emulator-app.yml'
      - '.github/apps/speedtest.json'
      - '.github/scripts/check_app.py'
      - '.github/actions/install-emulator/**'
      - '.github/morphe-cli-version'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'patches/build.gradle.kts'
  workflow_dispatch:
  workflow_call:
    inputs:
      required:
        description: 'Fail instead of skipping when APKS_TOKEN is missing'
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

jobs:
  test:
    # emulator-app.yml has a job that records a pass and needs to write; it only runs when
    # "record" is on, which it isn't here.
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/emulator-app.yml
    secrets: inherit
    with:
      app: speedtest
      # A pull request or a run by hand skips the test when APKS_TOKEN is missing; a workflow that
      # calls this one (required defaults to true there) fails instead.
      required: ${{ inputs.required == true }}
