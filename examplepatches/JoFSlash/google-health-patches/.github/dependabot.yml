version: 2
updates:
  - package-ecosystem: github-actions
    labels: []
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    labels: []
    directory: /
    schedule:
      interval: monthly
    ignore:
      # version 10.x and later may not generate release notes correctly
      # https://github.com/conventional-changelog/conventional-changelog/issues/1495
      - dependency-name: "conventional-changelog-conventionalcommits"
      # gradle-semantic-release-plugin 1.10.3 accepts semantic-release ^24 || ^25 only
      - dependency-name: "semantic-release"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    labels: []
    directory: /
    schedule:
      interval: monthly
