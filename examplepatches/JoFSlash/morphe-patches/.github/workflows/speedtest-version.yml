name: Speedtest version

# Once a day, looks for a Speedtest version on APKMirror that this bundle doesn't support yet, and
# tries it: app-version.yml does the work, with the settings in .github/apps/speedtest.json. Run it by
# hand with a version to try that one, for example after uploading its file to JoFSlash/morphe-apks.

on:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Speedtest version to try (empty: the newest on APKMirror)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: read

jobs:
  version:
    uses: ./.github/workflows/app-version.yml
    secrets: inherit
    with:
      app: speedtest
      version: ${{ inputs.version || '' }}
