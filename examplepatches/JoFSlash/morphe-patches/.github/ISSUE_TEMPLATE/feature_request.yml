name: Patch idea
description: Suggest a new patch or a change to an existing one.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please [search the existing ideas](https://github.com/JoFSlash/morphe-patches/issues?q=label%3Aenhancement) first.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        # APPS_START (written by .github/scripts/sync_apps.py from .github/apps)
        - Booking.com
        - Google Health (Fitbit)
        - IMDb
        - Kalorické Tabulky
        - Listonic
        - Quora
        - Speedtest (Ookla)
        - The Crypto App (TrustSwap)
        # APPS_END
        - Another app
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What should the patch do
      description: What you want added, hidden, changed or stopped, and where it appears in the app. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What bothers you today, and how often you run into it.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you send
      options:
        - label: I searched the open and closed issues and this is not a duplicate.
          required: true
        - label: None of the current patches already does this (see the app's README).
          required: true
