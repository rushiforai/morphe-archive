version: 2
# Pull requests go to main (the default branch), like every change.
updates:
  - package-ecosystem: github-actions
    labels: []
    directory: /
    schedule:
      interval: monthly
    # One pull request for every action. Actions often have to move together
    # (upload-artifact and download-artifact), so majors are in it too.
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    labels: []
    directory: /
    schedule:
      interval: monthly
    ignore:
      # version 10.x and later may not generate release notes correctly
      # https://github.com/conventional-changelog/conventional-changelog/issues/1495
      - dependency-name: "conventional-changelog-conventionalcommits"
      # 26 needs Node 26.13+ and swaps in a new release engine; 25 works, the release is the
      # most fragile part of the repository. Revisit once 26 has settled.
      - dependency-name: "semantic-release"
        update-types: ["version-update:semver-major"]
    # Minor and patch updates come in one pull request; a major update still
    # gets its own, so a breaking one can't hold back the others.
    groups:
      npm:
        update-types: ["minor", "patch"]

  - package-ecosystem: gradle
    labels: []
    directory: /
    schedule:
      interval: monthly
    groups:
      gradle:
        update-types: ["minor", "patch"]
