name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon
          ls -la patches/build/libs

      - name: Publish release and bundle info for Morphe Manager
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          FILE="patches-${VERSION}.mpp"
          MPP=$(ls patches/build/libs/*.mpp | grep -v -e sources -e javadoc | head -1)
          cp "$MPP" "$FILE"
          NOTES="$(git log -1 --pretty=%B | head -1)"
          gh release create "$TAG" "$FILE" --title "$TAG" --notes "$NOTES"

          cat > patches-bundle.json <<EOF
          {
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%S)",
            "description": $(printf '%s' "$NOTES" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'),
            "download_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE}",
            "signature_download_url": "",
            "version": "${VERSION}"
          }
          EOF
          sed -i 's/^          //' patches-bundle.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          git commit -m "chore: patches-bundle.json for ${TAG} [skip ci]"
          git push
