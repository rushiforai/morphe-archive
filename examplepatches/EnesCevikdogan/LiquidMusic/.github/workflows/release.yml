name: Build & Release Morphe Patches

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build patches & generate list
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :patches:generatePatchesList --no-daemon --stacktrace

      - name: Prepare release metadata
        if: github.event_name != 'pull_request'
        id: meta
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          TAG="v${VERSION}"
          MPP_FILE=$(ls patches/build/libs/patches-*.mpp | grep -v -E 'sources|javadoc' | head -n 1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "mpp_file=${MPP_FILE}" >> "$GITHUB_OUTPUT"

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%S")
          cat > patches-bundle.json <<EOF
          {
            "created_at": "${NOW}",
            "description": "LiquidMusic Morphe patches ${TAG}",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/$(basename "${MPP_FILE}")",
            "signature_download_url": "",
            "version": "${VERSION}"
          }
          EOF

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "LiquidMusic ${{ steps.meta.outputs.tag }}"
          files: |
            ${{ steps.meta.outputs.mpp_file }}
            patches-bundle.json
            patches-list.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
