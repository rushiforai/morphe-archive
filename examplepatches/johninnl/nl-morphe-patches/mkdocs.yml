site_name: Dutch App Patches
site_description: Kies patches voor Nederlandse en Belgische Android-apps en lees wat ze veranderen.
site_url: https://johninnl.github.io/nl-morphe-patches/
repo_url: https://github.com/johninnl/nl-morphe-patches
repo_name: johninnl/nl-morphe-patches
edit_uri: ''
docs_dir: docs/site
site_dir: build/docs-site
exclude_docs: |
  _meta/
  overrides/
  assets/brand/SOURCES.md
copyright: Community patches voor Morphe · Onafhankelijk van Morphe en de app-uitgevers.

theme:
  name: material
  custom_dir: docs/site/overrides
  language: nl
  font: false
  logo: assets/brand/mark-on-dark.svg
  favicon: assets/brand/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Donker / Dark
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Licht / Light
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/dutch-app-patches.css
extra_javascript:
  - assets/javascripts/app-catalogue.js
extra:
  social_image: https://johninnl.github.io/nl-morphe-patches/assets/brand/social-card.png

plugins:
  - i18n:
      docs_structure: folder
      # Shared assets fall back; check_docs_site.py requires every Markdown
      # page to have a real translation, so missing prose never passes CI.
      fallback_to_default: true
      languages:
        - locale: nl
          default: true
          name: Nederlands
          build: true
          nav_translations:
            Home: Start
            Guides: Handleidingen
            Apps: Apps
            Weather: Weer
            News and reading: Nieuws en lezen
            Traffic and navigation: Verkeer en navigatie
            Entertainment: Amusement
            Other apps: Overige apps
            Learn about tracking: Tracking begrijpen
            Trackers and services: Trackers en diensten
            Behaviour and marketing: Gedrag en marketing
            Audience and video: Publiek en video
            Consent and subscriptions: Toestemming en abonnementen
            Diagnostics and app services: Diagnose en app-diensten
            Reference: Naslag
        - locale: en
          name: English
          build: true
          site_description: Choose patches for Dutch and Belgian Android apps and see what they change.
          copyright: Community patches for Morphe · Independent of Morphe and the app publishers.
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Guides:
      - guides/index.md
      - guides/install.md
      - guides/downloads.md
      - guides/choose-patches.md
      - guides/shizuku.md
      - guides/shizuku-tv.md
      - guides/android-auto.md
      - guides/troubleshooting.md
  - Apps:
      - apps/index.md
      - Weather:
