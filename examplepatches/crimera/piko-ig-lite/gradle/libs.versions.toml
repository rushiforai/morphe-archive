[versions]
morphe-patcher = "2.0.0"
morphe-patches-library = "2.0.1-dev.1"
piko-library = "0.10.1-dev.1"
#noinspection GradleDependency
smali = "4220ae75f7"
gson = "2.14.0"
annotation = "1.9.1"
appcompat = "1.7.1"

[libraries]
morphe-patches-library = { module = "app.morphe:morphe-patches-library", version.ref = "morphe-patches-library" }
morphe-extensions-library = { module = "app.morphe:morphe-extensions-library", version.ref = "morphe-patches-library" }
# One release carries both artifacts, so they share one version.
piko-patches-library = { module = "app.crimera:piko-patches-library", version.ref = "piko-library" }
piko-extension-library = { module = "app.crimera:piko-extension-library", version.ref = "piko-library" }
annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

[plugins]
android-library = { id = "com.android.library" }
