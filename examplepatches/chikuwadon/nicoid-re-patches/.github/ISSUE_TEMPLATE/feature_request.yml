name: ⭐ 機能要望 / Feature request
description: 新機能や改善の要望を記入してください。 / Request a new feature or improvement.
title: "feat: "
labels: ["Feature request"]
body:
  - type: markdown
    attributes:
      value: |
        # nicoid Re — 機能要望 / Feature request

        投稿前に[既存の機能要望](https://github.com/chikuwadon/nicoid-re-patches/issues?q=is%3Aissue%20label%3A%22Feature%20request%22)を確認してください。
        Please check [existing feature requests](https://github.com/chikuwadon/nicoid-re-patches/issues?q=is%3Aissue%20label%3A%22Feature%20request%22) before submitting.
  - type: textarea
    id: feature-description
    attributes:
      label: 要望の内容 / Feature description
      description: |
        希望する機能や改善内容を詳しく記入してください。画像・動画・リンク・具体例などがあれば添付してください。
        Describe the feature or improvement in detail. Include images, videos, links, or examples if available.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 要望の理由・利用場面 / Motivation and use case
      description: |
        どのような場面で必要か、現在困っていること、実装によりどのように便利になるかを記入してください（任意）。
        Explain when you would use this feature, what problem you currently face, and how it would help (optional).
    validations:
      required: false
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 確認事項 / Checklist
      options:
        - label: 既存のIssue（解決済みを含む）を確認し、同じ要望がないことを確認しました。 / I checked existing issues, including closed ones, and found no duplicate.
          required: true
        - label: 内容が分かるタイトルを付けました。 / I chose a title that describes the request.
          required: true
        - label: 必須項目を記入しました。 / I provided all required information.
          required: true
