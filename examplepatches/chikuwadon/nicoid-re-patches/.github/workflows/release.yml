name: Release

# A release must be explicitly approved and manually started.
# Routine pushes are verified by verify-main.yml / private-build.yml instead.
on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: 'Type APPROVE to publish a NEW release; never rerun against an existing tag'
        required: true
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_git_tag: ${{ steps.release.outputs.new_release_git_tag }}
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
      && inputs.release_confirmation == 'APPROVE'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate workflow action pinning and release safeguards
        run: python3 porting/tests/VerifyGithubActionsSecurity.py

      - name: Check published source baseline and metadata
        run: python3 porting/tests/VerifyReleaseBaseline.py

      - name: Check legacy list interactions and download history
        run: |
          revision=porting/revisions/v1.10.0
          mkdir -p /tmp/nicoid-current-tests
          javac --release 8 -d /tmp/nicoid-current-tests "$revision"/src/e/e/a/{GestureRules110,GestureDefaults113,TabOrder113,PlaybackOrder110,SearchBounds110,SeriesPages110,Mp4Playlist115}.java "$revision"/test/{CoreRegression,Mp4PlaylistTest}.java
          java -cp /tmp/nicoid-current-tests e.e.a.CoreRegression
          java -cp /tmp/nicoid-current-tests e.e.a.Mp4PlaylistTest
          curl -fLs --retry 2 https://repo.maven.apache.org/maven2/org/eclipse/jdt/ecj/3.38.0/ecj-3.38.0.jar -o /tmp/nicoid-ecj.jar
          echo "97c566b120009c203a2fc8b291f4a9adbc171cf1ccb70f06f6b4e1828c00ce8e  /tmp/nicoid-ecj.jar" | sha256sum -c -
          python3 "$revision/test/download_files_test.py" /tmp/nicoid-ecj.jar
          python3 "$revision/test/comment_continuity_test.py" /tmp/nicoid-ecj.jar

      - name: Check video count order and precision
        run: |
          javac -d /tmp/nicoid-count-tests extensions/extension/src/main/java/e/e/a/VideoCountRules.java porting/tests/VideoCountRulesTest.java
          java -cp /tmp/nicoid-count-tests e.e.a.VideoCountRulesTest
      - name: Check authenticated Cast HLS relay
        run: |
          javac -d /tmp/nicoid-cast-tests extensions/extension/src/main/java/e/e/a/CastHls.java extensions/extension/src/main/java/e/e/a/CastRelay.java extensions/extension/src/main/java/e/e/a/CastDiagnostics.java porting/tests/cast-stubs/e/e/a/*.java porting/tests/CastRelayTest.java
          java -cp /tmp/nicoid-cast-tests e.e.a.CastRelayTest
      - name: Test HLS transfer size planning
        run: |
          javac -d /tmp/nicoid-transfer-tests extensions/extension/src/main/java/e/e/a/CacheTransferPlan.java porting/tests/CacheTransferPlanTest.java
          java -cp /tmp/nicoid-transfer-tests e.e.a.CacheTransferPlanTest
      - name: Test performance policies
        run: |
          mkdir -p /tmp/nicoid-performance-tests
          javac -d /tmp/nicoid-performance-tests extensions/extension/src/main/java/e/e/a/PageCache.java extensions/extension/src/main/java/e/e/a/ImageDiskCache.java extensions/extension/src/main/java/e/e/a/NetworkTask.java porting/tests/PerformanceTest.java
          java -cp /tmp/nicoid-performance-tests e.e.a.PerformanceTest
      - name: Check paid metadata and badge reuse
        run: |
          curl -fLs --retry 2 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/nicoid-json.jar
          javac -cp /tmp/nicoid-json.jar -d /tmp/nicoid-paid-tests $(find porting/tests/paid-stubs -name '*.java') extensions/extension/src/main/java/e/e/a/PaidVideos.java extensions/extension/src/main/java/e/e/a/UiStrings.java porting/tests/PaidVideosTest.java
          java -cp /tmp/nicoid-paid-tests:/tmp/nicoid-json.jar e.e.a.PaidVideosTest porting/tests/paid-list-fixture.json porting/tests/paid-watch-fixture.json
      - name: Check comment storage failure recovery
        run: |
          javac --release 8 -d /tmp/nicoid-comment-storage $(find porting/tests/comment-storage-fixtures -name '*.java') extensions/extension/src/main/java/e/e/a/CacheComments.java
          java -cp /tmp/nicoid-comment-storage e.e.a.CommentStorageTest
      - name: Check content filtering and history deletion
        run: |
          javac -d /tmp/nicoid-content-tests extensions/extension/src/main/java/e/e/a/ContentFilterRules.java extensions/extension/src/main/java/e/e/a/HistoryRules.java porting/tests/ContentHistoryRulesTest.java
          java -cp /tmp/nicoid-content-tests e.e.a.ContentHistoryRulesTest
      - name: Check development data and interaction policies
        run: |
          android_jar=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -n 1)
          javac --release 8 -cp "$android_jar" -d /tmp/nicoid-development-tests $(find extensions/extension/src/main/java -name '*.java')
          javac --release 8 -cp /tmp/nicoid-development-tests:/tmp/nicoid-json.jar -d /tmp/nicoid-development-tests porting/tests/DevelopmentDataTest.java porting/tests/WatchRequestHeadersTest.java porting/tests/PostingRulesTest.java porting/tests/SearchBoundsTest.java porting/tests/StorageImprovementsTest.java
          java -cp /tmp/nicoid-development-tests e.e.a.WatchRequestHeadersTest
          java -Duser.timezone=Asia/Tokyo -cp /tmp/nicoid-development-tests:/tmp/nicoid-json.jar e.e.a.DevelopmentDataTest
          java -cp /tmp/nicoid-development-tests:/tmp/nicoid-json.jar e.e.a.PostingRulesTest
          java -cp /tmp/nicoid-development-tests:/tmp/nicoid-json.jar e.e.a.SearchBoundsTest
          java -cp /tmp/nicoid-development-tests:/tmp/nicoid-json.jar e.e.a.StorageImprovementsTest
          bash porting/tests/audit136-model.sh > /tmp/nicoid-model-regressions.log 2>&1
      - name: Check Nico Reports activity filters
        run: |
          javac -cp /tmp/nicoid-json.jar -d /tmp/nicoid-feed-tests extensions/extension/src/main/java/e/e/a/FollowFeedData.java porting/tests/FollowFeedDataTest.java
          java -cp /tmp/nicoid-feed-tests:/tmp/nicoid-json.jar e.e.a.FollowFeedDataTest
      - name: Check NG comment management and playback return
        run: |
          javac -cp /tmp/nicoid-json.jar -d /tmp/nicoid-ng-tests extensions/extension/src/main/java/e/e/a/NgCommentData.java porting/tests/NgCommentDataTest.java
          java -cp /tmp/nicoid-ng-tests:/tmp/nicoid-json.jar e.e.a.NgCommentDataTest
          javac -d /tmp/nicoid-return-tests $(find porting/tests/return-stubs -name '*.java') extensions/extension/src/main/java/e/e/a/PlaybackReturn.java porting/tests/PlaybackReturnTest.java
          java -cp /tmp/nicoid-return-tests e.e.a.PlaybackReturnTest
      - name: Check manual login cookie input
        run: |
          javac -d /tmp/nicoid-cookie-tests extensions/extension/src/main/java/e/e/a/ManualCookie.java porting/tests/ManualCookieTest.java
          java -cp /tmp/nicoid-cookie-tests e.e.a.ManualCookieTest
      - name: Check theme selection policies
        run: |
          javac -d /tmp/nicoid-theme-tests extensions/extension/src/main/java/e/e/a/ThemeRules.java porting/tests/ThemeRulesTest.java
          java -cp /tmp/nicoid-theme-tests e.e.a.ThemeRulesTest
      - name: Check translation dictionary contracts
        run: |
          javac -encoding UTF-8 -d /tmp/nicoid-i18n-tests extensions/extension/src/main/java/e/e/a/UiStrings.java porting/tests/UiStringsTest.java porting/tests/compat194/I18nAudit194Test.java
          java -cp /tmp/nicoid-i18n-tests e.e.a.UiStringsTest
          java -cp /tmp/nicoid-i18n-tests e.e.a.I18nAudit194Test patches/src/main/resources/nicoid/ui-strings.txt porting/i18n-194/additions.tsv
      - name: Validate bundled Android manifest
        run: python3 porting/tests/VerifyManifest.py patches/src/main/resources/nicoid/resources.zip
      - name: Validate bundled settings
        run: python3 porting/tests/VerifySettingsPayload.py patches/src/main/resources/nicoid/resources.zip
      - name: Check playback callback registers
        run: python3 porting/tests/VerifyQualityRegisters195.py porting/helpers-smali
      - name: Validate helper source precedence
        run: python3 porting/tests/VerifyCanonicalHelpers.py
      - name: Install lockfile-pinned release dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify fixed npm release dependency
        run: node .github/scripts/verify-release-npm.cjs

      - name: Make Gradle dependency downloads resilient
        run: |
          sed -i 's#https\\://services.gradle.org/distributions/gradle-9.8.2-bin.zip#https\\://downloads.gradle.org/distributions/gradle-9.8.2-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/^networkTimeout=.*/networkTimeout=180000/' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/^retries=.*/retries=2/' gradle/wrapper/gradle-wrapper.properties
          printf '\nsystemProp.org.gradle.internal.http.connectionTimeout=180000\nsystemProp.org.gradle.internal.http.socketTimeout=180000\n' >> gradle.properties

      # A manual approval must not accidentally publish the wrong version if development
      # commits contain minor-release types. Preview the exact next tag first.
      - name: Confirm approved release target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          expected=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' gradle.properties)
          test -n "$expected"
          test -s ".github/release-notes/v$expected.md"
          if git show-ref --verify --quiet "refs/tags/v$expected"; then
            echo "Existing release tag must not be republished: v$expected" >&2
            exit 1
          fi
          EXPECTED_RELEASE_VERSION="$expected" node --input-type=module <<'NODE'
          import semanticRelease from 'semantic-release';
          const expected = process.env.EXPECTED_RELEASE_VERSION;
          const plan = await semanticRelease({ dryRun: true, ci: false });
          const actual = plan && plan.nextRelease && plan.nextRelease.version;
          if (actual !== expected) {
            throw new Error('Release version mismatch: approved v' + expected + ', planned v' + String(actual));
          }
          console.log('Approved release version verified: v' + expected);
          NODE

      - name: Audit release candidate source and lifecycle guards
        run: python3 porting/revisions/v1.11.1/release-readiness-audit.py
      - name: Build and verify approved release payload
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./gradlew :patches:buildAndroid --no-daemon
          if grep -Fq "version = 2.0.0" gradle.properties; then
            NICOID_OFFICIAL_RELEASE_APPROVED=APPROVE bash .github/scripts/stage-v2.0.0-mpp.sh
          else
            python3 porting/revisions/v1.11.1/verify-mpp.py 1.11.1
          fi
          python3 porting/tests/regression136.py
          python3 porting/tests/regression141.py
          python3 porting/tests/regression155.py
          python3 porting/tests/retained-notification-regression.py
          python3 porting/tests/tap-regions-regression.py
          python3 porting/tests/tap-region-ui-regression.py

      # Use the verified project dependency tree, not an action that installs
      # its own separate (unpatched) semantic-release toolchain.
      - name: Release
        id: release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git ls-remote --refs --tags origin 'refs/tags/v*' |
            awk '{print $2}' | sed 's|^refs/tags/||' |
            grep -E '^v[0-9]+[.][0-9]+[.][0-9]+(-dev[.][0-9]+)?$' | sort -u > /tmp/nicoid-tags-before
          ./node_modules/.bin/semantic-release
          git ls-remote --refs --tags origin 'refs/tags/v*' |
            awk '{print $2}' | sed 's|^refs/tags/||' |
            grep -E '^v[0-9]+[.][0-9]+[.][0-9]+(-dev[.][0-9]+)?$' | sort -u > /tmp/nicoid-tags-after
          mapfile -t created < <(comm -13 /tmp/nicoid-tags-before /tmp/nicoid-tags-after)
          if (( ${#created[@]} > 1 )); then
            echo "Unexpected multiple new release tags" >&2
            exit 1
          elif (( ${#created[@]} == 1 )); then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_git_tag=${created[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true' && github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Verify compilation if the manually approved run does not publish.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean :patches:buildAndroid --no-daemon

  sync-dev:
    name: Fast-forward dev after a published stable release
    needs: release
    if: needs.release.outputs.new_release_published == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Synchronize main to dev without rewriting history
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.new_release_git_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Unexpected stable release tag"; exit 1;
          }
          git fetch --prune origin main dev --tags
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" origin/main || {
            echo "::error::The published tag is not in main"; exit 1;
          }
          if git merge-base --is-ancestor origin/dev origin/main; then
            git checkout --detach origin/main
            if git push origin HEAD:refs/heads/dev; then
              echo "### Release branch synchronization" >> "$GITHUB_STEP_SUMMARY"
              echo "Fast-forwarded dev to the verified main commit after $RELEASE_TAG." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::dev push blocked by branch rules or a concurrent update; manual sync required"
              echo "### Warning: dev synchronization was blocked; manually review the branch protection or concurrent update." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::dev is not an ancestor of main; refusing rebase or force-push"
            echo "### Warning: dev diverged from main. Review and merge deliberately; no history was rewritten." >> "$GITHUB_STEP_SUMMARY"
          fi
