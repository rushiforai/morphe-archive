name: Verify main source and patch build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: verify-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and compile MPP
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate workflow action pinning and release safeguards
        run: python3 porting/tests/VerifyGithubActionsSecurity.py
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify version, metadata and immutable release sources
        run: |
          python3 porting/tests/VerifyReleaseBaseline.py
          if grep -Eq '^version[[:space:]]*=[[:space:]]*2\.0\.1[[:space:]]*$' gradle.properties; then
            python3 porting/revisions/v2.0.1-release/test_release.py
          elif grep -Eq '^version[[:space:]]*=[[:space:]]*2\.0\.2[[:space:]]*$' gradle.properties; then
            python3 porting/revisions/v2.0.2-release/test_release.py
          elif grep -Eq '^version[[:space:]]*=[[:space:]]*2\.0\.3[[:space:]]*$' gradle.properties; then
            python3 porting/revisions/v2.0.3-release/test_release.py
          elif grep -Eq '^version[[:space:]]*=[[:space:]]*2\.0\.4[[:space:]]*$' gradle.properties; then
            python3 porting/revisions/v2.0.4-release/test_release.py
          elif grep -Eq '^version[[:space:]]*=[[:space:]]*2\.0\.5[[:space:]]*$' gradle.properties; then
            python3 porting/revisions/v2.0.5-release/test_release.py
          elif grep -Eq '^version[[:space:]]*=[[:space:]]*2\.0\.6[[:space:]]*$' gradle.properties; then
            python3 porting/revisions/v2.0.6-release/test_release.py
          elif grep -Eq '^version[[:space:]]*=[[:space:]]*2\.1\.0[[:space:]]*$' gradle.properties; then
            python3 porting/revisions/v2.1.0-release/test_release.py
          elif grep -Eq '^version[[:space:]]*=[[:space:]]*2\.1\.1[[:space:]]*$' gradle.properties; then
            python3 porting/revisions/v2.1.1-release/test_release.py
          else
            echo "Unsupported official release version" >&2
            exit 1
          fi
      - name: Verify helper source ownership before release
        run: python3 porting/tests/VerifyCanonicalHelpers.py
      - name: Make Gradle dependency downloads resilient
        run: |
          sed -i 's#https\\://services.gradle.org/distributions/gradle-9.9.1-bin.zip#https\\://downloads.gradle.org/distributions/gradle-9.9.1-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/^networkTimeout=.*/networkTimeout=180000/' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/^retries=.*/retries=2/' gradle/wrapper/gradle-wrapper.properties
          printf '\nsystemProp.org.gradle.internal.http.connectionTimeout=180000\nsystemProp.org.gradle.internal.http.socketTimeout=180000\n' >> gradle.properties
      - name: Audit release candidate source and lifecycle guards
        run: python3 porting/revisions/v1.11.1/release-readiness-audit.py
      - name: Test immutable release MPP publication safeguards
        run: python3 porting/tests/test_release_mpp_integrity.py
      - name: Build and run Gradle verification
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean :patches:buildAndroid :patches:generatePatchesList --no-daemon
      - name: Verify release candidate MPP and regressions
        run: |
          if grep -Fq "version = 2.0.0" gradle.properties; then
            NICOID_OFFICIAL_RELEASE_APPROVED=VERIFY bash .github/scripts/stage-v2.0.0-mpp.sh
          elif grep -Fq "version = 2.0.1" gradle.properties; then
            NICOID_OFFICIAL_RELEASE_APPROVED=VERIFY bash .github/scripts/stage-v2.0.1-mpp.sh
          elif grep -Fq "version = 2.0.2" gradle.properties; then
            NICOID_OFFICIAL_RELEASE_APPROVED=VERIFY bash .github/scripts/stage-v2.0.2-mpp.sh
          elif grep -Fq "version = 2.0.3" gradle.properties; then
            NICOID_OFFICIAL_RELEASE_APPROVED=VERIFY bash .github/scripts/stage-v2.0.3-mpp.sh
          elif grep -Fq "version = 2.0.4" gradle.properties; then
            NICOID_OFFICIAL_RELEASE_APPROVED=VERIFY bash .github/scripts/stage-v2.0.4-mpp.sh
          elif grep -Fq "version = 2.0.5" gradle.properties; then
            NICOID_OFFICIAL_RELEASE_APPROVED=VERIFY bash .github/scripts/stage-v2.0.5-mpp.sh
          elif grep -Fq "version = 2.0.6" gradle.properties; then
            NICOID_OFFICIAL_RELEASE_APPROVED=VERIFY bash .github/scripts/stage-v2.0.6-mpp.sh
          elif grep -Fq "version = 2.1.0" gradle.properties; then
            NICOID_OFFICIAL_RELEASE_APPROVED=VERIFY bash .github/scripts/stage-v2.1.0-mpp.sh
          elif grep -Fq "version = 2.1.1" gradle.properties; then
            NICOID_OFFICIAL_RELEASE_APPROVED=VERIFY bash .github/scripts/stage-v2.1.1-mpp.sh
          else
            python3 porting/revisions/v1.11.1/verify-mpp.py 1.11.1
          fi
          python3 porting/tests/regression136.py
          python3 porting/tests/regression141.py
          python3 porting/tests/regression155.py
          python3 porting/tests/retained-notification-regression.py
          python3 porting/tests/tap-regions-regression.py
          python3 porting/tests/tap-region-ui-regression.py
      - name: Validate staged v2.1.1 runtime DEX
        run: |
          if grep -Fq 'version = 2.1.1' gradle.properties; then
            python3 .github/scripts/verify-release-mpp.py record 2.1.1
          fi
      - name: Verify MPP was produced
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(patches/build/libs/*.mpp)
          test "${#bundles[@]}" -ge 1
          for bundle in "${bundles[@]}"; do
            test -s "$bundle"
            echo "Verified generated MPP: $bundle"
          done

  audit:
    name: Report build-tool dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: Audit locked build-tool dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node .github/scripts/verify-release-npm.cjs
          node .github/scripts/test-release-toolchain.cjs
          node --input-type=module -e "await import('semantic-release'); console.log('Release CLI import successful')"
          npm audit --json > /tmp/nicoid-npm-audit.json || true
          python3 - <<'PY'
          import json, os
          with open("/tmp/nicoid-npm-audit.json", encoding="utf-8") as f:
              data = json.load(f)
          counts = data.get("metadata", {}).get("vulnerabilities", {})
          text = "Build-tool npm audit (not an APK runtime audit): " + ", ".join(
              f"{key}={counts.get(key, 0)}"
              for key in ("critical", "high", "moderate", "low")
          )
          print(text)
          for name, info in sorted(data.get("vulnerabilities", {}).items()):
              if info.get("severity") in ("critical", "high"):
                  print(f"Security advisory: {name}: {info.get('severity')}, "
                        f"affected={info.get('range')}, fixAvailable={info.get('fixAvailable')}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Build-tool dependency audit\n\n" + text + "\n\n")
          PY

