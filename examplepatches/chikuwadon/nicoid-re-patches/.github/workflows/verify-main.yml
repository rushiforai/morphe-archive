name: Verify main source and patch build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: verify-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and compile MPP
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate workflow action pinning and release safeguards
        run: python3 porting/tests/VerifyGithubActionsSecurity.py
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify version, metadata and immutable release sources
        run: python3 porting/tests/VerifyReleaseBaseline.py
      - name: Make Gradle dependency downloads resilient
        run: |
          sed -i 's#https\\://services.gradle.org/distributions/gradle-9.8.2-bin.zip#https\\://downloads.gradle.org/distributions/gradle-9.8.2-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/^networkTimeout=.*/networkTimeout=180000/' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/^retries=.*/retries=2/' gradle/wrapper/gradle-wrapper.properties
          printf '\nsystemProp.org.gradle.internal.http.connectionTimeout=180000\nsystemProp.org.gradle.internal.http.socketTimeout=180000\n' >> gradle.properties
      - name: Audit release candidate source and lifecycle guards
        run: python3 porting/revisions/v1.10.6/release-readiness-audit.py
      - name: Build and run Gradle verification
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean :patches:buildAndroid :patches:generatePatchesList --no-daemon
      - name: Verify release candidate MPP and regressions
        run: |
          python3 porting/revisions/v1.10.6/verify-mpp.py 1.10.6
          python3 porting/tests/regression136.py
          python3 porting/tests/regression141.py
          python3 porting/tests/regression155.py
      - name: Verify MPP was produced
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(patches/build/libs/*.mpp)
          test "${#bundles[@]}" -ge 1
          for bundle in "${bundles[@]}"; do
            test -s "$bundle"
            echo "Verified generated MPP: $bundle"
          done

  audit:
    name: Report build-tool dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Audit fixed npm and locked build dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node .github/scripts/verify-release-npm.cjs
          node --input-type=module -e "await import('semantic-release'); console.log('Release CLI import successful')"
          npm audit --json > /tmp/nicoid-npm-audit.json || true
          python3 - <<'PY'
          import json, os
          with open("/tmp/nicoid-npm-audit.json", encoding="utf-8") as f:
              data = json.load(f)
          counts = data.get("metadata", {}).get("vulnerabilities", {})
          text = "Build-tool npm audit (not an APK runtime audit): " + ", ".join(
              f"{key}={counts.get(key, 0)}"
              for key in ("critical", "high", "moderate", "low")
          )
          print(text)
          for name, info in sorted(data.get("vulnerabilities", {}).items()):
              if info.get("severity") in ("critical", "high"):
                  print(f"Security advisory: {name}: {info.get('severity')}, "
                        f"affected={info.get('range')}, fixAvailable={info.get('fixAvailable')}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Build-tool dependency audit\n\n" + text + "\n\n")
          PY
