name: CodeQL (Java/Kotlin, Python, JavaScript, Actions)

on:
  push:
    branches: [main, dev, release/v2.2.0-prep]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Interim mitigation for CVE-2026-114938 until patched Temurin 25 is verified.
# Disables the vulnerable x86-64 Base64 intrinsic for all Java subprocesses.
env:
  JAVA_TOOL_OPTIONS: '-XX:-UseBASE64Intrinsics'

jobs:
  java-kotlin:
    name: Analyze Java/Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 65
    # Fork pull requests cannot be granted the package credentials required
    # for the Morphe plugin. The other CodeQL language jobs still run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            21
            25
          check-latest: true
      - name: Verify patched Java 25 runtime
        run: python3 .github/scripts/verify-java25-cspu.py
      - name: Use the validated Gradle download source
        run: |
          sed -i 's#https\\://services.gradle.org/distributions/gradle-9.9.2-bin.zip#https\\://downloads.gradle.org/distributions/gradle-9.9.2-bin.zip#' gradle/wrapper/gradle-wrapper.properties
      - name: Initialize CodeQL Java/Kotlin
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Trace canonical Morphe build and helper compilation
        run: |
          set -euo pipefail
          if grep -Eq '^version[[:space:]]*=[[:space:]]*2[.]2[.]0[[:space:]]*$' gradle.properties; then
            sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            test -n "$sdk"
            android="$sdk/platforms/android-37.2/android.jar"
            if [[ ! -f "$android" ]]; then
              sdkmanager --install 'platforms;android-37.2'
            fi
            test -f "$android"
            test -x "${JAVA_HOME_21_X64:?Java 21 required}/bin/java"
            python3 porting/revisions/v2.2.0-recovery/prepare-ci-inputs.py "$RUNNER_TEMP/v220-inputs" --android-jar "$android"
            bash .github/scripts/prepare-v2.2.0-mpp.sh "$RUNNER_TEMP/v220-inputs" "$JAVA_HOME_21_X64"
            python3 .github/scripts/verify-release-mpp.py record 2.2.0
            python3 .github/scripts/verify-v2.2.0-prepared-release.py 2.2.0
            # Smali payloads require separate bytecode security and reference audits.
          else
            ./gradlew clean :patches:buildAndroid :patches:generatePatchesList --no-daemon --no-build-cache --rerun-tasks
          fi
      - name: Verify XXE and URL denial-of-service security regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nicoid-codeql-security-tests
          curl -fLs --retry 2 https://repo.maven.apache.org/maven2/org/json/json/20260814/json-20260814.jar -o /tmp/nicoid-codeql-orgjson.jar
          javac --release 8 -cp /tmp/nicoid-codeql-orgjson.jar -d /tmp/nicoid-codeql-security-tests \
            extensions/extension/src/main/java/e/e/a/HistoryRules.java \
            extensions/extension/src/main/java/e/e/a/ChannelFeed.java \
            extensions/extension/src/main/java/e/e/a/DetailData.java \
            porting/tests/CodeqlSecurityTest.java
          java -cp /tmp/nicoid-codeql-security-tests:/tmp/nicoid-codeql-orgjson.jar e.e.a.CodeqlSecurityTest
      - name: Analyze CodeQL Java/Kotlin
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          upload-database: false

  other-languages:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          upload-database: false
