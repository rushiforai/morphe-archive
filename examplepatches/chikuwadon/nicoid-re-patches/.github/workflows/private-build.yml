name: Private patch build

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Check short gesture policy
        run: |
          javac -d /tmp/nicoid-shorts-tests extensions/extension/src/main/java/e/e/a/ShortsRules.java porting/tests/ShortsRulesTest.java
          java -cp /tmp/nicoid-shorts-tests ShortsRulesTest
      - name: Check bicycle runner physics
        run: |
          javac -d /tmp/nicoid-bike-tests extensions/extension/src/main/java/e/e/a/BikeRunModel.java porting/tests/BikeRunModelTest.java
          java -cp /tmp/nicoid-bike-tests e.e.a.BikeRunModelTest
      - name: Check UI translations
        run: |
          javac -d /tmp/nicoid-ui-tests extensions/extension/src/main/java/e/e/a/UiStrings.java porting/tests/UiStringsTest.java
          java -cp /tmp/nicoid-ui-tests e.e.a.UiStringsTest
      - name: Check cache authentication and storage migration
        run: |
          javac -d /tmp/nicoid-cache-tests extensions/extension/src/main/java/e/e/a/CacheSupport.java porting/tests/CacheSupportTest.java
          java -cp /tmp/nicoid-cache-tests e.e.a.CacheSupportTest
      - name: Check video count order and precision
        run: |
          javac -d /tmp/nicoid-count-tests extensions/extension/src/main/java/e/e/a/VideoCountRules.java porting/tests/VideoCountRulesTest.java
          java -cp /tmp/nicoid-count-tests e.e.a.VideoCountRulesTest
      - name: Check authenticated Cast HLS relay
        run: |
          javac -d /tmp/nicoid-cast-tests extensions/extension/src/main/java/e/e/a/CastHls.java extensions/extension/src/main/java/e/e/a/CastRelay.java extensions/extension/src/main/java/e/e/a/CastDiagnostics.java porting/tests/cast-stubs/e/e/a/*.java porting/tests/CastRelayTest.java
          java -cp /tmp/nicoid-cast-tests e.e.a.CastRelayTest
      - name: Test performance policies
        run: |
          mkdir -p /tmp/nicoid-performance-tests
          javac -d /tmp/nicoid-performance-tests extensions/extension/src/main/java/e/e/a/PageCache.java extensions/extension/src/main/java/e/e/a/ImageDiskCache.java extensions/extension/src/main/java/e/e/a/NetworkTask.java porting/tests/PerformanceTest.java
          java -cp /tmp/nicoid-performance-tests e.e.a.PerformanceTest
      - name: Check paid metadata and badge reuse
        run: |
          curl -fLs --retry 2 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/nicoid-json.jar
          javac -cp /tmp/nicoid-json.jar -d /tmp/nicoid-paid-tests $(find porting/tests/paid-stubs -name '*.java') extensions/extension/src/main/java/e/e/a/PaidVideos.java extensions/extension/src/main/java/e/e/a/UiStrings.java porting/tests/PaidVideosTest.java
          java -cp /tmp/nicoid-paid-tests:/tmp/nicoid-json.jar e.e.a.PaidVideosTest porting/tests/paid-list-fixture.json porting/tests/paid-watch-fixture.json
      - name: Check content filtering and history deletion
        run: |
          javac -d /tmp/nicoid-content-tests extensions/extension/src/main/java/e/e/a/ContentFilterRules.java extensions/extension/src/main/java/e/e/a/HistoryRules.java porting/tests/ContentHistoryRulesTest.java
          java -cp /tmp/nicoid-content-tests e.e.a.ContentHistoryRulesTest
      - name: Check manual login cookie input
        run: |
          javac -d /tmp/nicoid-cookie-tests extensions/extension/src/main/java/e/e/a/ManualCookie.java porting/tests/ManualCookieTest.java
          java -cp /tmp/nicoid-cookie-tests e.e.a.ManualCookieTest
      - name: Validate bundled Android manifest
        run: python3 porting/tests/VerifyManifest.py patches/src/main/resources/nicoid/resources.zip
      - name: Build Morphe bundle
        run: ./gradlew :patches:buildAndroid --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: nicoid-mod-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 7
