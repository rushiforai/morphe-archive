          test -s "$output"
          test "$(find /tmp/nicoid-v2-delivery -maxdepth 1 -type f | wc -l)" -eq 2
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/v2.0.0-dev'
        with:
          name: ${{ github.ref == 'refs/heads/dev' && format('nicoid-re-v{0}-mpp', steps.candidate.outputs.version) || 'nicoid-re-v2.0.0-dev-mpp' }}
          path: /tmp/nicoid-v2-delivery/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

      - name: Package complete source archives
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nicoid-v2-source
          version=2.0.3-dev.5
          if [[ "$GITHUB_REF" == "refs/heads/dev" ]]; then
            version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' gradle.properties)
            test -n "$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git archive -9 --format=zip --output="/tmp/nicoid-v2-source/nicoid-re-$version-source.zip" HEAD
          git archive -9 --format=tar.gz --output="/tmp/nicoid-v2-source/nicoid-re-$version-source.tar.gz" HEAD
          unzip -tq "/tmp/nicoid-v2-source/nicoid-re-$version-source.zip"
          tar -tzf "/tmp/nicoid-v2-source/nicoid-re-$version-source.tar.gz" > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.ref == 'refs/heads/dev' && format('nicoid-re-v{0}-source', steps.source.outputs.version) || 'nicoid-re-v2.0.0-dev-source' }}
          path: /tmp/nicoid-v2-source/*-source.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

      # Keep both source formats, but avoid forcing every user to download
      # both copies when only ZIP or tar.gz is required.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.ref == 'refs/heads/dev' && format('nicoid-re-v{0}-source-targz', steps.source.outputs.version) || 'nicoid-re-v2.0.0-dev-source-targz' }}
          path: /tmp/nicoid-v2-source/*-source.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

