      - name: Compile complete Android live source against official MPP
        shell: bash
        run: |
          set -euo pipefail
          revision=porting/revisions/v2.0.0-dev.1
          python3 "$revision/bootstrap_tools.py"
          python3 "$revision/bootstrap_live.py"
          curl -fLs --retry 2 https://github.com/chikuwadon/nicoid-re-patches/releases/download/v1.11.1/patches-1.11.1.mpp -o /tmp/stable-nicoid.mpp
          echo "8920e9cdc9fc49178be5bc78cdb990627f4e7a7be83fef782eece3e7c443bcce  /tmp/stable-nicoid.mpp" | sha256sum -c -
          python3 -c 'from zipfile import ZipFile;ZipFile("/tmp/stable-nicoid.mpp").extract("nicoid/helpers.mpe","/tmp")'
          java -cp "$revision/deps/*" com.googlecode.dex2jar.tools.Dex2jarCmd -o /tmp/nicoid-v2-helpers.jar /tmp/nicoid/helpers.mpe
          mkdir -p /tmp/nicoid-v2-android-classes
          # NicoLiveSession uses OkHttp from the native APK. CI has no private
          # APK, so supply pinned, API-compatible OkHttp solely for compilation.
          curl -fLs --retry 2 https://repo.maven.apache.org/maven2/com/squareup/okhttp3/okhttp/3.14.9/okhttp-3.14.9.jar -o /tmp/nicoid-v2-okhttp.jar
          curl -fLs --retry 2 https://repo.maven.apache.org/maven2/com/squareup/okio/okio/1.17.2/okio-1.17.2.jar -o /tmp/nicoid-v2-okio.jar
          cp="$revision/tools/android-all-16-robolectric-13921718.jar:/tmp/nicoid-v2-helpers.jar:/tmp/nicoid-v2-okhttp.jar:/tmp/nicoid-v2-okio.jar"
          for jar in "$revision"/deps/*.jar; do cp="$cp:$jar"; done
          java -jar "$revision/tools/ecj.jar" -8 -proc:none -nowarn -cp "$cp" \
            -d /tmp/nicoid-v2-android-classes \
            $(find "$revision/java" -name '*.java' | sort) \
            porting/revisions/v1.11.1/java/e/e/a/AmbientLight.java
          test -s /tmp/nicoid-v2-android-classes/e/e/a/NicoliveActivity.class
          test -s /tmp/nicoid-v2-android-classes/e/e/a/NicoliveBrowser.class
          test -s /tmp/nicoid-v2-android-classes/e/e/a/NicoliveData.class
          echo "Complete live Java source compiled. No original APK was used or distributed."

      - name: Build guarded v2 candidate MPP from stable release and validated sources
        shell: bash
        run: |
          set -euo pipefail
          revision=porting/revisions/v2.0.0-dev.1
          builder="$revision"
          version=2.0.0-dev.1-27
          if [[ "$GITHUB_REF" == "refs/heads/dev" ]]; then
            builder=porting/revisions/v2.0.1-dev.8
            version=2.0.1-dev.8
          fi
          output="/tmp/nicoid-re-$version.mpp"
          python3 "$builder/build_mpp.py" \
            --base /tmp/stable-nicoid.mpp \
            --tools "$revision/tools" --media "$revision/deps" \
            --ci-without-apk \
            --compile-jar /tmp/nicoid-v2-okhttp.jar \
            --compile-jar /tmp/nicoid-v2-okio.jar \
            --output "$output"
          python3 "$builder/verify_ci_candidate.py" /tmp/stable-nicoid.mpp "$output"
          mkdir -p /tmp/nicoid-v2-delivery
          cp "$output" /tmp/nicoid-v2-delivery/
          {
            echo "nicoid Re $version — development verification only"
            echo "Branch: $GITHUB_REF"
            echo "Commit: $GITHUB_SHA"
            echo "Source compilation and MPP structure verified"
            echo "Original APK not distributed. Morphe application and Android runtime: NOT VERIFIED."
            echo
            sha256sum "$output"
          } > /tmp/nicoid-v2-delivery/verification.txt
          test -s "$output"
          test "$(find /tmp/nicoid-v2-delivery -maxdepth 1 -type f | wc -l)" -eq 2

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nicoid-re-v2.0.1-dev.8-mpp
          path: /tmp/nicoid-v2-delivery/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

      - name: Package complete source archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nicoid-v2-source
          git archive --format=zip --output=/tmp/nicoid-v2-source/nicoid-re-v2.0.1-dev.8-source.zip HEAD
          git archive --format=tar.gz --output=/tmp/nicoid-v2-source/nicoid-re-v2.0.1-dev.8-source.tar.gz HEAD
          unzip -tq /tmp/nicoid-v2-source/nicoid-re-v2.0.1-dev.8-source.zip
          tar -tzf /tmp/nicoid-v2-source/nicoid-re-v2.0.1-dev.8-source.tar.gz > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nicoid-re-v2.0.1-dev.8-source
          path: /tmp/nicoid-v2-source/*
          if-no-files-found: error
          retention-days: 2

