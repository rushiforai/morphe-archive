name: Private patch build

on:
  push:
    branches: [dev, audit/v1.10.5-dev.5]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    if: >-
      github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'docs: update release notes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Check short gesture policy
        run: |
          javac -d /tmp/nicoid-shorts-tests extensions/extension/src/main/java/e/e/a/ShortsRules.java porting/tests/ShortsRulesTest.java
          java -cp /tmp/nicoid-shorts-tests ShortsRulesTest
      - name: Check model regressions
        run: bash porting/tests/audit136-model.sh > /tmp/model-regressions.log 2>&1
      - name: Check UI translations
        run: |
          javac -d /tmp/nicoid-ui-tests extensions/extension/src/main/java/e/e/a/UiStrings.java porting/tests/UiStringsTest.java
          java -cp /tmp/nicoid-ui-tests e.e.a.UiStringsTest
      - name: Check cache authentication and storage migration
        run: |
          javac -d /tmp/nicoid-cache-tests extensions/extension/src/main/java/e/e/a/CacheSupport.java porting/tests/CacheSupportTest.java
          java -cp /tmp/nicoid-cache-tests e.e.a.CacheSupportTest
      - name: Check comment posting video identifiers
        run: |
          curl -fLs --retry 2 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/nicoid-posting-json.jar
          javac -cp /tmp/nicoid-posting-json.jar -d /tmp/nicoid-posting-tests extensions/extension/src/main/java/e/e/a/PostingRules.java porting/tests/PostingRulesTest.java
          java -cp /tmp/nicoid-posting-tests:/tmp/nicoid-posting-json.jar e.e.a.PostingRulesTest
      - name: Check video count order and precision
        run: |
          javac -d /tmp/nicoid-count-tests extensions/extension/src/main/java/e/e/a/VideoCountRules.java porting/tests/VideoCountRulesTest.java
          java -cp /tmp/nicoid-count-tests e.e.a.VideoCountRulesTest
      - name: Check authenticated Cast HLS relay
        run: |
          javac -d /tmp/nicoid-cast-tests extensions/extension/src/main/java/e/e/a/CastHls.java extensions/extension/src/main/java/e/e/a/CastRelay.java extensions/extension/src/main/java/e/e/a/CastDiagnostics.java porting/tests/cast-stubs/e/e/a/*.java porting/tests/CastRelayTest.java
          java -cp /tmp/nicoid-cast-tests e.e.a.CastRelayTest
      - name: Test HLS transfer size planning
        run: |
          javac -d /tmp/nicoid-transfer-tests extensions/extension/src/main/java/e/e/a/CacheTransferPlan.java porting/tests/CacheTransferPlanTest.java
          java -cp /tmp/nicoid-transfer-tests e.e.a.CacheTransferPlanTest
      - name: Test performance policies
        run: |
          mkdir -p /tmp/nicoid-performance-tests
          javac -d /tmp/nicoid-performance-tests extensions/extension/src/main/java/e/e/a/PageCache.java extensions/extension/src/main/java/e/e/a/ImageDiskCache.java extensions/extension/src/main/java/e/e/a/NetworkTask.java porting/tests/PerformanceTest.java
          java -cp /tmp/nicoid-performance-tests e.e.a.PerformanceTest
      - name: Check paid metadata and badge reuse
        run: |
          curl -fLs --retry 2 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/nicoid-json.jar
          javac -cp /tmp/nicoid-json.jar -d /tmp/nicoid-paid-tests $(find porting/tests/paid-stubs -name '*.java') extensions/extension/src/main/java/e/e/a/PaidVideos.java extensions/extension/src/main/java/e/e/a/UiStrings.java porting/tests/PaidVideosTest.java
          java -cp /tmp/nicoid-paid-tests:/tmp/nicoid-json.jar e.e.a.PaidVideosTest porting/tests/paid-list-fixture.json porting/tests/paid-watch-fixture.json
      - name: Check content filtering and history deletion
        run: |
          javac -d /tmp/nicoid-content-tests extensions/extension/src/main/java/e/e/a/ContentFilterRules.java extensions/extension/src/main/java/e/e/a/HistoryRules.java porting/tests/ContentHistoryRulesTest.java
          java -cp /tmp/nicoid-content-tests e.e.a.ContentHistoryRulesTest
      - name: Check manual login cookie input
        run: |
          javac -d /tmp/nicoid-cookie-tests extensions/extension/src/main/java/e/e/a/ManualCookie.java porting/tests/ManualCookieTest.java
          java -cp /tmp/nicoid-cookie-tests e.e.a.ManualCookieTest
      - name: Validate bundled Android manifest
        run: python3 porting/tests/VerifyManifest.py patches/src/main/resources/nicoid/resources.zip
      - name: Verify screen-off audio defaults to ON
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("porting/revisions/v1.10.5-dev.5/java/e/e/a/Dev119.java").read_text()
          assert "option.setDefaultValue(Boolean.TRUE)" in source
          assert ".getBoolean(KEY, true)" in source
          assert "option.setDefaultValue(Boolean.FALSE)" not in source
          print("PASS: new installs default ON; stored explicit OFF remains effective")
          PY
      - name: Check additional cache, audio and gesture regressions
        run: python3 porting/tests/regression136.py
      - name: Test comment lifecycle and player controls regressions
        run: python3 porting/tests/regression141.py
      - name: Test secure comment posting endpoint policy
        run: |
          mkdir -p /tmp/nicoid-post122
          javac -d /tmp/nicoid-post122 porting/revisions/v1.10.5-dev.5/java/e/e/a/PostingPolicy122.java porting/revisions/v1.10.5-dev.5/PostingPolicy122Test.java
          java -cp /tmp/nicoid-post122 e.e.a.PostingPolicy122Test
      - name: Use the official Gradle GitHub release for CI
        run: |
          sed -i 's#https\\://services.gradle.org/distributions/gradle-9.8.2-bin.zip#https\\://github.com/gradle/gradle-distributions/releases/download/v9.8.2/gradle-9.8.2-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          grep -q 'github.com/gradle/gradle-distributions' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/^networkTimeout=.*/networkTimeout=180000/' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/^retries=.*/retries=2/' gradle/wrapper/gradle-wrapper.properties
          printf '\nsystemProp.org.gradle.internal.http.connectionTimeout=180000\nsystemProp.org.gradle.internal.http.socketTimeout=180000\n' >> gradle.properties
      - name: Test confirmed comment posting and adapter deduplication
        run: |
          mkdir -p /tmp/nicoid-post123
          javac -d /tmp/nicoid-post123 porting/revisions/v1.10.5-dev.5/java/e/e/a/PostEcho123.java $(find porting/revisions/v1.10.5-dev.5/post-test -name '*.java' | sort)
          java -cp /tmp/nicoid-post123 e.e.a.PostEcho123Test
      - name: Test popup tap, drag, double-tap and pinch policy
        run: |
          mkdir -p /tmp/nicoid-popup125
          javac -d /tmp/nicoid-popup125 porting/revisions/v1.10.5-dev.5/java/e/e/a/PopupTouchPolicy125.java porting/revisions/v1.10.5-dev.5/PopupTouchPolicy125Test.java
          java -cp /tmp/nicoid-popup125 e.e.a.PopupTouchPolicy125Test
      - name: Test public mylist title synchronization rules
        run: |
          mkdir -p /tmp/nicoid-mylists126
          javac -d /tmp/nicoid-mylists126 porting/revisions/v1.10.5-dev.5/java/e/e/a/TabTitleRules126.java porting/revisions/v1.10.5-dev.5/TabTitleRules126Test.java
          java -cp /tmp/nicoid-mylists126 e.e.a.TabTitleRules126Test
      - name: Verify popup double tap bridge regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("porting/revisions/v1.10.5-dev.5")
          bridge = (root / "java/e/e/a/PopupTouch125.java").read_text()
          policy = (root / "java/e/e/a/PopupTouchPolicy125.java").read_text()
          assert 'getMethod("isVisible")' not in bridge
          assert '((View) controls).isShown()' in bridge
          assert 'Gesture routing must not depend on optional player control APIs' in bridge
          assert 'if (second)' in policy
          assert 'if (confirmed && second)' not in policy
          print("PASS: no nonexistent View.isVisible reflection or missing GestureDetector dependency")
          PY
      - name: Test popup bridge event streams
        run: python3 porting/tests/regression155.py
      - name: Build Morphe bundle
        run: ./gradlew :patches:buildAndroid --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify final distributed MPP, payload and patch version
        run: python3 porting/revisions/v1.10.5-dev.5/verify-mpp.py 1.10.5-dev.5
      - name: Verify stable resources and feature continuity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/nicoid-baseline /tmp/nicoid-stage
          gh release download v1.10.4 --repo chikuwadon/nicoid-re-patches --pattern patches-1.10.4.mpp --dir /tmp/nicoid-baseline
          python3 porting/tests/VerifyResourceIdentity191.py /tmp/nicoid-baseline/patches-1.10.4.mpp patches/build/libs/patches-1.10.5-dev.5.mpp
          python3 porting/tests/VerifyLegacyImageFormats191.py /tmp/nicoid-baseline/patches-1.10.4.mpp patches/build/libs/patches-1.10.5-dev.5.mpp
          cp -a porting/revisions/v1.10.1/helpers porting/revisions/v1.10.1/method-delta /tmp/nicoid-stage/
          python3 porting/revisions/v1.10.5-dev.5/patch-payloads.py /tmp/nicoid-stage 1.10.5-dev.5
          python3 porting/tests/VerifyReleaseContinuity.py porting/revisions/v1.10.1/helpers /tmp/nicoid-stage/helpers /tmp/nicoid-stage/method-delta
          python3 porting/tests/VerifyQualityRegisters195.py /tmp/nicoid-stage
      - name: Prepare development sources and verification report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patches/build/dev-delivery
          version=1.10.5-dev.5
          git archive --format=zip --prefix="nicoid-re-$version/" \
            --output="patches/build/dev-delivery/nicoid-re-$version-source.zip" HEAD
          git archive --format=tar.gz --prefix="nicoid-re-$version/" \
            --output="patches/build/dev-delivery/nicoid-re-$version-source.tar.gz" HEAD
          python3 porting/revisions/v1.10.5-dev.5/sync-source-payloads.py "$version"
          {
            echo "nicoid Re $version / development verification"
            echo "Commit: $GITHUB_SHA"
            echo "Gradle build and development Smali overlay: PASS"
            echo "Shipped-MPP payload and visible version verification: PASS"
            echo "Development source overlay tests: PASS (build-payloads.sh/verify-overlay.py)"
            echo "Source ZIP/TAR DEX parity with generated MPP: PASS"
            echo "Audit fixes: comment echo session ownership across network/UI delay, optional popup player fallback, final-UP touch slop"
            echo "Additional JVM regressions: PASS"
            echo "Stable v1.10.4 resource and feature continuity: PASS"
            echo "Android device/emulator runtime testing: NOT PERFORMED"
            echo "Official release/tag update: NOT PERFORMED"
            echo "Changes: secure confirmed comment posting, same-session local echo, popup touch arbitration and public mylist tab title synchronization"
            echo "Comment lifecycle and controls boundary tests: PASS (JVM doubles; Android runtime not covered)"
            echo "Popup bridge event-stream regressions: PASS (Android boundary doubles; device runtime not covered)"
            echo
            echo "Files (SHA-256):"
            sha256sum patches/build/libs/*.mpp patches/build/dev-delivery/*source.*
          } > patches/build/dev-delivery/verification.txt

      - uses: actions/upload-artifact@v4
        with:
          name: nicoid-re-v1.10.5-dev.5-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: nicoid-re-v1.10.5-dev.5-source-verification
          path: patches/build/dev-delivery/
          if-no-files-found: error
          retention-days: 2
