id: capcut
package: com.lemon.lvoverseas
display_name: CapCut
apk_file_type: APK
apkpure_slug: capcut-for-android-2025
analysis_dir: analysis/capcut

verify:
  apk: analysis/capcut/extract/com.lemon.lvoverseas.apk
  smali_assertions:
    - file: com/vega/subscribe/SubscribeImpl.smali
      pattern: 'const/4 v0, 0x1'
      label: SubscribeImpl isVip spoof
    - file: com/lemon/editor/proxy/PayVipImpl.smali
      pattern: 'const/4 v0, 0x1'
      label: PayVipImpl isVip spoof
    - file: com/lemon/clipmonetize/biz/userinfoapi/UserInfoServiceServiceImpl.smali
      pattern: 'SSVIP:Lcom/lemon/lv/clipmonetize/data/VipState;'
      label: UserInfoService SSVIP spoof
    - file: com/xt/retouch/account/api/subscribe/SubscribeFacade.smali
      pattern: 'const/4 v0, 0x1'
      label: SubscribeFacade subscribed spoof
    - file: com/lemon/lv/config/WatermarkTrailerConfig.smali
      pattern: 'const/4 p2, 0x0'
      label: WatermarkTrailerConfig trailer disabled
    - file: com/xt/retouch/baseui/JniToast.smali
      method: showApkError
      pattern: '\.registers 3'
      label: JniToast showApkError bypass
    - file: com/xt/retouch/baseui/JniToast$1.smali
      method: run
      pattern: '\.registers 4'
      label: JniToast runnable bypass
