name: Build curated patches
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Core tests
        run: |
          python3 tests/niagara-weather/run_tests.py
          sh tests/transit-core/test.sh
          python3 tests/transit-onboard/test.py
      - name: Build Android-compatible bundle and source metadata
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew clean :patches:generatePatchesList :patches:buildAndroid --no-daemon
          python3 tools/release_metadata.py
      - uses: actions/upload-artifact@v4
        with:
          name: curated-patches
          path: |
            patches/build/libs/patches-*.mpp
            patches-list.json
            patches-bundle.json
            SHA256SUMS.txt
