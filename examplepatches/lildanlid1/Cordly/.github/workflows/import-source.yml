name: Import Cordly source ZIP

on:
  push:
    branches: [main]
    paths:
      - 'Cordly.zip'
      - 'Cordly-GitHub-Morphe-Ready.zip'
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify and extract prepared Cordly source
        shell: bash
        run: |
          set -euo pipefail
          if test -s Cordly.zip; then
            ARCHIVE=Cordly.zip
          else
            ARCHIVE=Cordly-GitHub-Morphe-Ready.zip
          fi
          test -s "$ARCHIVE" || { echo "Upload $ARCHIVE to the repository root first."; exit 1; }
          WORKDIR="$(mktemp -d)"
          unzip -q "$ARCHIVE" -d "$WORKDIR"
          test -f "$WORKDIR/Cordly/gradle.properties"
          test -f "$WORKDIR/Cordly/.github/workflows/build.yml"
          test -f "$WORKDIR/Cordly/patches/src/main/resources/venus/bootstrap.js"
          rsync -a "$WORKDIR/Cordly/" ./
          rm "$ARCHIVE"
          python3 scripts/verify_source_setup.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "Source already imported."
          else
            git commit -m 'feat: import Cordly v1.23.0 complete source [skip ci]'
            git push origin HEAD:main
          fi

      - name: Next step
        run: echo "Run Actions > Build and publish Cordly > Run workflow to create the .mpp release."
