org.gradle.parallel = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max = 2
kotlin.code.style = official
version = 1.0.0
# The upstream settings plugin eagerly reads these unused values before its
# GitHub repository is replaced with the public Codeberg Maven mirror.
gpr.user = anonymous
gpr.key = public-mirror
