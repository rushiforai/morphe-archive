name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build & Verify MPP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests & build patch bundle
        run: ./gradlew :extensions:soundcloud:testDebugUnitTest :patches:check :patches:generatePatchesList --no-daemon

      - name: Verify built MPP & patches-list.json
        run: bash .github/scripts/verify_mpp.sh
