name: Bug report
description: Report a problem with one of these patches.
labels: [bug]
body:
  - type: input
    id: app
    attributes:
      label: Target app and version
      placeholder: App name, package name, and version
    validations:
      required: true
  - type: input
    id: patch
    attributes:
      label: Patch name
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce and expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      render: shell
