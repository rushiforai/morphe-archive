name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v6.3.0
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and prepare release assets
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || github.token }}
        run: |
          bash gradlew buildAndroid --no-daemon
          python3 scripts/release_assets.py --tag "$GITHUB_REF_NAME"
      - name: Publish patch bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/release/* --verify-tag --draft --title "Chrome Morphe $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
