name: Feature request
description: Request suppression of an additional Instagram notification prompt
title: "feat: "
body:
  - type: input
    id: version
    attributes:
      label: Instagram version
      placeholder: 454.0.0.13.77
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Which notification prompt should be hidden?
      description: Describe where it appears and whether it is strictly an opt-in prompt, not actual notification UI.
    validations:
      required: true
