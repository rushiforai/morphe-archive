name: BitChord compatibility

# Tries the patch on every BitChord version newer than the one it supports:
# published releases from their APKs, unreleased vX.Y.Z branches from a build
# of their latest commit. Results go to one issue per version.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Test builds that were already reported
        type: boolean
        default: false
      calibrate:
        description: Check that a source build matches BitChord's official APKs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bitchord-watch

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      targets: ${{ steps.find.outputs.targets }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Find new BitChord builds
        id: find
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          targets=$(python3 tools/bitchord_watch.py targets $FORCE)
          echo "$targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    if: needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record the target
        env:
          TARGET: ${{ toJSON(matrix.target) }}
        run: |
          mkdir -p results
          echo "$TARGET" > results/target.json
      - name: Cache build tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .deps/tools
          key: tools-${{ hashFiles('PROVENANCE.json') }}
      - name: Build the patch
        run: |
          mkdir -p .deps
          curl -fsSL --retry 5 --retry-all-errors -o .deps/release.mpp "$(python3 -c "import json; print(json.load(open('patches-bundle.json'))['download_url'])")"
          python3 tools/bootstrap_from_release.py --bundle .deps/release.mpp --download-tools
          python3 build.py

      - name: Download the release APKs
        if: matrix.target.kind == 'release'
        env:
          APKS: ${{ toJSON(matrix.target.apks) }}
        run: |
          mkdir -p apks
          echo "$APKS" | python3 -c "import json, sys; [print(abi, url) for abi, url in json.load(sys.stdin).items()]" |
            while read -r abi url; do
              curl -fsSL --retry 5 --retry-all-errors -o "apks/BitChord-${{ matrix.target.ref }}_$abi.apk" "$url"
            done

      - name: Check out BitChord
        if: matrix.target.kind == 'branch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kushagrasinghx/BitChord
          ref: ${{ matrix.target.id }}
          path: upstream
          persist-credentials: false
      - name: Set up JDK 17 for BitChord
        if: matrix.target.kind == 'branch'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            upstream/**/*.gradle*
            upstream/**/gradle-wrapper.properties
      - name: Build BitChord
        if: matrix.target.kind == 'branch'
        run: tools/build_bitchord.sh upstream apks "${{ matrix.target.ref }}"

      - name: Try the patch
        run: python3 tools/check_bitchord.py --label "${{ matrix.target.kind }} ${{ matrix.target.ref }}" --out results apks/*.apk
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-${{ matrix.target.version }}
          path: |
            results/*.json
            results/*.md
            results/*.log

  report:
    needs: [discover, check]
    if: always() && needs.discover.outputs.targets != '[]' && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Collect results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compat-*
          path: results
      - name: Open or update issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/bitchord_watch.py report results

  # Branch results are only meaningful if a source build compiles to the same
  # code as an official release. This builds the supported version from its tag
  # and compares it with the official APKs, class by class.
  calibrate:
    if: inputs.calibrate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the supported version
        id: version
        run: echo "tag=v$(python3 -c "import json; print(json.load(open('PROVENANCE.json'))['app_version'])")" >> "$GITHUB_OUTPUT"
      - name: Check out BitChord ${{ steps.version.outputs.tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kushagrasinghx/BitChord
          ref: ${{ steps.version.outputs.tag }}
          path: upstream
          persist-credentials: false
      - name: Set up JDK 17 for BitChord
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            upstream/**/*.gradle*
            upstream/**/gradle-wrapper.properties
      - name: Build BitChord
        run: tools/build_bitchord.sh upstream rebuilt "${{ steps.version.outputs.tag }}"
      - name: Download the official APKs and Morphe
        run: |
          mkdir -p official
          python3 - <<'PY'
          import hashlib, json, sys
          sys.path.insert(0, "tools")
          from bootstrap_from_release import download

          meta = json.load(open("PROVENANCE.json"))
          files = [(a["url"], "official/" + a["file"], a["sha256"]) for a in meta["original_apks"]]
          files += [
              (d["url"], "morphe.jar", d["sha256"])
              for d in meta["downloads"]
              if d["file"].startswith("morphe-desktop-")
          ]
          for url, path, sha in files:
              download(url, path)
              if hashlib.sha256(open(path, "rb").read()).hexdigest() != sha:
                  sys.exit("Hash mismatch: " + path)
          PY
      - name: Compare
        run: |
          javac -nowarn -cp morphe.jar -d compare checks/CompareDex.java
          status=0
          {
            echo "## Source build of BitChord ${{ steps.version.outputs.tag }} vs official APKs"
            for abi in arm64-v8a armeabi-v7a x86_64; do
              echo "### $abi"
              echo '```'
              java -Xmx4g -cp compare:morphe.jar CompareDex official/BitChord-${{ steps.version.outputs.tag }}_$abi.apk rebuilt/BitChord-${{ steps.version.outputs.tag }}_$abi.apk patches/src/main/kotlin/app/bitchord/patches/TelegramPatch.kt || status=1
              echo '```'
            done
            if [ $status = 0 ]; then
              echo "Every class the patch hooks is identical, so branch builds can be trusted."
            else
              echo "Some hooked classes differ, so branch results may not match the real release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          exit $status
