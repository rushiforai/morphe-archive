version: 2
# Dependencies are updated by merging the upstream repository, which runs its own version updates,
# so this repository opens no pull requests of its own. Security updates are not affected.
updates:
  - package-ecosystem: github-actions
    labels: []
    directory: /
    target-branch: dev
    open-pull-requests-limit: 0
    schedule:
      interval: weekly

  - package-ecosystem: npm
    labels: []
    directory: /
    target-branch: dev
    open-pull-requests-limit: 0
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    labels: []
    directory: /
    target-branch: dev
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
