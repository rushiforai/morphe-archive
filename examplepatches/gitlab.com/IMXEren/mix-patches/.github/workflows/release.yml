name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    name: Release
    env:
      PROJECT_PATH: ${{ github.repository }}
      PROJECT_REF_NAME: ${{ github.ref_name }}
      PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
      GITHUB_RELEASE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
      PROJECT_RELEASE_URL_TEMPLATE: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v{version}
      PROJECT_RELEASE_DOWNLOAD_URL_TEMPLATE: ${{ github.server_url }}/${{ github.repository }}/releases/download/v{version}/patches-{version}.mpp
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup tools
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: npm ci

      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Mix Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Always run tests and verify compilation when semantic-release did not publish a release.
      # This covers non-main/dev branches, chore commits, docs commits, etc.
      - name: Verify project
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:test :patches:buildAndroid clean --no-daemon
