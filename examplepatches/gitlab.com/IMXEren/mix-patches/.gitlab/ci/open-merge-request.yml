open_merge_request:
  stage: automate
  image: alpine:3.24
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apk add --no-cache curl jq
    - ': "${GL_TOKEN:?Set GL_TOKEN to a GitLab project access token with api scope}"'
  script:
    - |
      api="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      source_branch="$CI_COMMIT_REF_NAME"

      open_count=$(curl --fail --silent --show-error \
        --header "PRIVATE-TOKEN: $GL_TOKEN" \
        --get \
        --data-urlencode "state=opened" \
        --data-urlencode "source_branch=$source_branch" \
        --data-urlencode "target_branch=main" \
        "$api/merge_requests" | jq 'length')

      if [ "$open_count" -gt 0 ]; then
        echo "An open merge request from $source_branch to main already exists."
        exit 0
      fi

      commit_count=$(curl --fail --silent --show-error \
        --header "PRIVATE-TOKEN: $GL_TOKEN" \
        --get \
        --data-urlencode "from=main" \
        --data-urlencode "to=$source_branch" \
        --data-urlencode "straight=true" \
        "$api/repository/compare" | jq '.commits | length')

      if [ "$commit_count" -eq 0 ]; then
        echo "No changes found between $source_branch and main."
        exit 0
      fi

      curl --fail-with-body --silent --show-error \
        --request POST \
        --header "PRIVATE-TOKEN: $GL_TOKEN" \
        --data-urlencode "source_branch=$source_branch" \
        --data-urlencode "target_branch=main" \
        --data-urlencode 'title=chore: Merge branch `dev` to `main`' \
        --data-urlencode "description=When dev (pre-release) is ready, then merge this merge request to create a new stable release." \
        --data-urlencode "remove_source_branch=false" \
        "$api/merge_requests"
