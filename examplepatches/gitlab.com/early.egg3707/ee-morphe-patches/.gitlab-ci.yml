stages:
  - release

default:
  image: ghcr.io/cirruslabs/android-sdk:35
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - .gradle/

variables:
  GIT_DEPTH: "0"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl gnupg jq
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y --no-install-recommends nodejs
    - node --version
    - npm ci --cache .npm --prefer-offline
    - set +o pipefail; yes | sdkmanager --licenses; set -o pipefail
    - sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
  script:
    - export GL_TOKEN="${GL_TOKEN:-$GITLAB_TOKEN}"
    - test -n "$GL_TOKEN" || (echo "Missing GL_TOKEN or GITLAB_TOKEN"; exit 1)
    - test -n "$GITHUB_ACTOR" || (echo "Missing GITHUB_ACTOR"; exit 1)
    - test -n "$GITHUB_TOKEN" || (echo "Missing GITHUB_TOKEN"; exit 1)
    - chmod +x ./gradlew
    - ./gradlew :patches:buildAndroid :patches:generatePatchesList
    - npx semantic-release
