name: Feature request
description: Suggest a new patch or a change to an existing patch
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > **Before you request**
        > - [Search existing issues](https://github.com/amfakh/fakh-patches/issues?q=is%3Aissue) to see if it was already requested.
        > - Something that is broken belongs in a bug report, not here.
        > - To request a new app, use [morphe-patches.software/requests](https://morphe-patches.software/requests).
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - BARDI Smart Home
        - CNN Indonesia
        - Confluence
        - CoverScreen OS
        - detikcom
        - DoDo Music
        - Facer
        - Facer (Wear OS)
        - FlipSide
        - FOMO Indonesia
        - Genius
        - GitHub
        - IDN
        - Jira
        - KOMPAS.com
        - LinkedIn
        - "Mazii: Japanese Dictionary"
        - Muslim Pro
        - Radio Indonesia
        - Smart Life
        - SYNC by Krisbow
        - Todaii Super
        - "Todaii: Learn German A1-C1"
        - "Todaii: Learn Japanese N5-N1"
        - Tuya Smart
        - Warung Life Simulator
        - Windy
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Leave this empty if the request is not tied to one version.
      placeholder: 1.285.0
  - type: textarea
    id: request
    attributes:
      label: What do you want
      description: What the patched app should do or show, and where in the app.
      placeholder: A Repositories tab in the bottom navigation bar that opens the list of my repositories directly.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why
      description: What is annoying or missing today.
      placeholder: To see my repositories I have to open my profile and then tap Repositories.
  - type: textarea
    id: proof
    attributes:
      label: Screenshots or examples
      description: Drag images or videos here, or link another mod or app that already does this.
