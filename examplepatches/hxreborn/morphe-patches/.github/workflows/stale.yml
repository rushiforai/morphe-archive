name: Close stale issues

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: >
            This issue has been marked stale after 30 days without activity. It will close
            automatically in 7 days unless there's an update. Please comment if the issue persists.
          close-issue-message: >
            Closed automatically after no further activity. If the issue persists, please comment
            below to request reopening.
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-all-assignees: true
          exempt-all-milestones: true
          exempt-issue-labels: "app request,needs info"
          operations-per-run: 30
      - uses: actions/stale@v11
        with:
          only-labels: "needs info"
          days-before-issue-stale: 14
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: >
            The details requested above are still needed. Please add them within 7 days to keep
            this issue open.
          close-issue-message: >
            Closed automatically because the requested details are still missing. Please open a new
            issue with those details, or comment below if this closure seems wrong.
          close-issue-reason: not_planned
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-all-assignees: true
          exempt-issue-labels: "bad-triage"
          operations-per-run: 30
