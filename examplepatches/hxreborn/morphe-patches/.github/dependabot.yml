version: 2
registries:
  morphe:
    type: maven-repository
    url: https://maven.pkg.github.com/MorpheApp/registry
    username: hxreborn
    password: ${{ secrets.MORPHE_PACKAGES_TOKEN }}

updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: "ci(deps)"
    labels: []
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: npm
    commit-message:
      prefix: "ci(deps)"
    labels: []
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "conventional-changelog-conventionalcommits"

  - package-ecosystem: gradle
    commit-message:
      prefix: "ci(deps)"
    registries:
      - morphe
    labels: []
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
