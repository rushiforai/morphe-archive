<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1020" viewBox="0 0 1920 1020" font-family="'Hiragino Sans','Noto Sans JP',sans-serif"><rect width="1920" height="1020" fill="#111111"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker></defs><text x="80" y="90" text-anchor="start" font-size="44" font-weight="700" fill="#F2F2F2">build-time と runtime</text><rect x="60" y="140" width="880" height="820" rx="30" fill="none" stroke="#3A3A3A" stroke-width="2" stroke-dasharray="10 8"/><text x="100" y="195" text-anchor="start" font-size="30" font-weight="700" fill="#7AA7FF">build-time（パッチ適用時）</text><rect x="980" y="140" width="880" height="820" rx="30" fill="none" stroke="#3A3A3A" stroke-width="2" stroke-dasharray="10 8"/><text x="1020" y="195" text-anchor="start" font-size="30" font-weight="700" fill="#4FD1A5">runtime（LINE の中で動く）</text><g id="patches"><rect x="120" y="250" width="760" height="170" rx="22" fill="#1E1E1E" stroke="#7AA7FF" stroke-width="3"/><text x="500.0" y="321.0" text-anchor="middle" font-size="34" font-weight="700" fill="#F2F2F2">patches/（Kotlin）</text><text x="500.0" y="365.0" text-anchor="middle" font-size="24" fill="#9A9A9A">bytecodePatch / resourcePatch で</text><text x="500.0" y="397.0" text-anchor="middle" font-size="24" fill="#9A9A9A">DEX とリソースを書き換え</text></g><g id="fingerprint"><rect x="120" y="500" width="760" height="170" rx="22" fill="#1E1E1E" stroke="#7AA7FF" stroke-width="3"/><text x="500.0" y="571.0" text-anchor="middle" font-size="34" font-weight="700" fill="#F2F2F2">fingerprint</text><text x="500.0" y="615.0" text-anchor="middle" font-size="24" fill="#9A9A9A">文字列・opcode・安定した型で一意に特定</text><text x="500.0" y="647.0" text-anchor="middle" font-size="24" fill="#9A9A9A">一致しなければ書き換えない</text></g><g id="status"><rect x="120" y="750" width="760" height="170" rx="22" fill="#1E1E1E" stroke="#7AA7FF" stroke-width="3"/><text x="500.0" y="821.0" text-anchor="middle" font-size="34" font-weight="700" fill="#F2F2F2">patch-status.json</text><text x="500.0" y="865.0" text-anchor="middle" font-size="24" fill="#9A9A9A">各パッチの結果を APK に記録</text><text x="500.0" y="897.0" text-anchor="middle" font-size="24" fill="#9A9A9A">（expected / actual）</text></g><g id="hook"><rect x="1040" y="250" width="760" height="170" rx="22" fill="#1E1E1E" stroke="#4FD1A5" stroke-width="3"/><text x="1420.0" y="321.0" text-anchor="middle" font-size="34" font-weight="700" fill="#F2F2F2">static hook</text><text x="1420.0" y="365.0" text-anchor="middle" font-size="24" fill="#9A9A9A">LINE の処理の途中で</text><text x="1420.0" y="397.0" text-anchor="middle" font-size="24" fill="#9A9A9A">Linimal の判定を呼ぶ</text></g><g id="ext"><rect x="1040" y="500" width="760" height="170" rx="22" fill="#1E1E1E" stroke="#4FD1A5" stroke-width="3"/><text x="1420.0" y="571.0" text-anchor="middle" font-size="34" font-weight="700" fill="#F2F2F2">extensions/linimal（Java）</text><text x="1420.0" y="615.0" text-anchor="middle" font-size="24" fill="#9A9A9A">Hooks / LinimalConfig</text><text x="1420.0" y="647.0" text-anchor="middle" font-size="24" fill="#9A9A9A">設定 OFF・例外時は公式の挙動</text></g><g id="settings"><rect x="1040" y="750" width="760" height="170" rx="22" fill="#1E1E1E" stroke="#4FD1A5" stroke-width="3"/><text x="1420.0" y="821.0" text-anchor="middle" font-size="34" font-weight="700" fill="#F2F2F2">Linimal 設定画面</text><text x="1420.0" y="865.0" text-anchor="middle" font-size="24" fill="#9A9A9A">LINE の設定の一番下</text><text x="1420.0" y="897.0" text-anchor="middle" font-size="24" fill="#9A9A9A">5 ページ・37 スイッチ</text></g><line x1="500" y1="420" x2="500" y2="495" stroke="#8A8A8A" stroke-width="3" marker-end="url(#ar)"/><line x1="500" y1="670" x2="500" y2="745" stroke="#8A8A8A" stroke-width="3" marker-end="url(#ar)"/><line x1="880" y1="335" x2="1035" y2="335" stroke="#8A8A8A" stroke-width="3" marker-end="url(#ar)"/><text x="957.5" y="321.0" text-anchor="middle" font-size="22" fill="#9A9A9A">命令を注入</text><line x1="1420" y1="420" x2="1420" y2="495" stroke="#8A8A8A" stroke-width="3" marker-end="url(#ar)"/><line x1="1420" y1="670" x2="1420" y2="745" stroke="#8A8A8A" stroke-width="3" marker-end="url(#ar)"/><line x1="880" y1="835" x2="1035" y2="600" stroke="#8A8A8A" stroke-width="3" marker-end="url(#ar)"/><text x="957.5" y="703.5" text-anchor="middle" font-size="22" fill="#9A9A9A">読み込み</text></svg>