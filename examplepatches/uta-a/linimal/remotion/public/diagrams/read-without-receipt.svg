<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="840" viewBox="0 0 1920 840" font-family="'Hiragino Sans','Noto Sans JP',sans-serif"><rect width="1920" height="840" fill="#111111"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker></defs><text x="80" y="90" text-anchor="start" font-size="44" font-weight="700" fill="#F2F2F2">既読をつけずに読む</text><g id="s1"><rect x="80" y="260" width="400" height="230" rx="22" fill="#1E1E1E" stroke="#7AA7FF" stroke-width="3"/><text x="280.0" y="361.0" text-anchor="middle" font-size="34" font-weight="700" fill="#F2F2F2">長押し</text><text x="280.0" y="405.0" text-anchor="middle" font-size="24" fill="#9A9A9A">メニュー / プレビュー</text></g><line x1="480" y1="375" x2="535" y2="375" stroke="#8A8A8A" stroke-width="3" marker-end="url(#ar)"/><g id="s2"><rect x="540" y="260" width="400" height="230" rx="22" fill="#1E1E1E" stroke="#4FD1A5" stroke-width="3"/><text x="740.0" y="361.0" text-anchor="middle" font-size="34" font-weight="700" fill="#F2F2F2">既読をつけずに読む</text><text x="740.0" y="405.0" text-anchor="middle" font-size="24" fill="#9A9A9A">未読のまま開く</text></g><line x1="940" y1="375" x2="995" y2="375" stroke="#8A8A8A" stroke-width="3" marker-end="url(#ar)"/><g id="s3"><rect x="1000" y="260" width="400" height="230" rx="22" fill="#1E1E1E" stroke="#4FD1A5" stroke-width="3"/><text x="1200.0" y="361.0" text-anchor="middle" font-size="34" font-weight="700" fill="#F2F2F2">閲覧セッション</text><text x="1200.0" y="405.0" text-anchor="middle" font-size="24" fill="#9A9A9A">既読の送信と</text><text x="1200.0" y="437.0" text-anchor="middle" font-size="24" fill="#9A9A9A">ローカル未読解除を止める</text></g><line x1="1400" y1="375" x2="1455" y2="375" stroke="#8A8A8A" stroke-width="3" marker-end="url(#ar)"/><g id="s4"><rect x="1460" y="260" width="400" height="230" rx="22" fill="#1E1E1E" stroke="#7AA7FF" stroke-width="3"/><text x="1660.0" y="361.0" text-anchor="middle" font-size="34" font-weight="700" fill="#F2F2F2">終了</text><text x="1660.0" y="405.0" text-anchor="middle" font-size="24" fill="#9A9A9A">送信 / すべて既読 /</text><text x="1660.0" y="437.0" text-anchor="middle" font-size="24" fill="#9A9A9A">退室で解除</text></g><g id="notif"><rect x="80" y="600" width="860" height="170" rx="22" fill="#1E1E1E" stroke="#7AA7FF" stroke-width="3"/><text x="510.0" y="671.0" text-anchor="middle" font-size="34" font-weight="700" fill="#F2F2F2">通知から既読をつけずに開く</text><text x="510.0" y="715.0" text-anchor="middle" font-size="24" fill="#9A9A9A">通知から開いた通常トークにも適用</text></g><line x1="510" y1="600" x2="1195" y2="495" stroke="#8A8A8A" stroke-width="3" marker-end="url(#ar)"/><g id="keep"><rect x="1000" y="600" width="840" height="170" rx="22" fill="#1E1E1E" stroke="#F0B45A" stroke-width="3"/><text x="1420.0" y="671.0" text-anchor="middle" font-size="34" font-weight="700" fill="#F2F2F2">送信しても既読を有効にしない</text><text x="1420.0" y="715.0" text-anchor="middle" font-size="24" fill="#9A9A9A">初期 OFF・誤解につながるため注意</text></g></svg>