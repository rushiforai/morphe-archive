name: Build and Release Morphe Patch Bundle

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Build & Publish .mpp Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Patch Bundle (.mpp)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew :patches:buildAndroid --no-daemon --stacktrace

      - name: Upload MPP Patch Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixiv-patches-bundle
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 30

      - name: Attach MPP to GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          MPP_FILE=$(ls patches/build/libs/*.mpp | head -n 1)
          echo "Releasing $MPP_FILE for tag $TAG_NAME"
          gh release upload "$TAG_NAME" "$MPP_FILE" --clobber || \
          gh release create "$TAG_NAME" "$MPP_FILE" --title "$TAG_NAME" --generate-notes

      - name: Update patches-bundle.json for Morphe Manager
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          MPP_FILE=$(ls patches/build/libs/*.mpp | head -n 1)
          MPP_NAME=$(basename "$MPP_FILE")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${MPP_NAME}"
          PAGE_URL="https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%S")

          # Checkout main branch to commit the bundle update
          git checkout main || git checkout -b main origin/main

          cat <<EOF > patches-bundle.json
          {
            "created_at": "${NOW}",
            "description": "Release v${VERSION} for Pixiv",
            "download_url": "${DOWNLOAD_URL}",
            "signature_download_url": "",
            "page_url": "${PAGE_URL}",
            "version": "${VERSION}"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          git commit -m "chore(release): update patches-bundle.json to v${VERSION} [skip ci]" || exit 0
          git push origin main

