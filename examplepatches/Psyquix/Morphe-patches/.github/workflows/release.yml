name: Release

# Fully automatic: merging to master (retarget or patch fix touching the
# versioned paths) builds, tests, tags <reddit>-morphe-ver-<nn> and
# publishes a Release whose notes show only the Reddit version built for.
# No human tagging; re-runs are idempotent (tagged HEAD is skipped).

on:
  push:
    branches: [master]
    paths:
      - "reddit-target.txt"
      - "patches/**"
      - "extensions/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version and next tag
        id: tag
        run: |
          VER="$(tr -d ' \t\r\n' < reddit-target.txt)"
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]{4}\.[0-9]+\.[0-9]+$'; then
            echo "error: invalid version in reddit-target.txt: $VER" >&2
            exit 1
          fi
          if git tag --points-at HEAD | grep -Eq -- "$VER-morphe-ver-[0-9]+$"; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "HEAD already carries a release tag for $VER; skipping."
          else
            LAST="$(git tag -l "$VER-morphe-ver-*" | sort -V | tail -n 1)"
            if [ -n "$LAST" ]; then
              N=$((10#${LAST##*-ver-} + 1))
            else
              N=1
            fi
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "tag=$VER-morphe-ver-$(printf '%02d' "$N")" >> "$GITHUB_OUTPUT"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
            # Bundle version shown in managers (manifest + patches-list):
            # 0.<NN>.0 tracks the release revision (ver-13 -> 0.13.0).
            echo "mppver=0.$N.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.tag.outputs.tagged != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        if: steps.tag.outputs.tagged != 'true'
        run: chmod +x gradlew

      - name: Run tests (gate)
        if: steps.tag.outputs.tagged != 'true'
        run: ./gradlew test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build patches
        if: steps.tag.outputs.tagged != 'true'
        run: ./gradlew :patches:buildAndroid -Pversion="${{ steps.tag.outputs.mppver }}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        if: steps.tag.outputs.tagged != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${{ steps.tag.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          printf 'Built for Reddit %s (experimental).\n' "$VER" > /tmp/opencode-notes.md
          # Name the bundle after the release revision: <reddit>-morphe-ver-<NN>
          # ships 0.<NN>.0.mpp (e.g. ver-13 -> 0.13.0.mpp). Downstream
          # resolves the asset by '*.mpp' glob, so the name is cosmetic.
          # The bundle's internal version is set via -Pversion at build time.
          MPP="${{ steps.tag.outputs.mppver }}.mpp"
          # The test gate above already built patches-1.0.0.mpp; select the
          # bundle matching this release's version (plugin names it
          # patches-<version>.mpp) and normalize it to the exact asset name.
          mapfile -t MPPS < <(compgen -G "patches/build/libs/*${{ steps.tag.outputs.mppver }}.mpp")
          if [ "${#MPPS[@]}" -ne 1 ]; then
            echo "error: expected exactly one .mpp bundle, found ${#MPPS[@]}" >&2
            exit 1
          fi
          mv "${MPPS[0]}" "patches/build/libs/$MPP"
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/opencode-notes.md "patches/build/libs/$MPP"
