    <rect x="302" y="0" width="168" height="32" rx="16" fill="#14191F" stroke="#28313B" stroke-width="1.5"/>
    <text x="386" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#D5DEE5">Pure AMOLED #000</text>
