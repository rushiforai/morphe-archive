name: Publish Rex IG Lite Release (.mpp)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (must match gradle.properties version, e.g. 3.14.0)'
        required: false
        default: '3.14.0'

permissions:
  contents: write
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build, Verify & Publish Rex IG Lite Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Requested Version / Tag Against gradle.properties
        id: version_check
        run: |
          PROP_VERSION=$(grep -E '^version\s*=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -z "$PROP_VERSION" ]; then
            echo "::error::Missing 'version' in gradle.properties"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_RAW="${{ github.event.inputs.version }}"
            REQ_VERSION="${INPUT_RAW#v}"
            if [ -z "$REQ_VERSION" ]; then
              REQ_VERSION="$PROP_VERSION"
            fi
            if [ "$REQ_VERSION" != "$PROP_VERSION" ]; then
              echo "::error::Requested workflow_dispatch version (${REQ_VERSION}) does not match gradle.properties version (${PROP_VERSION}). Update gradle.properties first."
              exit 1
            fi
            FINAL_VERSION="$REQ_VERSION"
          elif [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG_RAW="${GITHUB_REF_NAME}"
            TAG_VERSION="${TAG_RAW#v}"
            if [ "$TAG_VERSION" != "$PROP_VERSION" ]; then
              echo "::error::Pushed git tag (${TAG_RAW} -> ${TAG_VERSION}) does not match gradle.properties version (${PROP_VERSION})."
              exit 1
            fi
            FINAL_VERSION="$TAG_VERSION"
          else
            FINAL_VERSION="$PROP_VERSION"
          fi

          echo "version=${FINAL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${FINAL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Validated release version: ${FINAL_VERSION} (tag: v${FINAL_VERSION})"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Read-Only Static & Structural Audit Suite
        run: python3 scripts/verify_rex_ig_lite.py

      - name: Build Morphe Patch Bundle (.mpp) with Android Extensions
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :patches:checkStringResources build :patches:generatePatchesList --no-daemon --stacktrace
          ./gradlew :patches:buildAndroid --rerun-tasks --no-daemon --stacktrace
          MPP_CHECK=$(find patches/build/libs -maxdepth 1 -name "*.mpp" ! -name "*-sources*" ! -name "*-javadoc*" | head -n 1)
          if [ -z "$MPP_CHECK" ]; then
            echo "::error::No .mpp artifact produced in patches/build/libs"
            exit 1
          fi
          JAR_LIST=$(jar tf "$MPP_CHECK")
          echo "$JAR_LIST" | sed -n '1,30p'
          if ! echo "$JAR_LIST" | grep -q "\.dex$"; then
            echo "::error::CRITICAL: Built .mpp does not contain compiled Android extension (.dex)!"
            exit 1
          fi

      - name: Create GitHub Release First and Then Update patches-bundle.json
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version_check.outputs.version }}"
          TAG="${{ steps.version_check.outputs.tag }}"

          MPP_FILE="patches/build/libs/patches-${VERSION}.mpp"
          if [ ! -f "$MPP_FILE" ]; then
            echo "::error::Expected compiled bundle ${MPP_FILE} not found in patches/build/libs/"
            ls -la patches/build/libs/ || true
            exit 1
          fi

          MPP_FILENAME=$(basename "$MPP_FILE")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${MPP_FILENAME}"

          if [ -f "patches/build/patches-list.json" ]; then
            cp "patches/build/patches-list.json" ./patches-list.json
          fi
          python3 scripts/verify_rex_ig_lite.py --populate-categories
          python3 scripts/verify_rex_ig_lite.py

          COUNTS=$(python3 -c '
          import json
          with open("patches-list.json") as f:
              patches = json.load(f).get("patches", [])
          named = [p for p in patches if p.get("name") and p.get("name") != "<init>"]
          pkgs_of = lambda p: [cp.get("packageName") for cp in (p.get("compatiblePackages") or []) if isinstance(cp, dict)] if isinstance(p.get("compatiblePackages"), list) else list((p.get("compatiblePackages") or {}).keys())
          ig = sum(1 for p in named if "com.instagram.android" in pkgs_of(p) and "com.twitter.android" not in pkgs_of(p))
          tw = sum(1 for p in named if "com.twitter.android" in pkgs_of(p) and "com.instagram.android" not in pkgs_of(p))
          sh = sum(1 for p in named if "com.instagram.android" in pkgs_of(p) and "com.twitter.android" in pkgs_of(p))
          print(f"{len(named)} named patches ({ig} Instagram-only, {tw} X-only, {sh} shared; {len(patches)} total manifest entries)")
          ')

          CREATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%S")
          python3 -c "
          import json, re
          bundle = {
              'created_at': '${CREATED_AT}',
              'description': 'Rex IG Lite Patches v${VERSION} by xboyrex (${COUNTS})',
              'download_url': '${DOWNLOAD_URL}',
              'signature_download_url': '',
              'version': '${VERSION}'
          }
          with open('patches-bundle.json', 'w') as f:
              json.dump(bundle, f, indent=2)
              f.write('\n')
          with open('README.md', 'r') as f:
              readme = f.read()
          readme = re.sub(r'release-v[0-9]+\.[0-9]+\.[0-9]+-88C2CE', 'release-v${VERSION}-88C2CE', readme)
          with open('README.md', 'w') as f:
              f.write(readme)
          "

          RELEASE_NOTES="## Rex IG Lite v${VERSION} — by xboyrex

          - **Patch Bundle**: \`${MPP_FILENAME}\`
          - **Total Manifest Count**: ${COUNTS}
          - **Quick Add in Morphe**: [Add Rex IG Lite to Morphe](https://morphe.software/add-source?github=${{ github.repository }})
          - **Bundle Endpoint**: \`https://raw.githubusercontent.com/${{ github.repository }}/main/patches-bundle.json\`"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$MPP_FILE" ./patches-bundle.json ./patches-list.json --clobber
            gh release edit "$TAG" --title "Rex IG Lite ${TAG}" --notes "$RELEASE_NOTES" --latest
          else
            gh release create "$TAG" "$MPP_FILE" ./patches-bundle.json ./patches-list.json \
              --title "Rex IG Lite ${TAG}" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json patches-list.json README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): update patches-bundle.json and patches-list.json for ${TAG} [skip ci]"
            git fetch origin main
            git rebase --autostash origin/main
            git push origin HEAD:refs/heads/main
            git push origin HEAD:refs/heads/dev --force
            git fetch origin main
            git diff --exit-code origin/main -- patches-bundle.json patches-list.json README.md
          fi
