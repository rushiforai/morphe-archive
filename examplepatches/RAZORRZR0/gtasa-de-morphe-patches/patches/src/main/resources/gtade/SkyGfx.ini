[General]
; Master switch for all SkyGfx effects.
; 1 = enabled
; 0 = disabled (game renders as stock)
Enabled=1
; Log verbosity written to logcat (tag SkyGfx). Applies live.
; 0 = errors and startup only
; 1 = info
; 2 = verbose, plus a status line per feature every few seconds
Log=0

[ColourFilter]
; PS2-style colour filter applied over the final image.
; 1 = on
; 0 = off
PS2Filter=1
; Strength of the colour filter. 0 = none, 1 = full.
; range: 0..2
Strength=1.0
; How strongly the game's own timecycle grading is kept under the filter. 0 = none, 1 = full.
; range: 0..2
GameTimecycStrength=0.35
; How much of the original brightness is kept when the filter darkens the image. 0 = none, 1 = full.
; range: 0..1
KeepBrightness=0.5

[Grade]
; Colour saturation. 1.0 = unchanged.
; range: 0..2
Saturation=1.15
; Colour contrast. 1.0 = unchanged.
; range: 0.5..2
Contrast=1.05

[Atmosphere]
; Sky and fog model.
; 0 = classic sky
; 1 = GTA fog
; 2 = modern
Mode=0
; Distance of the fog. Larger values push fog further away.
; range: 0.5..5
FogDistance=1.8
; Opacity of the fog. 0 = clear, 1 = opaque.
; range: 0.05..0.95
FogOpacity=0.5
; Haze strength around the horizon. 0 = none, 1 = strong.
; range: 0..2
Haze=0.35
; Haze strength near the ground. 0 = none, 1 = strong.
; range: 0..2
GroundHaze=0.0

[Colours]
; Sky colour multiplier. 1.0 = default.
; range: 0..1
Sky=1.0
; Fog colour multiplier. 1.0 = default.
; range: 0..1
Fog=1.0
; Ambient light level. 0 = none, 1 = full.
; range: 0..1
Ambient=0.25
; Sun colour multiplier. 1.0 = default.
; range: 0..1
Sun=0.35
; Cloud colour multiplier. 1.0 = default.
; range: 0..1
Clouds=0.5
; Overall brightness. 1.0 = default.
; range: 0..2
Brightness=1.0
; Exposure adjustment at night. Negative values darken, positive values brighten.
; range: -4..4
NightExposure=-0.5

[Shadows]
; Darkness of shadows. 0 = none, 1 = full.
; range: 0..0.9
Darkness=0.5

[Timecyc]
; Which timecycle colour table is used.
; 1 = PS2 table
; 0 = game table
PS2Timecyc=1
; Timecyc file used by PS2Timecyc, in the configs folder (or an absolute path). 8-hour files (23 weathers x 8 lines)
; or 24-hour files (23 x 24). Default: the PS2 one.
File=timecyc_ps2.dat

[Radiosity]
; The PS2 glow around bright areas (the original's radiosity pass).
; 1 = on
; 0 = off
Radiosity=1
; Strength of the glow, 0 to 255. 35 = PS2.
; range: 0..255
Intensity=35
; How far up-left the glow sits from its source, in PS2 pixels, 0 to 64. 6 = PS2, 0.2 = nearly centred.
; range: 0..12
Offset=0.2
; The game's own bloom while the glow is on. 0 = off (the PS2 had no bloom), 1 = unchanged.
; range: 0..1
DEBloom=0.0

[Grain]
; PS2 film grain in rain.
; 1 = on
; 0 = off
Grain=1
; Strength of the grain. 1 = PS2.
; range: 0..2
GrainStrength=1.0

[WaterDrops]
; Water drops on the lens in rain and near splashes, hydrants and fountains.
; 1 = on
; 0 = off
Enabled=1
; Most drops on screen at once, 0 to 2000.
; range: 0..2000
MaxDrops=2000

[SpeedFX]
; The PS2 speed blur when driving fast.
; 1 = on
; 0 = off
SpeedFX=1
; Forces the full speed blur on for testing.
; 1 = always on
; 0 = normal behaviour
TestMode=0

[StreetLights]
; Distance at which street lights are drawn, in decametres.
; range: 0..50
DrawDistanceDm=15
; Brightness of bollard lights. 0 = off, 1 = full.
; range: 0..1
BollardBrightness=0.5
; Brightness of globe lamps. Higher values are brighter.
; range: 1..16
GlobeLampBrightness=8

[Corona]
; Distant street lamp glows at night (Project2DFX SALodLights).
; 1 = on
; 0 = off
Enabled=1
; Size of the glow. 0 = none, 1 = full.
; range: 0.1..2
Size=0.5
; Brightness of the glow. 0 = none, 1 = full.
; range: 0..4
Intensity=1.0
; Distance at which the glow stops drawing, in decametres. 0 = the weather's draw distance.
; range: 0..500
FarClipDm=0

[World]
; Level-of-detail distance multiplier. Higher values draw distant objects at higher detail.
; range: 0.5..4
LodDistance=1.8

[ModernLook]
; Strength of the sun light. 1.0 = DE's, higher is stronger, 0 = no sunlight.
; (PC's SSGI, ambient occlusion, reflections, volumetric fog and lens flare need Unreal's desktop renderer; the
; Android game runs the mobile renderer, which has none of them.)
; range: 0..3
SunStrength=1.0

[Graphics]
; The detail settings of the PC version, which the phone menu only offers as presets. "Game default" keeps what
; the game's preset picked. A chosen value beats the presets; after going back to "Game default", the game's own
; menu changes to that setting apply again after a restart. All apply while playing.
; How far away objects are drawn.
; 0 = Game default
; 1 = Low
; 2 = Medium
; 3 = High
; 4 = Very high
; 5 = Ultra
; 6 = Max
ViewDistance=0
; How far away models keep their full detail (less pop-in when higher).
; 0 = Game default
; 1 = Low
; 2 = Medium
; 3 = High
; 4 = Ultra
MeshDetail=0
; Grass and plant density.
; 0 = Game default
; 1 = Low
; 2 = Medium
; 3 = High
; 4 = Ultra
Foliage=0
; Sun shadow sharpness (shadow map size and cascades).
; 0 = Game default
; 1 = Low
; 2 = Medium
; 3 = High
; 4 = Ultra
ShadowQuality=0
; How far away sun shadows are drawn.
; 0 = Game default
; 1 = Low
; 2 = Medium
; 3 = High
; 4 = Very high
; 5 = Ultra
ShadowDistance=0
; Anti-aliasing (smooths jagged edges).
; 0 = Game default
; 1 = Off
; 2 = MSAA 2x
; 3 = MSAA 4x
AntiAliasing=0
; Texture sharpness at an angle (anisotropic filtering).
; 0 = Game default
; 1 = Off
; 2 = 2x
; 3 = 4x
; 4 = 8x
; 5 = 16x
TextureFiltering=0
; AMD FSR 1.0 upscaling: rebuilds the screen from the game's lower render resolution with sharp edges instead of the game's
; blurry stretch. Works when the game's own resolution setting is below native.
; 1 = on
; 0 = off
FSR=0
; FSR sharpening strength.
; 0 = Low
; 1 = Medium
; 2 = High
FSRSharpness=1

[Debug]
; Forces a weather type. -1 = off, 0 to 22 = weather id.
ForceWeather=-1
; Second weather type to blend towards. -1 = off, 0 to 22 = weather id.
BlendWeatherB=-1
; Blend between weather A and weather B. 0 = A, 1 = B.
; range: 0..1
Blend=0.0
; Jumps the clock to this hour when the value changes during play (not at game start). -1 = off, 0 to 23 = hour.
; range: -1..23
SetHour=-1
; Minute for SetHour. -1 = 0, 0 to 59 = minute.
; range: -1..59
SetMinute=-1
; Stops the game clock.
; 1 = frozen
; 0 = normal
FreezeTime=0
; Speed of the game clock. 1.0 = normal.
; range: 0.1..60
TimeSpeed=1.0
; Fast-forwards the clock through the day.
; 1 = on
; 0 = off
Timelapse=0
; Lets the player move through walls.
; 1 = on
; 0 = off
Noclip=0
; Detaches the camera from the player.
; 1 = on
; 0 = off
Freecam=0
; Movement speed in noclip mode.
; range: 1..200
NoclipSpeed=15
; Movement speed in freecam mode.
; range: 1..200
FreecamSpeed=20
; Moves the player to the camera position when switched to 1 during play.
; 1 = move
; 0 = do nothing
MovePlayerToCamera=0
; Runs the on-device probes (writes diagnostics to logcat). Restart required.
; 1 = on
; 0 = off
Probes=0
