; ProjectPropsDE for GTA SA: The Definitive Edition (Android).
; Port of the PC ProjectPropsDE: Project Props 4 placements, IplActorsDE and the DE_LimitAdjuster pools it needs.
; The placements come from ProjectPropsDE.dat (same folder), made by build_props.py.
; Every setting applies at the next game start (the map is loaded once).

[General]
; 0 = load no props (the pools below still apply)
Enabled=1
; 0 = no log, 1 = log to logcat (tag ProjectPropsDE), 2 = also how many props have a UE actor, every 10 s
Log=0

; Pool sizes. 0 = keep DE's size. Values below were measured on PC with all 16,166 placements
; (load + driving around); DE's own size is in the comment.
[Pools]
; DE 75000
PtrNodeSingle=100000
; DE 7500. About 13500 used at load: crash on load without this
PtrNodeDouble=20000
; DE 600. Fills while driving past knock-over props
EntryInfoNode=4000
; DE 14000. About 10000 used
Buildings=24000
; DE 8500. About 10200 used at load
Dummys=20000
; DE 10400. About 10000 used
ColModel=12000
; DE 1800. Every tilted prop keeps one matrix for good (1,066 of them)
MatrixList=8000
