; GTA_Prop_Fix settings.

[Props]
; 1 = knocked-over props keep the original RenderWare physics (CPhysical):
;     world collision, car collision and object.dat mass/uproot values.
; 0 = stock Definitive Edition behaviour (Unreal PhysX hand-off).
RenderWarePhysicsForDislodgedProps=1
; 1 = street lights switch off once tilted, like the original game.
StreetLightsOffWhenTilted=1
; 1 = lamp posts and traffic lights fall over in one piece (RenderWare physics).
; 0 = they shatter into DE's broken pieces (the 2004 game broke them: object.dat damage effect 200).
StreetLightsFallWhole=0
; Seconds before a street light that fell over whole disappears (0 = stays). Only with StreetLightsFallWhole=1.
FallenPolesDisappearSeconds=6
; Seconds before any other knocked-loose prop (bins, hydrants, ...) disappears. 0 = stays, like the original.
KnockedPropsDisappearSeconds=0
; A prop is only handed to RenderWare physics when its RenderWare collision is at least this tall
; relative to the visible prop. Some DE poles only have collision at the base; RenderWare would let
; them hang under the road, so those keep DE's breaking behaviour instead.
MinCollisionCoveragePercent=60
; The solid collision shapes (spheres/boxes/triangles) must also fill this much of the collision box
; height. Some poles (e.g. BP_MTraffic1_C) have a tall box but solid shapes only at the base.
MinShapeCoveragePercent=70
; RenderWare only lands a falling prop on its collision SPHERES. Some DE props (e.g. BP_MTraffic1_C)
; are a triangle mesh with a single sphere, so everything but the base goes through the road.
; 1 = generate spheres along those props (only for props this plugin simulates) so they fall in one piece.
; 0 = keep DE's breaking behaviour for them.
GenerateCollisionSpheres=1
; 1 = fallen poles stay solid for cars and peds.
; 0 = original: cars pass through a lamp post once it lies on the ground (IsFallenLampPost).
FallenPolesBlockCars=1
; 1 = a knocked-over prop that has settled can still be pushed by any car or ped.
; 0 = original: after a few seconds it is rooted again and only moves if hit harder than its uproot limit.
KnockedPropsStayPushable=1

[Debris]
; 1 = broken fragments land on the original ground plane (BreakObject_c).
OriginalGroundPlane=1
; 0 = like the original: pieces disappear after PiecesDisappearSeconds.
; 1 = keep pieces on the ground permanently.
; 2 = stock DE: pieces fall through the map when the Blueprint removes its floor (~6 s).
Lifetime=0
; 1 = broken pieces move like the original game's pieces (gta-reversed BreakObject_c): they pop up with the
;     object.dat break velocity, fall at the original 2 g, tumble briefly, turn flat towards the ground,
;     bounce off it (x0.85 reflect, x0.8 speed), stop when slow, fade out and disappear. Like the original,
;     they only touch the ground: cars and peds pass through them.
; 0 = DE's own PhysX pieces.
OriginalPieceMotion=1
; Seconds the pieces take to fade out at the end of their life (original: 2.55 = 127.5 frames at 50/s).
; DE's prop materials ignore transparency, so the pieces also slide under the ground during this time. 0 = no fade.
PiecesFadeSeconds=2.55
; Seconds before broken pieces disappear (original pieces faded after roughly 5-9 s). 0 = never.
PiecesDisappearSeconds=6
; Size of the invisible ground plane under fragments, in metres (only fragments collide with it).
GroundPlaneSizeMeters=30
; Angular damping for broken pieces (original pieces stopped rotating when they landed). 0 = stock.
FragmentAngularDamping=1.5
; 1 = continuous collision detection on fragments.
ContinuousCollision=1

[PhysX]
; 1 = 4 x 1/60 s PhysX substeps for fragments.
Substepping=1

[Debug]
; GTA_Prop_Fix.log is written to the mod loader's data folder. 0 = off, 1 = prop events (repeats throttled) + a summary every
; 30 s, 2 = verbose (every damage call, light switches, RemoveFloor).
Log=0
