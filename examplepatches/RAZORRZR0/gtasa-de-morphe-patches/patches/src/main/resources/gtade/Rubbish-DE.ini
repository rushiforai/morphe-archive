; ============================================================================
; Rubbish-DE 1.0 - SETTINGS
; Loose litter that blows around when vehicles pass, for GTA San Andreas -
; The Definitive Edition. Port of RubbishSA. Restart the game after editing.
; Change the number after =. Lines starting with ; are explanations.
; ============================================================================

[Main]
; 1 = on, 0 = off.
Enabled=1
; Litter lies within this many metres of the camera (original: VC 23, III 18).
MaxDistance=23
; New pieces appear between SpawnDistance and MaxDistance, out of view when
; possible (the original faded sheets in here; DE objects can't fade).
SpawnDistance=20
; Driving or flying fast: litter is kept and spawned further out, this many
; seconds of travel ahead, up to FastMaxDistance metres (the litter models
; stop drawing at about 50 m).
FastMaxDistance=45
LookAheadSeconds=1
; 1 = a piece that falls behind comes back as a new object ahead. 0 = the old
; object is moved there (cheaper, but DE motion-blurs the jump into a streak).
RespawnAsNewObject=1
; 1 = litter stays during missions. 0 = cleared while a mission runs.
DuringMissions=1


; ---------------------------------------------------------------------------
; LITTER PER AREA
; Every spot picks its own area, so city litter and forest debris mix at the
; edge of town. Count = pieces around you (0 = none in that area).
; Items = model, kind, weight - separated by commas. Weight = how often it is
; picked compared to the others. Kinds:
;   paper  light sheets: fly high, flutter down
;   light  cups, boxes: lift less, tumble
;   roll   cans: small hop, roll along the ground
;   stick  branches: only move when a vehicle drives right over them
;   weed   dry weeds: bounce and roll, carried far
; The models are DE's own clutter meshes, added by 904-Rubbish-DE_P.pak:
;   2672 2675 2676 2677  paper flyers 1-4        849  food wrapper
;   850  burger box       851  Sprunk cup          852  soda can
;   853  small branch     854 2821 2856  branches  2861 medium branch
;   2866 2867  dry weeds
; ---------------------------------------------------------------------------
[City]
; Los Santos, San Fierro, Las Venturas and the towns listed under [Zones].
Count=32
; Pieces in Los Santos during the riots at the end of the story.
RiotCount=128
Items=2672 paper 3, 2675 paper 3, 2676 paper 3, 2677 paper 3, 849 paper 3, 850 light 2, 851 light 2, 852 roll 2

[Woods]
; Red County, Flint County, Whetstone (Mount Chiliad) outside the towns.
Count=24
Items=853 stick 3, 854 stick 3, 2821 stick 3, 2856 stick 2, 2861 stick 1

[Desert]
; Bone County and Tierra Robada outside the towns.
Count=10
Items=2866 weed 1, 2867 weed 1


[Zones]
; Exceptions by zone name (the names in the game's info.zon; a name also
; covers its numbered parts, e.g. MTCHI = MTCHI1..MTCHI4). Comma separated.
; Countryside towns that get city litter:
Town=MONT, PALO, DILLI, BLUEB, ANGPI, CARSO, BARRA, ELQUE, SUNNN, SUNMA, EBAY
; Places inside a city or desert that get forest debris (HILLP = Missionary Hill):
Woods=HILLP
; Places that get desert weeds:
Desert=
; No litter at all here (like the original's ZonesToNotAppearIn):
Off=


[Physics]
; 1 = passing vehicles lift litter.
Vehicles=1
; 1 = a low helicopter's rotor wash blows litter away.
Helicopters=1
; 1 = CJ running through litter kicks it.
OnFoot=1
; Slowest vehicle (metres per second, 8 = about 29 km/h) that lifts litter.
; Branches need 1.4 times this.
MinVehicleSpeed=8
; How hard litter is thrown (1 = normal, 0.5 = gentle, 2 = wild).
Strength=1


[Debug]
; 1 = typing RUBBISHTEST shows all 15 litter models in a row in front of CJ
; for 30 seconds (left to right in the order listed above).
PreviewCheat=0
; 1 = write what the mod does to logcat (tag Rubbish-DE).
Log=0
