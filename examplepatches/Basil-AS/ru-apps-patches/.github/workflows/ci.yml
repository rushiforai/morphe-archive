name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python verification scripts
        run: python -m py_compile scripts/verify_rustore_downloads.py scripts/test_verify_rustore_downloads.py scripts/test_patch_list_generator.py

      - name: Run downloader verification tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon -Pkotlin.incremental=false :patches:compileKotlin :patches:buildAndroid :patches:generatePatchesList
