        /* TeX math (MathJax) */
        .md-math-display {
            overflow-x: auto;
            overflow-y: hidden;

            margin: 0.75em 0;

        /* MathJax's own stylesheet is not injected when startup.typeset is
           false, so center display math ourselves. display: table shrink-wraps
           to the formula and lets margin: auto center it; when a formula is
           wider than the screen the block starts at the left edge, so the
           wrapper's horizontal scroll still reaches everything. */
        .md-math-display mjx-container[display="true"] {
            display: table;
            margin: 0 auto !important;
        }

        .md-math-inline mjx-container {
            margin: 0 !important;
        }

        .md-math-error {
            font-family: monospace;
            white-space: pre-wrap;

        /* MathJax adds an accessibility copy of each formula as MathML. Its own

        mjx-assistive-mml {

        /* Dark theme, following Box's night mode. The app paints the WebView
