name: Release

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Also run :patches:test in CI (slow; tests normally run locally)'
        type: boolean
        default: false
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify agent docs
        run: python3 -B .github/scripts/check_agent_docs.py

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify patch category documentation
        run: python3 -B .github/scripts/test_generate_patches_readme.py

      - name: Verify external release artifact paths
        run: node .github/scripts/test_release_artifact_paths.cjs

      - name: Run unit tests
        if: ${{ inputs.run_tests }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:test --no-daemon

      # Semantic release owns the release build. gradle-semantic-release-plugin bumps
      # gradle.properties to the next version, then @semantic-release/exec prepareCmd
      # runs ./gradlew clean generatePatchesList, rebuilding the bundle and every
      # catalog from scratch. That happens before any git tag is created, so a broken
      # tree fails the run with nothing published.
      # The Gradle graph ends at :patches:buildAndroid and :patches:generatePatchesList
      # (see patches/build.gradle.kts); :patches:test is a local step (AGENTS.md) and is
      # never compiled or executed here.
      # Only dev and main branch will generate a release as specified by .releaserc
      #
      # semantic-release pushes the release commit and tag before the small
      # refs/notes/semantic-release-<tag> push. GitHub can reject that last push with
      # "(missing necessary objects)" while objects from the preceding pushes are still
      # replicating (a known transient). The build from prepareCmd is already on disk at
      # that point, so the recovery step retries only the notes push and then runs the
      # configured @semantic-release/github publish hook with the notes recorded in the
      # release commit. It never rebuilds the bundle and never rewrites pushed history.
      - name: Release
        id: semantic_release
        continue-on-error: true
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Complete interrupted release
        id: complete_release
        if: steps.semantic_release.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/complete_interrupted_release.mjs

      # The Release step owns the output contract. This selector lets the rest of the
      # job consume either a normal release or one completed by the recovery step.
      - name: Select release outputs
        id: release
        if: always()
        env:
          FIRST_PUBLISHED: ${{ steps.semantic_release.outputs.new_release_published }}
          FIRST_VERSION: ${{ steps.semantic_release.outputs.new_release_version }}
          FIRST_TAG: ${{ steps.semantic_release.outputs.new_release_git_tag }}
          COMPLETED_PUBLISHED: ${{ steps.complete_release.outputs.new_release_published }}
          COMPLETED_VERSION: ${{ steps.complete_release.outputs.new_release_version }}
          COMPLETED_TAG: ${{ steps.complete_release.outputs.new_release_git_tag }}
        run: |
          published="${FIRST_PUBLISHED:-false}"
          version="${FIRST_VERSION:-}"
          tag="${FIRST_TAG:-}"
          if [ "$published" != "true" ] && [ "${COMPLETED_PUBLISHED:-false}" = "true" ]; then
            published=true
            version="$COMPLETED_VERSION"
            tag="$COMPLETED_TAG"
          fi
          {
            echo "new_release_published=$published"
            echo "new_release_version=$version"
            echo "new_release_git_tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve released bundle
        if: steps.release.outputs.new_release_published == 'true'
        id: release_artifact
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.new_release_version }}
        run: node .github/scripts/resolve_release_artifact.cjs

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: ${{ steps.release_artifact.outputs.path }}

      # No release was published from this commit (other branches, chore, docs, ...):
      # build the complete release graph once as the push gate. No branch artifact is
      # uploaded; build outputs are not consumed from CI.
      - name: Verify build when no release was published
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid :patches:generatePatchesList -PreleaseChannel=${{ github.ref_name == 'main' && 'stable' || 'experimental' }}
