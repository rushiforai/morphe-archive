name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

# Serialize with Release: both workflows update main.
concurrency:
  group: morphe-main-branch-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync Morphe Patches
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve repository-specific workflows and release metadata.
          mkdir -p /tmp/local-files
          if [ -d .github/workflows ]; then
            cp -a .github/workflows /tmp/local-files/workflows
          fi
          for path in .releaserc CHANGELOG.md gradle.properties patches-bundle.json patches-list.json README.md; do
            if [ -e "$path" ]; then
              mkdir -p "/tmp/local-files/$(dirname "$path")"
              cp -a "$path" "/tmp/local-files/$path"
            fi
          done

          git remote add upstream https://github.com/MorpheApp/morphe-patches.git
          git fetch upstream main --force

          # Keep upstream history and tags while resolving modify/delete conflicts
          # in favor of upstream. -X theirs alone does not resolve those conflicts.
          if ! git merge --no-edit -X theirs upstream/main; then
            while IFS= read -r path; do
              if ! git checkout --theirs -- "$path" 2>/dev/null; then
                git rm -f -- "$path" 2>/dev/null || true
              fi
            done < <(git diff --name-only --diff-filter=U)
            git add -A
            git -c core.editor=true commit --no-edit
          fi

          # Restore this fork's own workflow and release configuration.
          rm -rf .github/workflows
          mkdir -p .github
          if [ -d /tmp/local-files/workflows ]; then
            cp -a /tmp/local-files/workflows .github/workflows
          fi

          for path in .releaserc CHANGELOG.md gradle.properties patches-bundle.json patches-list.json README.md; do
            if [ -e "/tmp/local-files/$path" ]; then
              mkdir -p "$(dirname "$path")"
              cp -a "/tmp/local-files/$path" "$path"
            fi
          done

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream while preserving local release files"
          fi

          git push origin main
