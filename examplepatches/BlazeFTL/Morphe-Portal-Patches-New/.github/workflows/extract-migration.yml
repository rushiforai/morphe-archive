name: Extract migration zip

on:
  workflow_dispatch:
    inputs:
      zip_path:
        required: false
        default: "Morphe-Portal-Patches-New-dev.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract
        run: |
          ZIP="${{ inputs.zip_path }}"
          if [ ! -f "$ZIP" ]; then
            echo "::error::$ZIP not found"
            exit 1
          fi
          rm -rf extensions/extension patches/src/main/kotlin/app/template
          unzip -o "$ZIP" -d .
          rm -f "$ZIP"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: extract migration zip"
          git push origin HEAD:${{ github.ref_name }}
