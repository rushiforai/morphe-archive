name: 🐞 Bug report
description: Report a bug or an issue.
title: "bug: "
labels: ["Bug report"]
body:
  - type: markdown
    attributes:
      value: |
        # Bug report

        Before creating a new bug report, please keep the following in mind:

        - **Do not submit a duplicate bug report**: Search for existing bug reports [here](https://github.com/OmarBrbutovic/merak-patches/issues?q=label%3A%22Bug+report%22).
        - **Never share codes, secret keys or QR codes**: Hide account names and codes in screenshots and videos.
  - type: textarea
    attributes:
      label: Bug description
      description: |
        - Describe your bug in detail
        - Add steps to reproduce the bug if possible (Step 1. ... Step 2. ...)
        - Add images and videos if possible
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Versions and setup used when the bug happened.
      value: |
        - Google Authenticator version (before patching):
        - Patches version:
        - Patches applied (and changed patch options):
        - Patched with (Morphe Manager / Morphe Desktop) and its version:
        - MicroG-RE version (if signing in):
        - Device and Android version:
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error logs
      description: Exceptions can be captured by running `adb logcat | grep -E "AndroidRuntime|MorpheOrganizer"` in a shell.
      render: shell
  - type: textarea
    attributes:
      label: Solution
      description: If applicable, add a possible solution to the bug.
  - type: textarea
    attributes:
      label: Additional context
      description: Add additional context here.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your bug report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: All requested information has been provided properly.
          required: true
