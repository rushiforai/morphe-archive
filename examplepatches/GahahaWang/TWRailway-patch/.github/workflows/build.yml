name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - main
      - dev

jobs:
  build:
    name: Build patches
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Upload patches bundle
        uses: actions/upload-artifact@v7
        with:
          name: patches
          path: patches/build/libs/patches-*.mpp
