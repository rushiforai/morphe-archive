[versions]
agp = "9.5.1"
morphe-patcher = "2.5.0"
morphe-patches-library = "2.2.0"
#noinspection GradleDependency
smali = "4220ae75f7"
gson = "2.15.0"
animalsniffer = "2.0.1"
