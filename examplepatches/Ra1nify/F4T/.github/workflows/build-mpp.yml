name: Build bundle

on:
  workflow_call:
    inputs:
      version:
        description: Exact bundle version (yy.MM.dd.<sequence>)
        required: true
        type: string
      flavor:
        description: release (R8-minified) or debug (unminified extension)
        required: true
        type: string
      sign:
        description: Sign the bundle with MORPHE_SIGNING_KEY
        required: false
        type: boolean
        default: false
      upload:
        description: Upload the bundle as a workflow artifact
        required: false
        type: boolean
        default: true
    secrets:
      MORPHE_SIGNING_KEY:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      # Web uploads and squashed history can drop the executable bit from gradlew.
      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Build bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ inputs.sign && secrets.MORPHE_SIGNING_KEY || '' }}
        run: |
          args=(-Pf4t.version="${{ inputs.version }}")
          if [ "${{ inputs.flavor }}" = "debug" ]; then
            args+=(-PnoMinify=true)
          fi
          ./gradlew buildAndroid "${args[@]}" --console=plain

      - name: Verify bundle
        run: |
          python3 scripts/verify_bundle.py \
            patches/build/libs/*.mpp "${{ inputs.version }}" "${{ inputs.sign }}"

      - uses: actions/upload-artifact@v4
        if: inputs.upload
        with:
          name: f4t-${{ inputs.version }}-${{ inputs.flavor }}
          path: patches/build/libs/*.mpp
          retention-days: 90
