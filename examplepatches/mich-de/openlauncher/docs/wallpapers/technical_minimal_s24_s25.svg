<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3120" viewBox="0 0 1440 3120">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="60%" stop-color="#0e0e0e"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="2.2" fill="#262626"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1440" height="3120" fill="url(#vignette)"/>
  <rect width="1440" height="3120" fill="url(#dot-grid)"/>

  <!-- Subtle Orange Accent Lines (Teenage Engineering style) -->
  <line x1="80" y1="240" x2="1360" y2="240" stroke="#262626" stroke-width="1.5"/>
  <circle cx="80" cy="240" r="4" fill="#ff5a1f"/>
  <circle cx="1360" cy="240" r="4" fill="#ff5a1f"/>

  <!-- Technical Monospace Coordinates -->
  <text x="96" y="228" fill="#5f5b55" font-family="monospace" font-size="22" letter-spacing="3">S24 // S25 // S25 EDGE • DISPLAY OPTIMIZED</text>
  <text x="1344" y="228" fill="#ff5a1f" font-family="monospace" font-size="22" font-weight="bold" text-anchor="end">120Hz LTPO</text>

  <!-- Subtle Dot Matrix Brand in Center Background -->
  <g opacity="0.15" transform="translate(480, 1500)">
    <circle cx="40" cy="40" r="8" fill="#ff5a1f"/>
    <circle cx="80" cy="40" r="8" fill="#ffffff"/>
    <circle cx="120" cy="40" r="8" fill="#ffffff"/>
    <circle cx="160" cy="40" r="8" fill="#ffffff"/>
    <circle cx="200" cy="40" r="8" fill="#ffffff"/>
    <circle cx="240" cy="40" r="8" fill="#ffffff"/>
    <circle cx="280" cy="40" r="8" fill="#ffffff"/>
    <circle cx="320" cy="40" r="8" fill="#ffffff"/>
    <circle cx="360" cy="40" r="8" fill="#ffffff"/>
    <circle cx="400" cy="40" r="8" fill="#ffffff"/>
    <circle cx="440" cy="40" r="8" fill="#ff5a1f"/>
  </g>

  <!-- Bottom boundary hairline -->
  <line x1="80" y1="2880" x2="1360" y2="2880" stroke="#262626" stroke-width="1.5"/>
  <text x="96" y="2912" fill="#5f5b55" font-family="monospace" font-size="20">01 // TECHNICAL MINIMAL</text>
  <text x="1344" y="2912" fill="#5f5b55" font-family="monospace" font-size="20" text-anchor="end">OLED TRUE BLACK</text>
</svg>
