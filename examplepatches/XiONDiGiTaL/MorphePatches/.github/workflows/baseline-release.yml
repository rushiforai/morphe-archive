name: Baseline release

# Publishes an exact version once, with the bundle that carries every app's patches.
#
# Why this exists: semantic-release can only tag the *next* version after the latest release, and
# with no tags at all it starts at 1.0.0. Neither produces the 0.1.0 baseline the collection is
# numbered from, so the baseline is published here instead. Every later push to main goes through
# release.yml, whose release rules only ever bump the patch number: 0.1.1, 0.1.2, 0.1.3, ...
#
# Run it from Actions -> Baseline release -> Run workflow, after the old v1.x tags are gone.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to publish
        required: true
        default: 0.1.0

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write

jobs:
  release:
    name: Publish the baseline bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build the bundle at the requested version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"

          ./gradlew :patches:buildAndroid generatePatchesList -Pversion="$VERSION" --no-daemon

          # Derive each app folder's bundle from the combined one, so the folders and the release can
          # never disagree about what a version contains.
          BUNDLE=$(ls -1 patches/build/libs/patches-*.mpp | grep -v -e sources -e javadoc | head -1)
          python3 .github/scripts/split_app_bundles.py "$BUNDLE"

          # What release.yml does for a normal release: stamp the version into the generated files,
          # rebuild the README patch table from them, and keep gradle.properties in step so a local
          # build produces the same version as the last release.
          jq --arg v "$VERSION" '.version = $v' patches-list.json > patches-list.json.tmp
          mv patches-list.json.tmp patches-list.json
          python3 .github/scripts/generate_patches_readme.py "$GITHUB_REPOSITORY" main patches-list.json README.md
          sed -i "s/^version = .*/version = $VERSION/" gradle.properties

          jq -n --arg v "$VERSION" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/patches-$VERSION.mpp" \
            '{created_at: (now | strftime("%Y-%m-%dT%H:%M:%S")),
              description: "Baseline release: one bundle carrying every patch for every supported app.",
              download_url: $url,
              signature_download_url: "",
              version: $v}' > patches-bundle.json

          cat > CHANGELOG.md <<'EOF'
          ## 0.1.0 (baseline)

          First release under the 0.1.x scheme. One bundle carries every patch for every supported app:
          five for Tandem 6.38.0 and 6.12.0, two for Amazon A to Z on any version.

          Versions now move by one patch at a time — 0.1.1, 0.1.2, 0.1.3 — regardless of whether a
          change is a feature, a fix or a new app. Nothing is skipped, and the number no longer implies
          which kinds of change are inside.

          Each app keeps its own folder (`Tandem/`, `AmazonAtoZ/`) documenting its patches; the release
          asset is the bundle Morphe reads and contains all of them.
          EOF

      - name: Commit, tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          BUNDLE=$(ls -1 patches/build/libs/patches-*.mpp | grep -v -e sources -e javadoc | head -1)
          test -n "$BUNDLE"

          git config user.name "XiØN"
          git config user.email "53795273+XiONDiGiTaL@users.noreply.github.com"
          git add README.md CHANGELOG.md gradle.properties patches-list.json patches-stats.json patches-bundle.json
          git add Tandem/patches.mpp Tandem/patches.mpp.sha256
          git add AmazonAtoZ/patches.mpp AmazonAtoZ/patches.mpp.sha256
          if git diff --cached --quiet; then
            # A re-run after a partial failure must not fail on "nothing to commit".
            echo "Generated files already carry v$VERSION; nothing to commit."
          else
            git commit -m "chore: Release v$VERSION [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

          # --follow-tags only pushes annotated tags and this one is lightweight, so name it explicitly.
          git tag --force "v$VERSION"
          git push origin "refs/tags/v$VERSION"

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$BUNDLE" --clobber
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes "Baseline release. One bundle, every supported app: five Tandem patches and two Amazon A to Z patches. Versions from here move by one patch at a time." \
              "$BUNDLE"
          fi

      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches v${{ inputs.version }}'
          subject-path: patches/build/libs/patches-*.mpp
