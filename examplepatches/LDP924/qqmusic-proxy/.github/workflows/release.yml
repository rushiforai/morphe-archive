name: Release Patch

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build .mpp (with dex)
        env:
          GITHUB_ACTOR: LDP924
          GITHUB_TOKEN: ${{ secrets.MORPHE_PAT }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --rerun-tasks --no-daemon
          python3 .github/scripts/finalize_mpp.py
          ls patches/build/libs/

      - name: Upload .mpp artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqmusic-patch-mpp
          path: patches/build/libs/patches.mpp
          retention-days: 90

      - name: Update patches-bundle.json & Release
        run: |
          TAG="v1.0.${{ github.run_number }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S")
          python3 - "$TAG" "$DATE" << 'PY'
          import json, sys
          tag, date = sys.argv[1], sys.argv[2]
          bundle = {
            "created_at": date,
            "description": "QQ Music patches: hidden server settings in About page + CGI host redirect",
            "download_url": f"https://github.com/LDP924/qqmusic-proxy/releases/download/{tag}/patches.mpp",
            "signature_download_url": "",
            "version": tag[1:]
          }
          open('patches-bundle.json', 'w').write(json.dumps(bundle, indent=2))
          PY
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add patches-bundle.json
          git commit -m "chore: bump bundle to ${TAG} [skip ci]" || echo "no change"
          git push

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: QQMusic Patch v1.0.${{ github.run_number }}
          files: patches/build/libs/patches.mpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
