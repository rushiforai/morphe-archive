name: Refresh patch catalog

on:
  push:
    branches: [bundles]
    paths: ['config/sources.json']
  workflow_dispatch:
    inputs:
      source:
        description: Optional source URL or alias for extraction; all inventories still reconcile
        type: string
        default: ''
      force:
        description: Re-extract selected bundles (full rebuild when source is empty)
        type: boolean
        default: false
      historical_batch_size:
        description: Maximum older bundles to attempt (1-10000; blank uses variable or 1000)
        type: string
        default: ''
      historical_max_seconds:
        description: Older-bundle time budget in seconds (1-21600; blank uses variable or 900)
        type: string
        default: ''

permissions:
  contents: write
  packages: read

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: vars.CATALOG_DATA_ENABLED != 'true'
    runs-on: ubuntu-latest
    env:
      CATALOG_HISTORICAL_BATCH_SIZE: ${{ inputs.historical_batch_size || vars.CATALOG_HISTORICAL_BATCH_SIZE || '1000' }}
      CATALOG_HISTORICAL_MAX_SECONDS: ${{ inputs.historical_max_seconds || vars.CATALOG_HISTORICAL_MAX_SECONDS || '900' }}
      CATALOG_EXTRACTION_WORKERS: ${{ vars.CATALOG_EXTRACTION_WORKERS || '2' }}
      CATALOG_METADATA_WORKERS: ${{ vars.CATALOG_METADATA_WORKERS || '4' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: bundles
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install Java 21 for bundle extraction
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Cache pinned native inspectors
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: internal/cache/runtimes
          key: catalog-native-runtimes-v1-${{ runner.os }}-${{ hashFiles('config/patcher-runtimes.json') }}
          restore-keys: catalog-native-runtimes-v1-${{ runner.os }}-
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: internal/cache/release_cache.json
          key: catalog-releases-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-releases-v1-${{ runner.os }}-
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Capture catalog before refresh
        continue-on-error: true
        run: python scripts/notify_catalog_update.py capture --baseline "$RUNNER_TEMP/catalog-before.json"
      - name: Refresh and publish catalog progress
        id: refresh
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GH_PAT: ${{ secrets.GIT_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GIT_HOST_TOKENS: ${{ secrets.GIT_HOST_TOKENS }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PAT }}
        run: python scripts/run_catalog_refresh.py --publish
      - name: Build and validate catalog
        run: |
          python -m pytest
          python -m ruff check .
          python scripts/validate_json.py
          python scripts/generate_database.py --site
          python scripts/validate_database.py
      - name: Commit catalog changes
        id: commit
        shell: bash
        run: |
          git add database
          if git diff --cached --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh patch catalog"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push catalog
        if: steps.commit.outputs.changed == 'true'
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: git push "https://x-access-token:${GIT_TOKEN}@github.com/${{ github.repository }}.git" HEAD:bundles
      - name: Upload catalog for Pages
        if: steps.commit.outputs.changed == 'true' && vars.CATALOG_PAGES_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-site
          path: site-dist
          include-hidden-files: true
          retention-days: 2
      - name: Notify catalog update
        if: always() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure')
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          CATALOG_REFRESH_FAILED: ${{ job.status != 'success' }}
        run: python scripts/notify_catalog_update.py notify --baseline "$RUNNER_TEMP/catalog-before.json"

      - name: Upload extraction failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-extraction-diagnostics
          path: internal/cache/extraction-diagnostics/*.log
          if-no-files-found: ignore
          retention-days: 7

  cloudflare:
    if: vars.CATALOG_DATA_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: catalog-data
    permissions:
      contents: read
      packages: read
    env:
      CATALOG_BACKEND: d1
      CATALOG_SOURCE: ${{ inputs.source }}
      CATALOG_FORCE: ${{ inputs.force }}
      CATALOG_HISTORICAL_BATCH_SIZE: ${{ inputs.historical_batch_size || vars.CATALOG_HISTORICAL_BATCH_SIZE || '1000' }}
      CATALOG_HISTORICAL_MAX_SECONDS: ${{ inputs.historical_max_seconds || vars.CATALOG_HISTORICAL_MAX_SECONDS || '900' }}
      CATALOG_EXTRACTION_WORKERS: ${{ vars.CATALOG_EXTRACTION_WORKERS || '2' }}
      CATALOG_METADATA_WORKERS: ${{ vars.CATALOG_METADATA_WORKERS || '4' }}
      CATALOG_R2_WORKERS: ${{ vars.CATALOG_R2_WORKERS || '8' }}
      CATALOG_OBJECT_CACHE_BYTES: ${{ vars.CATALOG_OBJECT_CACHE_BYTES || '1073741824' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CATALOG_D1_ID: ${{ vars.CATALOG_D1_ID }}
      CATALOG_R2_BUCKET: ${{ vars.CATALOG_R2_BUCKET }}
      CATALOG_RETENTION_GENERATIONS: ${{ vars.CATALOG_RETENTION_GENERATIONS || '8' }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bundles
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cloudflare.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install Java 21 for bundle extraction
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Cache pinned native inspectors
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: internal/cache/runtimes
          key: catalog-native-runtimes-v1-${{ runner.os }}-${{ hashFiles('config/patcher-runtimes.json') }}
          restore-keys: catalog-native-runtimes-v1-${{ runner.os }}-
      - name: Cache verified immutable R2 objects
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: internal/r2-objects
          key: catalog-r2-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-r2-v1-${{ runner.os }}-
      - run: python -m pip install -r requirements-cloudflare.txt
      - name: Restore refresh inputs without API shards
        run: python -m scripts.cloudflare_catalog download --refresh-inputs
      - id: resume
        run: python -m scripts.cloudflare_catalog resume
      - name: Capture catalog before cloud refresh
        continue-on-error: true
        run: python scripts/notify_catalog_update.py capture --baseline "$RUNNER_TEMP/catalog-before.json"
      - name: Verify sources and reconcile full history
        id: refresh
        env:
          GITHUB_ACTOR: ${{ github.repository_owner }}
          GH_PAT: ${{ secrets.GIT_TOKEN }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GIT_HOST_TOKENS: ${{ secrets.GIT_HOST_TOKENS }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PAT }}
        run: python -m scripts.run_catalog_refresh --cloudflare
      - name: Validate catalog snapshot
        run: python -u scripts/validate_database.py
      - name: Publish catalog atomically
        run: python -u -m scripts.cloudflare_catalog publish
      - name: Notify cloud catalog update
        if: always() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure')
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          CATALOG_REFRESH_FAILED: ${{ job.status != 'success' }}
        run: python scripts/notify_catalog_update.py notify --baseline "$RUNNER_TEMP/catalog-before.json"
      - name: Upload catalog for Pages
        if: vars.CATALOG_PAGES_ENABLED == 'true' && vars.CATALOG_BACKEND == 'd1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-site
          path: site-dist
          include-hidden-files: true
          retention-days: 2
      - name: Save resumable progress, including on failure
        if: always() && steps.resume.outcome == 'success'
        run: python -m scripts.cloudflare_catalog checkpoint
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalog-refresh-diagnostics
          path: |
            internal/cache/refresh-jobs.json
            internal/cache/bundle-run-metadata.json
            internal/cache/history/archive.json
            internal/cache/cloudflare-performance.json
            internal/cache/refresh-issues.json
            internal/cache/extraction-diagnostics/*.log
          retention-days: 7
