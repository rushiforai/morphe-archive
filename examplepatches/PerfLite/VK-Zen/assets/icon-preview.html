<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>VK Zen — иконка</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 48px;
    background: #121317; color: #e8e9ee; font: 14px/1.4 system-ui, sans-serif; padding: 32px; flex-wrap: wrap; }
  .previews { display: flex; gap: 32px; align-items: center; }
  .preview { display: grid; gap: 10px; justify-items: center; }
  .checker { background-image: linear-gradient(45deg, #2a2c33 25%, transparent 25%),
      linear-gradient(-45deg, #2a2c33 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2c33 75%),
      linear-gradient(-45deg, transparent 75%, #2a2c33 75%);
    background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    border-radius: 18px; overflow: hidden; }
  .mask-circle { clip-path: circle(50%); }
  .mask-squircle { clip-path: inset(0 round 26%); }
  canvas.icon { width: 192px; height: 192px; display: block; }
  .small canvas.icon { width: 64px; height: 64px; }
  .label { color: #9aa0ae; font-size: 12px; }
  .panel { width: 300px; display: grid; gap: 18px; }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  .row label { color: #c3c7d1; }
  .row input[type=color] { width: 56px; height: 36px; border: none; background: none; padding: 0; cursor: pointer; }
  .row input[type=text] { grid-column: 1 / -1; background: #1c1e24; border: 1px solid #2c2f38; color: #e8e9ee;
    border-radius: 8px; padding: 8px 10px; font: 13px ui-monospace, monospace; width: 100%; box-sizing: border-box; }
  button { background: #2c2f38; color: #e8e9ee; border: 1px solid #3a3e49; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button:hover { background: #343845; }
</style>
</head>

  const state = JSON.parse(new URLSearchParams(location.search).get('colors') || 'null') || {
    accent: '#1E6BFF', plate: '#0C1220'
  };

  function parseColor(hex) {
    const v = hex.replace('#', '').slice(-6);
    return [parseInt(v.slice(0,2),16), parseInt(v.slice(2,4),16), parseInt(v.slice(4,6),16)];
  }

  const bgImg = new Image(), fgImg = new Image();
  let loaded = 0;
  const canvases = [...document.querySelectorAll('canvas.icon')];

  // Glow hue shift + flat plate replacement, matching IconColorPatch.kt.
  const PLATE_BASE = [12, 18, 32], PLATE_TOL = 4;
  const GLOW_MIN = 170, GLOW_MAX = 275, SAT_MIN = 0.25, VAL_MIN = 0.08;

  function rgb2hsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) {
      if (max === r) h = ((g - b) / d + (g < b ? 6 : 0));
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, max ? d / max : 0, max];
  }

  function hsv2rgb(h, s, v) {
    const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
    let r = 0, g = 0, b = 0;
    if (h < 60) [r, g, b] = [c, x, 0];
    else if (h < 120) [r, g, b] = [x, c, 0];
    else if (h < 180) [r, g, b] = [0, c, x];
    else if (h < 240) [r, g, b] = [0, x, c];
    else if (h < 300) [r, g, b] = [x, 0, c];
    else [r, g, b] = [c, 0, x];
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
  }

  function render() {
    if (loaded < 2) return;
    const glow = parseColor(state.accent), plate = parseColor(state.plate);
    const [glowH, glowS] = rgb2hsv(glow[0], glow[1], glow[2]);
    const size = 324;
    const off = document.createElement('canvas'); off.width = off.height = size;
    const octx = off.getContext('2d');
    octx.drawImage(bgImg, 0, 0, size, size);
    octx.drawImage(fgImg, 0, 0, size, size);
    const img = octx.getImageData(0, 0, size, size);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i+3] === 0) continue;
      const r = d[i], g = d[i+1], b = d[i+2];
      if (Math.abs(r - PLATE_BASE[0]) <= PLATE_TOL && Math.abs(g - PLATE_BASE[1]) <= PLATE_TOL && Math.abs(b - PLATE_BASE[2]) <= PLATE_TOL) {
        d[i] = plate[0]; d[i+1] = plate[1]; d[i+2] = plate[2];
        continue;
      }
      const [h, s, v] = rgb2hsv(r, g, b);
      if (h >= GLOW_MIN && h <= GLOW_MAX && s > SAT_MIN && v > VAL_MIN) {
        const ns = Math.min(1, s * 1.05 + glowS * 0.15);
        const [nr, ng, nb] = hsv2rgb(glowH, ns, v);
        d[i] = Math.round(nr); d[i+1] = Math.round(ng); d[i+2] = Math.round(nb);
      }
    }
    octx.putImageData(img, 0, 0);
    for (const cv of canvases) {
      const ctx = cv.getContext('2d');
      ctx.clearRect(0, 0, size, size);
      ctx.drawImage(off, 0, 0);
    }
  }

  function syncInputs() {
    for (const key of ['accent','plate']) {
      document.getElementById(key).value = state[key].toLowerCase();
      document.getElementById(key + 'Hex').value = state[key].toUpperCase();
    }
  }

  function bind(key) {
    const picker = document.getElementById(key);
    const hex = document.getElementById(key + 'Hex');
    picker.addEventListener('input', () => { state[key] = picker.value.toUpperCase(); hex.value = state[key]; render(); });
    hex.addEventListener('input', () => {
      if (/^#[0-9a-fA-F]{6}$/.test(hex.value)) { state[key] = hex.value.toUpperCase(); picker.value = hex.value.toLowerCase(); render(); }
    });
  }

  for (const key of ['accent','plate']) bind(key);
  document.getElementById('reset').addEventListener('click', () => {
    Object.assign(state, { accent: '#1E6BFF', plate: '#0C1220' });
    syncInputs(); render();
  });

  bgImg.onload = () => { if (++loaded === 2) render(); };
  fgImg.onload = () => { if (++loaded === 2) render(); };
  bgImg.src = BG_SRC; fgImg.src = FG_SRC;
  syncInputs();
