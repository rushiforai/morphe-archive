name: Build Xposed module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xposed
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload module APK
        uses: actions/upload-artifact@v4
        with:
          name: neteaseja-xposed
          path: xposed/app/build/outputs/apk/debug/app-debug.apk
