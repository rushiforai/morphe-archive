name: Word list reports

# Receives "wordlist-report" events from the report worker (tools/report-worker): words the Wordfeud server
# rejected in a game (type remove) or words played in a game that our list lacks (type add). Valid words go to
# wordlists/<code>/remove.txt or add.txt on the branch wordlist/<code>, the list
# is rebuilt, and one pull request per language (wordlist/<code> -> main) collects all reports until it is merged.
# Nothing reaches users before that pull request is merged (a merge makes a new release with the new list).
on:
  repository_dispatch:
    types: [wordlist-report]

permissions:
  contents: write
  pull-requests: write

# No concurrency group: GitHub keeps only one queued run per group and cancels the others, which would lose
# reports that arrive close together. Runs that race on the same branch instead retry their push (see below).

env:
  BASE: main

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: build/wordlist-cache
          key: wordlist-sources-${{ hashFiles('wordlists/sources.json') }}

      - name: Language of the report
        id: lang
        env:
          RULESET: ${{ github.event.client_payload.ruleset }}
        run: |
          code=$(python3 -I - "$RULESET" <<'PY'
          import json, sys
          try:
              rs = str(int(sys.argv[1]))
          except ValueError:
              rs = ""
          print(json.load(open("wordlists/manifest.json"))["rulesets"].get(rs, ""))
          PY
          )
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Apply report to the wordlist branch
        # Switch to wordlist/<code> (merged with the base), add the reported words, rebuild and push. When the push
        # fails (another report pushed first, or a GitHub error) everything is redone on the latest branch, up to 5
        # times, so reports that arrive together are all kept.
        id: add
        if: steps.lang.outputs.code != ''
        env:
          CODE: ${{ steps.lang.outputs.code }}
          RULESET: ${{ github.event.client_payload.ruleset }}
          WORDS: ${{ join(github.event.client_payload.words, ',') }}
          TYPE: ${{ github.event.client_payload.type || 'remove' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          B="wordlist/$CODE"
          switch_branch() {
            git fetch -q origin "$BASE"
            git merge --abort 2>/dev/null || true
            git reset -q --hard
            if git ls-remote --exit-code --heads origin "$B" >/dev/null; then
              git fetch -q origin "$B"
              git checkout -q -B "$B" "origin/$B"
              if ! git merge -q --no-edit "origin/$BASE"; then
                # Generated files are rebuilt below, so take the base versions; remove.txt / add.txt merge as a
                # union (.gitattributes). Any other conflict fails the job.
                for f in $(git diff --name-only --diff-filter=U); do
                  case "$f" in
                    wordlists/manifest.json|wordlists/*/words.txt.gz) git checkout "origin/$BASE" -- "$f" ;;
                    *) echo "Unexpected conflict in $f"; exit 1 ;;
                  esac
                done
                git add -A wordlists
                git -c core.editor=true merge --continue
              fi
            else
              git checkout -q -B "$B" "origin/$BASE"
            fi
          }
          # Commit messages end up in CHANGELOG.md and the release notes Morphe shows: keep them in English.
          if [ "$TYPE" = "add" ]; then verb="added"; why="played, missing from the list"; else verb="removed"; why="rejected by the server"; fi
          for attempt in 1 2 3 4 5; do
            switch_branch
            out=$(python3 -I tools/wordlists/report.py --type "$TYPE" --ruleset "$RULESET" --words "$WORDS")
            echo "$out"
            added=$(echo "$out" | sed -n 's/^added=//p')
            if [ -z "$added" ]; then echo "added=" >> "$GITHUB_OUTPUT"; exit 0; fi
            python3 -I tools/wordlists/build.py --only "$CODE"
            git add wordlists
            git commit -q -m "fix(wordlists): $CODE: $verb $added ($why)"
            if git push origin "$B"; then echo "added=$added" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "Push failed (attempt $attempt); retrying on the latest branch"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Pull request
        # Also when nothing new was added: a pull request that failed to open earlier (e.g. a GitHub 5xx) is then
        # opened with the next report. Retries transient GitHub errors.
        if: steps.lang.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.lang.outputs.code }}
        run: |
          B="wordlist/$CODE"
          git ls-remote --exit-code --heads origin "$B" >/dev/null || { echo "no branch $B"; exit 0; }
          git fetch -q origin "$B" "$BASE"
          if [ "$(git rev-list --count "origin/$BASE..origin/$B")" = "0" ]; then echo "$B has nothing new"; exit 0; fi
          for attempt in 1 2 3 4; do
            if open=$(gh pr list --head "$B" --base "$BASE" --state open --json number --jq '.[0].number'); then
              if [ -n "$open" ]; then echo "pull request #$open is open"; exit 0; fi
              if gh pr create --head "$B" --base "$BASE" \
                  --title "Word list $CODE: reported words" \
                  --body "Reported automatically by the patch: words the Wordfeud server rejected (\`wordlists/$CODE/remove.txt\`) and words that were played in a game but are missing from our list (\`wordlists/$CODE/add.txt\`). Every report adds a commit to this branch. Check the words and merge whenever you like: the merge makes a new release with the updated list."; then
                exit 0
              fi
            fi
            echo "GitHub error, attempt $attempt; retrying"
            sleep $((attempt * 20))
          done
          exit 1
