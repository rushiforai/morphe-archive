name: Release

on:
  workflow_dispatch:
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Verify bundle signing key
        env:
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}
        run: |
          test -n "$MORPHE_SIGNING_KEY"
          printf '%s' "$MORPHE_SIGNING_KEY" | tr -d '\r\n' | base64 --decode >/dev/null

      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v8
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Always verify compilation when semantic-release did not publish a release.
      # This covers non-main/dev branches, chore commits, docs commits, etc.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon

      # semantic-release only understands Closes/Fixes keywords; handle `Refs #n` here.
      - name: Comment on referenced tickets
        if: steps.release.outputs.new_release_published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/comment_tickets.sh "${{ steps.release.outputs.new_release_git_tag }}"

      # Stable release only: close tickets that semantic-release commented on and labeled
      # `released`. Tickets stay open during pre-releases (label `in-prerelease`).
      - name: Close released tickets
        if: steps.release.outputs.new_release_published == 'true' && github.ref_name == 'main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --state open --label released --json number --jq '.[].number'); do
            gh issue close "$n" --reason completed || echo "::warning::Could not close #$n"
          done
