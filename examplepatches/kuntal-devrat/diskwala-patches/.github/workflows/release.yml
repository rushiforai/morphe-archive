name: Release

on:
  workflow_dispatch:
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Write gradle.properties (Morphe registry auth)
        run: |
          # Credentials go to the user-level file, NOT the repo file
          # (repo gradle.properties is committed back by semantic-release).
          mkdir -p ~/.gradle
          printf 'gpr.user=%s\n' "${{ github.repository_owner }}" >> ~/.gradle/gradle.properties
          printf 'gpr.key=%s\n' "${{ secrets.MORPHE_PAT }}" >> ~/.gradle/gradle.properties
          # Repo file committed by semantic-release of template provenance:
          printf 'org.gradle.jvmargs=-Xmx4g\n' > gradle.properties
          printf 'android.useAndroidX=true\n' >> gradle.properties

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'DiskWala Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp
