name: Release

on:
  workflow_dispatch:
    inputs:
      apk_tag:
        description: 'Only (re)build the patched APK of this existing release, e.g. v2.1.0'
        required: false
        default: ''
  push:

jobs:
  release:
    name: Release
    if: github.event_name != 'workflow_dispatch' || inputs.apk_tag == ''
    outputs:
      published: ${{ steps.release.outputs.new_release_published }}
      tag: ${{ steps.release.outputs.new_release_git_tag }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v8
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_SIGNING_KEY: ${{ secrets.MORPHE_SIGNING_KEY }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Always verify compilation when semantic-release did not publish a release.
      # This covers non-main/dev branches, chore commits, docs commits, etc.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon

  # The patched app itself, attached to every release (and on demand: run the workflow with apk_tag).
  # Original app: release "app-source"; signing key: secret MORPHE_KEYSTORE_BASE64 (see build_apk.sh).
  apk:
    name: Patched APK
    needs: release
    if: >-
      always() && (needs.release.outputs.published == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.apk_tag != ''))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Patch the app and attach the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MORPHE_KEYSTORE_BASE64: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
          TAG: ${{ inputs.apk_tag || needs.release.outputs.tag }}
        run: bash .github/scripts/build_apk.sh "$TAG"
