name: Build and Publish Morphe Patches

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'patches/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore official Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/MorpheApp/morphe-patches-template.git /tmp/morphe-template
          cp /tmp/morphe-template/gradlew ./gradlew
          cp /tmp/morphe-template/gradlew.bat ./gradlew.bat
          mkdir -p gradle/wrapper
          cp /tmp/morphe-template/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
          cp /tmp/morphe-template/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Build Android Morphe bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon --stacktrace

      - name: Prepare release bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          SOURCE="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' | head -n 1)"
          test -n "$SOURCE"
          TARGET="patches-${VERSION}.mpp"
          cp "$SOURCE" "$TARGET"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.bundle.outputs.tag }}" \
            "${{ steps.bundle.outputs.target }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lawnchair Morphe Patches ${{ steps.bundle.outputs.version }}" \
            --notes "Morphe patch bundle for Lawnchair."

      - name: Generate Morphe source metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          version = "${{ steps.bundle.outputs.version }}"
          repo = os.environ["GITHUB_REPOSITORY"]
          data = {
              "created_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", ""),
              "description": "Lawnchair custom patches for Morphe Manager.",
              "download_url": f"https://github.com/{repo}/releases/download/v{version}/patches-{version}.mpp",
              "signature_download_url": "",
              "version": version,
          }
          with open("patches-bundle.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Publish source metadata to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update Morphe source metadata [skip ci]"
          git push origin HEAD:main

      - name: Upload MPP bundle
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: lawnchair-morphe-patches
          path: ${{ steps.bundle.outputs.target }}
          if-no-files-found: error
