<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="LiquidMusic: Liquid Glass for Apple Music on Android">
  <title>LiquidMusic: Liquid Glass for Apple Music on Android</title>
  <defs>
    <clipPath id="frame">
      <rect width="1280" height="440" rx="28"/>
    </clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0a12"/>
      <stop offset="0.55" stop-color="#160c1c"/>
      <stop offset="1" stop-color="#0b0f1d"/>
    </linearGradient>

    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>

    <!-- Album covers -->
    <linearGradient id="c1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff375f"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient>
    <linearGradient id="c2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5e5ce6"/><stop offset="1" stop-color="#64d2ff"/></linearGradient>
    <linearGradient id="c3" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#30d158"/><stop offset="1" stop-color="#0a84ff"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#bf5af2"/><stop offset="1" stop-color="#ff375f"/></linearGradient>
    <linearGradient id="c5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd60a"/><stop offset="1" stop-color="#ff453a"/></linearGradient>
    <linearGradient id="c6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1c1e"/><stop offset="1" stop-color="#636366"/></linearGradient>
    <linearGradient id="c7" x1="1" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff9f0a"/><stop offset="1" stop-color="#bf5af2"/></linearGradient>
    <linearGradient id="c8" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#64d2ff"/><stop offset="1" stop-color="#30d158"/></linearGradient>
    <linearGradient id="c9" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff2d55"/><stop offset="1" stop-color="#5e5ce6"/></linearGradient>

    <!-- Everything behind the glass: background, haze and the scrolling covers -->
    <g id="scene">
      <rect width="1280" height="440" fill="url(#bg)"/>
      <g filter="url(#haze)">
        <circle cx="1010" cy="110" r="210" fill="#ff2d55" opacity="0.55"/>
        <circle cx="1210" cy="360" r="170" fill="#ff9f0a" opacity="0.45"/>
        <circle cx="760" cy="420" r="190" fill="#bf5af2" opacity="0.45"/>
        <circle cx="430" cy="10" r="210" fill="#0a84ff" opacity="0.22"/>
        <circle cx="150" cy="440" r="190" fill="#ff375f" opacity="0.18"/>
      </g>
      <g>
        <rect x="726" y="-46" width="156" height="156" rx="20" fill="url(#c1)"/>
        <rect x="898" y="-46" width="156" height="156" rx="20" fill="url(#c2)"/>
        <rect x="1070" y="-46" width="156" height="156" rx="20" fill="url(#c3)"/>
        <circle cx="804" cy="32" r="38" fill="#fff" opacity="0.18"/>
        <path d="M 912 92 Q 976 10 1040 92" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.25"/>
        <rect x="1100" y="20" width="96" height="60" rx="30" fill="#000" opacity="0.18"/>

        <rect x="726" y="126" width="156" height="156" rx="20" fill="url(#c4)"/>
        <rect x="898" y="126" width="156" height="156" rx="20" fill="url(#c5)"/>
        <rect x="1070" y="126" width="156" height="156" rx="20" fill="url(#c6)"/>
        <circle cx="804" cy="204" r="52" fill="none" stroke="#fff" stroke-width="8" opacity="0.28"/>
        <circle cx="976" cy="204" r="26" fill="#fff" opacity="0.35"/>
        <path d="M 1092 250 L 1148 160 L 1204 250 Z" fill="#ff375f" opacity="0.85"/>

        <rect x="726" y="298" width="156" height="156" rx="20" fill="url(#c7)"/>
        <rect x="898" y="298" width="156" height="156" rx="20" fill="url(#c8)"/>
        <rect x="1070" y="298" width="156" height="156" rx="20" fill="url(#c9)"/>
        <circle cx="976" cy="370" r="44" fill="#000" opacity="0.15"/>
      </g>
    </g>

    <!-- Glass material -->
    <filter id="frost" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="10"/>
      <feColorMatrix type="saturate" values="1.6"/>
    </filter>
    <filter id="drop" x="-20%" y="-60%" width="140%" height="240%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffc2cd"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8e8ed"/>
      <stop offset="1" stop-color="#8e8e93"/>
    </linearGradient>

    <clipPath id="miniClip"><rect x="742" y="294" width="498" height="58" rx="29"/></clipPath>
    <clipPath id="tabClip"><rect x="742" y="364" width="498" height="66" rx="33"/></clipPath>
    <clipPath id="dropClip"><rect x="752" y="371" width="84" height="52" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <use xlink:href="#scene" href="#scene"/>

    <!-- Shadows under the floating pills -->
    <rect x="752" y="306" width="478" height="50" rx="25" fill="#000" opacity="0.55" filter="url(#drop)"/>
    <rect x="752" y="378" width="478" height="58" rx="29" fill="#000" opacity="0.55" filter="url(#drop)"/>

    <!-- Mini player: magnified, frosted copy of the scene, clipped to the pill -->
    <g clip-path="url(#miniClip)">
      <g filter="url(#frost)">
        <g transform="translate(991 323) scale(1.1) translate(-991 -323)">
          <use xlink:href="#scene" href="#scene"/>
        </g>
      </g>
      <rect x="742" y="294" width="498" height="58" rx="29" fill="#1c1c1e" opacity="0.22"/>
      <rect x="742" y="294" width="498" height="58" rx="29" fill="url(#sheen)"/>
    </g>
    <rect x="742.75" y="294.75" width="496.5" height="56.5" rx="28.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
    <rect x="754" y="303" width="40" height="40" rx="9" fill="url(#c4)"/>
    <rect x="808" y="310" width="176" height="11" rx="5.5" fill="#fff" opacity="0.92"/>
    <rect x="808" y="329" width="118" height="9" rx="4.5" fill="#fff" opacity="0.5"/>
    <path d="M 1148 313 L 1166 323 L 1148 333 Z" fill="#fff"/>
    <path d="M 1190 314 L 1200 323 L 1190 332 Z M 1201 314 L 1211 323 L 1201 332 Z" fill="#fff"/>

    <!-- Tab bar -->
    <g clip-path="url(#tabClip)">
      <g filter="url(#frost)">
        <g transform="translate(991 397) scale(1.1) translate(-991 -397)">
          <use xlink:href="#scene" href="#scene"/>
        </g>
      </g>
      <rect x="742" y="364" width="498" height="66" rx="33" fill="#1c1c1e" opacity="0.22"/>
      <rect x="742" y="364" width="498" height="66" rx="33" fill="url(#sheen)"/>
    </g>
    <rect x="742.75" y="364.75" width="496.5" height="64.5" rx="32.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

    <!-- Liquid drop under the selected tab -->
    <g clip-path="url(#dropClip)">
      <rect x="752" y="371" width="84" height="52" rx="26" fill="#ff375f" opacity="0.30"/>
      <rect x="752" y="371" width="84" height="52" rx="26" fill="url(#sheen)"/>
    </g>
    <rect x="752.75" y="371.75" width="82.5" height="50.5" rx="25.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

    <!-- Tab icons -->
    <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path transform="translate(794 397)" d="M -11 1 L 0 -9 L 11 1 V 11 H 4 V 4 H -4 V 11 H -11 Z" fill="#fff"/>
      <g transform="translate(892 397)" opacity="0.88">
        <rect x="-10" y="-10" width="8" height="8" rx="2"/>
        <rect x="2" y="-10" width="8" height="8" rx="2"/>
        <rect x="-10" y="2" width="8" height="8" rx="2"/>
        <rect x="2" y="2" width="8" height="8" rx="2"/>
      </g>
      <g transform="translate(991 397)" opacity="0.88">
        <circle r="2.6" fill="#fff" stroke="none"/>
        <path d="M -6.5 -6.5 A 9.2 9.2 0 0 0 -6.5 6.5 M 6.5 -6.5 A 9.2 9.2 0 0 1 6.5 6.5"/>
        <path d="M -11 -11 A 15.6 15.6 0 0 0 -11 11 M 11 -11 A 15.6 15.6 0 0 1 11 11"/>
      </g>
      <g transform="translate(1090 397)" opacity="0.88">
        <path d="M -10 -10 V 10 M -4 -10 V 10 M 2 -9 L 9 9"/>
      </g>
      <g transform="translate(1190 397)" opacity="0.88">
        <circle cx="-2" cy="-2" r="7.5"/>
        <path d="M 3.5 3.5 L 10 10"/>
      </g>
    </g>

    <!-- Text -->
    <g font-family="'SF Pro Display', 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
      <rect x="64" y="78" width="252" height="38" rx="19" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.22"/>
      <text x="190" y="103" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="2.5" fill="#fff" fill-opacity="0.85">MORPHE PATCH SOURCE</text>

      <text x="60" y="212" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#title)">LiquidMusic</text>
      <text x="64" y="262" font-size="30" font-weight="500" fill="#fff" fill-opacity="0.78">Real Liquid Glass for Apple Music</text>
      <text x="64" y="300" font-size="30" font-weight="500" fill="#fff" fill-opacity="0.78">on Android</text>

      <g font-size="17" font-weight="600" fill="#fff" fill-opacity="0.9" text-anchor="middle">
        <rect x="64" y="338" width="132" height="38" rx="19" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.22"/>
        <text x="130" y="363">Refraction</text>
        <rect x="208" y="338" width="118" height="38" rx="19" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.22"/>
        <text x="267" y="363">Vibrancy</text>
        <rect x="338" y="338" width="122" height="38" rx="19" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.22"/>
        <text x="399" y="363">Highlight</text>
      </g>
    </g>
  </g>
</svg>
