[versions]
morphe-patcher = "2.1.0"
#noinspection GradleDependency
smali = "4220ae75f7"
gson = "2.15.0"
# Kyant's Backdrop (libs/) and the Jetpack Compose it is built on, bundled into the extension.
compose = "1.12.0"
kyant-shapes = "1.2.1"
jetbrains-annotations = "26.1.0"
androidx-compose = "1.12.1"
androidx-lifecycle = "2.10.0"
androidx-savedstate = "1.4.0"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
# Gradle plugins adds the dependency during build, this declaration is here only for dependabot to provide updates.
#noinspection UnusedVersionCatalogEntry
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-ui-graphics = { module = "org.jetbrains.compose.ui:ui-graphics", version.ref = "compose" }
kyant-shapes = { module = "io.github.kyant0:shapes", version.ref = "kyant-shapes" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "androidx-compose" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "androidx-compose" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidx-lifecycle" }
androidx-savedstate = { module = "androidx.savedstate:savedstate", version.ref = "androidx-savedstate" }

[plugins]
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version = "2.4.21" }
