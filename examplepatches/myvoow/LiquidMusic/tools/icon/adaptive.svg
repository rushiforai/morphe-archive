<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <!-- The LiquidMusic icon as a full-bleed adaptive icon layer: generated from .github/assets/icon.svg by render.mjs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140b17"/>
      <stop offset="1" stop-color="#0b0e1a"/>
    </linearGradient>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <g id="scene">
      <rect width="200" height="200" fill="url(#bg)"/>
      <g filter="url(#haze)">
        <circle cx="62" cy="58" r="56" fill="#ff2d55"/>
        <circle cx="150" cy="70" r="46" fill="#ff9f0a" opacity="0.9"/>
        <circle cx="70" cy="160" r="52" fill="#bf5af2" opacity="0.9"/>
        <circle cx="160" cy="160" r="44" fill="#0a84ff" opacity="0.8"/>
      </g>
    </g>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
      <feColorMatrix type="saturate" values="1.7"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <path id="drop" d="M 100 30 C 100 30 152 88 152 122 A 52 52 0 0 1 48 122 C 48 88 100 30 100 30 Z"/>
    <clipPath id="dropClip"><use xlink:href="#drop" href="#drop"/></clipPath>
  </defs>
  <use xlink:href="#scene" href="#scene"/>
  <g transform="translate(100 102) scale(0.78) translate(-100 -102)">

  
  <use xlink:href="#drop" href="#drop" fill="#000" opacity="0.5" filter="url(#shadow)" transform="translate(0 6)"/>
  <g clip-path="url(#dropClip)">
    <g filter="url(#frost)">
      <g transform="translate(100 112) scale(1.18) translate(-100 -112)">
        <use xlink:href="#scene" href="#scene"/>
      </g>
    </g>
    <rect width="200" height="200" fill="#fff" opacity="0.08"/>
    <rect x="40" y="28" width="120" height="150" fill="url(#sheen)"/>
  </g>
  <use xlink:href="#drop" href="#drop" fill="none" stroke="url(#rim)" stroke-width="2.5"/>

  <!-- Audio level bars -->
  <g fill="#fff">
    <rect x="73" y="112" width="10" height="28" rx="5"/>
    <rect x="89" y="96" width="10" height="60" rx="5"/>
    <rect x="105" y="104" width="10" height="44" rx="5"/>
    <rect x="121" y="116" width="10" height="20" rx="5"/>
  </g>
</g>
</svg>
