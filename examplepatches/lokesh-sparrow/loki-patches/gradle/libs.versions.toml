[versions]
morphe-patcher = "1.15.0"
#noinspection GradleDependency
smali = "d92701d947"
gson = "2.14.0"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# The Gradle plugin puts morphe-patcher on the build classpath by itself; the entry below only
