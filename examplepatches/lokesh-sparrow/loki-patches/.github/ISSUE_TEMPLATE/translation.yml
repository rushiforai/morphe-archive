name: 🌐 Translation
description: Point out a translation that is wrong, or volunteer a new language.
title: "i18n: "
labels: ["Translation"]
body:
  - type: markdown
    attributes:
      value: |
        <p align="center"><b>🧩 Loki Patches · Translation</b></p>

        Every language is one JSON file in [`extensions/extension/src/main/translations`](https://github.com/lokesh-sparrow/loki-patches/tree/main/extensions/extension/src/main/translations), keyed by the English text. If you prefer, open a pull request with the file instead of an issue.

  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "Français (fr)"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - A translation is wrong or sounds unnatural
        - A text is not translated
        - I'd like to add a new language
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: The text as it is now, where it appears, and what it should say.
      placeholder: |
        Screen: Other → Language
        Current: "Automatique (langue de l'appareil)"
        Suggested: "..."
    validations:
      required: true
