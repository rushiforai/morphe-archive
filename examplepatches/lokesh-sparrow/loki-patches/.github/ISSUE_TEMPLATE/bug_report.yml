name: 🐞 Bug report
description: A patch does nothing, something crashes, or the app behaves differently than described.
title: "bug: "
labels: ["Bug report"]
body:
  - type: markdown
    attributes:
      value: |
        <p align="center"><b>🧩 Loki Patches · Bug report</b></p>

        Thanks for taking the time to write this up. Before you fill in the form:

        - 🔎 **Look for an existing report first.** The [open and closed bug reports](https://github.com/lokesh-sparrow/loki-patches/issues?q=label%3A%22Bug+report%22) already cover most problems.
        - ⚙️ **Where are the options?** Tap your profile photo → **Loki Patches**, or long press the LinkedIn icon on your home screen → **Loki Patches**.
        - 📦 **Check your LinkedIn version.** The [README](https://github.com/lokesh-sparrow/loki-patches#patches) lists the versions this bundle is built for; anything else is experimental.
        - 🚫 **Never attach a patched APK**, or a link to one, to an issue.

  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - LinkedIn
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Android settings → Apps → LinkedIn, or the file name of the APKMirror download you patched.
      placeholder: "4.1.1267"
    validations:
      required: true

  - type: input
    id: patches-version
    attributes:
      label: Loki Patches version
      description: Loki Patches → About.
      placeholder: "1.0.1"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Samsung Galaxy A06, Android 14"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: |
        The download button is missing on photos in posts.
        I expected it at the top right, as it is on profile photos.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps. The closer they are to a click-by-click list, the quicker the fix.
      placeholder: |
        1. Open a post with several photos
        2. Tap a photo
        3. ...
    validations:
      required: true

  - type: textarea
    id: diagnostic-report
    attributes:
      label: Diagnostic report
      description: |
        This lists which patches were applied and what failed, and it is the single most useful thing in a report:

        1. Loki Patches → **Other** → turn on **Diagnostic logging**
        2. Close LinkedIn, reopen it, then **repeat the bug**
        3. Loki Patches → **Other** → **Copy diagnostic report**
        4. Paste the result here

        Personal data such as links, IDs and e-mail addresses is stripped from the report, but read it before you post it.
      placeholder: "### Loki Patches diagnostic report ..."

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Drop images or videos here. Blur anything personal first.

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Other bundles you have installed, things you already tried, or an idea about the cause.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Reports that skip this list may be closed without an answer.
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I'm using Morphe with the Loki Patches source, not a pre-patched APK from somewhere else.
          required: true
        - label: The title says what is broken, and I filled in every field above.
          required: true
