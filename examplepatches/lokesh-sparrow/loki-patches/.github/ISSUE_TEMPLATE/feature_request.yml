name: ⭐ Feature request
description: Propose a new patch, or a change to one that already exists.
title: "feat: "
labels: ["Feature request"]
body:
  - type: markdown
    attributes:
      value: |
        <p align="center"><b>🧩 Loki Patches · Feature request</b></p>

        An idea is welcome. Two things to read first:

        - 🔎 **Check the [existing requests](https://github.com/lokesh-sparrow/loki-patches/issues?q=label%3A%22Feature+request%22).** If yours is already there, a 👍 on it counts more than a second issue.
        - 🧭 **Out of scope:** unlocking paid features or content (Premium, subscriptions), and anything that gathers other people's data. Those requests are closed.

  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - LinkedIn
        - Other app (say which below)
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Type of request
      options:
        - New patch
        - Improvement to an existing patch
        - Settings screen or translations
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What should it do?
      description: Describe the behaviour. A screenshot, a recording, or an example from another app or bundle makes it much easier to picture.
      placeholder: Add an option to hide the "Add to your feed" suggestions on the home feed.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why is it useful?
      description: Which annoyance does it remove for you, and how often do you hit it?
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I checked the existing feature requests and mine is not among them.
          required: true
        - label: This request is not about unlocking paid features or content.
          required: true
