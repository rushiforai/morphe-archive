#
# One workflow for every push. On main, semantic-release cuts a release from the commit
# types; anywhere else, or for commits that do not release, the bundle is only compiled,
# so a broken build is still caught.

name: Release

on:
  push:
  workflow_dispatch:

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # semantic-release needs the history and the tags

      - name: Java 21
        uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }

      - name: Node.js
        uses: actions/setup-node@v7
        with: { node-version: 'lts/*', cache: npm }

      - name: Install release tooling
        run: npm install

      # The release command itself comes from gradle-semantic-release-plugin, and the Gradle
      # build runs through the wrapper. Only main releases, as configured in .releaserc.
      - name: Publish release
        id: release
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commit the release as the maintainer, not as semantic-release-bot.
          GIT_AUTHOR_NAME: Lokesh Sparrow
          GIT_AUTHOR_EMAIL: 144280457+lokesh-sparrow@users.noreply.github.com
          GIT_COMMITTER_NAME: Lokesh Sparrow
          GIT_COMMITTER_EMAIL: 144280457+lokesh-sparrow@users.noreply.github.com

      - name: Attach build provenance
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # No release means nothing proved the code still compiles, so build it here.
      - name: Verify the bundle compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
