#
# Update pull requests land on dev, never on main: main is released by semantic-release,
# and a dependency bump should be built and tested first. Label-less on purpose.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    labels: []

  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    labels: []

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    labels: []
    ignore:
      # 10.x and later stopped generating the release notes this repo needs.
      # https://github.com/conventional-changelog/conventional-changelog/issues/1495
      - dependency-name: "conventional-changelog-conventionalcommits"
