name: Build and publish Morphe bundle

on:
  push:
    paths:
      - "patches/**"
      - "tests/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Test WebView ad-space cleanup
        run: |
          npm install --prefix "$RUNNER_TEMP/fmkorea-tests" jsdom@26.1.0 --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/fmkorea-tests/node_modules" node tests/ad-spaces.test.cjs

      - name: Build Morphe patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew buildAndroid --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: fmkorea-morphe-patch
          path: patches/build/libs/*.mpp

      - name: Publish GitHub release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="1.3.5"
          tag="v$version"
          bundle="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$bundle"

          cp "$bundle" "patches-$version.mpp"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "patches-$version.mpp" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "patches-$version.mpp" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes "FMKorea splash removal and native WebView ad-blocking patches for Morphe."
          fi
