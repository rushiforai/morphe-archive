<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
  <title id="title">Rambler Bangla v32.4.0 — Feature Overview Poster</title>
  <desc id="desc">Six-card visual summary of Rambler Bangla v32.4.0 features: Live Gemini Rambler+ Bangla &amp; Mixed Voice Typing, SwiftKey Mode, Instant @Mention Full-Email &amp; 1-Digit Personalized Strip, AMOLED &amp; Hide Icon, Hex Waveforms &amp; Productivity, and Drag-to-Reorder Clipboard with Power Tools.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152B"/>
      <stop offset="1" stop-color="#0E2849"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#113152"/>
      <stop offset="1" stop-color="#0C2440"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="540" rx="18" fill="url(#canvas)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Header -->
    <text x="44" y="52" font-size="24" font-weight="700" fill="#FFFFFF">Everything Inside Rambler Bangla <tspan fill="#F6B13E">v32.4.0</tspan></text>
    <text x="44" y="78" font-size="14.5" fill="#9EC0E0">60 selectable Morphe patches for Gboard 18.5.4 — 3-mode Bangla/Mixed/English voice, SwiftKey Mode, @/email/digit strip &amp; GPL-3.0.</text>

    <!-- Row 1 -->
    <!-- Card 1 -->
    <g transform="translate(44 104)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="134" height="24" rx="12" fill="#1C4670"/>
      <text x="87" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F6B13E">3-MODE VOICE</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">Bangla, Mixed &amp; English</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">English (US) = English/Phonetic Latin · Bangla =</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">100% Natural Bengali · abc-&gt;Bangla = True Mixed</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">Bangla + English inside the same sentence.</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12" fill="#9BE0B0">20.6k audited loans · 190k lexicon · 0ms delay</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(450 104)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="164" height="24" rx="12" fill="#1C4670"/>
      <text x="102" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F6B13E">PERSONALIZED STRIP</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">@, Full Email &amp; Digit Strip</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">Learns @handles, full emails &amp; digit IDs locally.</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">Type 1 -&gt; immediately suggests 11name@gmail.com</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">on Gboard's native strip with drag-to-remove.</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12" fill="#F6B13E">@grok  |  1 -&gt; 11name@gmail.com  |  0 OTP leak</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(856 104)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="144" height="24" rx="12" fill="#1C4670"/>
      <text x="92" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#9BE0B0">NEW IN v32.4.0</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">SwiftKey Mode</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">Shift-to-capitalize at word end (word-&gt;Word-&gt;WORD),</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">smart punctuation space trim, text shortcuts &amp;</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">reversible 1-tap SwiftKey Preset (200ms long-press).</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12" fill="#9BE0B0">Seamless migration from Microsoft SwiftKey</text>
    </g>

    <!-- Row 2 -->
    <!-- Card 4 -->
    <g transform="translate(44 318)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="154" height="24" rx="12" fill="#1C4670"/>
      <text x="97" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F6B13E">RAMBLER POWER</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">Hex Waveforms &amp; AI Rules</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">Hex Dot Scope &amp; Android Wave animations,</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">Per-App Custom Instructions, MUSE_STATS</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">dictionary, Contact Sync &amp; Spacebar Hold.</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12.5" fill="#9BE0B0">Snippets · Find/Replace · Stats · Toolbar Overflow</text>
    </g>

    <!-- Card 5 -->
    <g transform="translate(450 318)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="140" height="24" rx="12" fill="#1C4670"/>
      <text x="90" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F6B13E">POWER TOOLS</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">Drag Clipboard, Calc &amp; LAN</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">Tap &amp; hold drag-to-reorder clipboards (saved</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">permanently), Web Clipboard + image sync,</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">LAN FTP, Calculator, OCR &amp; AI Writing Tools.</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12.5" fill="#9EC0E0">Drag Reorder · Editing Shortcuts · Bluetooth Mic</text>
    </g>

    <!-- Card 6 -->
    <g transform="translate(856 318)">
      <rect width="380" height="192" rx="14" fill="url(#card)" stroke="#2B5379" stroke-width="1.4"/>
      <rect x="20" y="20" width="144" height="24" rx="12" fill="#1C4670"/>
      <text x="92" y="36" text-anchor="middle" font-size="11.5" font-weight="700" fill="#F6B13E">LOOK &amp; UPDATES</text>
      <text x="20" y="74" font-size="19" font-weight="700" fill="#FFFFFF">AMOLED, Logo &amp; Auto-OTA</text>
      <text x="20" y="100" font-size="13.5" fill="#B3C9E2">Custom adaptive logo, Hide Launcher Icon, live</text>
      <text x="20" y="120" font-size="13.5" fill="#B3C9E2">AMOLED #000000 toggle, Frosted Glass, Rboard</text>
      <text x="20" y="140" font-size="13.5" fill="#B3C9E2">Themes &amp; SHA-256 verified GitHub Auto-Updater.</text>
      <rect x="20" y="154" width="340" height="24" rx="6" fill="#07152B"/>
      <text x="30" y="170" font-size="12" fill="#9BE0B0">About -&gt; App updates · Android 12–16 Fast OTA</text>
    </g>
