<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Rambler Bangla — Unified 60-Patch Morphe Suite for Gboard 18.5.4</title>
  <desc id="desc">Banner: Rambler Bangla v32.4.0, Bengali-first 3-mode voice typing, SwiftKey Mode, instant @mention/email/digit personalized strip, and 60-patch Morphe suite for Gboard 18.5.4.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061224"/>
      <stop offset="0.52" stop-color="#0B1F3B"/>
      <stop offset="1" stop-color="#173E66"/>
    </linearGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="912" y1="0" x2="1044" y2="0">
      <stop offset="0" stop-color="#F6B13E"/>
      <stop offset="1" stop-color="#5FA3DA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#2D6FA3" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2D6FA3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.2" r="0.35">
      <stop offset="0" stop-color="#F6B13E" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#F6B13E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="340" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="16" fill="url(#glow)"/>
  <rect width="1280" height="340" rx="16" fill="url(#glow2)"/>

  <!-- subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 85H1280M0 170H1280M0 255H1280"/>
    <path d="M160 0V340M320 0V340M480 0V340M640 0V340M800 0V340M960 0V340M1120 0V340"/>
  </g>

  <!-- top pill -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="76" y="40" width="372" height="32" rx="16" fill="#10304F" stroke="#2D6FA3" stroke-width="1.2"/>
    <circle cx="98" cy="56" r="4.5" fill="#9BE0B0"/>
    <text x="114" y="61" font-size="13" font-weight="600" fill="#B3C9E2" letter-spacing="0.6">v32.4.0  ·  MORPHE 2.1  ·  60 PATCHES</text>

    <!-- main wordmark -->
    <text x="76" y="146" font-size="68" font-weight="700" fill="#FFFFFF" letter-spacing="-1.2">Rambler <tspan fill="#F6B13E">Bangla</tspan></text>
    <rect x="78" y="164" width="112" height="5" rx="2.5" fill="#F6B13E"/>

    <!-- subtitle -->
    <text x="76" y="212" font-size="21.5" font-weight="500" fill="#E4EFFA">Bengali-first voice typing, SwiftKey Mode &amp; 60-patch Morphe suite for Gboard 18.5.4</text>

    <!-- capability pills -->
    <g font-size="13" font-weight="600">
      <rect x="76" y="246" width="128" height="32" rx="16" fill="#10304F" stroke="#2B5379"/>
      <text x="140" y="266" text-anchor="middle" fill="#F6B13E">3-Mode Voice</text>

      <rect x="214" y="246" width="136" height="32" rx="16" fill="#10304F" stroke="#2B5379"/>
      <text x="282" y="266" text-anchor="middle" fill="#9BE0B0">SwiftKey Mode</text>

      <rect x="360" y="246" width="152" height="32" rx="16" fill="#10304F" stroke="#2B5379"/>
      <text x="436" y="266" text-anchor="middle" fill="#D6E4F2">@ &amp; Digit Strip</text>

      <rect x="522" y="246" width="132" height="32" rx="16" fill="#10304F" stroke="#2B5379"/>
      <text x="588" y="266" text-anchor="middle" fill="#D6E4F2">Drag Clipboard</text>

      <rect x="664" y="246" width="144" height="32" rx="16" fill="#10304F" stroke="#2B5379"/>
      <text x="736" y="266" text-anchor="middle" fill="#9BE0B0">In-App Updates</text>
    </g>
  </g>

  <!-- microphone -->
  <g transform="translate(866 118)">
    <rect x="-22" y="0" width="44" height="76" rx="22" fill="#2D6FA3" stroke="#9CC4E8" stroke-width="3"/>
    <path d="M-34 46 A34 34 0 0 0 34 46" fill="none" stroke="#9CC4E8" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 80V102M-18 102H18" stroke="#9CC4E8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- sound wave -->
  <g stroke="url(#wave)" stroke-width="8" stroke-linecap="round">
    <path d="M926 156V164"/>
    <path d="M948 144V176"/>
    <path d="M970 124V196"/>
    <path d="M992 138V182"/>
    <path d="M1014 114V206"/>
    <path d="M1036 134V186"/>
    <path d="M1058 148V172"/>
  </g>

  <!-- keyboard + native @ strip illustration -->
  <g transform="translate(1088 94)">
    <!-- native suggestion strip pill -->
    <rect x="0" y="0" width="126" height="28" rx="8" fill="#07152B" stroke="#2D6FA3" stroke-width="1.5"/>
    <text x="63" y="19" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#F6B13E">@grok  ·  @claude</text>
    <!-- keys -->
    <rect x="0" y="38" width="58" height="40" rx="8" fill="#12304F" stroke="#5FA3DA" stroke-width="2"/>
    <rect x="68" y="38" width="58" height="40" rx="8" fill="#12304F" stroke="#5FA3DA" stroke-width="2"/>
    <rect x="0" y="88" width="126" height="40" rx="8" fill="#F6B13E" fill-opacity="0.92"/>
    <path d="M16 58H42M84 58H110" stroke="#9CC4E8" stroke-width="3" stroke-linecap="round"/>
    <path d="M28 108H98" stroke="#0B1F3B" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
