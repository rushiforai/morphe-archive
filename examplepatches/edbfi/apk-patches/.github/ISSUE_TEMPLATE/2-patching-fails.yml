name: Patching fails
description: Patching stops with an error, or the patched APK won't install.
labels: [bug]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you report
      options:
        - label: I searched the open and closed issues for this problem.
          required: true
        - label: I patched the app version its page in [Supported apps](https://github.com/edbfi/apk-patches#supported-apps) lists as tested, with the latest release.
          required: true
        - label: I patched with only this bundle. In ReVanced Manager, that means unticking ReVanced Patches, as [Install](https://github.com/edbfi/apk-patches#revanced-manager) says.
          required: true
  - type: dropdown
    id: ecosystem
    attributes:
      label: Bundle
      description: The bundle you patched with.
      options:
        - ReVanced (patches-X.Y.Z.rvp)
        - Morphe (patches-X.Y.Z.mpp)
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App and version
      placeholder: Sync for Reddit v23.06.30-13:39
    validations:
      required: true
  - type: input
    id: apk
    attributes:
      label: Where the APK came from
      description: A link to the exact download page, or "installed app".
      placeholder: https://www.apkmirror.com/apk/…
    validations:
      required: true
  - type: input
    id: bundle
    attributes:
      label: Patches version
      description: The release you patched with.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Patching tool and version
      description: ReVanced Manager, the ReVanced CLI, Morphe Manager or the Morphe CLI.
      placeholder: ReVanced Manager 2.6.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      description: For the CLI, also the computer's OS and Java version.
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: textarea
    id: patches
    attributes:
      label: Patches and options
      description: Write "defaults" if you changed none; otherwise list what you changed.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: The step it stopped at and the error you saw.
    validations:
      required: true
  - type: textarea
    id: patcher-log
    attributes:
      label: Patcher log
      description: |
        - **ReVanced Manager:** once patching stops, tap the second icon in the bottom bar of the patching screen (**Save logs**; long-press an icon to see its name). If Manager itself crashes, use Settings → Advanced → **Export debug logs**.
        - **ReVanced CLI:** the whole terminal output of the `patch` command.
        - **Morphe Manager:** with Settings → **Expert mode** on, the patching screen shows the log; tap **Copy** in its bottom bar (after a successful patch, tap **Logs** first). Without Expert mode, a failed run's **Error details** has a **Copy** button. If Manager itself crashes, use Settings → **Help & info** → **Export debug logs**.
        - **Morphe CLI:** the whole terminal output of the `patch` command.

        Remove personal data. Paste the log, or for a long one a link to a paste site such as [PrivateBin](https://privatebin.net) or [0bin](https://0bin.ch), kept for at least a month and without burn after reading.
      render: text
    validations:
      required: true
