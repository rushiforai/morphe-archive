[versions]
# Hold the patcher at the version the stable Morphe Manager bundles: a newer pin trips the
# Manager's Patcher-Version gate and the bundle is refused. Stable Manager 2.2.0 (2026-10-25)
# bundles patcher 2.0.1, as does desktop CLI 1.19.1. A 2.0 bundle needs Manager 2.x;
# Manager 1.x refuses it with its update prompt.
morphe-patcher = "2.0.1"
# First stable Manager release that bundled the patcher above. Stated in README + bundle description.
manager-floor = "2.2.0"
# Read by the app.morphe.patches settings plugin, not by anything in this repo: remove it and
# configuration fails with "Version with alias smali not found in version catalog". The commit
# resolves as com.github.MorpheApp.smali through JitPack. Keep it the commit the patcher
# above requests (2.0.1 asks for ac700e1942; 2.0.0 asked for 4220ae75f7): Gradle merges the
# two requests and keeps the version that sorts higher, not the newer commit, so a stale pin
# can silently replace the patcher's dexlib2 in every compile graph.
#noinspection GradleDependency
smali = "ac700e1942"
gson = "2.14.0"

[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
