[versions]
# The patcher stable Morphe Manager 2.3.0 and Desktop 1.20.0 bundle. A newer pin trips Manager's
# Patcher-Version gate, and scripts/check_release.py holds the README's minimum client versions to
# this pin. 2.1.0 went stable on 2026-10-30 and checks bundle signatures.
morphe-patcher = "2.1.0"
# Read by the app.morphe.patches settings plugin. Keep it the smali commit the patcher above asks
# for (2.1.0 and 2.0.1 ask for ac700e1942, 2.0.0 asked for 4220ae75f7): Gradle keeps whichever sorts higher.
smali = "ac700e1942"
# Every org.bouncycastle request is rewritten to this, in :patches and on the settings classpath
# (settings.gradle.kts spells it out because the catalog does not exist yet there). 1.86 publishes
# bcprov, bcpkix and bcutil and is outside CVE-2025-8916, CVE-2026-5588, CVE-2025-14813,
# CVE-2026-0636, CVE-2026-8763 and CVE-2026-13506; the patcher asks for 1.77 and the Android build
# tools for 1.79.
bouncycastle = "1.86"

[libraries]
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }
