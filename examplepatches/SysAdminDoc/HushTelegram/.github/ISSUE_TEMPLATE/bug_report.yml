name: 🐞 Bug report
description: Something in HushTelegram doesn't work the way it should.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # HushTelegram bug report

        Thanks for taking the time to report this. Before you start:

        - **Check whether it's already reported.** Search the [open and closed bug reports](https://github.com/SysAdminDoc/HushTelegram/issues?q=is%3Aissue%20label%3Abug). If yours was closed and it still happens, comment on it and we'll reopen it. GitHub doesn't let the person who reported something reopen it.
        - **Patching stopped with an error?** Say which Telegram version you picked. The desktop scripts write a public patch summary you can attach below. Keep raw patching reports and configured APKs private because they can contain credentials.
  - type: input
    id: versions
    attributes:
      label: HushTelegram and Telegram versions
      description: Long-press the Telegram icon and tap HushTelegram, or open Telegram's App info page and tap Additional settings in the app. Then open More settings, then About, and copy the Version line.
      placeholder: HushTelegram 0.0.8 on Telegram 12.10.6
    validations:
      required: true
  - type: input
    id: variant
    attributes:
      label: Which Telegram file did you patch?
      description: Where it came from, such as telegram.org's APK, and its version code if you know it. Most bugs on a build that should work come from a different build of the same version.
      placeholder: telegram.org's APK, 12.10.6
  - type: dropdown
    id: manager
    attributes:
      label: What did you patch Telegram with?
      options:
        - Morphe Manager (the Android app)
        - morphe-desktop (on a computer)
        - Something else
    validations:
      required: true
  - type: input
    id: manager_version
    attributes:
      label: Its version
      description: Morphe Manager shows its version in its own settings. If you picked "Something else", name the program too.
      placeholder: Morphe Manager 1.33.0
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: How was it installed?
      options:
        - Standard install (re-signed)
        - Root Mount
        - I don't know
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      description: Both are in your phone's Settings, under About phone. If this Telegram is a clone, say which kind too, such as one renamed by Morphe's Clone app patch, Dual Apps, Second space or a work profile.
      placeholder: Samsung Galaxy S25, Android 16
    validations:
      required: true
  - type: dropdown
    id: selected_patches
    attributes:
      label: Which patches were in your build?
      description: Pick the patches included in your build. The manager shows which ones it selected by default.
      multiple: true
      options:
        - Disable analytics
        - Disable call debug upload
        - Disable chat swipe actions
        - Disable pull to next channel
        - Use normal paste
        - Show user and chat IDs
        - Disable double-tap reactions
        - Disable draft link previews
        - Disable update checks
        - Gallery camera on tap
        - Hide ads
        - Hide Stories
        - Hide recommendations
        - Hide popular apps
        - Hide Premium, gifts and Stars
        - Hide promotional banners
        - Hide sponsored proxy channel
        - Holiday look all year
        - Open links externally
        - Quiet contacts nag
        - Repair Firebase push registration
        - Use registered Telegram API credentials
        - Use registered Maps API key
        - Strip link tracking
        - HushTelegram settings
    validations:
      required: true
  - type: dropdown
    id: affected_surface
    attributes:
      label: Where did it happen?
      options:
        - The chat list
        - A channel, group or chat
        - The video player
        - Stories
        - Notifications
        - Calls
        - Signing in, or a screen that won't open
        - HushTelegram settings
        - Patching (Morphe Manager or morphe-desktop)
        - Other
    validations:
      required: true
  - type: textarea
    id: bug_description
    attributes:
      label: What went wrong?
      description: What happened, and what did you expect to happen instead? A screenshot or a screen recording helps a lot. Cover names and private messages first.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: What did you tap, in order?
      description: Start from opening Telegram. Include every HushTelegram switch you changed before it went wrong, and say whether it still happens after you close Telegram and open it again. For a message, say where it was, such as a channel, a group, a private chat or a shared link.
      placeholder: |
        1. Opened Telegram
        2. Opened a large public channel
        3. A sponsored message showed at the bottom
    validations:
      required: true
  - type: textarea
    id: diagnostic_report
    attributes:
      label: Diagnostic report
      description: |
        This answers most of our questions, so please add it if you can. It works with Debug logging off and then still names your build, the patches in it and what each one has counted. For the most detail, long-press the Telegram icon, tap HushTelegram, turn on Debug logging, do the thing that goes wrong, then come back, tap Export diagnostic report and pick Save full report. If the screen opens on category pages, these controls are under More settings, then Pause, backup and diagnostics. That saves a text file in Download/Morphe on your phone. Drag it into this box. If you can't get the file off your phone, pick Copy quick report instead and paste the shorter report here.
        The report leaves out links, long ID numbers, cookies, sign-in tokens and Authorization headers, JSON included. It can't spot a name, phone number or message written anywhere else, so read it and remove anything private before you post it.
  - type: textarea
    id: additional_context
    attributes:
      label: Anything else?
      description: A workaround you found, an older version where it still worked, or anything else that might help.
  - type: textarea
    id: public_patch_summary
    attributes:
      label: Public patch summary
      description: If you used the desktop scripts, attach public-summary.json or verify-all-public-summary-*.json. These contain validated targets, patch names and fixed failure codes. Don't attach result.json, a configured APK, option values or keystore details. If you used Morphe Manager, describe the visible error after removing private values.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before you send it
      options:
        - label: I searched the open and closed bug reports and this isn't one of them.
          required: true
        - label: I answered every question above as well as I could.
          required: true
