
name: Build NoBrokerHood patch bundle (.mpp)

on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/src/main/kotlin/community/nobrokerhood/NoBrokerHoodAdPatches.kt'
      - '.github/workflows/build-nobrokerhood.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Morphe Android patch bundle
        env:
          # The template's package registry may require an external PAT.
          # Set a repository secret named MORPHE_READ_PACKAGES_TOKEN if needed.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_READ_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon --stacktrace

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoBrokerHood-mpp-prototype
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 7
