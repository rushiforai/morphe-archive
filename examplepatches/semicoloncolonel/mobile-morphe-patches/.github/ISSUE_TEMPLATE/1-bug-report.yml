name: 🐞 Bug report
description: Morphe Manager does not accept your app version or build, a patch fails to apply, the patched app crashes or will not play, or a patch does not do what its description says.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please work through [Before you report a problem](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/faq.md#before-you-report-a-problem) first. It solves many problems, and this form asks you to confirm each step.

        I maintain these patches as a volunteer, so clear and complete reports are what make a fix possible. Please give as much detail as you can, even if you cannot answer every question. Before you submit, remove or cover any private information, such as your email address, account name, phone number, or location, in text, logs, and screenshots.

        Required fields are marked with an asterisk. A report that is incomplete, or that does not show what is wrong and how to reproduce it, may be closed without a fix.

        **Security problem?** Please do not report it here. Report it privately, as the [security policy](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/SECURITY.md) describes. The troubleshooting steps do not apply.

        **Using a dev pre-release?** Please comment on the app's open issue labeled [testing on dev](https://github.com/semicoloncolonel/mobile-morphe-patches/issues?q=is%3Aissue+is%3Aopen+label%3A%22testing+on+dev%22) instead of opening a report here. Open a report only for a critical problem, such as a patched app that will not install or open.
  - type: checkboxes
    id: before
    attributes:
      label: Before you submit
      options:
        - label: "I read the [Known issues](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/known-issues.md)."
          required: true
        - label: "I searched the [open and closed issues](https://github.com/semicoloncolonel/mobile-morphe-patches/issues?q=is%3Aissue) and did not find this problem."
          required: true
        - label: "I understand that the patches do not currently remove paywalls or unlock paid content."
          required: true
  - type: checkboxes
    id: troubleshooting
    attributes:
      label: Troubleshooting
      description: The steps in [Before you report a problem](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/faq.md#before-you-report-a-problem). Each one is required.
      options:
        - label: "I updated the patches in Morphe Manager and patched the app again with the latest release."
          required: true
        - label: "The app version and version code match [Supported apps](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/apps.md), and the APK came from a source the FAQ recommends."
          required: true
        - label: "I uninstalled the patched app, installed a fresh copy of the app, and patched it again."
          required: true
        - label: "I tried again with ad blockers, DNS filters, and VPNs turned off."
          required: true
        - label: "I tried again with only the default patches selected."
          required: true
        - label: "The problem does not happen in the unpatched app."
          required: true
  - type: dropdown
    id: app
    attributes:
      label: App
      description: The app you patched.
      options:
        - "ABC News"
        - "Amazon Shopping"
        - "AMC+"
        - "AP News"
        - "Apple TV"
        - "Apple TV (Android TV)"
        - "Best Buy"
        - "C-SPAN Now"
        - "CBS News"
        - "Checkout 51"
        - "CNBC"
        - "CNN"
        - "Costco"
        - "CVS"
        - "DealNews"
        - "DealSeek"
        - "Disney+"
        - "ESPN"
        - "Fandango at Home"
        - "FEMA"
        - "Flipp"
        - "Fox Local"
        - "Fox News"
        - "Fox One"
        - "HBO Max"
        - "Hulu"
        - "JustWatch"
        - "Kanopy"
        - "Lowe's"
        - "MGM+"
        - "Mint Mobile"
        - "MLB"
        - "Moviebase"
        - "MS NOW"
        - "My Verizon"
        - "myAT&T"
        - "MyTSA"
        - "National Forests & Grasslands"
        - "NBA"
        - "NBC News"
        - "NewsBreak"
        - "NewsNation"
        - "NewsNation (Android TV)"
        - "NFL"
        - "NPR"
        - "NPS"
        - "Paramount+"
        - "PBS"
        - "Peacock"
        - "Plex"
        - "Pluto TV"
        - "Prime Video"
        - "Recreation.gov"
        - "RetailMeNot"
        - "Settings Home"
        - "Shudder"
        - "SiriusXM"
        - "Slickdeals"
        - "Starz"
        - "Substack"
        - "Sundance Now"
        - "T-Life"
        - "T-Mobile Play"
        - "Target"
        - "The Daily Wire"
        - "The Home Depot"
        - "The New York Times"
        - "The Wall Street Journal"
        - "The Washington Post"
        - "theScore"
        - "Truth Social"
        - "Tubi"
        - "USA TODAY"
        - "Visible"
        - "Walgreens"
        - "Walmart"
        - "White House"
        - "Xfinity"
        - "Xumo Play"
        - "Yahoo Finance"
        - "Yahoo News"
        - "YouTube TV"
        - "YouTube TV (Android TV)"
        - "Other (name it in the description)"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: The version you patched. In Morphe Manager it is shown when you select the APK.
      placeholder: "17.3.0"
    validations:
      required: true
  - type: input
    id: version-code
    attributes:
      label: App version code
      description: Some apps have phone and Android TV builds with the same version, and only the version code tells them apart. Morphe Manager shows it when you select the APK, and APKMirror shows it on the download page.
      placeholder: "520000991"
  - type: dropdown
    id: build
    attributes:
      label: Phone or Android TV build
      description: Which build of the app you patched.
      options:
        - Phone or tablet
        - Android TV or Google TV
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: apk-source
    attributes:
      label: Where the APK came from
      description: Most version and build problems come from the file. The [FAQ](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/faq.md) explains how to get the right one.
      options:
        - APKMirror
        - APKPure
        - Aurora Store
        - Installed copy from the Play Store
        - Morphe Manager's download link
        - Other (name it in the description)
    validations:
      required: true
  - type: input
    id: patches-version
    attributes:
      label: Patches version
      description: The version of these patches, shown under Sources in Morphe Manager.
      placeholder: "1.0.19"
    validations:
      required: true
  - type: dropdown
    id: patches-release
    attributes:
      label: Patches release
      description: Dev pre-releases have "-dev" in the version, such as 1.0.20-dev.4.
      options:
        - Main release
        - Dev pre-release
        - Not sure
    validations:
      required: true
  - type: input
    id: manager-version
    attributes:
      label: Morphe Manager version
      placeholder: "2.5.0"
    validations:
      required: true
  - type: textarea
    id: selected-patches
    attributes:
      label: Patches selected
      description: The patches you applied. If you kept the defaults, say so.
    validations:
      required: true
  - type: dropdown
    id: clone
    attributes:
      label: Clone app
      description: Whether the Clone app option was on, which installs the app under a new package name.
      options:
        - "Off"
        - "On"
        - Not sure
  - type: input
    id: device
    attributes:
      label: Device
      description: The maker and model of the phone, tablet, or TV device.
      placeholder: "Samsung Galaxy S25 Ultra, NVIDIA Shield TV Pro, Google TV Streamer"
    validations:
      required: true
  - type: dropdown
    id: android-version
    attributes:
      label: Android version
      description: On a phone, see Settings > About phone. On a TV, see Settings > System > About.
      options:
        - "Android 17"
        - "Android 16"
        - "Android 15"
        - "Android 14"
        - "Android 13"
        - "Android 12 or 12L"
        - "Android 11"
        - "Android 10"
        - "Android 9 or older"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: root
    attributes:
      label: Rooted
      options:
        - "No"
        - "Yes"
  - type: dropdown
    id: dns-filter
    attributes:
      label: Ad blockers or DNS filters
      description: Ad blockers and DNS filters can stop video or sign-in on their own. Select any that were on.
      multiple: true
      options:
        - No ad blocker or DNS filter
        - AdGuard
        - Control D
        - NextDNS
        - Pi-hole
        - Private DNS (set in Android settings)
        - Other (name it in the description)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected, what happened instead, and when it started.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Play a movie
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash log
      description: |
        If the app crashes, connect it with adb and run `adb logcat -b crash`, or `adb logcat | grep -A 40 "FATAL EXCEPTION"`. Please include everything from `FATAL EXCEPTION` down.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Drag a screenshot or video of the problem here to attach it. If you pasted a crash log in Crash log, write "See crash log". A report with neither cannot be looked into.
    validations:
      required: true
