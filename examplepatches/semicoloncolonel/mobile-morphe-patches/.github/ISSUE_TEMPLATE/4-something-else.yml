name: 💬 Question or idea
description: A question about using the patches, an idea, or a problem with the documentation. To report something that does not work, use Bug report.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        This form is for questions and ideas. If a patch fails to apply, the app crashes or will not play, or a patch does not do what its description says, use the Bug report form instead. It asks for the details needed to find the cause. A problem reported through this form will be closed, and you will be asked to use the Bug report form.
  - type: checkboxes
    id: before
    attributes:
      label: Before you submit
      options:
        - label: "I read the README and the [Known issues](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/known-issues.md)."
          required: true
        - label: "I searched the [open and closed issues](https://github.com/semicoloncolonel/mobile-morphe-patches/issues?q=is%3Aissue) and did not find this topic."
          required: true
        - label: "I understand that the patches do not currently remove paywalls or unlock paid content."
          required: true
        - label: "This is a question or an idea, not a report of something that does not work."
          required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - A question about using the patches
        - An idea or suggestion
        - The documentation
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App and version
      description: The app and version your question or idea is about. If it is not about one app, write None.
      placeholder: "Disney+ 26.20.0+rc2-2026.10.28"
    validations:
      required: true
  - type: dropdown
    id: apk-source
    attributes:
      label: Where the APK came from
      description: Most version and build problems come from the file. The [FAQ](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/faq.md) explains how to get the right one.
      options:
        - APKMirror
        - APKPure
        - Aurora Store
        - Installed copy from the Play Store
        - Morphe Manager's download link
        - Other (name it in the description)
        - Does not apply
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: The maker and model of the phone, tablet, or TV device. If it is not about a device, write None.
      placeholder: "Samsung Galaxy S25 Ultra, NVIDIA Shield TV Pro, Google TV Streamer"
    validations:
      required: true
  - type: dropdown
    id: android-version
    attributes:
      label: Android version
      description: On a phone, see Settings > About phone. On a TV, see Settings > System > About.
      options:
        - "Android 17"
        - "Android 16"
        - "Android 15"
        - "Android 14"
        - "Android 13"
        - "Android 12 or 12L"
        - "Android 11"
        - "Android 10"
        - "Android 9 or older"
        - "Not sure"
        - "Not about a device"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
    validations:
      required: true
