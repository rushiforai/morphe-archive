        - "MGM+"
        - "Mint Mobile"
        - "MLB"
        - "Moviebase"
        - "MS NOW"
        - "My Verizon"
        - "myAT&T"
        - "MyTSA"
        - "National Forests & Grasslands"
        - "NBA"
        - "NBC News"
        - "NewsBreak"
        - "NewsNation"
        - "NewsNation (Android TV)"
        - "NFL"
        - "NPR"
        - "NPS"
        - "Paramount+"
        - "PBS"
        - "Peacock"
        - "Plex"
        - "Pluto TV"
        - "Prime Video"
        - "Recreation.gov"
        - "RetailMeNot"
        - "Settings Home"
        - "Shudder"
        - "SiriusXM"
        - "Slickdeals"
        - "Starz"
        - "Substack"
        - "Sundance Now"
        - "T-Life"
        - "T-Mobile Play"
        - "Target"
        - "The Daily Wire"
        - "The Home Depot"
        - "The New York Times"
        - "The Wall Street Journal"
        - "The Washington Post"
        - "theScore"
        - "Truth Social"
        - "Tubi"
        - "USA TODAY"
        - "Visible"
        - "Walgreens"
        - "Walmart"
        - "White House"
        - "Xfinity"
        - "Xumo Play"
        - "Yahoo Finance"
        - "Yahoo News"
        - "YouTube TV"
        - "YouTube TV (Android TV)"
        - "Other (name it in the description)"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: The version you patched. In Morphe Manager it is shown when you select the APK.
      placeholder: "17.3.0"
    validations:
      required: true
  - type: input
    id: version-code
    attributes:
      label: App version code
      description: Some apps have phone and Android TV builds with the same version, and only the version code tells them apart. Morphe Manager shows it when you select the APK, and APKMirror shows it on the download page.
      placeholder: "520000991"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Phone or Android TV build
      description: Which build of the app you patched.
      options:
        - Phone or tablet
        - Android TV or Google TV
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: apk-source
    attributes:
      label: Where the APK came from
      description: Most version and build problems come from the file. The [FAQ](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/faq.md) explains how to get the right one.
      options:
        - APKMirror
        - APKPure
        - Aurora Store
        - Installed copy from the Play Store
        - Morphe Manager's download link
        - Other (name it in the description)
    validations:
      required: true
  - type: input
    id: patches-version
    attributes:
      label: Patches version
      description: The version of these patches, shown under Sources in Morphe Manager.
      placeholder: "1.0.19"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: The maker and model of the phone, tablet, or TV device.
      placeholder: "Samsung Galaxy S25 Ultra, NVIDIA Shield TV Pro, Google TV Streamer"
    validations:
      required: true
  - type: dropdown
    id: android-version
    attributes:
      label: Android version
      description: On a phone, see Settings > About phone. On a TV, see Settings > System > About.
      options:
        - "Android 17"
        - "Android 16"
        - "Android 15"
        - "Android 14"
        - "Android 13"
        - "Android 12 or 12L"
        - "Android 11"
        - "Android 10"
        - "Android 9 or older"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: manager-message
    attributes:
      label: Morphe Manager's message
      description: Drag a screenshot of what Morphe Manager shows when you select the file here to attach it.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: For example, why you could not use the copy from Google Play or Aurora Store.
