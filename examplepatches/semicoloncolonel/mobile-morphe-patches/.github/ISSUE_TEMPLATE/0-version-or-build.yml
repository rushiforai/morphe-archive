        - "Apple TV (Android TV)"
        - "Best Buy"
        - "C-SPAN Now"
        - "CBS News"
        - "Checkout 51"
        - "CNBC"
        - "CNN"
        - "Costco"
        - "CVS"
        - "DealNews"
        - "DealSeek"
        - "Disney+"
        - "ESPN"
        - "Fandango at Home"
        - "FEMA"
        - "Flipp"
        - "Fox Local"
        - "Fox News"
        - "Fox One"
        - "HBO Max"
        - "Hulu"
        - "JustWatch"
        - "Kanopy"
