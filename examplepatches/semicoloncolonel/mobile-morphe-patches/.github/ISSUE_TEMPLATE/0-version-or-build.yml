name: 🔢 App version or build not accepted
description: Morphe Manager says your app version or build is not supported. Please read the explanation at the top of the form first.
title: "version: "
labels: ["app version"]
body:
  - type: markdown
    attributes:
      value: |
        Please read this before you report. Most version problems come from the APK file, not from the patches.

        **The version and the version code are different.** The version is a name, such as `26.20.0+rc3-2026.11.02`. The version code, which Morphe Manager shows as the build, is a number, such as `179366219`. Some apps publish several builds of one version, for phones, Android TV, Fire TV, and Fire tablets, and each build has its own version code. The patches accept only the versions and builds listed in [Supported apps](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/apps.md).

        - **The version is not listed.** The patches do not support that version yet. Patch a listed version, or ask for the new one with the [New app or patch request](https://github.com/semicoloncolonel/mobile-morphe-patches/issues/new?template=3-new-app-or-patch.yml) form.
        - **The version is listed, but the version code is different.** The file is a build for another device. Install the app from Google Play or [Aurora Store](https://auroraoss.com/), then patch it in Morphe Manager with "Use installed app".

        The newest file on APKMirror is not always the right one, and download tools that pick the newest file can choose a build for another device. The [FAQ](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/faq.md#morphe-manager-says-my-version-or-build-is-not-supported) explains this in more detail.

        If you checked both and Morphe Manager still does not accept a listed version and version code, please report it here. Before you submit, remove or cover any private information, such as your email address, account name, phone number, or location, in text and screenshots.
  - type: checkboxes
    id: before
    attributes:
      label: Before you submit
      options:
        - label: "I compared the version and the version code with [Supported apps](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/apps.md), and both are listed."
          required: true
        - label: "I installed the app from Google Play or Aurora Store and tried to patch it with \"Use installed app\", or I explain below why I could not."
          required: true
        - label: "I searched the [open and closed issues](https://github.com/semicoloncolonel/mobile-morphe-patches/issues?q=is%3Aissue) and did not find this problem."
          required: true
  - type: dropdown
    id: app
    attributes:
      label: App
      description: The app you patched.
      options:
