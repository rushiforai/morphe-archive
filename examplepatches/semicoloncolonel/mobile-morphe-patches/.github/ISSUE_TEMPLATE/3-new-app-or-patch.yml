name: 📦 New app or patch request
description: Ask for an app that is not supported yet, a new patch for a supported app, or another version.
title: "request: "
labels: ["type: request"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the suggestion. Every field except Anything else is required.

        This source patches phone apps. To ask for an Android TV app or patch, use the [TV patch source's forms](https://github.com/semicoloncolonel/tv-morphe-patches/issues/new/choose).

        Before you start, please check the [open and closed issues](https://github.com/semicoloncolonel/mobile-morphe-patches/issues?q=is%3Aissue) for the same request, and the [Morphe patches site](https://morphe-patches.software/) for a patch that another source already offers. If that patch is out of date, please ask its author to update it first. I take over a patch only when its author no longer works on it.
  - type: checkboxes
    id: before
    attributes:
      label: Before you submit
      description: "New to this tracker? [Issue labels](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/issue-labels.md) explains how issues are sorted, tracked, and closed."
      options:
        - label: "I searched the [open and closed issues](https://github.com/semicoloncolonel/mobile-morphe-patches/issues?q=is%3Aissue) and did not find this request."
          required: true
        - label: "Unless otherwise stated, I understand that none of the patches bypass paywalls or unlock paid content."
          required: true
        - label: "I searched the [Morphe patches site](https://morphe-patches.software/) and no other patch source already does this."
          required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type of request
      options:
        - A new app
        - A new patch for an app that is already supported
        - Support for another version of a supported app
        - Something else
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App name
      placeholder: "Pluto TV"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Play Store or APKMirror link
      placeholder: "https://play.google.com/store/apps/details?id=..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: The version you would like supported, if it matters.
    validations:
      required: true
  - type: dropdown
    id: beta
    attributes:
      label: Are you enrolled as a beta tester for this app?
      description: On Google Play, the app's page says "You're a beta tester" when you are. A beta tester can get a version that is not public yet, and I can only support a beta that I can install myself.
      options:
        - "No"
        - "Yes"
        - "I do not know"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Phone or Android TV build
      options:
        - Phone or tablet
        - Android TV or Google TV
        - Both
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What the patch should do
      description: For example, which ads, prompts, or tracking to remove. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Links, other projects that patch this app, or anything else that could help.
