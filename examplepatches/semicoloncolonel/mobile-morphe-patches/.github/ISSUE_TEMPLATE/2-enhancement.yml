      required: true
  - type: input
    id: patch
    attributes:
      label: Patch
      description: The patch you would like improved.
      placeholder: "Skip ads"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "17.3.0"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Phone or Android TV build
      options:
        - Phone or tablet
        - Android TV or Google TV
        - Both
    validations:
      required: true
  - type: dropdown
    id: apk-source
    attributes:
      label: Where the APK came from
      description: Most version and build problems come from the file. The [FAQ](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/faq.md) explains how to get the right one.
      options:
        - APKMirror
        - APKPure
        - Aurora Store
        - Installed copy from the Play Store
        - Morphe Manager's download link
        - Other (name it in the description)
    validations:
      required: true
  - type: input
    id: patches-version
    attributes:
      label: Patches version
      description: The version of these patches, shown under Sources in Morphe Manager.
      placeholder: "1.0.19"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: The maker and model of the phone, tablet, or TV device.
      placeholder: "Samsung Galaxy S25 Ultra, NVIDIA Shield TV Pro, Google TV Streamer"
    validations:
      required: true
  - type: dropdown
    id: android-version
    attributes:
      label: Android version
      description: On a phone, see Settings > About phone. On a TV, see Settings > System > About.
      options:
        - "Android 17"
        - "Android 16"
        - "Android 15"
        - "Android 14"
        - "Android 13"
        - "Android 12 or 12L"
        - "Android 11"
        - "Android 10"
        - "Android 9 or older"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What could be better
      description: What the patch misses or leaves behind, and where in the app you see it.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Drag files here to attach them. A screenshot of what is left behind helps the most.
  - type: textarea
    id: context
    attributes:
      label: Anything else
