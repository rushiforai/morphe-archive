name: ✨ Improve a working patch
description: A patch works, but it misses something, such as an ad, a prompt, or a tracker, or it leaves an empty space behind. Not for problems.
title: "enhancement: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form only when a patch works as described and you would like it to do more, for example hide an ad or prompt it misses, or remove an empty space it leaves behind.

        This form is not for anything that does not work. Use the [Bug report](https://github.com/semicoloncolonel/mobile-morphe-patches/issues/new?template=1-bug-report.yml) form when:

        - Morphe Manager does not accept your app version or build.
        - A patch fails to apply.
        - The patched app will not install, open, play, or sign in, or it crashes.
        - A patch does not do what [What the patches do](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/patches.md) says it does.

        To ask for a new app, a new patch, or another app version, use the [New app or patch request](https://github.com/semicoloncolonel/mobile-morphe-patches/issues/new?template=3-new-app-or-patch.yml) form.

        Thank you for helping improve a patch. I maintain these patches as a volunteer, so complete requests are the quickest to act on. A screenshot of what the patch misses helps the most. Before you submit, remove or cover any private information, such as your email address, account name, phone number, or location, in text and screenshots.

        Required fields are marked with an asterisk. A request that is incomplete, or that does not show what the patch misses, may be closed without a change.
  - type: checkboxes
    id: before
    attributes:
      label: Before you submit
      options:
        - label: "I read [What the patches do](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/patches.md) and the [Known issues](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/known-issues.md)."
          required: true
        - label: "I searched the [open and closed issues](https://github.com/semicoloncolonel/mobile-morphe-patches/issues?q=is%3Aissue) and did not find this enhancement."
          required: true
        - label: "I understand that the patches do not currently remove paywalls or unlock paid content."
          required: true
        - label: "The patch works. This request asks it to do more, and it is not a report of something that does not work."
          required: true
