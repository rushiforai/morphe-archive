name: ✨ Improve a working patch
description: Ask for a new feature or a change to how a working patch behaves, such as a new option. Not for something that does not work, such as an ad that still plays or a side effect of a patch.
title: "enhancement: "
labels: ["type: enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to ask for a new feature or a change to how a working patch behaves, for example a new option or a different default.

        This form is not for anything that does not work. Use the [Bug report](https://github.com/semicoloncolonel/mobile-morphe-patches/issues/new?template=1-bug-report.yml) form when:

        - Morphe Manager does not accept your app version or build.
        - A patch fails to apply.
        - The patched app will not install, open, play, or sign in, or it crashes.
        - A patch misses something it should remove, such as an ad, a prompt, or a tracker, or it leaves an empty space behind.
        - A patch causes a new problem, such as out-of-sync subtitles.
        - A patch does not do what [What the patches do](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/patches.md) says it does.

        To ask for a new app, a new patch, or another app version, use the [New app or patch request](https://github.com/semicoloncolonel/mobile-morphe-patches/issues/new?template=3-new-app-or-patch.yml) form.

        Thank you for helping improve a patch. I maintain these patches as a volunteer, so complete requests are the quickest to act on. A screenshot of the part of the app you would like changed helps the most. Before you submit, remove or cover any private information, such as your email address, account name, phone number, or location, in text and screenshots.

        Required fields are marked with an asterisk. A request that is incomplete, or that does not say what should change, may be closed without a change.
  - type: checkboxes
    id: before
    attributes:
      label: Before you submit
      description: "New to this tracker? [Issue labels](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/issue-labels.md) explains how issues are sorted, tracked, and closed."
      options:
        - label: "I read [What the patches do](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/patches.md) and the [Known issues](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/known-issues.md)."
          required: true
        - label: "I searched the [open and closed issues](https://github.com/semicoloncolonel/mobile-morphe-patches/issues?q=is%3Aissue) and did not find this enhancement."
          required: true
        - label: "Unless otherwise stated, I understand that none of the patches bypass paywalls or unlock paid content."
          required: true
        - label: "The patch works. This request asks it to do more, and it is not a report of something that does not work."
          required: true
