        - "CNBC"
        - "CNN"
        - "Costco"
        - "CVS"
        - "DealNews"
        - "DealSeek"
        - "Disney+"
        - "ESPN"
        - "Fandango at Home"
        - "FEMA"
        - "Flipp"
        - "Fox Local"
        - "Fox News"
        - "Fox One"
        - "HBO Max"
        - "Hulu"
