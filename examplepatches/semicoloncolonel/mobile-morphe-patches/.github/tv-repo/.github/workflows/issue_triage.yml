name: Triage issues

# Checks issues from people outside the project for the details their form
# requires, and labels the ones that lack them "incomplete". Bug reports and
# version or build reports are also checked against the Android TV versions
# the patches support, and the ones that use another version or build are
# labeled "untargeted version".
#
# The patches and the script live in mobile-morphe-patches, so this checks out
# that repository for them and reads the forms from this one. See
# mobile-morphe-patches/.github/scripts/issue_triage.py.
#
# The issue body is untrusted. Only the script reads it, from the event file;
# it never reaches a shell command.
#
# Copied from mobile-morphe-patches/.github/tv-repo. Edit it there.

on:
  issues:
    types: [opened, edited]

permissions: {}

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    name: Check the report
    if: >-
      (contains(github.event.issue.labels.*.name, 'bug') ||
       contains(github.event.issue.labels.*.name, 'app version') ||
       contains(github.event.issue.labels.*.name, 'enhancement') ||
       contains(github.event.issue.labels.*.name, 'question')) &&
      github.event.issue.state == 'open' &&
      github.event.issue.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout the forms
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout the patches
        uses: actions/checkout@v7
        with:
          repository: semicoloncolonel/mobile-morphe-patches
          # dev, because the script's TV options reach dev before main.
          ref: dev
          path: mobile
          # main and dev are both read for the supported versions.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the report
        working-directory: mobile
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIAGE_FORMS_DIR: ../.github/ISSUE_TEMPLATE
          TRIAGE_DEFAULT_BUILD: Android TV
        run: python3 .github/scripts/issue_triage.py
