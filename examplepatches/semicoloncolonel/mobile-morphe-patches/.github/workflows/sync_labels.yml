name: Sync labels

# Makes the issue labels match .github/labels.json, which sets every label's
# color and description. See .github/scripts/sync_labels.py.

on:
  push:
    branches:
      - main
    paths:
      - .github/labels.json
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    name: Sync labels
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Sync
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/sync_labels.py
