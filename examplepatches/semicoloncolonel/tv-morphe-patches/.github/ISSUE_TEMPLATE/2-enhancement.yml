name: ✨ Improve a working patch
description: Ask for a new feature or a change to how a working patch behaves, such as a new option. Not for something that does not work, such as an ad that still plays or a side effect of a patch.
title: "enhancement: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to ask for a new feature or a change to how a working patch behaves, for example a new option or a different default.

        This form is not for anything that does not work. Use the [Bug report](https://github.com/semicoloncolonel/tv-morphe-patches/issues/new?template=1-bug-report.yml) form when:

        - Morphe Manager does not accept your app version or build.
        - A patch fails to apply.
        - The patched app will not install, open, play, or sign in, or it crashes.
        - A patch misses something it should remove, such as an ad, a prompt, or a tracker, or it leaves an empty space behind.
        - A patch causes a new problem, such as out-of-sync subtitles.
        - A patch does not do what [What the patches do](https://github.com/semicoloncolonel/tv-morphe-patches/blob/main/docs/patches.md) says it does.

        To ask for a new app, a new patch, or another app version, use the [New app or patch request](https://github.com/semicoloncolonel/tv-morphe-patches/issues/new?template=3-new-app-or-patch.yml) form.

        Thank you for helping improve a patch. I maintain these patches as a volunteer, so complete requests are the quickest to act on. A screenshot of the part of the app you would like changed helps the most. Before you submit, remove or cover any private information, such as your email address, account name, phone number, or location, in text and screenshots.

        Required fields are marked with an asterisk. A request that is incomplete, or that does not say what should change, may be closed without a change.
  - type: checkboxes
    id: before
    attributes:
      label: Before you submit
      options:
        - label: "I read [What the patches do](https://github.com/semicoloncolonel/tv-morphe-patches/blob/main/docs/patches.md) and the [Known issues](https://github.com/semicoloncolonel/tv-morphe-patches/blob/main/docs/known-issues.md)."
          required: true
        - label: "I searched the [open and closed issues](https://github.com/semicoloncolonel/tv-morphe-patches/issues?q=is%3Aissue) and did not find this enhancement."
          required: true
        - label: "I understand that the patches do not currently remove paywalls or unlock paid content."
          required: true
        - label: "The patch works. This request asks it to do more, and it is not a report of something that does not work."
          required: true
  - type: dropdown
    id: app
    attributes:
      label: App
      description: The app the patch is for.
      options:
        - "Apple TV"
        - "Disney+"
        - "ESPN"
        - "Fox One"
        - "HBO Max"
        - "Hulu"
        - "JustWatch"
        - "MGM+"
        - "MLB"
        - "NBA"
        - "NewsNation"
        - "NFL"
        - "PBS"
        - "Peacock"
        - "Plex"
        - "Pluto TV"
        - "Prime Video"
        - "Starz"
        - "Tubi"
        - "YouTube TV"
        - "Other (name it in the description)"
    validations:
      required: true
  - type: input
    id: patch
    attributes:
      label: Patch
      description: The patch you would like improved.
      placeholder: "Skip ads"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "17.3.0"
    validations:
      required: true
  - type: dropdown
    id: apk-source
    attributes:
      label: Where the APK came from
      description: Most version and build problems come from the file. The [FAQ](https://github.com/semicoloncolonel/mobile-morphe-patches/blob/main/docs/faq.md) explains how to get the right one.
      options:
        - APKMirror
        - APKPure
        - Aurora Store
        - Installed copy from the Play Store
        - Morphe Manager's download link
        - Other (name it in the description)
    validations:
      required: true
  - type: input
    id: patches-version
    attributes:
      label: Patches version
      description: The version of these patches, shown under Sources in Morphe Manager.
      placeholder: "1.0.19"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: The maker and model of the TV device, such as an NVIDIA Shield TV or a Chromecast with Google TV.
      placeholder: "Samsung Galaxy S25 Ultra, NVIDIA Shield TV Pro, Google TV Streamer"
    validations:
      required: true
  - type: dropdown
    id: android-version
    attributes:
      label: Android version
      description: See Settings > System > About.
      options:
        - "Android 17"
        - "Android 16"
        - "Android 15"
        - "Android 14"
        - "Android 13"
        - "Android 12 or 12L"
        - "Android 11"
        - "Android 10"
        - "Android 9 or older"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What could be better
      description: The feature or change you would like, and where in the app it would apply.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Drag files here to attach them. A screenshot of the part of the app you would like changed helps the most.
  - type: textarea
    id: context
    attributes:
      label: Anything else
