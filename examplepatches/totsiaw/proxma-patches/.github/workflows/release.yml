name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
      discussions: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid generatePatchesList

      - name: Clean old build artifacts (avoids version bleed into assets)
        run: rm -f patches/build/libs/patches-*.mpp

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Nai64Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      - name: Notify shipped requests
        if: steps.release.outputs.new_release_published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.new_release_git_tag }}
          LAST: ${{ steps.release.outputs.last_release_git_tag }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP"

          # Without a readable previous list every app would look new; skip instead.
          if [ -z "$LAST" ] || ! git show "$LAST:patches-list.json" > "$tmp/previous.json" 2>/dev/null; then
            echo "::notice::No patches-list.json at previous release '${LAST}'; skipping"
            exit 0
          fi
          git show "$TAG:patches-list.json" > "$tmp/current.json"

          bash .github/scripts/discussion.sh list app-requests > "$tmp/discussions.json"
          gh issue list --repo "$REPO" --state open --label app-update --limit 200 \
            --json number,title,body,comments > "$tmp/issues.json"

          python3 .github/scripts/shipped_requests.py \
            "$tmp/previous.json" "$tmp/current.json" \
            "$tmp/discussions.json" "$tmp/issues.json" "$TAG" > "$tmp/actions.jsonl"

          while IFS= read -r row; do
            kind=$(jq -r .kind <<<"$row")
            n=$(jq -r .number <<<"$row")
            app=$(jq -r .app <<<"$row")
            jq -r .comment <<<"$row" > "$tmp/comment.md"
            if [ "$kind" = discussion ]; then
              bash .github/scripts/discussion.sh comment "$n" "$tmp/comment.md" >/dev/null
              echo "Commented on discussion #$n ($app)"
              if [ "$(jq -r .close <<<"$row")" = true ]; then
                bash .github/scripts/discussion.sh close "$n" RESOLVED
                echo "Closed discussion #$n ($app)"
              fi
            else
              gh issue comment "$n" --repo "$REPO" --body-file "$tmp/comment.md" >/dev/null
              echo "Commented on issue #$n ($app)"
            fi
          done < "$tmp/actions.jsonl"
