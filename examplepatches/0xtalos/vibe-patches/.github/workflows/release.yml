name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle Credentials
        env:
          GPR_USER: ${{ github.actor }}
          GPR_KEY: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.gradle
          echo "gpr.user=$GPR_USER" >> ~/.gradle/gradle.properties
          echo "gpr.key=$GPR_KEY" >> ~/.gradle/gradle.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Get version from tag or commit
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="v1.3.3"
          fi
          RAW_VER="${VER#v}"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "raw_version=$RAW_VER" >> $GITHUB_OUTPUT

      - name: Build patches
        env:
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -o pipefail
          VER="${{ steps.version.outputs.raw_version }}"
          ./gradlew :patches:buildAndroid -Pversion=$VER --stacktrace --no-daemon 2>&1 | tee build.log || {
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b build-failure-log
            git add -f build.log
            git commit -m "chore: save build failure log"
            git push -f origin build-failure-log
            exit 1
          }
          echo "Build finished. Directory contents:"
          ls -la patches/build/libs/
          for f in patches/build/libs/*.mpp; do
            if [ -f "$f" ] && [ "$f" != "patches/build/libs/patches-$VER.mpp" ]; then
              cp "$f" "patches/build/libs/patches-$VER.mpp"
            fi
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Vibe Patches ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            patches/build/libs/*.mpp
            patches/build/libs/*.jar
            patches-bundle.json
            patches-list.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

