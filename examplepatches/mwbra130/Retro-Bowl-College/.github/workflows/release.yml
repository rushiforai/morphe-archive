name: Build & Publish Release

on:
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Leave blank to auto-increment (0.0.1 -> 0.0.2), or enter exact version (e.g. 0.0.1)'
        required: false
        default: ''
        type: string
  push:
    branches: [ main ]
    paths:
      - 'patches/**'
      - 'extensions/**'
      - 'settings.gradle.kts'


concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle (Cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Next Version (Starts at 0.0.1)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_VER: ${{ github.event.inputs.custom_version }}
        run: |
          if [ -n "$CUSTOM_VER" ]; then
            NEXT_VER="${CUSTOM_VER#v}"
          else
            # Check your latest published GitHub Release (ignores old inherited tags)
            LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
            if [[ "$LATEST_TAG" =~ ^v?0\.0\.([0-9]+)$ ]]; then
              PATCH_NUM=$((BASH_REMATCH[1] + 1))
              NEXT_VER="0.0.${PATCH_NUM}"
            elif [[ "$LATEST_TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              PATCH_NUM=$((BASH_REMATCH[3] + 1))
              NEXT_VER="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${PATCH_NUM}"
            else
              # First release starts at 0.0.1
              NEXT_VER="0.0.1"
            fi
          fi
          echo "version=$NEXT_VER" >> $GITHUB_OUTPUT
          echo "Building version v$NEXT_VER"

      - name: Build Patches (.mpp)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :patches:buildAndroid :patches:generatePatchesList -Pversion="${{ steps.ver.outputs.version }}" --no-daemon
          # The build also drops -sources and -javadoc jars in this folder.
          # Never glob-pick one of those as the bundle: the release asset must
          # be exactly patches-<version>.mpp, or this run fails right here.
          ls -la patches/build/libs/
          test -f "patches/build/libs/patches-${{ steps.ver.outputs.version }}.mpp"

      - name: Update README App Grid & Patch List
        run: |
          if [ ! -f "patches-list.json" ]; then
            for cand in patches/patches-list.json patches/build/patches-list.json patches/build/libs/patches-list.json; do
              if [ -f "$cand" ]; then cp "$cand" patches-list.json; break; fi
            done
          fi
          if [ ! -f "patches-list.json" ]; then
            python3 -c '
          import zipfile, json
          from pathlib import Path
          mpp = sorted(Path("patches/build/libs").glob("patches-*.mpp"))[0]
          with zipfile.ZipFile(mpp) as z:
              if "patches-list.json" in z.namelist():
                  Path("patches-list.json").write_bytes(z.read("patches-list.json"))
          '
          fi
          if [ -f "patches-list.json" ] && [ -f ".github/scripts/generate_patches_readme.py" ]; then
            python3 -c '
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          ver = "${{ steps.ver.outputs.version }}"
          p = Path("patches-list.json")
          data = json.loads(p.read_text())
          data["version"] = ver
          p.write_text(json.dumps(data, indent=2))
          bundle = {
              "created_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S"),
              "description": f"Release v{ver}",
              "download_url": f"https://github.com/${{ github.repository }}/releases/download/v{ver}/patches-{ver}.mpp",
              "signature_download_url": "",
              "version": ver,
          }
          Path("patches-bundle.json").write_text(json.dumps(bundle, indent=2))
          '
            python3 .github/scripts/generate_patches_readme.py "${{ github.repository }}" main patches-list.json README.md
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md patches-list.json patches-bundle.json
            git commit -m "docs: update README for v${{ steps.ver.outputs.version }} [skip ci]" || exit 0
            git push
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          gh release create "v${VER}" \
            "patches/build/libs/patches-${VER}.mpp" \
            --title "v${VER}" \
            --notes "Release v${VER}"
