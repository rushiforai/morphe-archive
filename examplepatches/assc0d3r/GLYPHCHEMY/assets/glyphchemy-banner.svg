<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Glyphchemy — Alchemy for Every Key</title>
  <desc id="desc">A dark violet and midnight keyboard-inspired animated banner with gently floating luminous keycaps, breathing light, and an abstract alchemy glyph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B1A"/>
      <stop offset="0.52" stop-color="#17133A"/>
      <stop offset="1" stop-color="#071E2B"/>
    </linearGradient>
    <linearGradient id="titleGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4EFFF"/>
      <stop offset="0.48" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#34305F" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#111A35" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#A5B4FC" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="520" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="34" fill="url(#grid)"/>
  <circle cx="1220" cy="240" r="330" fill="url(#orb)" opacity="0.68">
    <animate attributeName="opacity" values="0.48;0.82;0.48" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="r" values="318;344;318" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="30" r="230" fill="url(#orb)" opacity="0.56">
    <animate attributeName="opacity" values="0.34;0.62;0.34" dur="11s" begin="-3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="218;238;218" dur="11s" begin="-3s" repeatCount="indefinite"/>
  </circle>
  <path d="M0 420C330 360 480 560 830 440S1290 320 1600 390" fill="none" stroke="#8B5CF6" stroke-opacity="0.19" stroke-width="2" pathLength="100" stroke-dasharray="7 93">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.10;0.24;0.10" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M0 450C330 390 530 570 860 465S1320 360 1600 420" fill="none" stroke="#22D3EE" stroke-opacity="0.13" stroke-width="2" pathLength="100" stroke-dasharray="5 95">
    <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="22s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(1080 86) rotate(12 220 170)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="7s" repeatCount="indefinite" additive="sum"/>
    <g fill="url(#key)" stroke="url(#edge)" stroke-opacity="0.55" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.38;0.78;0.38" dur="5.5s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="112" height="92" rx="18"/>
      <rect x="128" y="0" width="112" height="92" rx="18"/>
      <rect x="256" y="0" width="112" height="92" rx="18"/>
      <rect x="0" y="108" width="112" height="92" rx="18"/>
      <rect x="128" y="108" width="112" height="92" rx="18"/>
      <rect x="256" y="108" width="112" height="92" rx="18"/>
      <rect x="0" y="216" width="240" height="92" rx="18"/>
      <rect x="256" y="216" width="112" height="92" rx="18"/>
    </g>
    <g fill="#D8D5FF" fill-opacity="0.86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" text-anchor="middle">
      <text x="56" y="58">✦</text><text x="184" y="58">⌘</text><text x="312" y="58">⌥</text>
      <text x="56" y="166">↗</text><text x="184" y="166">Aa</text><text x="312" y="166">⌫</text>
      <text x="120" y="274">GLYPH</text><text x="312" y="274">↵</text>
    </g>
  </g>
  <path d="M1090 350C1170 315 1250 225 1455 112" fill="none" stroke="#A5F3FC" stroke-width="3" stroke-linecap="round" opacity="0.0" pathLength="100" stroke-dasharray="10 90">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.52;0" dur="6.5s" repeatCount="indefinite"/>
  </path>
  <path d="M1190 70L1244 35L1298 70L1244 105Z" fill="none" stroke="#67E8F9" stroke-opacity="0.6" stroke-width="2" pathLength="100" stroke-dasharray="18 82">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.2;0.8;0.2" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M1450 330l16 28 32 5-24 22 6 32-30-15-29 15 5-32-23-22 32-5z" fill="none" stroke="#C4B5FD" stroke-opacity="0.5" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.22;0.72;0.22" dur="6s" repeatCount="indefinite"/>
  </path>
  <circle cx="1464" cy="116" r="4" fill="#67E8F9">
    <animate attributeName="opacity" values="0.28;1;0.28" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;4.8;3" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="360" r="5" fill="#C4B5FD">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.4s" begin="-1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="145" r="2.5" fill="#67E8F9">
    <animate attributeName="cy" values="145;137;145" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.95;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1510" cy="250" r="3" fill="#A78BFA">
    <animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.7s" begin="-2s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(104 122)">
    <path d="M42 0L52 30L82 40L52 50L42 80L32 50L2 40L32 30Z" fill="none" stroke="url(#edge)" stroke-width="3"/>
    <circle cx="42" cy="40" r="7" fill="#EDE9FE">
      <animate attributeName="r" values="6.5;8;6.5" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.78;1;0.78" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M42 86V111M29 98H55" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.45;0.95;0.45" dur="3.8s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="104" y="292" fill="url(#titleGlow)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="88" font-weight="800" letter-spacing="3">GLYPHCHEMY</text>
  <text x="110" y="350" fill="#D8D5FF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="29" font-weight="600" letter-spacing="5">ALCHEMY FOR EVERY KEY</text>
  <text x="110" y="402" fill="#A5B4D6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="21">89 ways to reshape your Gboard experience.</text>
  <rect x="110" y="438" width="170" height="5" rx="2.5" fill="url(#edge)"/>
  <text x="300" y="447" fill="#9AA7C6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2">MORPHE PATCH COLLECTION</text>
</svg>
