name: Build

# release.yml only runs on a tag or a manual dispatch, so a broken build or a stale
# inventory is discovered after the tag has been pushed, as a failed release. This runs the
# same two gates on every change to main and on every pull request, before any tag exists.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify the patch inventory
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make scripts executable
        run: chmod +x ./build.sh ./tools/check-readme-layout.sh

      # The README is hand-designed: the centred banner, hero/footer, glass badge row, jump pills,
      # section order and the <details> card used for every patch are what the project page looks
      # like. Content may change; the shell may not. Checking the shape here means a content update
      # that flattens a card or reorders a section fails in review instead of after a release.
      - name: Verify the README layout is intact
        run: ./tools/check-readme-layout.sh README.md

      # build.sh names the bundle from gradle.properties, so the version comes from there
      # instead of a tag. A pull request that forgets to bump it still builds; that is the
      # release workflow's business, not this one's.
      - name: Build Patch Package (.mpp)
        run: ./build.sh

      # Same gate as the release workflow: the committed inventory must describe the bundle
      # that was just built. The regenerated file is compared, never moved into place, so a
      # failing run leaves the checkout untouched.
      - name: Verify the patch inventory matches the bundle
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version=' gradle.properties | cut -d'=' -f2 | tr -d ' ')"
          REGENERATED="build/patches-list.regenerated.json"
          java -cp "libs/morphe-cli.jar:libs/gson.jar" tools/bindings/Inventory.java \
            "dist/patches-${VERSION}.mpp" "${VERSION}" "${REGENERATED}"
          # The version is stamped from the current gradle.properties and the entry order
          # follows the previous file, so compare the patch entries themselves, name by name.
          jq -S '.patches | sort_by(.name)' patches-list.json > build/inventory.committed.json
          jq -S '.patches | sort_by(.name)' "${REGENERATED}" > build/inventory.built.json
          if ! diff -u build/inventory.committed.json build/inventory.built.json; then
            echo "::error::patches-list.json does not describe dist/patches-${VERSION}.mpp."
            echo "::error::Regenerate and commit it before merging:"
            echo "::error::java -cp \"libs/morphe-cli.jar:libs/gson.jar\" tools/bindings/Inventory.java dist/patches-${VERSION}.mpp ${VERSION} patches-list.json"
            exit 1
          fi
          echo "Inventory matches the bundle: $(jq '.patches | length' patches-list.json) patches"

      # BindingAudit resolves every target in GboardVersionBindings.kt against a real Gboard build, so
      # a binding that no longer exists there fails here instead of the next time someone re-derives
      # by hand. The APK cannot live in this repository (it is Google's proprietary build and *.apk is
      # ignored), so its URL and checksum come from repository variables. Until both are set - and on
      # every pull request from a fork, which sees no variables - the gate warns and skips rather than
      # failing builds it cannot judge.
      - name: Verify the bindings resolve against the target Gboard build
        env:
          GBOARD_APK_URL: ${{ vars.GBOARD_APK_URL }}
          GBOARD_APK_SHA256: ${{ vars.GBOARD_APK_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "${GBOARD_APK_URL:-}" || -z "${GBOARD_APK_SHA256:-}" ]]; then
            echo "::warning::GBOARD_APK_URL and GBOARD_APK_SHA256 are not set, so the bindings audit was skipped."
            exit 0
          fi

          APK="build/gboard-target.apk"
          curl -fSL --retry 3 --retry-delay 5 -o "${APK}" "${GBOARD_APK_URL}"
          # The pinned checksum is what makes a plain URL safe to keep in a variable: if the file
          # behind it is replaced, the audit stops instead of passing against a different build.
          EXPECTED="$(printf '%s' "${GBOARD_APK_SHA256}" | tr 'A-F' 'a-f')"
          ACTUAL="$(sha256sum "${APK}" | cut -d' ' -f1)"
          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "::error::Downloaded APK is sha256 ${ACTUAL}, not the pinned ${EXPECTED}."
            exit 1
          fi

          java -cp "libs/morphe-cli.jar" tools/bindings/BindingAudit.java \
            src/main/kotlin/dev/jason/gboardpatches/patches/gboard/shared/generated/GboardVersionBindings.kt \
            "${APK}" \
            --known-missing tools/bindings/unresolved-baseline.txt
