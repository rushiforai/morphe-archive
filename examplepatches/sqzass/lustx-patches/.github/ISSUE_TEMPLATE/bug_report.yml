name: 🐛 Bug report
description: Report a bug, patch failure, or unexpected behavior.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        # Lustx Patches bug report

        Before creating a new bug report, please keep the following in mind:
        - **Do not submit a duplicate bug report**: Search existing reports, including closed issues, [here](https://github.com/sqzass/lustx-patches/issues?q=is%3Aissue).
        - This repo targets [Morphe](https://morphe.software). Issues must relate to patches in this repo, not the underlying apps themselves.

  - type: input
    id: app-name
    attributes:
      label: App name
      description: Which app is the patch for? (e.g. Pawxy, PortDroid, Postparty, SD Maid 2/SE)
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: The exact version of the app you are patching. (e.g. 1.15.1, 2.2.3-rc0)
    validations:
      required: true

  - type: input
    id: patch-version
    attributes:
      label: Lustx Patches version
      description: Found in Settings > About in Morphe Manager.
    validations:
      required: true

  - type: input
    id: morphe-version
    attributes:
      label: Morphe Manager version
      description: The version of Morphe Manager you are using.
    validations:
      required: true

  - type: dropdown
    id: apk-source
    attributes:
      label: APK source
      description: Where did you get the APK you are patching?
      options:
        - GitHub (official)
        - APKMirror
        - APKPure
        - Play Store (split APK)
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug description
      description: |
        - What happened?
        - What did you expect to happen?
        - Steps to reproduce (Step 1 ... Step 2 ...)
    validations:
      required: true

  - type: textarea
    id: error-logs
    attributes:
      label: Error logs
      description: |
        Capture Android exceptions with:
        `logcat | grep AndroidRuntime`
        Paste the relevant output here.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, videos, or anything else that helps.
    validations:
      required: false

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your bug report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
        - label: I have provided all requested information above.
          required: true
        - label: I understand that this is a patch for a third-party app, and the bug is not caused by the original app developer.
          required: true