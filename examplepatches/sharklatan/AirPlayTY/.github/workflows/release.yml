name: Build and publish AirPlay
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Patch version (increase for each release)
        required: true
        default: '0.1.0'
permissions:
  contents: write
jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build prerequisites
        run: sdkmanager 'platforms;android-33' 'build-tools;34.0.0'
      - name: Build and verify patch bundle
        env:
          AIRPLAY_JAVA_HOME: ${{ steps.java17.outputs.path }}
          REQUESTED_VERSION: ${{ inputs.version || '0.1.0' }}
        run: python tools/build.py --version "$REQUESTED_VERSION"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sharklatan-airplay
          path: dist/*
      - name: Publish downloadable patch
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version || '0.1.0' }}
        run: |
          tag="v$REQUESTED_VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "SharkLatan AirPlay $REQUESTED_VERSION" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$tag" dist/*.mpp dist/SHA256SUMS.txt --clobber
          gh release edit "$tag" --title "SharkLatan AirPlay $REQUESTED_VERSION" --notes-file RELEASE_NOTES.md --latest
      - name: Publish source metadata and Add button
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patches-bundle.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: Update AirPlay download metadata [skip ci]'
            git push
          fi
