org.gradle.parallel = true
org.gradle.caching = true
kotlin.code.style = official
version = 0.2.2
# Termux aarch64: SDK build-tools aapt2 (2.19) cannot parse android-36; stock 36 aapt2 is a
# non-runnable ELF. Use the Termux-native aapt2 (2.20) which handles API 36.
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
