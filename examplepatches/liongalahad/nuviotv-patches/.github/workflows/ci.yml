name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read
  packages: read

jobs:
  build-and-apply:
    name: build-and-apply (${{ matrix.target.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x86_64
            url: https://github.com/NuvioMedia/NuvioTV/releases/download/0.8.6-beta/app-full-x86_64-release.apk
            sha256: 4f7b03074ee704e06581d42b32093e17454a6a1e3aaaa0135c9ab513367fbbe8
          - name: universal
            url: https://github.com/NuvioMedia/NuvioTV/releases/download/0.8.6-beta/app-full-universal-release.apk
            sha256: 9bc77c9be627885f5ab44e0b218d5dd3084b97cef0efdc70bcb497200cc48e2e
    env:
      GITHUB_ACTOR: liongalahad
      MORPHE_PACKAGES_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN }}
      TARGET_URL: ${{ matrix.target.url }}
      TARGET_SHA256: ${{ matrix.target.sha256 }}
      MORPHE_URL: https://github.com/MorpheApp/morphe-desktop/releases/download/v1.12.0/morphe-desktop-1.12.0-all.jar
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - name: Configure Morphe package credentials
        shell: pwsh
        env:
          GPR_KEY: ${{ secrets.MORPHE_PACKAGES_TOKEN || github.token }}
        run: |
          New-Item -ItemType Directory -Force "$HOME\.gradle" | Out-Null
          @("gpr.user=$env:GITHUB_ACTOR", "gpr.key=$env:GPR_KEY") |
            Set-Content -Encoding utf8 "$HOME\.gradle\gradle.properties"
      - name: Unit tests and clean bundle
        shell: pwsh
        run: |
          ./gradlew.bat :extensions:extension:test :patches:buildAndroid --no-daemon
          ./gradlew.bat generatePatchesList --no-daemon
          $list = Get-Content patches-list.json -Raw | ConvertFrom-Json
          $manifests = Get-ChildItem testing/patches -Recurse -Filter patch.json |
            ForEach-Object { Get-Content $_.FullName -Raw | ConvertFrom-Json }
          foreach ($manifest in $manifests) {
            if ($list.patches.name -notcontains $manifest.name) {
              throw "Generated list is missing $($manifest.name)."
            }
          }
          if ($list.patches.Count -ne $manifests.Count) {
            throw "Generated list contains $($list.patches.Count) patches; expected $($manifests.Count)."
          }
      - name: Download and verify official target
        shell: pwsh
        run: |
          Invoke-WebRequest $env:TARGET_URL -OutFile "$env:RUNNER_TEMP\nuvio.apk"
          $actual = (Get-FileHash "$env:RUNNER_TEMP\nuvio.apk" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:TARGET_SHA256) { throw "Target digest mismatch: $actual" }
          Invoke-WebRequest $env:MORPHE_URL -OutFile "$env:RUNNER_TEMP\morphe.jar"
      - name: Isolated patch application and inspection
        shell: pwsh
        run: |
          $bundle = (Get-ChildItem patches/build/libs/patches-*.mpp |
            Where-Object Name -NotMatch '-(sources|javadoc)\.mpp$' |
            Select-Object -First 1).FullName
          if (-not $bundle) { throw 'Runtime patch bundle was not produced.' }
          # FULL SDK verification reports false positives for optional classes
          # already absent from Nuvio; STRIP_SAFE has a Morphe 1.12.0 rebuild bug.
          $aapt = Get-ChildItem "$env:ANDROID_HOME\build-tools" -Recurse -Filter aapt2.exe | Sort-Object FullName -Descending | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $patchManifests = Get-ChildItem testing/patches -Recurse -Filter patch.json |
            ForEach-Object { Get-Content $_.FullName -Raw | ConvertFrom-Json }
          foreach ($patchManifest in $patchManifests) {
            $output = "$env:RUNNER_TEMP\patched-$($patchManifest.id).apk"
            $resultPath = "$env:RUNNER_TEMP\result-$($patchManifest.id).json"
            java -jar "$env:RUNNER_TEMP\morphe.jar" patch --patches $bundle --exclusive --enable $patchManifest.name --unsigned --bytecode-mode STRIP_FAST --out $output --result-file $resultPath "$env:RUNNER_TEMP\nuvio.apk"
            if ($LASTEXITCODE -ne 0) { throw "Isolated patching failed for $($patchManifest.name)." }

            $manifestText = (& $aapt.FullName dump xmltree --file AndroidManifest.xml $output) -join "`n"
            foreach ($needle in @($patchManifest.inspection.provider, $patchManifest.inspection.metadata)) {
              if ($manifestText -notmatch [regex]::Escape($needle)) { throw "Manifest inspection did not find $needle" }
            }

            $archive = [IO.Compression.ZipFile]::OpenRead($output)
            try {
              $dexText = ($archive.Entries | Where-Object Name -Match '^classes\d*\.dex$' | ForEach-Object {
                $stream = $_.Open(); $memory = New-Object IO.MemoryStream
                try { $stream.CopyTo($memory); [Text.Encoding]::ASCII.GetString($memory.ToArray()) } finally { $memory.Dispose(); $stream.Dispose() }
              }) -join ''
            } finally { $archive.Dispose() }

            $required = @($patchManifest.inspection.classes | ForEach-Object { 'L' + $_.Replace('.', '/') + ';' }) +
              @($patchManifest.inspection.needles)
            foreach ($needle in $required) {
              if (-not $dexText.Contains($needle)) { throw "DEX inspection did not find $needle" }
            }
            foreach ($needle in @($patchManifest.inspection.forbiddenNeedles)) {
              if ($dexText.Contains($needle)) { throw "DEX inspection found forbidden type $needle" }
            }

            $result = Get-Content $resultPath -Raw
            if ($result -notmatch [regex]::Escape($patchManifest.name)) {
              throw "Patch result does not identify $($patchManifest.name)."
            }
          }
      # Patched and source APKs remain in RUNNER_TEMP and are never uploaded.
