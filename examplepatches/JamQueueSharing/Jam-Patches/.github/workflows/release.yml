name: Release

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'AgentKosticka Jam Patch Source ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Manager resolves bare repository URLs via main and compares main/dev
      # versions even for prerelease users. Never retain inherited upstream metadata.
      - name: Sync custom source entry point
        if: steps.release.outputs.new_release_published == 'true'
        run: |
          git fetch origin main
          git worktree add "$RUNNER_TEMP/jam-source-main" origin/main
          cp patches-bundle.json patches-list.json "$RUNNER_TEMP/jam-source-main/"
          git -C "$RUNNER_TEMP/jam-source-main" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/jam-source-main" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/jam-source-main" add patches-bundle.json patches-list.json
          if ! git -C "$RUNNER_TEMP/jam-source-main" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/jam-source-main" commit -m "chore: sync Jam source entry point [skip ci]"
            git -C "$RUNNER_TEMP/jam-source-main" push origin HEAD:main
          fi

      # Always verify compilation when semantic-release did not publish a release.
      # This covers non-main/dev branches, chore commits, docs commits, etc.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
