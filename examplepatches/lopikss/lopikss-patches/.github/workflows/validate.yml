name: Validate

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  compile:
    name: Verify Morphe bundle compiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check whitespace errors
        run: git show --format= --check HEAD
      - name: Build patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
