name: Recover XP Hero v1.3.0 bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-v130.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Morphe patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
      - name: Publish previously interrupted v1.3.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f patches/build/libs/patches-1.3.0.mpp
          git rev-parse --verify refs/tags/v1.3.0
          if gh release view v1.3.0 >/dev/null 2>&1; then
            gh release upload v1.3.0 patches/build/libs/patches-1.3.0.mpp --clobber
          else
            gh release create v1.3.0 patches/build/libs/patches-1.3.0.mpp --verify-tag --title 'v1.3.0' --notes 'Experimental XP Hero 26.2.0 modular patches. Local pricing and ticket changes are not yet verified in-game.'
          fi
          gh release view v1.3.0 --json tagName,assets
