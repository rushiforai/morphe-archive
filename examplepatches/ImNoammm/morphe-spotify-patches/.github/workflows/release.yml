name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'patches-bundle.json'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # buildAndroid compiles the patches to DEX and merges them into the .mpp. Without it the
        # bundle is JVM-only: Morphe Desktop loads it, but Morphe Manager on Android cannot, and the
        # source shows up with no patches and no version.
        run: ./gradlew build buildAndroid --no-daemon

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="v$(date -u +%Y.%m.%d.%H%M)"
          mpp="patches-${version}.mpp"

          # The build also produces -sources and -javadoc bundles; only the real one is released.
          built=$(ls patches/build/libs/*.mpp | grep -vE -- '-(sources|javadoc)\.mpp$' | head -1)
          cp "$built" "$mpp"

          gh release create "$version" "$mpp" \
            --title "$version" \
            --notes "Morphe patches for Spotify."

          # Morphe decodes created_at as a LocalDateTime, so it must carry no timezone suffix.
          cat > patches-bundle.json <<JSON
          {
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%S)",
            "description": "Morphe patches for Spotify.",
            "download_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${version}/${mpp}",
            "signature_download_url": "",
            "version": "${version#v}"
          }
          JSON

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          git commit -m "chore: update bundle metadata ($version)"
          git push
