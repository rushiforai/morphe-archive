name: Bug report
description: Report a broken patch or crash on a supported app version
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > **Friendly heads-up:** This is a personal hobby repository for apps and games I use myself. Bug reports are welcome, and I'll look into them when I have time — but there are no guarantees or ETAs.

  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - New Star Soccer
        - MyTherapy
        - Wrestling Revolution
        - 17TRACK
        - Universal (Spoof install source)
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Exact APK version
      placeholder: "e.g. 4.34 (versionCode 142)"
    validations:
      required: true

  - type: input
    id: bundle_version
    attributes:
      label: Patch bundle version
      placeholder: "e.g. v1.6.6"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Briefly describe the issue and which patches were selected.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Morphe Manager log / logcat (optional)
      render: text
