name: Release

on:
  workflow_dispatch:

concurrency:
  group: penguin-patches-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          # Avoid Actions cache egress limits blocking the publishing runner.
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Fetch pinned Finamp verification input
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/finamp-input"
          gh release download 1.0.1 --repo finamp-app/finamp \
            --pattern Finamp-1.0.1-universal.apk --dir "$RUNNER_TEMP/finamp-input"
          echo "FINAMP_ORIGINAL_APK=$RUNNER_TEMP/finamp-input/Finamp-1.0.1-universal.apk" >> "$GITHUB_ENV"

      - name: Fetch pinned Mihon verification inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/mihon-input"
          gh release download v0.21.3 --repo mihonapp/mihon \
            --pattern mihon-arm64-v8a-v0.21.3.apk --dir "$RUNNER_TEMP/mihon-input"
          gh release download v1.19.1 --repo MorpheApp/morphe-desktop \
            --pattern morphe-desktop-1.19.1-all.jar --dir "$RUNNER_TEMP/mihon-input"
          echo "MIHON_ORIGINAL_APK=$RUNNER_TEMP/mihon-input/mihon-arm64-v8a-v0.21.3.apk" >> "$GITHUB_ENV"
          echo "MORPHE_DESKTOP_JAR=$RUNNER_TEMP/mihon-input/morphe-desktop-1.19.1-all.jar" >> "$GITHUB_ENV"

      - name: Verify same-size Finamp native writes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :patches:compileKotlin --no-daemon
          mkdir -p "$RUNNER_TEMP/finamp-output-probe"
          javac -cp "patches/build/classes/kotlin/main:$MORPHE_DESKTOP_JAR" \
            -d "$RUNNER_TEMP/finamp-output-probe" tests/finamp/VerifyNativeOutput.java
          java -cp "$RUNNER_TEMP/finamp-output-probe:patches/build/classes/kotlin/main:$MORPHE_DESKTOP_JAR" \
            io.github.pengusto.patches.finamp.VerifyNativeOutput \
            "$RUNNER_TEMP/finamp-output-probe" "$FINAMP_ORIGINAL_APK"

      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Penguin Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Always verify compilation when semantic-release did not publish a release.
      # This covers non-main/dev branches, chore commits, docs commits, etc.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
