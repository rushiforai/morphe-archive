name: Release

on:
  workflow_dispatch:

concurrency:
  group: penguin-patches-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          # Avoid Actions cache egress limits blocking the publishing runner.
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;37.0.0 platforms;android-35'

      - name: Fetch pinned Finamp verification input
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/finamp-input"
          gh release download 1.0.1 --repo finamp-app/finamp \
            --pattern Finamp-1.0.1-universal.apk --dir "$RUNNER_TEMP/finamp-input"
          echo "FINAMP_ORIGINAL_APK=$RUNNER_TEMP/finamp-input/Finamp-1.0.1-universal.apk" >> "$GITHUB_ENV"

      - name: Fetch pinned Mihon verification inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/mihon-input"
          gh release download v0.21.3 --repo mihonapp/mihon \
            --pattern mihon-arm64-v8a-v0.21.3.apk --dir "$RUNNER_TEMP/mihon-input"
          gh release download v1.19.1 --repo MorpheApp/morphe-desktop \
            --pattern morphe-desktop-1.19.1-all.jar --dir "$RUNNER_TEMP/mihon-input"
          echo "MIHON_ORIGINAL_APK=$RUNNER_TEMP/mihon-input/mihon-arm64-v8a-v0.21.3.apk" >> "$GITHUB_ENV"
          echo "MORPHE_DESKTOP_JAR=$RUNNER_TEMP/mihon-input/morphe-desktop-1.19.1-all.jar" >> "$GITHUB_ENV"

      - name: Fetch pinned Calendar verification inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/calendar-input"
          gh release download 1.12.0 --repo FossifyOrg/Calendar \
            --pattern calendar-23-foss-release.apk --dir "$RUNNER_TEMP/calendar-input"
          gh release download 1.12.1 --repo FossifyOrg/Calendar \
            --pattern calendar-24-foss-release.apk --dir "$RUNNER_TEMP/calendar-input"
          echo "CALENDAR_ORIGINAL_120=$RUNNER_TEMP/calendar-input/calendar-23-foss-release.apk" >> "$GITHUB_ENV"
          echo "CALENDAR_ORIGINAL_121=$RUNNER_TEMP/calendar-input/calendar-24-foss-release.apk" >> "$GITHUB_ENV"

      - name: Verify same-size Finamp native writes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :patches:compileKotlin --no-daemon
          mkdir -p "$RUNNER_TEMP/finamp-output-probe"
          javac -cp "patches/build/classes/kotlin/main:$MORPHE_DESKTOP_JAR" \
            -d "$RUNNER_TEMP/finamp-output-probe" tests/finamp/VerifyNativeOutput.java
          java -cp "$RUNNER_TEMP/finamp-output-probe:patches/build/classes/kotlin/main:$MORPHE_DESKTOP_JAR" \
            io.github.pengusto.patches.finamp.VerifyNativeOutput \
            "$RUNNER_TEMP/finamp-output-probe" "$FINAMP_ORIGINAL_APK"

      # Semantic release runs its own Gradle build command.
      # Only dev and main branch will generate a release as specified by .releaserc
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Penguin Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Always verify compilation when semantic-release did not publish a release.
      # This covers non-main/dev branches, chore commits, docs commits, etc.
      - name: Verify build and split bundles
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :patches:buildAndroid --no-daemon
          version=$(sed -n 's/^version *= *//p' gradle.properties)
          test -n "$version"
          jq --arg version "$version" --arg repo "$GITHUB_REPOSITORY" \
            '.version=$version | .download_url=("https://github.com/"+$repo+"/releases/download/v"+$version+"/patches-"+$version+".mpp")' \
            patches-bundle.json > "$RUNNER_TEMP/split-input.json"
          python3 -B .github/scripts/split_bundles.py \
            --bundle "patches/build/libs/patches-$version.mpp" --version "$version" \
            --metadata "$RUNNER_TEMP/split-input.json" --output-dir patches/build/libs \
            --metadata-dir "$RUNNER_TEMP/split-metadata" \
            --d8 "$ANDROID_HOME/build-tools/37.0.0/d8" \
            --android-jar "$ANDROID_HOME/platforms/android-35/android.jar" \
            --classpath "$MORPHE_DESKTOP_JAR" \
            --compact-classes patches/build/classes/kotlin/main
          python3 -B .github/scripts/verify_split_bundles.py \
            --full "patches/build/libs/patches-$version.mpp" \
            --standard "patches/build/libs/patches-standard-$version.mpp" \
            --finamp "patches/build/libs/patches-finamp-$version.mpp" \
            --finamp-individual "patches/build/libs/patches-finamp-individual-$version.mpp" \
            --combined "patches/build/libs/patches-combined-$version.mpp" \
            --compact-classes patches/build/classes/kotlin/main
          python3 -B tests/finamp/verify_compact.py \
            --java "$JAVA_HOME/bin/java" --desktop "$MORPHE_DESKTOP_JAR" \
            --bundle "patches/build/libs/patches-finamp-$version.mpp" \
            --original-apk "$FINAMP_ORIGINAL_APK" --work-dir "$RUNNER_TEMP/finamp-compact-check"
          python3 -B tests/finamp/verify_compact.py \
            --java "$JAVA_HOME/bin/java" --desktop "$MORPHE_DESKTOP_JAR" \
            --bundle "patches/build/libs/patches-combined-$version.mpp" \
            --original-apk "$FINAMP_ORIGINAL_APK" --work-dir "$RUNNER_TEMP/finamp-combined-check"
          ./gradlew :patches:generatePatchesListFromBundle --no-daemon \
            -PpatchListBundle="patches/build/libs/patches-combined-$version.mpp" \
            -PpatchListOutput="$RUNNER_TEMP/compact-patches-list.json"
          python3 -B .github/scripts/finamp_catalogue.py --metadata "$RUNNER_TEMP/compact-patches-list.json"
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -q
          python3 -B -m unittest discover -s tests/mihon -p 'test_*.py' -q
