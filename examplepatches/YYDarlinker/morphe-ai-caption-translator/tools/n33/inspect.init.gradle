  classpath=project.sourceSets.test.runtimeClasspath-project.sourceSets.main.output
  mainClass='validation.N33InspectorKt'
  maxHeapSize='3G'
  args project.findProperty('n33.input'),project.findProperty('n33.output')
 }
}
