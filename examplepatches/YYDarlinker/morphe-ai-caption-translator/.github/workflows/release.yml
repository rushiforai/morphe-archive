name: Release

concurrency:
  group: release-publisher
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate current Morphe metadata
        run: |
          current="$(jq -r '.version // empty' patches-bundle.json)"
          python3 .github/scripts/validate_morphe_metadata.py "$current" --mode published

      - name: Identify source version
        id: source
        run: echo "version=$(jq -r .version patches-bundle.json)" >> "$GITHUB_OUTPUT"

      - name: Test release metadata rejection paths
        run: python3 .github/scripts/test_release_contract.py

      - name: Validate addon localization resources
        run: python3 tools/check_localization.py

      - name: Reject stale release checkout
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote" = "$(git rev-parse HEAD)" || { echo "::error::main changed; release the latest commit instead"; exit 1; }

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Preview semantic release
        run: npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Semantic release is the only publisher. Its prepare phase validates generated metadata
      # before @semantic-release/git creates a release commit or a version tag.
      - name: Release with the locked semantic-release toolchain
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import semanticRelease from 'semantic-release';
          import { appendFileSync } from 'node:fs';
          const result = await semanticRelease();
          const values = result
            ? { new_release_published: 'true', new_release_version: result.nextRelease.version,
                new_release_git_tag: result.nextRelease.gitTag }
            : { new_release_published: 'false' };
          for (const [key, value] of Object.entries(values)) {
            appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          }
          NODE

      - name: Validate Morphe metadata after release decision
        run: |
          current="$(jq -r '.version // empty' patches-bundle.json)"
          if [ '${{ steps.release.outputs.new_release_published }}' = 'true' ]; then
            python3 .github/scripts/validate_morphe_metadata.py "$current"
          else
            python3 .github/scripts/validate_morphe_metadata.py "$current" --mode published
          fi

      - name: Verify published release asset
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag='${{ steps.release.outputs.new_release_git_tag }}'
          version='${{ steps.release.outputs.new_release_version }}'
          expected="patches-${version}.mpp"
          gh release view "$tag" --json tagName,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          jq -e --arg tag "$tag" '.tagName == $tag' "$RUNNER_TEMP/release.json" >/dev/null
          jq -r '.assets[].name' "$RUNNER_TEMP/release.json" | grep -Fx "$expected"

      - name: Verify final published bundle
        if: steps.release.outputs.new_release_published == 'true'
        run: |
          version='${{ steps.release.outputs.new_release_version }}'
          python3 .github/scripts/verify_bundle.py "$version"
          echo "EXPECTED_ASSET_SHA256=$(sha256sum build/n39/gradle/patches/libs/patches-${version}.mpp | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Verify anonymous Manager source chain
        run: python3 .github/scripts/verify_remote_source.py "${{ github.ref_name }}" "$(jq -r .version patches-bundle.json)"

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: build/n39/gradle/patches/libs/patches-${{ steps.release.outputs.new_release_version }}.mpp

      - name: Verify current source when no release was published
        if: steps.release.outputs.new_release_published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Same core + extension tests and candidate checks as PR/dev validation.
        run: python3 tools/verify_current.py --run-id "release-no-publish-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Archive prepublication tests and candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            validation/runs/
            build/n39/gradle/translation-core/reports/tests/
            build/n39/gradle/translation-core/test-results/
            extensions/extension/build/reports/tests/
            extensions/extension/build/test-results/
            build/n39/gradle/patches/libs/*.mpp
            build/maintenance/M1a/**/*.mpp
            build/maintenance/M1a/**/extension.mpe
          retention-days: 7
