name: Validate caption changes
on:
  pull_request:
    branches: [main]
  push:
    branches: ['fix/**']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify metadata, localization and release contract
        run: |
          python3 tools/check_localization.py
          python3 .github/scripts/test_release_contract.py
          python3 .github/scripts/validate_morphe_metadata.py "$(jq -r .version patches-bundle.json)"
      - name: Identify source version
        id: source
        run: echo "version=$(jq -r .version patches-bundle.json)" >> "$GITHUB_OUTPUT"
      - name: Test and build Android bundle (no publication)
        if: steps.source.outputs.version != '1.3.5'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :extensions:extension:testDebugUnitTest :patches:buildAndroid --no-daemon
      - name: Rebuild recovered 1.3.5 source
        if: steps.source.outputs.version == '1.3.5'
        shell: pwsh
        run: |
          ./tools/rebuild_recovered_135.ps1
          ./tools/verify_release_135.ps1
          New-Item -ItemType Directory -Path patches/build/libs -Force | Out-Null
          Copy-Item build/recovered-1.3.5/patches-1.3.5.mpp patches/build/libs/patches-1.3.5.mpp
      - name: Validate bundle
        run: python3 .github/scripts/verify_bundle.py "$(jq -r .version patches-bundle.json)"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: caption-validation-${{ github.sha }}
          path: |
            extensions/extension/build/reports/tests/
            extensions/extension/build/test-results/
            patches/build/libs/*.mpp
          retention-days: 7
