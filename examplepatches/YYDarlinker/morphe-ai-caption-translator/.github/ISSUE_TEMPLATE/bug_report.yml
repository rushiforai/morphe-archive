name: Bug report
description: Report a reproducible Anchored AI Captions problem.
title: "bug: "
labels: ["Bug report"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. This tracker is for Anchored AI Captions, not the official Morphe bundle. Do not attach API keys, signing keys or patched YouTube APKs. See [contributing](https://github.com/YYDarlinker/morphe-ai-caption-translator/blob/main/CONTRIBUTING.md).
  - type: input
    id: versions
    attributes:
      label: Versions and device
      description: Addon version, official patch version, YouTube version, Android version and device model.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: Include the selected patches, app language, source/target subtitle language and playback scene. State what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted diagnostics and screenshots
      description: Export diagnostics from AI settings. Check for personal data before attaching; include a crash stack if available. Never post credentials or a patched APK.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and removed credentials and private information from my evidence.
          required: true
