name: Feature request
description: Suggest an improvement to Anchored AI Captions.
title: "feat: "
labels: ["Feature request"]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing requests](https://github.com/YYDarlinker/morphe-ai-caption-translator/issues) and read [contributing](https://github.com/YYDarlinker/morphe-ai-caption-translator/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature and use case
      description: Explain the problem, desired behavior and benefit. Include examples without private credentials.
    validations:
      required: true
