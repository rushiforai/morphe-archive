name: Mirror to GitGud

on:
  push:
  release:
    types: [published]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  workflow_call:
    secrets:
      GITGUD_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: gitgud-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror tooling
        uses: actions/checkout@v7

      - name: Test mirror tooling
        working-directory: .github/scripts
        run: python3 -m unittest test_mirror_gitgud.py

      - name: Mirror Git history and releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITGUD_TOKEN: ${{ secrets.GITGUD_TOKEN }}
          GITGUD_PROJECT: ${{ vars.GITGUD_PROJECT }}
        run: python3 .github/scripts/mirror_gitgud.py
