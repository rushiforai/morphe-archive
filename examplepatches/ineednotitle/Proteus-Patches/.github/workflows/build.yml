name: Build patch bundle (.mpp)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build .mpp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android patch bundle
        run: |
          ./gradlew buildAndroid --stacktrace > build.log 2>&1 && tail -5 build.log && exit 0
          echo "=== GREP: exception headers ==="
          grep -n -m 12 -E "What went wrong|FAILURE:|Caused by|Exception|Error|Killed|No space|OutOfMemory|ExceptionInInitializerError|AssertionError" build.log | while IFS= read -r line; do
            echo "::error::$line"
            echo "$line"
          done
          echo "=== CONTEXT: around 'What went wrong' (if any) ==="
          grep -n -m 1 -A8 "What went wrong" build.log | while IFS= read -r line; do
            echo "::warning::$line"
            echo "$line"
          done
          echo "=== LAST 12 RAW LINES ==="
          tail -n 12 build.log | while IFS= read -r line; do
            echo "::warning::$line"
            echo "$line"
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Pinterest video URLs
        run: bash .github/scripts/test_pinterest_video_urls.sh

      - name: Test permission removal and Brave helpers
        run: ./gradlew :patches:testPermissionRemoval :patches:testBravePrivacy --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Exercise the same build-then-metadata sequence used by releases. The
      # metadata task must not leave a JVM-only archive in place of the MPP.
      - name: Generate patch metadata
        run: ./gradlew generatePatchesList --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Android bundle and remote source metadata
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          python3 .github/scripts/verify_android_bundle.py "patches/build/libs/patches-${VERSION}.mpp" "$VERSION"
          python3 .github/scripts/verify_patch_source.py patches-bundle.json "$VERSION"

      - name: Upload .mpp artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.7.0
        with:
          name: patches-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error

      - name: Upload full gradle log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.7.0
        with:
          name: gradle-error-log
          path: build.log
