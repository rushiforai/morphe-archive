name: Build patch bundle (.mpp)

on:
  workflow_dispatch:
  # API-triggered rebuilds (repository_dispatch, event_type: build-mpp).
  repository_dispatch:
    types: [build-mpp]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build .mpp
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android patch bundle
        run: |
          ./gradlew buildAndroid --stacktrace > build.log 2>&1 && tail -5 build.log && exit 0
          echo "=== GREP: exception headers ==="
          grep -n -m 40 -E "What went wrong|FAILURE:|Caused by|Exception|Error|Killed|No space|OutOfMemory|ExceptionInInitializerError|AssertionError|\.kt:[0-9]+" build.log | while IFS= read -r line; do
            echo "::error::$line"
            echo "$line"
          done
          echo "=== CONTEXT: around 'What went wrong' (if any) ==="
          grep -n -m 1 -A8 "What went wrong" build.log | while IFS= read -r line; do
            echo "::warning::$line"
            echo "$line"
          done
          echo "=== LAST 12 RAW LINES ==="
          tail -n 12 build.log | while IFS= read -r line; do
            echo "::warning::$line"
            echo "$line"
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Pinterest video URLs and Instagram extension helpers
        run: |
          bash .github/scripts/test_pinterest_video_urls.sh
          bash .github/scripts/test_instagram_extension.sh

      - name: Test permission removal, Brave, Instagram, Reddit, and Spotify helpers
        run: |
          ./gradlew :patches:testPermissionRemoval :patches:testBravePrivacy :patches:testInstagram :patches:testRedditCommentTree :patches:testSpotifyHooks :patches:testFirefox :patches:testMalwarebytesUnlock :patches:testSpotifyClone :patches:testSpotifyAmoled --stacktrace > test.log 2>&1 && tail -5 test.log && exit 0
          echo "=== GREP: test failures ==="
          grep -n -m 40 -E "FAILED|failed|Exception|\.kt:[0-9]+|Error|Caused by" test.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "=== LAST 20 RAW LINES ==="
          tail -n 20 test.log | while IFS= read -r line; do
            echo "::warning::$line"
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Exercise the same build-then-metadata sequence used by releases. The
      # metadata task must not leave a JVM-only archive in place of the MPP.
      - name: Generate patch metadata
        run: ./gradlew generatePatchesList --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Android bundle and remote source metadata
        run: |
          : > verify.log
          RC1=0; python3 -m unittest discover -s .github/scripts -p 'test_*.py' >> verify.log 2>&1 || RC1=$?
          VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          echo "=== version=$VERSION rc-tests=$RC1 ===" >> verify.log
          RC2=0; python3 .github/scripts/verify_android_bundle.py "patches/build/libs/patches-${VERSION}.mpp" "$VERSION" >> verify.log 2>&1 || RC2=$?
          RC3=0; python3 .github/scripts/verify_patch_source.py patches-bundle.json "$VERSION" >> verify.log 2>&1 || RC3=$?
          echo "=== rc: tests=$RC1 bundle=$RC2 source=$RC3 ===" >> verify.log
          if [ "$RC1$RC2$RC3" = "000" ]; then tail -5 verify.log; exit 0; fi
          tail -n 40 verify.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1

      - name: Upload .mpp artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.7.0
        with:
          name: patches-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error

      # Re-cut mode: a repository_dispatch run that names release_tag replaces
      # that release's bundle asset with the build just produced.
      - name: Upload bundle to the release (re-cut dispatch)
        if: success() && github.event_name == 'repository_dispatch' && github.event.client_payload.release_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties)
          gh release upload "${{ github.event.client_payload.release_tag }}" \
            "patches/build/libs/patches-${VERSION}.mpp" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload full gradle log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.7.0
        with:
          name: gradle-error-log
          path: build.log
