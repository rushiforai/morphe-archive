# One-shot analysis job: fetches a link-shared reference APK from Google
# Drive on the runner (which has full egress), disassembles the native
# library and DEX, and publishes a text report to a scratch branch.
# Triggered only via repository_dispatch (event_type: fetch-analysis).
# Not part of the build pipeline; removed once the analysis is done.

name: Reference analysis

on:
  repository_dispatch:
    types: [fetch-analysis]

permissions:
  contents: write

jobs:
  analyze:
    name: Analyze reference APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install analysis tools
        run: pip install --quiet capstone pyelftools androguard

      - name: Download reference APK
        run: |
          curl -fsSL --retry 3 -o reference.apk \
            "https://drive.usercontent.google.com/download?id=${{ github.event.client_payload.apk_id }}&export=download&confirm=t"
          ls -la reference.apk
          unzip -o -q reference.apk "lib/arm64-v8a/*" "classes*.dex" -d reference/ || true
          find reference -type f | head -20

      - name: Analyze
        run: |
          python3 .github/scripts/analyze_reference_apk.py reference/analysis-report.md reference/ || {
            echo "analyzer failed; continuing with partial report" >&2
          }
          wc -c reference/analysis-report.md || true

      - name: Publish report to scratch branch
        run: |
          git config user.name "analysis"
          git config user.email "analysis@localhost"
          git checkout --orphan analysis/reference-report
          git rm -rf --quiet . || true
          mkdir -p report
          cp reference/analysis-report.md report/analysis-report.md
          git add report/analysis-report.md
          git commit -m "chore: reference analysis report [skip ci]"
          git push -f origin analysis/reference-report
