name: Bug report
description: Report a reproducible problem with a SoundCloud patch.
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        # Bug report

        This repository supports **SoundCloud only**. Search existing issues before submitting a report.
  - type: dropdown
    attributes:
      label: Patch
      description: Select the affected SoundCloud patch.
      options:
        - Download button hook
        - Hide Cast icon
        - Enable SoundCloud Go
        - AMOLED dark theme
        - Disable telemetry
        - Shared settings / extension
        - Other SoundCloud-only repository issue
    validations:
      required: true
  - type: input
    attributes:
      label: SoundCloud version
      description: Provide the exact version name and, when available, version code.
      placeholder: '2026.08.26-release (369070)'
    validations:
      required: true
  - type: input
    attributes:
      label: Morphe Manager or CLI version
      description: Provide the exact patcher version used.
      placeholder: 'Manager or CLI version'
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      description: List the exact steps and the expected versus actual result.
      placeholder: |
        1. Patch SoundCloud with ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error log
      description: Attach the full patch log or a relevant adb logcat excerpt. Remove private data first.
      render: shell
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Checklist
      options:
        - label: This report concerns SoundCloud, not another app.
          required: true
        - label: I searched open and closed issues and found no duplicate.
          required: true
        - label: I included the exact SoundCloud and patcher versions.
          required: true
