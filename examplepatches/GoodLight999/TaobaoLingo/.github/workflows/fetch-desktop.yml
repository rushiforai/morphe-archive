name: Fetch Morphe Desktop CLI
on:
  push:
    paths:
      - .github/workflows/fetch-desktop.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Morphe Desktop 1.18.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          gh release download v1.18.1 --repo MorpheApp/morphe-desktop --pattern "*-all.jar" --dir output
          sha256sum output/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: morphe-desktop-cli-1.18.1
          path: output/*.jar
          if-no-files-found: error
