name: Build translation overlay
on:
  push:
    paths:
      - 'overlay/**'
      - '.github/workflows/overlay.yml'
  pull_request:
    paths:
      - 'overlay/**'
      - '.github/workflows/overlay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Android APK
        working-directory: overlay
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon --stacktrace
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TaobaoLingo-Overlay-debug
          path: overlay/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
