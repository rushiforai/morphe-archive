org.gradle.parallel = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.code.style = official
version = 1.0.2

# The vendored Morphe Patches Gradle plugin always registers the GitHub Packages
# registry (maven.pkg.github.com/MorpheApp/registry) as a dependency repo and
# passes its credentials through unconditionally; Gradle rejects null credentials.
# All real dependencies resolve from mavenLocal/mavenCentral/google/jitpack before
# this dummy repo is consulted, so placeholder values are safe here.
gpr.user = dummy
gpr.key = dummy

# Owner/repo slug used for release metadata (patches-bundle.json download_url) and the
# "Add to Morphe" link. Set this once the repository is published.
repoSlug = Hari-sys786/telegram-patches
