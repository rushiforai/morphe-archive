name: 🐞 Bug report - JioHotstar
description: Report a bug in a JioHotstar patch.
title: "bug(JioHotstar): "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        - Search open and closed issues first, then confirm the bug still happens with only the reported patch enabled.
        - Report one bug per issue. Keep the title prefix unchanged.
  - type: input
    id: patch
    attributes:
      label: Patch name
      description: The exact patch name from the patch list, e.g. `Remove ads`.
      placeholder: Remove ads
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: JioHotstar version
      description: Found in Settings → About.
      placeholder: 26.10.26.0
    validations:
      required: true
  - type: input
    id: patches_version
    attributes:
      label: Patches version
      description: The version shown next to the patch bundle.
      placeholder: 1.5.0-dev.4
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Expected behaviour, actual behaviour, and the steps to reproduce.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Expected ..., but ...
    validations:
      required: true
  - type: textarea
    id: proofs
    attributes:
      label: Proofs or screenshots
      description: Drag a screenshot or screen recording here showing the actual behaviour.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screen recording
      description: Paste a logcat excerpt or drop a recording here, if available.
      render: shell
  - type: textarea
    id: solution
    attributes:
      label: Possible solution
      description: If you have an idea what causes it or how to fix it.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed issues and this is not a duplicate.
          required: true
        - label: I reproduced this with only this patch enabled.
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: All requested information has been provided properly.
          required: true
