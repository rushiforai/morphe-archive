name: 📱 New app request
description: Request patch support for an app that is not covered yet.
title: "app_name_here: "
labels: ["patch request"]
body:
  - type: markdown
    attributes:
      value: |
        - Check the README first: the app may already be supported.
        - Request one app per issue. Keep the title prefix unchanged.
  - type: input
    id: app_name
    attributes:
      label: App name
      placeholder: Disney+ Hotstar
    validations:
      required: true
  - type: input
    id: store_link
    attributes:
      label: Play Store link
      description: Paste the store listing or official download page.
      placeholder: https://play.google.com/store/apps/details?id=...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and APK type
      description: Version of the build you want patched, and whether it ships as a split or universal APK.
      placeholder: 26.10.26.0, split APK
  - type: textarea
    id: features
    attributes:
      label: Which features should be patched?
      description: List the ads, prompts or premium limits you want removed, one per line.
    validations:
      required: true
  - type: textarea
    id: reasons
    attributes:
      label: Why this app?
      description: What makes it worth supporting over the apps that are already covered?
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your request will be closed if you don't follow the checklist below.
      options:
        - label: I have checked the README and all open and closed issues, and this app is not supported or requested yet.
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: All requested information has been provided properly.
          required: true
