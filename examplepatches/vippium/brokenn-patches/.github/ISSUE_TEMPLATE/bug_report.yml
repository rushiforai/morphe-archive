name: 🐞 Bug Report
description: Report a bug or an issue.
title: "bug: "
labels: ["Bug report"]
body:
  - type: markdown
    attributes:
      value: |
        - Search open and closed issues first.
        - Report one bug per issue. Keep the title prefix unchanged.
  - type: textarea
    attributes:
      label: Bug description
      description: Include expected behavior, actual behavior, and steps to reproduce.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error logs
      description: Paste relevant logs, if available.
      render: shell
  - type: textarea
    attributes:
      label: Solution
      description: If applicable, add a possible solution to the bug.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your bug report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: All requested information has been provided properly.
          required: true
