name: ⭐ Feature request
description: Create a detailed request for a new feature.
title: "feat: "
labels: ["Feature request"]
body:
  - type: markdown
    attributes:
      value: |
        - Feature requests are accepted only for JioHotstar right now.
        - Search open and closed issues before posting.
        - Keep the title prefix unchanged.
  - type: textarea
    attributes:
      label: What do you want to be added? 
      description: |
        - Describe the feature clearly. Add screenshots if applicable.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your feature request will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed feature requests and this is not a duplicate
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: All requested information has been provided properly.
          required: true
