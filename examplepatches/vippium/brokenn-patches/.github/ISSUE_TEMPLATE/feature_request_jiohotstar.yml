name: ⭐ Feature request - JioHotstar
description: Request a new feature or patch for JioHotstar.
title: "feat(JioHotstar): "
labels: ["feature request"]
body:
  - type: markdown
    attributes:
      value: |
        - Search open and closed issues first, and check the patch list in the README.
        - Request one feature per issue. Keep the title prefix unchanged.
  - type: textarea
    id: feature
    attributes:
      label: What should be added or changed?
      description: Describe the feature and where it belongs in the app.
      placeholder: A patch that hides the Trending row on Home.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Why is this useful?
      description: What problem does it solve for you?
    validations:
      required: true
  - type: textarea
    id: proofs
    attributes:
      label: Proofs or screenshots
      description: Drag a screenshot or screen recording here showing the element or behaviour.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your request will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed issues and this is not a duplicate.
          required: true
        - label: This feature is not already covered by an existing patch.
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: All requested information has been provided properly.
          required: true
