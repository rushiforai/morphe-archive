name: Build Telegram Morphe MPP

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: mpp-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mpp:
    name: Build Telegram MPP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build MPP
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :patches:buildTelegramMpp \
            --no-daemon \
            --stacktrace

      - name: Verify MPP
        run: |
          echo "Generated MPP files:"
          find patches/build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.mpp" \
            -print

          test -n "$(find patches/build/libs \
            -maxdepth 1 \
            -type f \
            -name "*.mpp" \
            -print -quit)"

      - name: Generate SHA-256
        run: |
          sha256sum patches/build/libs/*.mpp \
            | tee patches/build/libs/SHA256SUMS.txt

      - name: Upload MPP workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-morphe-mpp-${{ github.run_number }}
          path: |
            patches/build/libs/*.mpp
            patches/build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
