name: Build Test MPP

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base version (for example 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read
  packages: read

jobs:
  build-test-mpp:
    name: Build Test MPP
    runs-on: ubuntu-latest

    # Credentials read by settings.gradle.kts (GITHUB_ACTOR / GITHUB_TOKEN fallbacks)
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6
        with:
          ref: test
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set test version
        run: |
          VERSION="test.${{ inputs.version }}"
          sed -i -E "s/^version = .*/version = ${VERSION}/" gradle.properties
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Building ${VERSION}"

      - name: Build MPP
        run: |
          chmod +x ./gradlew
          ./gradlew :patches:buildAndroid --no-daemon --stacktrace

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name "*.mpp" -not -name "*sources*" -not -name "*javadoc*" -print -quit)"
          test -n "$MPP"

          TARGET="patches/build/libs/patches-${VERSION}.mpp"
          if [ "$MPP" != "$TARGET" ]; then
            cp "$MPP" "$TARGET"
          fi

          ZIP="patches/build/libs/patches-${VERSION}.zip"
          rm -f "$ZIP"
          (
            cd patches/build/libs
            zip -j "$(basename "$ZIP")" "$(basename "$TARGET")"
          )

          sha256sum "$TARGET" "$ZIP" > patches/build/libs/SHA256SUMS.txt

          echo "Prepared files:"
          ls -lh "$TARGET" "$ZIP" patches/build/libs/SHA256SUMS.txt

      - name: Upload Test ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: patches-${{ env.VERSION }}-zip
          path: patches/build/libs/patches-${{ env.VERSION }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Test MPP artifact
        uses: actions/upload-artifact@v4
        with:
          name: patches-${{ env.VERSION }}-mpp
          path: patches/build/libs/patches-${{ env.VERSION }}.mpp
          if-no-files-found: error
          retention-days: 14
