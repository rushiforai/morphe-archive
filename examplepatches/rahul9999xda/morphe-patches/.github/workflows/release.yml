name: Release

# IMPORTANT:
# This workflow handles ONLY main and dev releases.
# The test branch is handled exclusively by build-test-mpp.yml.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to release (main or dev only)"
        type: choice
        required: true
        default: main
        options:
          - main
          - dev

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: Build and Release (Main / Dev)
    runs-on: ubuntu-latest

    # Global variables mapped seamlessly to your custom settings.gradle.kts fallbacks
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Validate release branch
        shell: bash
        env:
          RELEASE_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          case "$RELEASE_BRANCH" in
            main|dev) ;;
            *)
              echo "Invalid release branch: $RELEASE_BRANCH"
              echo "This workflow supports only main and dev."
              exit 1
              ;;
          esac

      - name: Checkout selected release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Calculate release version
        shell: bash
        env:
          RELEASE_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          if [ "$RELEASE_BRANCH" = "main" ]; then
            LATEST_STABLE_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"

            if [ -z "$LATEST_STABLE_TAG" ]; then
              VERSION="1.0.0"
              PREVIOUS_TAG=""
            else
              STABLE_VERSION="${LATEST_STABLE_TAG#v}"
              IFS=. read -r MAJOR MINOR PATCH <<< "$STABLE_VERSION"
              VERSION="${MAJOR}.$((MINOR + 1)).0"
              PREVIOUS_TAG="$LATEST_STABLE_TAG"
            fi

            RELEASE_KIND="stable"
          else
            LATEST_STABLE_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"

            if [ -z "$LATEST_STABLE_TAG" ]; then
              echo "No stable release exists yet. Create the first main release before releasing dev."
              exit 1
            fi

            STABLE_VERSION="${LATEST_STABLE_TAG#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$STABLE_VERSION"
            DEV_BASE="${MAJOR}.$((MINOR + 1)).0"
            LAST_DEV_TAG="$(git tag --list "v${DEV_BASE}-dev[0-9]*" --sort=-v:refname | grep -E "^v${DEV_BASE}-dev[0-9]+$" | head -n1 || true)"

            if [ -z "$LAST_DEV_TAG" ]; then
              DEV_NUMBER=1
              PREVIOUS_TAG="$LATEST_STABLE_TAG"
            else
              LAST_DEV_NUMBER="${LAST_DEV_TAG##*-dev}"
              DEV_NUMBER=$((LAST_DEV_NUMBER + 1))
              PREVIOUS_TAG="$LAST_DEV_TAG"
            fi

            VERSION="${DEV_BASE}-dev${DEV_NUMBER}"
            RELEASE_KIND="dev"
          fi

          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi

          sed -i -E "s/^version = .*/version = ${VERSION}/" gradle.properties

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "PREVIOUS_TAG=${PREVIOUS_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_KIND=${RELEASE_KIND}" >> "$GITHUB_ENV"

          echo "Releasing ${VERSION} from ${RELEASE_BRANCH}; previous release: ${PREVIOUS_TAG:-none}"

      - name: Generate release notes
        run: |
          set -euo pipefail
          python3 .github/scripts/generate_release_notes.py "$VERSION" "$PREVIOUS_TAG" RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Generate current patch list and README
        if: ${{ inputs.branch == 'main' }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :patches:generatePatchesList --no-daemon --stacktrace

          GENERATED="$(find . -type f -name 'patches-list.json' -not -path './.git/*' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$GENERATED"

          # The generator already writes ./patches-list.json at the repo root;
          # only copy when the newest file found is a different file.
          if [ "$(realpath "$GENERATED")" != "$(realpath patches-list.json)" ]; then
            cp "$GENERATED" patches-list.json
          fi
          python3 .github/scripts/generate_patches_readme.py patches-list.json README.md

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Morphe Manager reads patches-bundle.json from the branch (main = stable,
          # dev = pre-release) to find the latest .mpp download URL.
          jq -n \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%S)" \
            --rawfile description RELEASE_NOTES.md \
            --arg download_url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/patches-${VERSION}.mpp" \
            --arg version "${VERSION}" \
            '{created_at: $created_at, description: $description, download_url: $download_url, signature_download_url: "", version: $version}' \
            > patches-bundle.json

          git add gradle.properties patches-bundle.json

          if [ "${RELEASE_KIND}" = "stable" ]; then
            git add README.md patches-list.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "chore: Release ${TAG} [skip ci]"
            git push origin "${{ inputs.branch }}"
          fi

      - name: Build MPP
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :patches:buildAndroid --no-daemon --stacktrace

      - name: Prepare release files
        run: |
          set -euo pipefail
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' -not -name '*sources*' -not -name '*javadoc*' -print -quit)"
          test -n "$MPP"

          TARGET="patches/build/libs/patches-${VERSION}.mpp"
          if [ "$MPP" != "$TARGET" ]; then
            cp "$MPP" "$TARGET"
          fi

          ZIP="patches/build/libs/patches-${VERSION}.zip"
          rm -f "$ZIP"
          (cd patches/build/libs && zip -j "$(basename "$ZIP")" "$(basename "$TARGET")")

          sha256sum "$TARGET" "$ZIP" > patches/build/libs/SHA256SUMS.txt

      - name: Upload release MPP artifact
        uses: actions/upload-artifact@v4
        with:
          name: patches-${{ env.VERSION }}-mpp
          path: patches/build/libs/patches-${{ env.VERSION }}.mpp
          if-no-files-found: error
          retention-days: 30

      - name: Upload release ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: patches-${{ env.VERSION }}-zip
          path: patches/build/libs/patches-${{ env.VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(
            "$TAG"
            "patches/build/libs/patches-${VERSION}.mpp"
            "patches/build/libs/patches-${VERSION}.zip"
            "patches/build/libs/SHA256SUMS.txt"
          )

          if [ "$RELEASE_KIND" = "dev" ]; then
            gh release create "${ARGS[@]}" \
              --title "Release ${VERSION}" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          else
            gh release create "${ARGS[@]}" \
              --title "Release ${VERSION}" \
              --notes-file RELEASE_NOTES.md
          fi
