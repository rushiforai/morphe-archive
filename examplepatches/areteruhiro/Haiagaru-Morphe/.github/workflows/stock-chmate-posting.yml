name: Verify stock ChMate posting

on:
  workflow_dispatch:
  push:
    branches: [codex/edge-cookie-transfer]

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify synthetic posting destinations and drafts
        run: |
          mkdir -p build/stock-posting-test
          javac -encoding UTF-8 -d build/stock-posting-test extensions/chmate/src/main/java/app/morphe/extension/chmate/StockChmatePostingRules.java scripts/StockChmatePostingRulesTest.java
          java -cp build/stock-posting-test app.morphe.extension.chmate.StockChmatePostingRulesTest
      - name: Build test bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon --max-workers=2
      - name: Save test bundle
        uses: actions/upload-artifact@v4
        with:
          name: stock-chmate-posting-test-bundle
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 14
