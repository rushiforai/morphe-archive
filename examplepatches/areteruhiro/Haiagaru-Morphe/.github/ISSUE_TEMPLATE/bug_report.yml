name: 🐞 バグ報告
description: 不具合や問題を報告する
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        # Haiagaru-Morphe バグ報告

        新しいバグ報告を作成する前に、以下を確認してください。

        - **重複したバグ報告を投稿しないでください**: 既存の issue と closed issue を確認してください。
        - クラッシュが発生する場合は、任意パッチ `Save ChMate crash logs` を有効にして再現し、`Download/Haiagaru/` に保存されたクラッシュログを添付してください。
  - type: textarea
    attributes:
      label: 不具合の内容
      description: |
        - パッチ適用先のアプリ名とバージョン、使用した Haiagaru-Morphe のバージョンを記載してください
        - 可能であれば再現手順を記載してください（手順 1. ... 手順 2. ...）
        - 可能であれば画像や動画を添付してください
    validations:
        required: true
  - type: input
    attributes:
      label: パッチ適用先のアプリとバージョン
      description: '例: ChMate 0.8.10.xxx dev'
    validations:
      required: true
  - type: textarea
    attributes:
      label: エラーログ
      description: |
        クラッシュする場合は、任意パッチ `Save ChMate crash logs` を有効にして再現し、`Download/Haiagaru/` に保存されたクラッシュログを添付してください。
        logcat を使える場合は、`logcat | grep AndroidRuntime` などで取得した例外ログも貼り付けてください。
      render: shell
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 確認事項
      description: 以下を満たしていない場合、報告を close することがあります。
      options:
        - label: open / closed の issue を確認し、重複ではないことを確認しました。
          required: true
        - label: 必要な情報を可能な限り記載しました。
          required: true
