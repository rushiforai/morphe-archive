name: ⭐ 機能要望
description: 新機能や改善案を提案する
title: 'feat: '
labels: ['feature']
body:
  - type: markdown
    attributes:
      value: |
        # Haiagaru-Morphe 機能要望

        新しい機能要望を作成する前に、以下を確認してください。

        - **重複した機能要望を投稿しないでください**: 既存の issue と closed issue を確認してください。
        - 不具合やクラッシュの報告は、バグ報告テンプレートを使用してください。
  - type: textarea
    attributes:
      label: 機能の内容
      description: |
        - 希望する機能や改善内容を具体的に記載してください
    validations:
      required: true
  - type: textarea
    attributes:
      label: 動機・用途
      description: |
        機能要望を検討するため、必要性や具体的な用途を記載してください。
        
        - なぜこの機能が必要ですか？
        - どのような場面で使いますか？
        - 実装されると何が改善しますか？
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 確認事項
      description: 以下を満たしていない場合、要望を close することがあります。
      options:
        - label: open / closed の issue を確認し、重複ではないことを確認しました。
          required: true
        - label: 不具合やクラッシュの報告ではなく、機能要望として投稿しています。
          required: true
